                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '20px', flexWrap: 'nowrap' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '4px', whiteSpace: 'nowrap' }}>
                      <div style={{ width: '2px', height: '12px', background: '#333333', flexShrink: 0 }}></div>
                      <span style={{ fontSize: '10px' }}>Today</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '4px', whiteSpace: 'nowrap' }}>
                      <div style={{ width: '0', height: '0', borderLeft: '5px solid transparent', borderRight: '5px solid transparent', borderTop: '8px solid #f43f5e', flexShrink: 0 }}></div>
                      <span style={{ fontSize: '10px' }}>Target Date</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '4px', whiteSpace: 'nowrap' }}>
                      <div style={{ width: '8px', height: '8px', background: '#1e3a8a', transform: 'rotate(45deg)', flexShrink: 0 }}></div>
                      <span style={{ fontSize: '10px' }}>Release Fix Version</span>
                    </div>
                  </div>
                </div>
                {legendExpanded && (
                  <div style={{ display: 'flex', gap: '10px', alignItems: 'left', flexWrap: 'wrap', flexDirection: 'column', marginTop: '10px' }}>
                    <div style={{ display: 'flex', gap: '8px', alignItems: 'left', flexWrap: 'wrap' }}>
                      <span style={{ fontSize: '11px', fontWeight: 'bold' }}>Feature States:</span>
                      {[{ label: 'New', color: '#94a3b8' }, { label: 'In Shaping', color: '#fbbf24' }, { label: 'In Planning', color: '#fb923c' }, { label: 'Planned', color: '#34d399' }, { label: 'In Process', color: '#60a5fa' }, { label: 'Closed', color: '#a78bfa' }].map((item, idx) => (
                        <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: '5px' }}>
                          <div style={{ width: '12px', height: '12px', background: item.color, borderRadius: '2px' }}></div>
                          <span style={{ fontSize: '10px' }}>{item.label}</span>
                        </div>
                      ))}
                    </div>
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center', fontSize: '10px' }}>
                      <span style={{ fontSize: '11px', fontWeight: 'bold' }}>Stories States:</span>
                      {Object.entries(storyStateColors).map(([state, color]) => (
                        <div key={state} style={{ display: 'flex', alignItems: 'left', gap: '4px' }}>
                          <div style={{ width: '12px', height: '12px', background: color, borderRadius: '2px' }}></div>
                          <span>{state}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* ── TABLA PRINCIPAL DEL ROADMAP ── */}
              {/* El header de la línea de tiempo ahora vive DENTRO de la tabla
                  como una fila especial, garantizando alineación perfecta */}
              <div className="table-wrapper" style={{ maxHeight: '70vh', overflowY: 'auto' }}>
                <table ref={roadmapTableRef} style={{ tableLayout: 'fixed', width: '100%' }}>
                  <thead style={{ position: 'sticky', top: 0, zIndex: 100, background: '#f9f9f9', boxShadow: '0 2px 4px rgba(0,0,0,0.08)' }}>
                    <tr>
                      <th style={{ width: '30px' }}></th>
                      <th
                        style={{ width: '40px', textAlign: 'center', cursor: 'pointer', fontSize: '12px', whiteSpace: 'nowrap' }}
                        onClick={() => { setSortColumn('priority'); setSortOrder(sortColumn === 'priority' && sortOrder === 'asc' ? 'desc' : 'asc'); }}
                      >
                        P {sortColumn === 'priority' ? (sortOrder === 'asc' ? '▲' : '▼') : ''}
                      </th>
                                            <th style={{ width: '80px' }}>ID</th>
                      <th style={{ width: '300px', padding: '12px 4px 12px 12px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: '100%' }}>
                          <span>Feature</span>

                          <div style={{ display: 'flex', alignItems: 'center', gap: '4px', flexShrink: 0 }}>
                            <button
                              type="button"
                              title={expandedRoadmapFeatureId !== null ? 'Previous week' : 'Previous month'}
                              aria-label={expandedRoadmapFeatureId !== null ? 'Previous week' : 'Previous month'}
                              style={{ width: '28px', height: '28px', background: '#537fbd', color: 'white', border: 'none', cursor: 'pointer', fontSize: '12px', borderRadius: '4px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}
                              onClick={() => expandedRoadmapFeatureId !== null
                                ? setWeekOffset(weekOffset - 1)
                                : setTimelineOffset(timelineOffset - 1)}
                            >
                              ◄
                            </button>

                            <button
                              type="button"
                              title={expandedRoadmapFeatureId !== null ? 'Next week' : 'Next month'}
                              aria-label={expandedRoadmapFeatureId !== null ? 'Next week' : 'Next month'}
                              style={{ width: '28px', height: '28px', background: '#537fbd', color: 'white', border: 'none', cursor: 'pointer', fontSize: '12px', borderRadius: '4px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}
                              onClick={() => expandedRoadmapFeatureId !== null
                                ? setWeekOffset(weekOffset + 1)
                                : setTimelineOffset(timelineOffset + 1)}
                            >
                              ►
                            </button>
                          </div>
                        </div>
                      </th>

                      <th style={{ padding: '4px 6px', verticalAlign: 'middle', fontWeight: 'normal' }}>
                        <TimelineSubHeader
                          isWeekMode={expandedRoadmapFeatureId !== null}
                          timelineOffset={timelineOffset}
                          weekOffset={weekOffset}
                        />
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    {(() => {
                      const today = new Date();
                      const monthTimelineStart = new Date(today.getFullYear(), today.getMonth() + timelineOffset, 1);
                      const monthTimelineEnd = new Date(today.getFullYear(), today.getMonth() + timelineOffset + 12, 0);
                      const dayOfWeek = today.getDay();
                      const thisMonday = new Date(today);
                      thisMonday.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
                      const weekTimelineStart = new Date(thisMonday);
                      weekTimelineStart.setDate(thisMonday.getDate() + weekOffset * 7);
                      const weekTimelineEnd = new Date(weekTimelineStart);
                      weekTimelineEnd.setDate(weekTimelineStart.getDate() + 12 * 7);

                      return pageItems.map(f => {
                        const isExpanded = expandedRoadmapFeatureId === f.id;
                        const featureTimelineStart = isExpanded ? weekTimelineStart : monthTimelineStart;
                        const featureTimelineEnd = isExpanded ? weekTimelineEnd : monthTimelineEnd;
                        return (
                          <React.Fragment key={f.id}>
                            <FeatureRow
                              featureId={f.id}
                              title={f.title}
                              targetDate={f.targetDate}
                              releaseFixVersion={f.releaseFixVersion}
                              estimation={f.estimation}
                              priority={f.priority}
                              formatDate={formatDate}
                              timelineStart={featureTimelineStart}
                              timelineEnd={featureTimelineEnd}
                              adoLink={adoLink}
                              isExpanded={isExpanded}
                              onToggleExpand={() => toggleRoadmapFeature(f.id)}
                              states={historyCache[f.id] || []}
                              loading={loadingHistory}
                              showTooltip={showTooltip}
                              moveTooltip={moveTooltip}
                              hideTooltip={hideTooltip}
                            />
                            {isExpanded && (
                              loadingStoriesIds[f.id] ? (
                                <tr style={{ background: '#f2f2f2' }}>
                                  <td colSpan="5" style={{ padding: '20px', textAlign: 'center' }}>Loading stories...</td>
                                </tr>
                              ) : (
                                (storiesCache[f.id] || []).map(s => (
                                  <StoryRow
                                    key={s.id}
                                    storyId={s.id}
                                    title={s.title}
                                    storyPoints={s.storyPoints}
                                    state={s.state}
                                    iterationPath={s.iterationPath}
                                    formatDate={formatDate}
                                    timelineStart={weekTimelineStart}
                                    timelineEnd={weekTimelineEnd}
                                    adoLink={adoLink}
                                    states={storyHistoryCache[s.id] || []}
                                    loading={loadingStoryHistory}
                                    showTooltip={showTooltip}
                                    moveTooltip={moveTooltip}
                                    hideTooltip={hideTooltip}
                                  />
                                ))
                              )
                            )}
                          </React.Fragment>
                        );
                      });
                    })()}
                  </tbody>
                </table>
              </div>

              {!loading && (
                <div style={{ background: 'white', padding: '20px', borderRadius: '8px', marginTop: '20px', display: 'flex', gap: '10px', justifyContent: 'center', alignItems: 'center' }}>
                  <button style={{ padding: '8px 16px', background: roadmapPage === 1 ? '#ccc' : '#007bff', color: 'white', border: 'none', cursor: roadmapPage === 1 ? 'default' : 'pointer', borderRadius: '4px' }} onClick={() => setRoadmapPage(roadmapPage - 1)} disabled={roadmapPage === 1}>Previous</button>
                  <span style={{ fontSize: '13px', fontWeight: 'bold' }}>Page {roadmapPage} of {totalPages}</span>
                  <button style={{ padding: '8px 16px', background: roadmapPage === totalPages ? '#ccc' : '#007bff', color: 'white', border: 'none', cursor: roadmapPage === totalPages ? 'default' : 'pointer', borderRadius: '4px' }} onClick={() => setRoadmapPage(roadmapPage + 1)} disabled={roadmapPage === totalPages}>Next</button>
                </div>
              )}
            </>
          )}
          <Tooltip tooltip={tooltip} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>
