<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ADO DEC Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    .header h1 { font-size: 24px; }
    .tabs { margin-top: 12px; display: flex; gap: 10px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .tab-btn { padding: 8px 16px; background: white; color: black; border: none; cursor: pointer; border-radius: 4px; font-size: 13px; }
    .tab-btn.active { background: #007bff; color: white; }
    .warnings { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffc107; }
    .filters { display: grid; gap: 15px; background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; overflow-x: auto; }
    .filter-div { }
    .filter-label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
    .filter-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .filter-count { font-size: 11px; color: #666; margin-top: 5px; }
    .clear-btn { width: 100%; padding: 10px 16px; background: #dc3545; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; margin-bottom: 12px; }
    .table-wrapper { background: white; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f9f9f9; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #eee; font-size: 13px; }
    td { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; }
    tr:hover { background: #f5f5f5; }
    a { color: #007bff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .expand-btn { cursor: pointer; user-select: none; text-align: center; width: 30px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const releaseDates = {
      'CE-2026-FEB': '2026-02-09',
      'CE-2026-FEB-SEMIMONTHLY': '2026-02-23',
      'CE-2026-MAR': '2026-03-09',
      'CE-2026-MAR-SEMIMONTHLY': '2026-03-23',
      'CE-2026-APR': '2026-04-12',
      'CE-2026-APR-SEMIMONTHLY': '2026-04-27',
      'CE-2026-MAY': '2026-05-11',
      'CE-2026-MAY-SEMIMONTHLY': '2026-05-25',
      'CE-2026-JUN': '2026-06-08',
      'CE-2026-JUN-SEMIMONTHLY': '2026-06-22',
      'CE-2026-JUL': '2026-07-13',
      'CE-2026-JUL-SEMIMONTHLY': '2026-07-27',
      'CE-2026-AUG': '2026-08-10',
      'CE-2026-AUG-SEMIMONTHLY': '2026-08-24',
      'CE-2026-SEP': '2026-09-14',
      'CE-2026-SEP-SEMIMONTHLY': '2026-09-28',
      'CE-2026-OCT': '2026-10-12',
      'CE-2026-OCT-SEMIMONTHLY': '2026-10-26',
      'CE-2026-NOV': '2026-11-09',
      'CE-2026-NOV-SEMIMONTHLY': '2026-11-23',
      'CE-2026-DEC': '2026-12-14'
    };

    const storyStateColors = {
      'New': '#94a3b8',
      'Business Refinement': '#facc15',
      'Technical Refinement': '#fb923c',
      'Ready for Development': '#f97316',
      'In Process': '#60a5fa',
      'QA Testing': '#38bdf8',
      'Business Sprint Testing': '#22d3ee',
      'Sprint Complete': '#2dd4bf',
      'User Acceptance Testing': '#34d399',
      'Approved for Release': '#4ade80',
      'Ready for Deployment': '#84cc16',
      'Closed': '#a78bfa'
    };

    // ── Tooltip global ──────────────────────────────────────────────
    function useTooltip() {
      const [tooltip, setTooltip] = React.useState({ visible: false, x: 0, y: 0, content: null });
      const showTooltip = React.useCallback((e, content) => {
        setTooltip({ visible: true, x: e.clientX, y: e.clientY, content });
      }, []);
      const moveTooltip = React.useCallback((e) => {
        setTooltip(prev => ({ ...prev, x: e.clientX, y: e.clientY }));
      }, []);
      const hideTooltip = React.useCallback(() => {
        setTooltip(prev => ({ ...prev, visible: false }));
      }, []);
      return { tooltip, showTooltip, moveTooltip, hideTooltip };
    }

    function Tooltip({ tooltip }) {
      if (!tooltip.visible || !tooltip.content) return null;
      const style = {
        position: 'fixed',
        left: tooltip.x + 14,
        top: tooltip.y - 10,
        background: 'rgba(15, 23, 42, 0.93)',
        color: 'white',
        padding: '8px 12px',
        borderRadius: '6px',
        fontSize: '11px',
        lineHeight: '1.6',
        pointerEvents: 'none',
        zIndex: 9999,
        maxWidth: '260px',
        boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
        whiteSpace: 'pre-wrap'
      };
      // Ajuste para que no se salga por la derecha
      const adjustedLeft = tooltip.x + 14 + 260 > window.innerWidth
        ? tooltip.x - 274
        : tooltip.x + 14;
      return (
        <div style={{ ...style, left: adjustedLeft }}>
          {tooltip.content}
        </div>
      );
    }
    
    function StoryRow({ storyId, title, storyPoints, state, iterationPath, formatDate, timelineStart, timelineEnd, adoLink, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const today = new Date();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);
      const todayPercent = ((today - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
      const clampedTodayPercent = Math.max(0, Math.min(100, todayPercent));

      // Calcular segmentos de estado
      const segments = [];
      if (states.length > 0) {
        states.forEach((st, idx) => {
          const stateStart = new Date(st.changedDate);
          const stateEnd = idx === states.length - 1 ? today : new Date(states[idx + 1].changedDate);
          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            segments.push({
              color: storyStateColors[st.state] || '#cccccc',
              state: st.state,
              startPercent: clampedStart,
              widthPercent: Math.max(1, clampedEnd - clampedStart)
            });
          }
        });
      }

      // Calcular sprint — si no hay match, sprintStart/sprintEnd quedan null y no se pinta nada
      let sprintStart = null;
      let sprintEnd = null;
      let sprintLabel = '';
      const sprintMatch = iterationPath && iterationPath.match(/(\d{4})_(S\d+)_([A-Za-z]+)(\d+)-([A-Za-z]+)(\d+)/);
      if (sprintMatch) {
        const year = parseInt(sprintMatch[1]);
        sprintLabel = sprintMatch[2];
        const monthMap = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
        const startMonth = sprintMatch[3];
        const startDay = parseInt(sprintMatch[4]);
        const endMonth = sprintMatch[5];
        const endDay = parseInt(sprintMatch[6]);
        sprintStart = new Date(year, monthMap[startMonth], startDay);
        sprintEnd = new Date(year, monthMap[endMonth], endDay);
        if (monthMap[endMonth] < monthMap[startMonth]) {
          sprintEnd = new Date(year + 1, monthMap[endMonth], endDay);
        }
      }

      const getSprintPercent = (date) => {
        const days = (date - timelineStart) / (1000 * 60 * 60 * 24);
        return (days / timelineTotalDays) * 100;
      };

      // Calcular posición del sprint solo si existe
      let sprintStartPercent = null;
      let sprintEndPercent = null;
      let sprintMidPercent = null;
      if (sprintStart && sprintEnd) {
        const rawStart = getSprintPercent(sprintStart);
        const rawEnd = getSprintPercent(sprintEnd);
        if (rawEnd > 0 && rawStart < 100) {
          sprintStartPercent = Math.max(0, rawStart);
          sprintEndPercent = Math.min(100, rawEnd);
          sprintMidPercent = (sprintStartPercent + sprintEndPercent) / 2;
        }
      }

      return (
        <tr style={{ borderBottom: '1px solid #eee', background: '#f2f2f2' }}>
          <td></td>
          <td><a href={adoLink(storyId)} target="_blank">{storyId}</a></td>
          <td style={{ maxWidth: '300px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span title={title} style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', flex: '0 1 auto', minWidth: '0' }}>{title}</span>
              <span style={{ color: '#696969', flexShrink: 0, fontSize: '11px' }}>({storyPoints} pts)</span>
            </div>
          </td>
          <td style={{ padding: '6px 8px' }}>
            <div style={{ height: '36px', background: '#e0e0e0', borderRadius: '4px', overflow: 'hidden', position: 'relative' }}>

              {/* Segmentos de estado — base de la barra, z-index bajo */}
              {!loading && segments.map((seg, idx) => {
                const segStartDate = new Date(timelineStart.getTime() + (seg.startPercent / 100) * (timelineEnd - timelineStart));
                const segEndDate = new Date(timelineStart.getTime() + ((seg.startPercent + seg.widthPercent) / 100) * (timelineEnd - timelineStart));
                const diffDays = Math.round((segEndDate - segStartDate) / (1000 * 60 * 60 * 24));
                const tooltipContent = (
                  <div>
                    <div style={{ fontWeight: 'bold', marginBottom: '4px', color: seg.color, fontSize: '12px' }}>● {seg.state}</div>
                    <div>From: {segStartDate.toLocaleDateString('es-CO')}</div>
                    <div>To:&nbsp;&nbsp; {segEndDate.toLocaleDateString('es-CO')}</div>
                    <div style={{ marginTop: '4px', color: '#94a3b8' }}>{diffDays} day{diffDays !== 1 ? 's' : ''} in this state</div>
                  </div>
                );
                return (
                  <div
                    key={idx}
                    style={{ position: 'absolute', top: '8px', left: seg.startPercent + '%', width: seg.widthPercent + '%', height: '20px', background: seg.color, borderRadius: '3px', opacity: 0.85, minWidth: '6px', cursor: 'pointer', zIndex: 2 }}
                    onMouseEnter={(e) => showTooltip && showTooltip(e, tooltipContent)}
                    onMouseMove={(e) => moveTooltip && moveTooltip(e)}
                    onMouseLeave={() => hideTooltip && hideTooltip()}
                  />
                );
              })}

              {/* Loading / No data — solo si no hay segmentos */}
              {loading && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>Loading...</div>
              )}
              {!loading && segments.length === 0 && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>No data</div>
              )}

              {/* Líneas y label del Sprint — solo si hay sprint válido en el rango */}
              {!loading && sprintStartPercent !== null && (
                <>
                  <div style={{ position: 'absolute', top: 0, bottom: 0, left: sprintStartPercent + '%', width: '1px', borderLeft: '1px dashed #123770', zIndex: 5, pointerEvents: 'none' }} />
                  <div style={{ position: 'absolute', top: 0, bottom: 0, left: sprintEndPercent + '%', width: '1px', borderLeft: '1px dashed #123770', zIndex: 5, pointerEvents: 'none' }} />
                  <div style={{ position: 'absolute', top: '2px', left: sprintMidPercent + '%', transform: 'translateX(-50%)', fontSize: '9px', color: 'white', background: '#123770', padding: '1px 5px', borderRadius: '2px', whiteSpace: 'nowrap', zIndex: 8, pointerEvents: 'none' }}>
                    {sprintLabel}
                  </div>
                </>
              )}

              {/* Línea de hoy */}
              {!loading && (
                <div style={{ position: 'absolute', top: 0, bottom: 0, left: clampedTodayPercent + '%', width: '1px', background: '#1e3a8a', opacity: 0.9, zIndex: 10, pointerEvents: 'none' }} />
              )}
            </div>
          </td>
        </tr>
      );
    }

    function FeatureRow({ featureId, title, targetDate, releaseFixVersion, estimation, formatDate, timelineStart, timelineEnd, adoLink, isExpanded, onToggleExpand, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const stateColors = {
        'New': '#94a3b8',
        'In Shaping': '#fbbf24',
        'In Planning': '#fb923c',
        'Planned': '#34d399',
        'In Process': '#60a5fa',
        'Closed': '#a78bfa'
      };

      const today = new Date();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);

      const segments = [];
      if (states.length > 0) {
        states.forEach((state, idx) => {
          const stateStart = new Date(state.changedDate);
          const stateEnd = idx === states.length - 1 ? today : new Date(states[idx + 1].changedDate);
          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            const widthPercent = Math.max(1, clampedEnd - clampedStart);
            segments.push({
              color: stateColors[state.state] || '#cccccc',
              state: state.state,
              startPercent: clampedStart,
              widthPercent: widthPercent
            });
          }
        });
      }

      return (
        <tr style={{ borderBottom: '1px solid #eee', background: isExpanded ? '#f2f2f2' : 'transparent' }}>
          <td className="expand-btn" onClick={onToggleExpand}>
            {isExpanded ? '▼' : '►'}
          </td>
          <td><a href={adoLink(featureId)} target="_blank">{featureId}</a></td>
          <td
            style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '300px', cursor: 'default' }}
            onMouseEnter={(e) => showTooltip && showTooltip(e, (
              <div>
                <div style={{ marginBottom: '6px', maxWidth: '240px', whiteSpace: 'normal', lineHeight: '1.4' }}>{title}</div>
                {targetDate && <div style={{ color: '#94a3b8', fontSize: '10px' }}>🎯 Target: {formatDate(targetDate)}</div>}
              </div>
            ))}
            onMouseMove={(e) => moveTooltip && moveTooltip(e)}
            onMouseLeave={() => hideTooltip && hideTooltip()}
          >{title}</td>
          <td style={{ padding: '8px' }}>
            <div style={{ minHeight: '32px', background: isExpanded ? '#e0e0e0' : '#f9f9f9', borderRadius: '4px', padding: '4px 10px', overflow: 'hidden', position: 'relative' }}>
              {!loading && (() => {
                const todayPercent = ((today - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
                if (todayPercent < 0 || todayPercent > 100) return null;
                return <div style={{ position: 'absolute', top: '0', bottom: '0', left: todayPercent + '%', width: '1px', background: '#1e3a8a', opacity: 0.9, zIndex: 10 }} />;
              })()}
              {!loading && targetDate && (() => {
                const target = new Date(targetDate);
                const targetPercent = ((target - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
                if (targetPercent < 0 || targetPercent > 100) return null;
                return (
                  <div style={{ position: 'absolute', top: '-4px', left: targetPercent + '%', transform: 'translateX(-50%)', zIndex: 11, width: '0', height: '0', borderLeft: '8px solid transparent', borderRight: '8px solid transparent', borderTop: '12px solid #f43f5e' }} title={'Target: ' + formatDate(targetDate)} />
                );
              })()}
              {!loading && releaseFixVersion && releaseDates[releaseFixVersion] && (() => {
                const releaseDate = new Date(releaseDates[releaseFixVersion]);
                const releasePercent = ((releaseDate - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
                if (releasePercent < 0 || releasePercent > 100) return null;
                return (
                  <div style={{ position: 'absolute', top: '50%', left: releasePercent + '%', transform: 'translate(-50%, -50%) rotate(45deg)', zIndex: 12, width: '10px', height: '10px', background: '#1e3a8a' }} title={releaseFixVersion + ': ' + formatDate(releaseDates[releaseFixVersion])} />
                );
              })()}
              {loading ? (
                <span style={{ fontSize: '11px', color: '#999' }}>Loading...</span>
              ) : segments.length === 0 ? (
                <span style={{ fontSize: '11px', color: '#999' }}>No data</span>
              ) : (
                <div style={{ width: '100%', position: 'relative', height: '20px' }}>
                  {segments.map((seg, idx) => {
                    const est = estimation || {};
                    const tooltipContent = (
                      <div>
                        <div style={{ fontWeight: 'bold', color: seg.color, marginBottom: '6px', fontSize: '12px' }}>● {seg.state}</div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '6px', textAlign: 'center' }}>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>BE</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.be || '—'}</div></div>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>FE</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.fe || '—'}</div></div>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>QA</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.qa || '—'}</div></div>
                        </div>
                      </div>
                    );
                    return (
                      <div
                        key={idx}
                        style={{ position: 'absolute', left: seg.startPercent + '%', width: seg.widthPercent + '%', height: '28px', background: seg.color, borderRadius: '3px', opacity: 0.85, minWidth: '6px', cursor: 'pointer' }}
                        onMouseEnter={(e) => showTooltip && showTooltip(e, tooltipContent)}
                        onMouseMove={(e) => moveTooltip && moveTooltip(e)}
                        onMouseLeave={() => hideTooltip && hideTooltip()}
                      />
                    );
                  })}
                </div>
              )}
            </div>
          </td>
        </tr>
      );
    }

    function Dashboard() {
      const { tooltip, showTooltip, moveTooltip, hideTooltip } = useTooltip();
      const [features, setFeatures] = useState([]);
      const [loading, setLoading] = useState(true);
      const [warnings, setWarnings] = useState([]);
      const [filterAreaPath, setFilterAreaPath] = useState([]);
      const [filterIteration, setFilterIteration] = useState([]);
      const [currentPage, setCurrentPage] = useState('roadmap');
      const [expandedRows, setExpandedRows] = useState({});
      const [searchTitle, setSearchTitle] = useState('');
      const [searchInput, setSearchInput] = useState('');
      const [sortColumn, setSortColumn] = useState('id');
      const [sortOrder, setSortOrder] = useState('asc');
      const currentYear = String(new Date().getFullYear());
      const [filterState, setFilterState] = useState([]);
      const [filterTargetDate, setFilterTargetDate] = useState([currentYear]);
      const [filterReleaseVersion, setFilterReleaseVersion] = useState([]);
      const [roadmapPage, setRoadmapPage] = useState(1);
      const [timelineOffset, setTimelineOffset] = useState(-8);
      const [weekOffset, setWeekOffset] = useState(-8);
      const [expandedRoadmapFeatureId, setExpandedRoadmapFeatureId] = useState(null);
      const [historyCache, setHistoryCache] = useState({});
      const [loadingHistory, setLoadingHistory] = useState(false);
      const [storiesCache, setStoriesCache] = useState({});
      const [loadingStoriesIds, setLoadingStoriesIds] = useState({});
      const [storyHistoryCache, setStoryHistoryCache] = useState({});
      const [loadingStoryHistory, setLoadingStoryHistory] = useState(false);
      const [featuresPage, setFeaturesPage] = useState(1);
      const [filterAssignedTo, setFilterAssignedTo] = useState([]);
      const [saveAsDefault, setSaveAsDefault] = useState(false);
      const [legendExpanded, setLegendExpanded] = useState(false);
      const [refreshing, setRefreshing] = useState(false);
      const [cacheInfo, setCacheInfo] = useState(null);

      // Debounce searchInput -> searchTitle
      useEffect(() => {
        const timer = setTimeout(() => { setSearchTitle(searchInput); }, 300);
        return () => clearTimeout(timer);
      }, [searchInput]);

      useEffect(() => {
        setRoadmapPage(1);
        setFeaturesPage(1);
        setExpandedRoadmapFeatureId(null);
      }, [filterAreaPath, filterIteration, filterState, filterTargetDate, filterReleaseVersion, filterAssignedTo, searchTitle]);

      async function loadFeatures(forceRefresh = false) {
        if (forceRefresh) { setRefreshing(true); } else { setLoading(true); }
        try {
          const url = forceRefresh ? '/api/features?refresh=1' : '/api/features';
          const res = await fetch(url);
          const json = await res.json();
          setFeatures(json.features);
          setCacheInfo(json.cacheInfo);
          setWarnings(json.warnings || []);
        } catch (err) {
          console.error('Error loading features:', err);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      }

      useEffect(() => { loadFeatures(false); }, []);
      useEffect(() => { setExpandedRoadmapFeatureId(null); }, [roadmapPage]);

      const areaPaths = [...new Set(features.map(f => f.areaPath).filter(a => a))].sort();
      const iterations = [...new Set(features.map(f => f.iterationPath).filter(a => a))].sort();
      const states = [...new Set(features.map(f => f.state).filter(a => a))].sort();
      const targetYears = [...new Set(features.map(f => f.targetDate ? new Date(f.targetDate).getFullYear() : null).filter(y => y))].sort((a, b) => b - a);
      const releaseVersions = [...new Set(features.map(f => f.releaseFixVersion).filter(v => v))].sort();
      const assignedTos = [...new Set(features.map(f => f.assignedTo).filter(a => a))].sort();

      const monthsByYear = {};
      features.forEach(f => {
        if (f.targetDate) {
          const d = new Date(f.targetDate);
          const y = d.getFullYear();
          const m = d.getMonth();
          if (!monthsByYear[y]) monthsByYear[y] = new Set();
          monthsByYear[y].add(m);
        }
      });

      const FILTER_STORAGE_KEY = 'featureTracker_defaultFilters';

      useEffect(() => {
        const saved = localStorage.getItem(FILTER_STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setFilterAreaPath(parsed.filterAreaPath || []);
            setFilterIteration(parsed.filterIteration || []);
            setFilterState(parsed.filterState || []);
            setFilterTargetDate(parsed.filterTargetDate || []);
            setFilterReleaseVersion(parsed.filterReleaseVersion || []);
            setFilterAssignedTo(parsed.filterAssignedTo || []);
            setSaveAsDefault(true);
          } catch (e) { console.error('Error loading saved filters:', e); }
        }
      }, []);

      useEffect(() => {
        if (!saveAsDefault) return;
        const filtersToSave = { filterAreaPath, filterIteration, filterState, filterTargetDate, filterReleaseVersion, filterAssignedTo };
        localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify(filtersToSave));
      }, [saveAsDefault, filterAreaPath, filterIteration, filterState, filterTargetDate, filterReleaseVersion, filterAssignedTo]);

      const handleSaveAsDefaultChange = (e) => {
        const checked = e.target.checked;
        setSaveAsDefault(checked);
        if (!checked) localStorage.removeItem(FILTER_STORAGE_KEY);
      };

      const filtered = features.filter(f => {
        const areaOk = filterAreaPath.length === 0 || filterAreaPath.includes(f.areaPath);
        const iterOk = filterIteration.length === 0 || filterIteration.includes(f.iterationPath);
        const stateOk = filterState.length === 0 || filterState.includes(f.state);
        const assignedOk = filterAssignedTo.length === 0 || filterAssignedTo.includes(f.assignedTo);
        let dateOk = filterTargetDate.length === 0;
        if (filterTargetDate.length > 0 && f.targetDate) {
          const d = new Date(f.targetDate);
          const yearMonthKey = d.getFullYear() + '-' + d.getMonth();
          const yearKey = String(d.getFullYear());
          dateOk = filterTargetDate.includes(yearMonthKey) || filterTargetDate.includes(yearKey);
        }
        const searchOk = searchTitle === '' || f.title.toLowerCase().includes(searchTitle.toLowerCase()) || f.tags.toLowerCase().includes(searchTitle.toLowerCase());
        const releaseOk = filterReleaseVersion.length === 0 || filterReleaseVersion.includes(f.releaseFixVersion);
        return areaOk && iterOk && stateOk && dateOk && searchOk && releaseOk && assignedOk;
      });

      let sortedFiltered = [...filtered];
      if (sortColumn) {
        sortedFiltered.sort((a, b) => {
          let valA = '', valB = '';
          if (sortColumn === 'id') { valA = a.id; valB = b.id; }
          else if (sortColumn === 'title') { valA = (a.title || '').toLowerCase(); valB = (b.title || '').toLowerCase(); }
          else if (sortColumn === 'areaPath') { valA = (a.areaPath || '').toLowerCase(); valB = (b.areaPath || '').toLowerCase(); }
          else if (sortColumn === 'iteration') {
            const extractYearQuarter = (path) => {
              const yearMatch = (path || '').match(/(\d{4})/);
              const quarterMatch = (path || '').match(/Q(\d)/);
              const year = yearMatch ? parseInt(yearMatch[1]) : 9999;
              const quarter = quarterMatch ? parseInt(quarterMatch[1]) : 9;
              return year * 10 + quarter;
            };
            valA = extractYearQuarter(a.iterationPath);
            valB = extractYearQuarter(b.iterationPath);
          }
          else if (sortColumn === 'priority') { valA = parseInt(a.priority) || 0; valB = parseInt(b.priority) || 0; }
          else if (sortColumn === 'state') { valA = (a.state || '').toLowerCase(); valB = (b.state || '').toLowerCase(); }
          else if (sortColumn === 'targetDate') { valA = (a.targetDate || ''); valB = (b.targetDate || ''); }
          else if (sortColumn === 'assignedTo') { valA = (a.assignedTo || '').toLowerCase(); valB = (b.assignedTo || '').toLowerCase(); }
          if (sortOrder === 'asc') return valA < valB ? -1 : valA > valB ? 1 : 0;
          else return valA > valB ? -1 : valA < valB ? 1 : 0;
        });
      }

      const toggleFeatureExpand = (featureId) => {
        const isExpanding = !expandedRows[featureId];
        setExpandedRows({ ...expandedRows, [featureId]: isExpanding });
        if (isExpanding && !storiesCache[featureId]) {
          setLoadingStoriesIds(prev => ({ ...prev, [featureId]: true }));
          fetch('/api/feature-stories/' + featureId)
            .then(r => r.json())
            .then(d => {
              setStoriesCache(prev => ({ ...prev, [featureId]: d.stories || [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            })
            .catch(() => {
              setStoriesCache(prev => ({ ...prev, [featureId]: [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            });
        }
      };

      // Precarga stories de todos los features visibles en la página actual
      useEffect(() => {
        const featuresToLoad = featuresPageItems
          .map(f => f.id)
          .filter(id => !storiesCache[id] && !loadingStoriesIds[id]);
        if (featuresToLoad.length === 0) return;

        featuresToLoad.forEach(featureId => {
          setLoadingStoriesIds(prev => ({ ...prev, [featureId]: true }));
          fetch('/api/feature-stories/' + featureId)
            .then(r => r.json())
            .then(d => {
              setStoriesCache(prev => ({ ...prev, [featureId]: d.stories || [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            })
            .catch(() => {
              setStoriesCache(prev => ({ ...prev, [featureId]: [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            });
        });
      }, [featuresPage, sortedFiltered.length, filterAreaPath.join(','), filterIteration.join(','), filterState.join(','), filterTargetDate.join(','), filterReleaseVersion.join(','), filterAssignedTo.join(','), searchTitle]);

      const toggleRoadmapFeature = (featureId) => {
        if (expandedRoadmapFeatureId === featureId) { setExpandedRoadmapFeatureId(null); return; }
        setExpandedRoadmapFeatureId(featureId);
        if (!storiesCache[featureId]) {
          setLoadingStoriesIds(prev => ({ ...prev, [featureId]: true }));
          fetch('/api/feature-stories/' + featureId)
            .then(r => r.json())
            .then(d => {
              setStoriesCache(prev => ({ ...prev, [featureId]: d.stories || [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            })
            .catch(() => {
              setStoriesCache(prev => ({ ...prev, [featureId]: [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            });
        }
      };

      const featuresItemsPerPage = 15;
      const featuresTotalPages = Math.ceil(sortedFiltered.length / featuresItemsPerPage);
      const featuresStartIdx = (featuresPage - 1) * featuresItemsPerPage;
      const featuresPageItems = sortedFiltered.slice(featuresStartIdx, featuresStartIdx + featuresItemsPerPage);

      const adoLink = (id) => `https://dev.azure.com/tr-commercial-eng/Commercial%20Engineering/_workitems/edit/${id}`;
      const formatDate = (date) => { if (!date) return '-'; return new Date(date).toLocaleDateString('es-CO'); };

      const itemsPerPage = 15;
      const totalPages = Math.ceil(sortedFiltered.length / itemsPerPage);
      const startIdx = (roadmapPage - 1) * itemsPerPage;
      const pageItems = sortedFiltered.slice(startIdx, startIdx + itemsPerPage);
      const pageItemIds = pageItems.map(item => item.id).join(',');

      const expandedRoadmapStories = expandedRoadmapFeatureId ? (storiesCache[expandedRoadmapFeatureId] || []) : [];
      const expandedStoryIds = expandedRoadmapStories.map(s => s.id).join(',');

      // Fix 1.1 — historyCache acumulativo
      useEffect(() => {
        if (currentPage !== 'roadmap' || pageItems.length === 0) return;
        const ids = pageItems.map(item => item.id).filter(id => !historyCache[id]);
        if (ids.length === 0) return;
        setLoadingHistory(true);
        fetch('/api/features-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids })
        })
          .then(r => r.json())
          .then(d => {
            setHistoryCache(prev => ({ ...prev, ...(d.results || {}) }));
            setLoadingHistory(false);
          })
          .catch(() => { setLoadingHistory(false); });
      }, [pageItemIds, currentPage]);

      // Fase 4 — Prefetch de la siguiente página del Roadmap
      useEffect(() => {
        if (currentPage !== 'roadmap') return;
        const nextStart = roadmapPage * itemsPerPage;
        const nextPageItems = sortedFiltered.slice(nextStart, nextStart + itemsPerPage);
        if (nextPageItems.length === 0) return;
        const ids = nextPageItems.map(item => item.id).filter(id => !historyCache[id]);
        if (ids.length === 0) return;
        fetch('/api/features-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids })
        })
          .then(r => r.json())
          .then(d => {
            setHistoryCache(prev => ({ ...prev, ...(d.results || {}) }));
          })
          .catch(() => {});
      }, [roadmapPage, currentPage, sortedFiltered.length, filterAreaPath.join(','), filterIteration.join(','), filterState.join(','), filterTargetDate.join(','), filterReleaseVersion.join(','), filterAssignedTo.join(','), searchTitle]);

      // Fix 1.2 — storyHistoryCache acumulativo
      useEffect(() => {
        if (!expandedRoadmapFeatureId || expandedRoadmapStories.length === 0) return;
        const ids = expandedRoadmapStories.map(s => s.id).filter(id => !storyHistoryCache[id]);
        if (ids.length === 0) return;
        setLoadingStoryHistory(true);
        fetch('/api/stories-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids })
        })
          .then(r => r.json())
          .then(d => {
            setStoryHistoryCache(prev => ({ ...prev, ...(d.results || {}) }));
            setLoadingStoryHistory(false);
          })
          .catch(() => { setLoadingStoryHistory(false); });
      }, [expandedRoadmapFeatureId, expandedStoryIds]);

      return (
        <div className="container">
          <div className="header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
            <div><h1 style={{ margin: 0 }}>ADO DEC Dashboard</h1></div>
            <div style={{ display: 'flex', gap: '10px' }}>
              <button style={{ padding: '8px 16px', background: currentPage === 'features' ? '#007bff' : 'white', color: currentPage === 'features' ? 'white' : 'black', border: 'none', cursor: 'pointer', borderRadius: '4px', fontSize: '13px' }} onClick={() => setCurrentPage('features')}>Feature List</button>
              <button style={{ padding: '8px 16px', background: currentPage === 'roadmap' ? '#007bff' : 'white', color: currentPage === 'roadmap' ? 'white' : 'black', border: 'none', cursor: 'pointer', borderRadius: '4px', fontSize: '13px' }} onClick={() => setCurrentPage('roadmap')}>Roadmap</button>
            </div>
          </div>

          {warnings.length > 0 && (
            <div className="warnings">
              <strong>⚠️ Data Warnings:</strong>
              {warnings.map((w, i) => <div key={i} style={{ fontSize: '13px', marginTop: '5px' }}>{w}</div>)}
            </div>
          )}

          <div style={{ background: 'white', padding: '15px', borderRadius: '8px', marginBottom: '12px', display: 'flex', gap: '20px', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', gap: '20px', alignItems: 'center', flex: 1 }}>
              <div style={{ flex: '0 0 auto', display: 'flex', gap: '8px', alignItems: 'center' }}>
                <label style={{ fontWeight: 'bold', fontSize: '12px', whiteSpace: 'nowrap' }}>Search Feature Title</label>
                <input
                  type="text"
                  placeholder="Type feature title..."
                  value={searchInput}
                  onChange={(e) => setSearchInput(e.target.value)}
                  style={{ width: '300px', padding: '8px', border: '1px solid #ddd', borderRadius: '4px', fontSize: '12px' }}
                />
              </div>
            </div>
            <button style={{ padding: '8px 16px', background: '#537fbd', color: 'white', border: 'none', cursor: 'pointer', borderRadius: '4px', fontWeight: 'bold', fontSize: '11px', whiteSpace: 'nowrap', flex: '0 0 auto' }} onClick={() => loadFeatures(true)} disabled={refreshing}>
              {refreshing ? 'Refreshing...' : 'Refresh results'}
            </button>
            {cacheInfo && (
              <span style={{ fontSize: '11px', color: '#888', marginLeft: '8px' }}>Cache updated {cacheInfo.ageMinutes} min ago</span>
            )}
            <button style={{ padding: '8px 16px', background: '#dc3545', color: 'white', border: 'none', cursor: 'pointer', borderRadius: '4px', fontWeight: 'bold', fontSize: '12px', whiteSpace: 'nowrap', flex: '0 0 auto' }} onClick={() => { setFilterAreaPath([]); setFilterIteration([]); setFilterState([]); setFilterTargetDate([]); setFilterReleaseVersion([]); setFilterAssignedTo([]); }}>
              Clear filters
            </button>
          </div>

          <div className="filters-card" style={{ background: 'white', padding: '15px 20px 10px 20px', borderRadius: '8px', marginBottom: '12px' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '0.7fr 1.7fr 0.8fr 0.5fr 0.8fr 0.6fr', gap: '15px', alignItems: 'start' }}>
              <div>
                <label className="filter-label">Area Path</label>
                <select multiple className="filter-select" value={filterAreaPath} onChange={(e) => setFilterAreaPath([...e.target.selectedOptions].map(o => o.value))}>
                  {areaPaths.map(area => <option key={area} value={area}>{area.split('\\').pop()}</option>)}
                </select>
                {filterAreaPath.length > 0 && <p className="filter-count">{filterAreaPath.length} selected</p>}
              </div>
              <div>
                <label className="filter-label">Iteration Path</label>
                <select multiple className="filter-select" value={filterIteration} onChange={(e) => setFilterIteration([...e.target.selectedOptions].map(o => o.value))}>
                  {iterations.map(iter => <option key={iter} value={iter}>{iter}</option>)}
                </select>
                {filterIteration.length > 0 && <p className="filter-count">{filterIteration.length} selected</p>}
              </div>
              <div>
                <label className="filter-label">Assigned To</label>
                <select multiple className="filter-select" value={filterAssignedTo} onChange={(e) => setFilterAssignedTo([...e.target.selectedOptions].map(o => o.value))}>
                  {assignedTos.map(person => <option key={person} value={person}>{person}</option>)}
                </select>
                {filterAssignedTo.length > 0 && <p className="filter-count">{filterAssignedTo.length} selected</p>}
              </div>
              <div>
                <label className="filter-label">State</label>
                <select multiple className="filter-select" value={filterState} onChange={(e) => setFilterState([...e.target.selectedOptions].map(o => o.value))}>
                  {states.map(state => <option key={state} value={state}>{state}</option>)}
                </select>
                {filterState.length > 0 && <p className="filter-count">{filterState.length} selected</p>}
              </div>
              <div>
                <label className="filter-label">Target Date (year/month)</label>
                <select multiple className="filter-select" value={filterTargetDate} onChange={(e) => setFilterTargetDate([...e.target.selectedOptions].map(o => o.value))}>
                  {targetYears.map(year => (
                    <React.Fragment key={year}>
                      <option value={String(year)} style={{ fontWeight: 'bold' }}>{year}</option>
                      {[...(monthsByYear[year] || [])].sort((a, b) => a - b).map(month => (
                        <option key={year + '-' + month} value={year + '-' + month} style={{ paddingLeft: '15px' }}>
                          &nbsp;&nbsp;{new Date(2000, month, 1).toLocaleString('default', { month: 'long' })}
                        </option>
                      ))}
                    </React.Fragment>
                  ))}
                </select>
                {filterTargetDate.length > 0 && <p className="filter-count">{filterTargetDate.length} selected</p>}
              </div>
              <div>
                <label className="filter-label">Release Fix Version</label>
                <select multiple className="filter-select" value={filterReleaseVersion} onChange={(e) => setFilterReleaseVersion([...e.target.selectedOptions].map(o => o.value))}>
                  {releaseVersions.map(rv => <option key={rv} value={rv}>{rv}</option>)}
                </select>
                {filterReleaseVersion.length > 0 && <p className="filter-count">{filterReleaseVersion.length} selected</p>}
              </div>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%', padding: '2px', marginTop: '4px', boxSizing: 'border-box' }}>
              <span style={{ color: '#666', fontSize: '10px', whiteSpace: 'nowrap' }}>
                Showing {featuresPageItems.length} of {sortedFiltered.length} (Page {featuresPage} of {featuresTotalPages})
              </span>
              <label style={{ display: 'flex', alignItems: 'center', gap: '4px', fontSize: '10px', cursor: 'pointer', flexShrink: 0, whiteSpace: 'nowrap' }}>
                <input type="checkbox" checked={saveAsDefault} onChange={handleSaveAsDefaultChange} style={{ width: '12px', height: '12px', margin: 0 }} />
                Save as default filter
              </label>
            </div>
          </div>

          {currentPage === 'features' && (
            <>
              {loading ? <div>Loading...</div> : (
                <div className="table-wrapper">
                  <table>
                    <thead>
                      <tr>
                        <th style={{ width: '30px' }}></th>
                        <th style={{ cursor: 'pointer' }} onClick={() => { setSortColumn('id'); setSortOrder(sortColumn === 'id' && sortOrder === 'asc' ? 'desc' : 'asc'); }}>ID {sortColumn === 'id' ? (sortOrder === 'asc' ? '▲' : '▼') : ''}</th>
                        <th style={{ cursor: 'pointer' }} onClick={() => { setSortColumn('title'); setSortOrder(sortColumn === 'title' && sortOrder === 'asc' ? 'desc' : 'asc'); }}>Feature {sortColumn === 'title' ? (sortOrder === 'asc' ? '▲' : '▼') : ''}</th>
                        <th style={{ cursor: 'pointer' }} onClick={() => { setSortColumn('areaPath'); setSortOrder(sortColumn === 'areaPath' && sortOrder === 'asc' ? 'desc' : 'asc'); }}>Area Path {sortColumn === 'areaPath' ? (sortOrder === 'asc' ? '▲' : '▼') : ''}</th>
                        <th style={{ cursor: 'pointer' }} onClick={() => { setSortColumn('iteration'); setSortOrder(sortColumn === 'iteration' && sortOrder === 'asc' ? 'desc' : 'asc'); }}>Iteration {sortColumn === 'iteration' ? (sortOrder === 'asc' ? '▲' : '▼') : ''}</th>
                        <th style={{ cursor: 'pointer' }} onClick={() => { setSortColumn('priority'); setSortOrder(sortColumn === 'priority' && sortOrder === 'asc' ? 'desc' : 'asc'); }}>Priority {sortColumn === 'priority' ? (sortOrder === 'asc' ? '▲' : '▼') : ''}</th>
                        <th style={{ cursor: 'pointer' }} onClick={() => { setSortColumn('targetDate'); setSortOrder(sortColumn === 'targetDate' && sortOrder === 'asc' ? 'desc' : 'asc'); }}>Target Date {sortColumn === 'targetDate' ? (sortOrder === 'asc' ? '▲' : '▼') : ''}</th>
                        <th>Planned Month</th>
                        <th>BE</th>
                        <th>FE</th>
                        <th>QA</th>
                        <th style={{ cursor: 'pointer' }} onClick={() => { setSortColumn('state'); setSortOrder(sortColumn === 'state' && sortOrder === 'asc' ? 'desc' : 'asc'); }}>State {sortColumn === 'state' ? (sortOrder === 'asc' ? '▲' : '▼') : ''}</th>
                        <th style={{ cursor: 'pointer' }} onClick={() => { setSortColumn('assignedTo'); setSortOrder(sortColumn === 'assignedTo' && sortOrder === 'asc' ? 'desc' : 'asc'); }}>Assigned To {sortColumn === 'assignedTo' ? (sortOrder === 'asc' ? '▲' : '▼') : ''}</th>
                        <th style={{ width: '120px', textAlign: 'center' }}>Progress</th>
                      </tr>
                    </thead>
                    <tbody>
                      {featuresPageItems.map(f => {
                        const featureRowBg = { 'New': '#f8fafc', 'In Shaping': '#fffbeb', 'In Planning': '#fff7ed', 'Planned': '#f0fdf4', 'In Process': '#eff6ff', 'Closed': '#f5f3ff' }[f.state] || 'white';
                        const featureStateDot = { 'New': '#94a3b8', 'In Shaping': '#fbbf24', 'In Planning': '#fb923c', 'Planned': '#34d399', 'In Process': '#60a5fa', 'Closed': '#a78bfa' }[f.state] || '#ccc';
                        return (
                          <React.Fragment key={f.id}>
                            <tr style={{ background: featureRowBg, borderLeft: '3px solid ' + featureStateDot }}>
                              <td className="expand-btn" onClick={() => toggleFeatureExpand(f.id)}>{expandedRows[f.id] ? '▼' : '►'}</td>
                              <td><a href={adoLink(f.id)} target="_blank">{f.id}</a></td>
                              <td title={f.title} style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '300px' }}>{f.title}</td>
                              <td style={{ fontSize: '11px' }}>{f.areaPath.split('\\').pop()}</td>
                              <td style={{ fontSize: '11px' }}>{f.iterationPath.split('\\').pop()}</td>
                              <td>{f.priority || '-'}</td>
                              <td style={{ fontSize: '11px' }}>{formatDate(f.targetDate)}</td>
                              <td>{f.plannedMonth || '-'}</td>
                              <td>{f.estimation.be || '-'}</td>
                              <td>{f.estimation.fe || '-'}</td>
                              <td>{f.estimation.qa || '-'}</td>
                              <td>
                                <span style={{ display: 'inline-flex', alignItems: 'center', gap: '5px' }}>
                                  <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: featureStateDot, flexShrink: 0, display: 'inline-block' }}></span>
                                  {f.state}
                                </span>
                              </td>
                              <td style={{ fontSize: '11px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '130px' }} title={f.assignedTo}>{f.assignedTo || '—'}</td>
                                                            <td style={{ textAlign: 'center', padding: '8px' }}>
                                {loadingStoriesIds[f.id] ? (
                                  <span style={{ fontSize: '10px', color: '#aaa', fontStyle: 'italic' }}>Loading...</span>
                                ) : storiesCache[f.id] ? (() => {
                                  const stories = storiesCache[f.id].filter(s => s.state !== 'Removed');
                                  const closed = stories.filter(s => s.state === 'Closed' || s.state === 'Approved for Release' || s.state === 'Ready for Deployment').length;
                                  const total = stories.length;
                                  const pct = total === 0 ? 0 : Math.round((closed / total) * 100);
                                  const barColor = pct === 100 ? '#34d399' : pct >= 50 ? '#60a5fa' : '#fbbf24';
                                  return (
                                    <div title={closed + ' of ' + total + ' stories done'}>
                                      <div style={{ fontSize: '10px', color: '#666', marginBottom: '3px' }}>{closed}/{total} ({pct}%)</div>
                                      <div style={{ height: '6px', background: '#e5e7eb', borderRadius: '3px', overflow: 'hidden' }}>
                                        <div style={{ height: '100%', width: pct + '%', background: barColor, borderRadius: '3px', transition: 'width 0.3s ease' }} />
                                      </div>
                                    </div>
                                  );
                                })() : <span style={{ fontSize: '10px', color: '#bbb' }}>—</span>}
                              </td>
                            </tr>
                            {expandedRows[f.id] && (() => {
                              if (loadingStoriesIds[f.id]) {
                                return (
                                  <tr style={{ background: '#f9f9f9' }}>
                                    <td colSpan="14" style={{ paddingLeft: '40px', paddingTop: '15px', paddingBottom: '15px' }}>Loading stories...</td>
                                  </tr>
                                );
                              }
                              const fStories = storiesCache[f.id] || [];
                              if (fStories.length === 0) {
                                return (
                                  <tr style={{ background: '#f9f9f9' }}>
                                    <td colSpan="14" style={{ paddingLeft: '40px', paddingTop: '15px', paddingBottom: '15px' }}>No stories found for this feature.</td>
                                  </tr>
                                );
                              }
                              return (
                                <tr style={{ background: '#f9f9f9' }}>
                                  <td colSpan="14" style={{ paddingLeft: '40px', paddingTop: '12px', paddingBottom: '12px', paddingRight: '20px' }}>
                                    <div>
                                     {(() => {
                                        const activeStories = fStories.filter(s => s.state !== 'Removed');
                                        const removedCount = fStories.length - activeStories.length;
                                        const doneCount = activeStories.filter(s => ['Closed','Approved for Release','Ready for Deployment'].includes(s.state)).length;
                                        const inProgressCount = activeStories.filter(s => ['In Process','QA Testing','Business Sprint Testing'].includes(s.state)).length;
                                        const pendingCount = activeStories.filter(s => !['Closed','Approved for Release','Ready for Deployment','In Process','QA Testing','Business Sprint Testing'].includes(s.state)).length;
                                        const removedLabel = removedCount > 0 ? ' +' + removedCount + ' removed' : '';
                                        return (
                                          <div style={{ marginBottom: '10px', fontSize: '12px', fontWeight: 'bold' }}>
                                            Stories & Bugs ({activeStories.length}
                                            {removedCount > 0 && <span style={{ color: '#94a3b8', fontWeight: 'normal' }}> +{removedCount} removed</span>}
                                            ){' — '}
                                            <span style={{ color: '#34d399' }}>{doneCount} done</span>
                                            {' / '}
                                            <span style={{ color: '#60a5fa' }}>{inProgressCount} in progress</span>
                                            {' / '}
                                            <span style={{ color: '#fbbf24' }}>{pendingCount} pending</span>
                                          </div>
                                        );
                                      })()}
                                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: '8px' }}>
                                       {fStories.filter(s => s.state !== 'Removed').map(story => {
                                          const storyDotColor = storyStateColors[story.state] || '#ccc';
                                          const isBug = story.workItemType === 'Bug';
                                          const sprintLabel = (() => {
                                            const m = story.iterationPath && story.iterationPath.match(/(\d{4})_(S\d+)_/);
                                            return m ? m[1] + ' ' + m[2] : story.iterationPath ? story.iterationPath.split('\\').pop() : '—';
                                          })();
                                          return (
                                            <div key={story.id} style={{ padding: '8px 12px', background: 'white', borderLeft: '3px solid ' + storyDotColor, borderRadius: '4px', boxShadow: '0 1px 3px rgba(0,0,0,0.06)' }}>
                                              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '8px' }}>
                                                <div style={{ flex: 1, minWidth: 0 }}>
                                                  <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '4px' }}>
                                                    {isBug && <span style={{ fontSize: '9px', background: '#fee2e2', color: '#dc2626', padding: '1px 5px', borderRadius: '3px', fontWeight: 'bold', flexShrink: 0 }}>BUG</span>}
                                                    <a href={adoLink(story.id)} target="_blank" style={{ fontSize: '11px', fontWeight: 'bold', color: '#007bff', flexShrink: 0 }}>#{story.id}</a>
                                                    <span style={{ fontSize: '11px', color: '#333', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{story.title}</span>
                                                  </div>
                                                  <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                                                    <span style={{ fontSize: '10px', background: storyDotColor, color: 'white', padding: '1px 6px', borderRadius: '3px', whiteSpace: 'nowrap' }}>{story.state}</span>
                                                    <span style={{ fontSize: '10px', color: '#666' }}>📍 {sprintLabel}</span>
                                                    <span style={{ fontSize: '10px', color: '#666' }}>🎯 {story.storyPoints || 0} pts</span>
                                                  </div>
                                                </div>
                                              </div>
                                            </div>
                                          );
                                        })}
                                      </div>
                                    </div>
                                  </td>
                                </tr>
                              );
                            })()}
                          </React.Fragment>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
              {!loading && (
                <div style={{ background: 'white', padding: '20px', borderRadius: '8px', marginTop: '20px', display: 'flex', gap: '10px', justifyContent: 'center', alignItems: 'center' }}>
                  <button style={{ padding: '8px 16px', background: featuresPage === 1 ? '#ccc' : '#007bff', color: 'white', border: 'none', cursor: featuresPage === 1 ? 'default' : 'pointer', borderRadius: '4px' }} onClick={() => setFeaturesPage(featuresPage - 1)} disabled={featuresPage === 1}>Previous</button>
                  <span style={{ fontSize: '13px', fontWeight: 'bold' }}>Page {featuresPage} of {featuresTotalPages}</span>
                  <button style={{ padding: '8px 16px', background: featuresPage === featuresTotalPages ? '#ccc' : '#007bff', color: 'white', border: 'none', cursor: featuresPage === featuresTotalPages ? 'default' : 'pointer', borderRadius: '4px' }} onClick={() => setFeaturesPage(featuresPage + 1)} disabled={featuresPage === featuresTotalPages}>Next</button>
                </div>
              )}
            </>
          )}

          {currentPage === 'roadmap' && (
            <>
              {(() => {
                return (
                  <>
                    <div style={{ background: 'white', padding: '10px 15px', borderRadius: '8px', marginBottom: '10px' }}>
                      <div onClick={() => setLegendExpanded(!legendExpanded)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer', userSelect: 'none' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                          <span style={{ fontSize: '13px', fontWeight: 'bold' }}>Features & Stories states</span>
                          <span style={{ fontSize: '10px', transform: legendExpanded ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }}>▼</span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '20px', flexWrap: 'nowrap' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '4px', whiteSpace: 'nowrap' }}>
                            <div style={{ width: '2px', height: '12px', background: '#333333', flexShrink: 0 }}></div>
                            <span style={{ fontSize: '10px' }}>Today</span>
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '4px', whiteSpace: 'nowrap' }}>
                            <div style={{ width: '0', height: '0', borderLeft: '5px solid transparent', borderRight: '5px solid transparent', borderTop: '8px solid #f43f5e', flexShrink: 0 }}></div>
                            <span style={{ fontSize: '10px' }}>Target Date</span>
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '4px', whiteSpace: 'nowrap' }}>
                            <div style={{ width: '8px', height: '8px', background: '#1e3a8a', transform: 'rotate(45deg)', flexShrink: 0 }}></div>
                            <span style={{ fontSize: '10px' }}>Release Fix Version</span>
                          </div>
                        </div>
                      </div>
                      {legendExpanded && (
                        <div style={{ display: 'flex', gap: '10px', alignItems: 'left', flexWrap: 'wrap', flexDirection: 'column', marginTop: '10px' }}>
                          <div style={{ display: 'flex', gap: '8px', alignItems: 'left', flexWrap: 'wrap' }}>
                            <span style={{ fontSize: '11px', fontWeight: 'bold' }}>Feature States:</span>
                            {[{ label: 'New', color: '#94a3b8' }, { label: 'In Shaping', color: '#fbbf24' }, { label: 'In Planning', color: '#fb923c' }, { label: 'Planned', color: '#34d399' }, { label: 'In Process', color: '#60a5fa' }, { label: 'Closed', color: '#a78bfa' }].map((item, idx) => (
                              <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: '5px' }}>
                                <div style={{ width: '12px', height: '12px', background: item.color, borderRadius: '2px' }}></div>
                                <span style={{ fontSize: '10px' }}>{item.label}</span>
                              </div>
                            ))}
                          </div>
                          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center', fontSize: '10px' }}>
                            <span style={{ fontSize: '11px', fontWeight: 'bold' }}>Stories States:</span>
                            {Object.entries(storyStateColors).map(([state, color]) => (
                              <div key={state} style={{ display: 'flex', alignItems: 'left', gap: '4px' }}>
                                <div style={{ width: '12px', height: '12px', background: color, borderRadius: '2px' }}></div>
                                <span>{state}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    {expandedRoadmapFeatureId ? (() => {
                      const today = new Date();
                      const dayOfWeek = today.getDay();
                      const thisMonday = new Date(today);
                      thisMonday.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
                      const weekLabels = [];
                      for (let i = 0; i < 12; i++) {
                        const weekStart = new Date(thisMonday);
                        weekStart.setDate(thisMonday.getDate() + (weekOffset + i) * 7);
                        weekLabels.push(weekStart.toLocaleString('default', { month: 'short', day: 'numeric' }));
                      }
                      return (
                        <div style={{ display: 'flex', gap: '20px', padding: '12px', marginBottom: '10px', alignItems: 'center' }}>
                          <div style={{ flex: '0 0 300px', display: 'flex', justifyContent: 'flex-end' }}>
                            <button style={{ padding: '4px 10px', background: '#537fbd', color: 'white', border: 'none', cursor: 'pointer', borderRadius: '4px', fontSize: '14px' }} onClick={() => setWeekOffset(weekOffset - 1)}>◄</button>
                          </div>
                          <div style={{ flex: 1 }}>
                            {(() => {
                              // Agrupar semanas por año-trimestre
                              const groups = [];
                              let currentGroup = null;
                              for (let i = 0; i < 12; i++) {
                                const weekStart = new Date(thisMonday);
                                weekStart.setDate(thisMonday.getDate() + (weekOffset + i) * 7);
                                const year = weekStart.getFullYear();
                                const quarter = Math.floor(weekStart.getMonth() / 3) + 1;
                                const quarterKey = year + '-Q' + quarter;
                                const label = weekStart.toLocaleString('default', { month: 'short', day: 'numeric' });
                                if (!currentGroup || currentGroup.key !== quarterKey) {
                                  currentGroup = { key: quarterKey, label: year + ' · Q' + quarter, weeks: [] };
                                  groups.push(currentGroup);
                                }
                                currentGroup.weeks.push(label);
                              }
                              return (
                                <div>
                                  {/* Fila de año-trimestre */}
                                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
                                    {groups.map((g, gi) => (
                                      <div
                                        key={gi}
                                        style={{
                                          gridColumn: 'span ' + g.weeks.length,
                                          background: parseInt(g.key) % 2 === 0 ? '#1e3a8a' : '#2563eb',
                                          color: 'white',
                                          textAlign: 'center',
                                          fontSize: '10px',
                                          fontWeight: 'bold',
                                          padding: '3px 0',
                                          borderRadius: '3px'
                                        }}
                                      >
                                        {g.label}
                                      </div>
                                    ))}
                                  </div>
                                  {/* Fila de semanas */}
                                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
                                    {groups.map((g, gi) =>
                                      g.weeks.map((week, wi) => (
                                        <div
                                          key={gi + '-' + wi}
                                          style={{
                                            background: '#e2e8f0',
                                            textAlign: 'center',
                                            fontSize: '9px',
                                            fontWeight: 'bold',
                                            padding: '3px 0',
                                            borderRadius: '3px',
                                            color: '#334155'
                                          }}
                                        >
                                          {week}
                                        </div>
                                      ))
                                    )}
                                  </div>
                                </div>
                              );
                            })()}
                          </div>
                          <button style={{ padding: '4px 10px', background: '#537fbd', color: 'white', border: 'none', cursor: 'pointer', borderRadius: '4px', fontSize: '14px' }} onClick={() => setWeekOffset(weekOffset + 1)}>►</button>
                        </div>
                      );
                    })() : (() => {
                      const today = new Date();
                      const timelineStart = new Date(today.getFullYear(), today.getMonth() + timelineOffset, 1);
                      const monthLabels = [];
                      for (let i = 0; i < 12; i++) {
                        const m = new Date(timelineStart.getFullYear(), timelineStart.getMonth() + i, 1);
                        monthLabels.push(m.toLocaleString('default', { month: 'short', year: '2-digit' }));
                      }
                                           return (
                        <div style={{ display: 'flex', gap: '20px', padding: '12px', marginBottom: '10px', alignItems: 'center' }}>
                          <div style={{ flex: '0 0 300px', display: 'flex', justifyContent: 'flex-end' }}>
                            <button style={{ padding: '4px 10px', background: '#007bff', color: 'white', border: 'none', cursor: 'pointer', borderRadius: '4px', fontSize: '14px' }} onClick={() => setTimelineOffset(timelineOffset - 1)}>◄</button>
                          </div>
                          <div style={{ flex: 1 }}>
                            {(() => {
                              // Agrupar meses por año
                              const groups = [];
                              let currentGroup = null;
                              for (let i = 0; i < 12; i++) {
                                const m = new Date(timelineStart.getFullYear(), timelineStart.getMonth() + i, 1);
                                const year = m.getFullYear();
                                const monthName = m.toLocaleString('default', { month: 'short' });
                                if (!currentGroup || currentGroup.year !== year) {
                                  currentGroup = { year, months: [] };
                                  groups.push(currentGroup);
                                }
                                currentGroup.months.push(monthName);
                              }
                              return (
                                <div>
                                  {/* Fila de años */}
                                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
                                    {groups.map((g, gi) => (
                                      <div
                                        key={gi}
                                        style={{
                                          gridColumn: 'span ' + g.months.length,
                                          background: (() => {
                                            if (!g.key || typeof g.key !== 'string') return '#1e3a8a';
                                            const parts = g.key.split('-Q');
                                            if (parts.length !== 2) return '#1e3a8a';
                                            return (parseInt(parts[0]) * 4 + parseInt(parts[1])) % 2 === 0 ? '#1e3a8a' : '#2563eb';
                                          })(),
                                          color: 'white',
                                          textAlign: 'center',
                                          fontSize: '10px',
                                          fontWeight: 'bold',
                                          padding: '3px 0',
                                          borderRadius: '3px'
                                        }}
                                      >
                                        {g.year}
                                      </div>
                                    ))}
                                  </div>
                                  {/* Fila de meses */}
                                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
                                    {groups.map((g, gi) =>
                                      g.months.map((month, mi) => (
                                        <div
                                          key={gi + '-' + mi}
                                          style={{
                                            background: '#e2e8f0',
                                            textAlign: 'center',
                                            fontSize: '10px',
                                            fontWeight: 'bold',
                                            padding: '3px 0',
                                            borderRadius: '3px',
                                            color: '#334155'
                                          }}
                                        >
                                          {month}
                                        </div>
                                      ))
                                    )}
                                  </div>
                                </div>
                              );
                            })()}
                          </div>
                          <button style={{ padding: '4px 10px', background: '#007bff', color: 'white', border: 'none', cursor: 'pointer', borderRadius: '4px', fontSize: '14px' }} onClick={() => setTimelineOffset(timelineOffset + 1)}>►</button>
                        </div>
                      );
                    })()}

                    <div className="table-wrapper" style={{ maxHeight: '70vh', overflowY: 'auto' }}>
                      <table>
                        <thead>
                          <tr>
                            <th style={{ width: '30px' }}></th>
                            <th style={{ width: '80px' }}>ID</th>
                            <th style={{ width: '300px' }}>Feature</th>
                            <th>Timeline</th>
                          </tr>
                        </thead>
                        <tbody>
                          {(() => {
                            const today = new Date();
                            const monthTimelineStart = new Date(today.getFullYear(), today.getMonth() + timelineOffset, 1);
                            const monthTimelineEnd = new Date(today.getFullYear(), today.getMonth() + timelineOffset + 12, 0);
                            const dayOfWeek = today.getDay();
                            const thisMonday = new Date(today);
                            thisMonday.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
                            const weekTimelineStart = new Date(thisMonday);
                            weekTimelineStart.setDate(thisMonday.getDate() + weekOffset * 7);
                            const weekTimelineEnd = new Date(weekTimelineStart);
                            weekTimelineEnd.setDate(weekTimelineStart.getDate() + 12 * 7);

                            return pageItems.map(f => {
                              const isExpanded = expandedRoadmapFeatureId === f.id;
                              const featureTimelineStart = isExpanded ? weekTimelineStart : monthTimelineStart;
                              const featureTimelineEnd = isExpanded ? weekTimelineEnd : monthTimelineEnd;
                              return (
                                <React.Fragment key={f.id}>
                                  <FeatureRow
                                    featureId={f.id}
                                    title={f.title}
                                    targetDate={f.targetDate}
                                    releaseFixVersion={f.releaseFixVersion}
                                    estimation={f.estimation}
                                    formatDate={formatDate}
                                    timelineStart={featureTimelineStart}
                                    timelineEnd={featureTimelineEnd}
                                    adoLink={adoLink}
                                    isExpanded={isExpanded}
                                    onToggleExpand={() => toggleRoadmapFeature(f.id)}
                                    states={historyCache[f.id] || []}
                                    loading={loadingHistory}
                                    showTooltip={showTooltip}
                                    moveTooltip={moveTooltip}
                                    hideTooltip={hideTooltip}
                                  />
                                  {isExpanded && (
                                    loadingStoriesIds[f.id] ? (
                                      <tr style={{ background: '#f2f2f2' }}>
                                        <td colSpan="4" style={{ padding: '20px', textAlign: 'center' }}>Loading stories...</td>
                                      </tr>
                                    ) : (
                                      (storiesCache[f.id] || []).map(s => (
                                        <StoryRow
                                          key={s.id}
                                          storyId={s.id}
                                          title={s.title}
                                          storyPoints={s.storyPoints}
                                          state={s.state}
                                          iterationPath={s.iterationPath}
                                          formatDate={formatDate}
                                          timelineStart={weekTimelineStart}
                                          timelineEnd={weekTimelineEnd}
                                          adoLink={adoLink}
                                          states={storyHistoryCache[s.id] || []}
                                          loading={loadingStoryHistory}
                                          showTooltip={showTooltip}
                                          moveTooltip={moveTooltip}
                                          hideTooltip={hideTooltip}
                                        />
                                      ))
                                    )
                                  )}
                                </React.Fragment>
                              );
                            });
                          })()}
                        </tbody>
                      </table>
                    </div>

                    {!loading && (
                      <div style={{ background: 'white', padding: '20px', borderRadius: '8px', marginTop: '20px', display: 'flex', gap: '10px', justifyContent: 'center', alignItems: 'center' }}>
                        <button style={{ padding: '8px 16px', background: roadmapPage === 1 ? '#ccc' : '#007bff', color: 'white', border: 'none', cursor: roadmapPage === 1 ? 'default' : 'pointer', borderRadius: '4px' }} onClick={() => setRoadmapPage(roadmapPage - 1)} disabled={roadmapPage === 1}>Previous</button>
                        <span style={{ fontSize: '13px', fontWeight: 'bold' }}>Page {roadmapPage} of {totalPages}</span>
                        <button style={{ padding: '8px 16px', background: roadmapPage === totalPages ? '#ccc' : '#007bff', color: 'white', border: 'none', cursor: roadmapPage === totalPages ? 'default' : 'pointer', borderRadius: '4px' }} onClick={() => setRoadmapPage(roadmapPage + 1)} disabled={roadmapPage === totalPages}>Next</button>
                      </div>
                    )}
                  </>
                );
              })()}
            </>
          )}
          <Tooltip tooltip={tooltip} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>
