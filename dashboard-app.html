    /*

    function getFeatureReadiness(feature) {

    function FeatureReadinessDetails({ feature }) {
      const checks = getFeatureReadinessChecks(feature);

    /*
      Delivery Health se calcula exclusivamente con feature.deliverySummary.

      Esto es intencional:
      - deliverySummary ya viene precalculado desde el backend.
      - Evita falsos "No Stories" mientras storiesCache está cargando.
      - Mantiene la evaluación consistente entre Feature List y Roadmap.
    */

    const deliveryExecutionStates = ['Planned', 'In Process'];
    const deliveryClosedStates = ['Closed'];
    
    function hasFeatureEstimate(feature) {
      const estimation = feature.estimation || {};
    
      return [estimation.be, estimation.fe, estimation.qa].some(value => {
        return (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ''
        );
      });
    }

    function parseDashboardDate(value) {
      if (!value) {
        return null;
      }
    
      const normalizedValue = String(value);
    
      /* Una fecha pura YYYY-MM-DD se interpreta como fecha local. Así se evita que JavaScript la trate como UTC y la desplace
        al día anterior en determinadas zonas horarias. */
      const date = /^\d{4}-\d{2}-\d{2}$/.test(normalizedValue)
        ? new Date(`${normalizedValue}T00:00:00`)
        : new Date(normalizedValue);
    
      return Number.isNaN(date.getTime())
        ? null
        : date;
    }
    
    function isPastTargetDate(targetDate) {
      const target = parseDashboardDate(targetDate);
    
      if (!target) {
        return false;
      }
    
      const today = new Date();
    
      target.setHours(0, 0, 0, 0);
      today.setHours(0, 0, 0, 0);
    
      return target < today;
    }
       
    function getDeliveryHealth(feature) {
      const summary = feature.deliverySummary;
      const state = feature.state || '';
      const isClosed = deliveryClosedStates.includes(state);
      const isExecutionState = deliveryExecutionStates.includes(state);
      
      /* openWorkItems representa las Stories y Bugs que continúan abiertos: Discovery + In Progress.*/
      const openWorkItems = Number(summary?.openWorkItems || 0);

      const discoveryWithoutSprintWorkItems = Number( summary?.discoveryWithoutSprintWorkItems || 0 );
    
      /* Estado técnico: no fue posible recuperar o resumir el trabajo. Requiere revisión, pero no representa un riesgo crítico; por eso se muestra como Requires Attention (amarillo) */
      if (!summary || summary.source !== 'ok') {
        return {
          key: 'unable-to-evaluate',
          label: 'Unable to evaluate',
          shortLabel: 'Unavailable',
          className: 'delivery--unknown',
          icon: '?',
          reason: 'Delivery work information could not be retrieved.'
        };
      }

      /*  1. Regla exclusiva para New: No se usa para In Planning ni In Shaping. */
      if ( state === 'New' && !summary.hasWorkItems && summary.totalWorkItems === 0 )
      {
        return {
          key: 'not-started',
          label: 'Not started',
          shortLabel: 'Not started',
          className: 'delivery--not-started',
          icon: '○',
          reason: 'This Feature is New and does not have associated Stories or Bugs yet.'
        };
      }
      /*
        2. Máxima prioridad:
        Target Date vencido y aún existe trabajo pendiente.
    
        Ejemplo:
        Target Date: 18 November 2025
        Fecha actual: 20 August 2026
        Pending work items > 0
        Resultado: Overdue
      */
      if ( isPastTargetDate(feature.targetDate) && openWorkItems > 0 )
      {
        return {
          key: 'overdue',
          label: 'Overdue',
          shortLabel: 'Overdue',
          className: 'delivery--overdue',
          icon: '!',
          reason: 'The Target Date has passed and delivery work remains open.'
        };
      }

      /* 2.1 Target Date cercana y trabajo de Discovery sin Sprint.
        Esta condición depende de deliverySummary, calculado por el backend,
        para que funcione aunque el usuario nunca abra las Stories del Feature. */
      if ( isTargetDateWithinNextTwoWeeks(feature.targetDate) && discoveryWithoutSprintWorkItems > 0 )
      {
        return {
          key: 'target-date-near-unscheduled-discovery',
          label: 'At risk',
          shortLabel: 'At risk',
          className: 'delivery--overdue',
          icon: '!',
          reason: `${discoveryWithoutSprintWorkItems} Discovery work item(s) are not assigned to a Sprint, and the Target Date is within the next two weeks.`
        };
      }
      
      /* 2.2 Target Date en el próximo mes calendario y sin Release Fix Version. */
       if ( isTargetDateInNextCalendarMonth(feature.targetDate) && !String(feature.releaseFixVersion || '').trim() )
      {
        return {
          key: 'target-next-month-without-release',
          label: 'At risk',
          shortLabel: 'At risk',
          className: 'delivery--overdue',
          icon: '!',
          reason:
            'The Target Date is in the next calendar month, but no Release Fix Version is defined.'
        };
      }
    
     /* 3. Closed no fuerza Healthy por sí solo. Si aún existen Stories/Bugs Pending o In Progress, el Feature
        debe conservar una alerta de Delivery Health. */
      if (isClosed && openWorkItems > 0) {
        return {
          key: 'closed-with-open-work',
          label: 'Open work',
          shortLabel: 'Open work',
          className: 'delivery--attention',
          icon: '!',
          reason: 'This Feature is Closed, but associated delivery work is still open or in progress.'
        };
      }

      /* 3.1 Si está Closed y no queda trabajo abierto, sí puede mostrarse Healthy; ya no depende solamente del estado Closed. */
      if (isClosed) {
        return {
          key: 'healthy',
          label: 'Healthy',
          shortLabel: 'Healthy',
          className: 'delivery--healthy',
          icon: '✓',
          reason: 'This Feature is Closed and has no open or in-progress delivery work.'
        };
      }
    
      /* 4. Estados tempranos: No se penalizan todavía por no tener Stories o estimaciones.
        New ya fue tratado arriba. */
      if (!isExecutionState) {
        return {
          key: 'healthy',
          label: 'Healthy',
          shortLabel: 'Healthy',
          className: 'delivery--healthy',
          icon: '✓',
          reason: 'Delivery execution checks apply from Planned onward.'
        };
      }
    
      /*  5. Needs estimate se conserva. Aplica desde Planned e In Process: todo Feature debe tener al menos una estimación
        BE, FE o QA antes/durante la ejecución. */
      if (!hasFeatureEstimate(feature)) {
        return {
          key: 'needs-estimate',
          label: 'Needs estimate',
          shortLabel: 'Needs estimate',
          className: 'delivery--needs-info',
          icon: '!',
          reason: 'The Feature is Planned or In Process and does not have BE, FE, or QA estimates.'
        };
      }
    
      /* 6. Planned o In Process sin Stories/Bugs. */
      if (!summary.hasWorkItems || summary.totalWorkItems === 0) {
        return {
          key: 'no-stories',
          label: 'No Stories',
          shortLabel: 'No Stories',
          className: 'delivery--attention',
          icon: '!',
          reason: 'This Feature is in delivery execution but has no associated Stories or Bugs.'
        };
      }
    
      /* 7. Existe trabajo pendiente, pero ninguno está activo. */
      if ( state === 'In Process' && summary.pendingWorkItems > 0 && (summary.inProgressWorkItems ?? summary.activeWorkItems ?? 0) === 0 )
      {
        return {
          key: 'no-active-work',
          label: 'No active work',
          shortLabel: 'No active work',
          className: 'delivery--attention',
          icon: '!',
          reason: 'There is open delivery work, but no Story or Bug is currently active.'
        };
      }
    
      /* 8. Las Stories/Bugs asociadas tienen trabajo sin estimar. Esto es distinto de Needs estimate:
        - Needs estimate: el Feature no tiene BE/FE/QA.
        - Unestimated work: existen Stories/Bugs sin estimación. */
      if (summary.unestimatedWorkItems > 0) {
        return {
          key: 'unestimated-work',
          label: 'No estimated work',
          shortLabel: 'No estimated',
          className: 'delivery--attention',
          icon: '!',
          reason: `${summary.unestimatedWorkItems} associated work item(s) do not have an estimate.`
        };
      }
    
      return {
        key: 'healthy',
        label: 'Healthy',
        shortLabel: 'Healthy',
        className: 'delivery--healthy',
        icon: '✓',
        reason: 'No delivery execution risks were detected.'
      };
    }

    function isTargetDateWithinNextTwoWeeks(targetDate) {
      const target = parseDashboardDate(targetDate);
    
      if (!target) {
        return false;
      }
    
      const today = new Date();
      const twoWeeksFromToday = new Date(today);
    
      today.setHours(0, 0, 0, 0);
      twoWeeksFromToday.setHours(0, 0, 0, 0);
      twoWeeksFromToday.setDate(twoWeeksFromToday.getDate() + 14);
    
      target.setHours(0, 0, 0, 0);
    
      return target >= today && target <= twoWeeksFromToday;
    }
    
    function isTargetDateInNextCalendarMonth(targetDate) {
      const target = parseDashboardDate(targetDate);
    
      if (!target) {
        return false;
      }
    
      const today = new Date();
    
      const nextMonthStart = new Date(
        today.getFullYear(),
        today.getMonth() + 1,
        1
      );
    
      const nextMonthEnd = new Date(
        today.getFullYear(),
        today.getMonth() + 2,
        0
      );
    
      target.setHours(0, 0, 0, 0);
      nextMonthStart.setHours(0, 0, 0, 0);
      nextMonthEnd.setHours(23, 59, 59, 999);
    
      return target >= nextMonthStart && target <= nextMonthEnd;
    }
    
    /* El badge muestra la alerta principal según la precedencia de getDeliveryHealth(). Este arreglo permite que el panel muestre
      todas las alertas aplicables para seguimiento. */
    function getDeliveryHealthAlerts(feature) {
      const summary = feature.deliverySummary;
      const state = feature.state || '';

      /* No se pudo evaluar Delivery Health. Es una alerta que requiere seguimiento, pero no es crítica; se presenta en amarillo. */
      if (!summary || summary.source !== 'ok') {
        return [{
          key: 'unable-to-evaluate',
          label: 'Unable to evaluate',
          className: 'delivery-alert--unknown',
          reason: 'Delivery work information could not be retrieved.'
        }];
      }

      const totalWorkItems = Number(summary.totalWorkItems || 0);
      const hasWorkItems =
        summary.hasWorkItems !== undefined
          ? Boolean(summary.hasWorkItems)
          : totalWorkItems > 0;
      const inProgressWorkItems = Number( summary.inProgressWorkItems || 0 );
      const pendingWorkItems = Number( summary.pendingWorkItems || 0 );
      const openWorkItems = Number( summary.openWorkItems || 0 );
      const unestimatedWorkItems = Number( summary.unestimatedWorkItems || 0 );
      const discoveryWithoutSprintWorkItems = Number( summary.discoveryWithoutSprintWorkItems || 0 );
      const isClosed = deliveryClosedStates.includes(state);
      const isExecutionState = deliveryExecutionStates.includes(state);
      const alerts = [];

      if (isPastTargetDate(feature.targetDate) && openWorkItems > 0) {
        alerts.push({
          key: 'overdue',
          label: 'Overdue',
          className: 'delivery-alert--overdue',
          reason: 'The Target Date has passed and delivery work remains open.'
        });
      }

      if ( isTargetDateWithinNextTwoWeeks(feature.targetDate) && discoveryWithoutSprintWorkItems > 0 )
      {
        alerts.push({
          key: 'target-date-near-unscheduled-discovery',
          label: 'Target date near',
          className: 'delivery-alert--overdue',
          reason:
            `${discoveryWithoutSprintWorkItems} Discovery work item(s) are not assigned to a Sprint, and the Target Date is within the next two weeks.`
        });
      }
      
      if ( isTargetDateInNextCalendarMonth(feature.targetDate) && !String(feature.releaseFixVersion || '').trim() )
      {
        alerts.push({
          key: 'target-next-month-without-release',
          label: 'Target date next month — no Release Fix Version',
          className: 'delivery-alert--overdue',
          reason:
            'The Target Date falls in the next calendar month, but no Release Fix Version is defined.'
        });
      }
      
      if (isClosed && openWorkItems > 0) {
        alerts.push({
          key: 'closed-with-open-work',
          label: 'Open work on Closed Feature',
          className: 'delivery-alert--attention',
          reason: 'The Feature is Closed, but associated delivery work is still open or in progress.'
        });
      }

      if (isExecutionState && !hasFeatureEstimate(feature)) {
        alerts.push({
          key: 'needs-estimate',
          label: 'Needs estimate',
          className: 'delivery-alert--needs-info',
          reason: 'The Feature is Planned or In Process and does not have BE, FE, or QA estimates.'
        });
      }

      if (
        isExecutionState &&
        (!hasWorkItems || totalWorkItems === 0)
      ) {
        alerts.push({
          key: 'no-stories',
          label: 'No Stories',
          className: 'delivery-alert--attention',
          reason: 'This Feature is in delivery execution but has no associated Stories or Bugs.'
        });
      }

      if (
        state === 'In Process' &&
        pendingWorkItems > 0 &&
        inProgressWorkItems === 0
      ) {
        alerts.push({
          key: 'no-active-work',
          label: 'No active work',
          className: 'delivery-alert--attention',
          reason: 'There is open delivery work, but no Story or Bug is currently active.'
        });
      }

      if (unestimatedWorkItems > 0) {
        alerts.push({
          key: 'unestimated-work',
          label: 'No estimated work',
          className: 'delivery-alert--attention',
          reason: `${unestimatedWorkItems} associated work item(s) do not have an estimate.`
        });
      }

      if (alerts.length === 0) {
        alerts.push({
          key: 'healthy',
          label: 'Healthy',
          className: 'delivery-alert--healthy',
          reason: 'No delivery execution risks were detected.'
        });
      }

      return alerts;
    }

    function ReadinessOverview({ counts, SelectedReadiness, isAllFeaturesSelected, onSelectReadiness }) {

    // ── Tooltip global ──────────────────────────────────────────────
    function useTooltip() {
      const [tooltip, setTooltip] = React.useState({ visible: false, x: 0, y: 0, content: null });
      const showTooltip = React.useCallback((e, content) => {
        setTooltip({ visible: true, x: e.clientX, y: e.clientY, content });
      }, []);
      const moveTooltip = React.useCallback((e) => {
        setTooltip(prev => ({ ...prev, x: e.clientX, y: e.clientY }));
      }, []);
      const hideTooltip = React.useCallback(() => {
        setTooltip(prev => ({ ...prev, visible: false }));
      }, []);
      return { tooltip, showTooltip, moveTooltip, hideTooltip };
    }

    function Tooltip({ tooltip }) {
      if (!tooltip.visible || !tooltip.content) return null;
      const style = {
        position: 'fixed',
        left: tooltip.x + 14,
        top: tooltip.y - 10,
        background: 'rgba(15, 23, 42, 0.93)',
        color: 'white',
        padding: '8px 12px',
        borderRadius: '6px',
        fontSize: '11px',
        lineHeight: '1.6',
        pointerEvents: 'none',
        zIndex: 9999,
        maxWidth: '260px',
        boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
        whiteSpace: 'pre-wrap'
      };
      const adjustedLeft = tooltip.x + 14 + 260 > window.innerWidth
        ? tooltip.x - 274
        : tooltip.x + 14;
      return (
        <div style={{ ...style, left: adjustedLeft }}>
          {tooltip.content}
        </div>
      );
    }

    function StoryRow({ storyId, title, storyPoints, state, iterationPath, formatDate, timelineStart, timelineEnd, adoLink, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const today = new Date();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);
      const todayPercent = ((today - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
      const clampedTodayPercent = Math.max(0, Math.min(100, todayPercent));

      const segments = [];
      if (states.length > 0) {
        states.forEach((st, idx) => {
          const stateStart = new Date(st.changedDate);
          const stateEnd = idx === states.length - 1 ? today : new Date(states[idx + 1].changedDate);
          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            segments.push({
              color: storyStateColors[st.state] || '#cccccc',
              state: st.state,
              startPercent: clampedStart,
              widthPercent: Math.max(1, clampedEnd - clampedStart)
            });
          }
        });
      }

      let sprintStart = null;
      let sprintEnd = null;
      let sprintLabel = '';
      const sprintMatch = iterationPath && iterationPath.match(/(\d{4})_(S\d+)_([A-Za-z]+)(\d+)-([A-Za-z]+)(\d+)/);
      if (sprintMatch) {
        const year = parseInt(sprintMatch[1]);
        sprintLabel = sprintMatch[2];
        const monthMap = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
        const startMonth = sprintMatch[3];
        const startDay = parseInt(sprintMatch[4]);
        const endMonth = sprintMatch[5];
        const endDay = parseInt(sprintMatch[6]);
        sprintStart = new Date(year, monthMap[startMonth], startDay);
        sprintEnd = new Date(year, monthMap[endMonth], endDay);
        if (monthMap[endMonth] < monthMap[startMonth]) {
          sprintEnd = new Date(year + 1, monthMap[endMonth], endDay);
        }
      }

      const getSprintPercent = (date) => {
        const days = (date - timelineStart) / (1000 * 60 * 60 * 24);
        return (days / timelineTotalDays) * 100;
      };

      let sprintStartPercent = null;
      let sprintEndPercent = null;
      let sprintMidPercent = null;
      if (sprintStart && sprintEnd) {
        const rawStart = getSprintPercent(sprintStart);
        const rawEnd = getSprintPercent(sprintEnd);
        if (rawEnd > 0 && rawStart < 100) {
          sprintStartPercent = Math.max(0, rawStart);
          sprintEndPercent = Math.min(100, rawEnd);
          sprintMidPercent = (sprintStartPercent + sprintEndPercent) / 2;
        }
      }

      return (
        <tr style={{ borderBottom: '1px solid #eee', background: '#f2f2f2' }}>
          <td></td>
          <td></td>
          <td><a href={adoLink(storyId)} target="_blank" rel="noopener noreferrer">{storyId}</a></td>
          <td style={{ maxWidth: '300px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span title={title} style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', flex: '0 1 auto', minWidth: '0' }}>{title}</span>
              <span
                style={{
                  color: storyPoints === null || storyPoints === undefined ? '#dc2626' : '#696969',
                  flexShrink: 0,
                  fontSize: '11px',
                  fontWeight: storyPoints === null || storyPoints === undefined ? 'bold' : 'normal'
                }}
              >
                ({storyPoints ?? 'Missing'}{storyPoints !== null && storyPoints !== undefined ? ' pts' : ''})
              </span>
            </div>
          </td>
          <td style={{ padding: '6px 8px' }}>
            <div style={{ height: '36px', background: '#e0e0e0', borderRadius: '4px', overflow: 'hidden', position: 'relative' }}>
              {!loading && segments.map((seg, idx) => {
                const segStartDate = new Date(timelineStart.getTime() + (seg.startPercent / 100) * (timelineEnd - timelineStart));
                const segEndDate = new Date(timelineStart.getTime() + ((seg.startPercent + seg.widthPercent) / 100) * (timelineEnd - timelineStart));
                const diffDays = Math.round((segEndDate - segStartDate) / (1000 * 60 * 60 * 24));
                const tooltipContent = (
                  <div>
                    <div style={{ fontWeight: 'bold', marginBottom: '4px', color: seg.color, fontSize: '12px' }}>● {seg.state}</div>
                    <div>From: {segStartDate.toLocaleDateString('es-CO')}</div>
                    <div>To:&nbsp;&nbsp; {segEndDate.toLocaleDateString('es-CO')}</div>
                    <div style={{ marginTop: '4px', color: '#94a3b8' }}>{diffDays} day{diffDays !== 1 ? 's' : ''} in this state</div>
                  </div>
                );
                return (
                  <div
                    key={idx}
                    style={{ position: 'absolute', top: '8px', left: seg.startPercent + '%', width: seg.widthPercent + '%', height: '20px', background: seg.color, borderRadius: '3px', opacity: 0.85, minWidth: '6px', cursor: 'pointer', zIndex: 2 }}
                    onMouseEnter={(e) => showTooltip && showTooltip(e, tooltipContent)}
                    onMouseMove={(e) => moveTooltip && moveTooltip(e)}
                    onMouseLeave={() => hideTooltip && hideTooltip()}
                  />
                );
              })}
              {loading && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>Loading...</div>
              )}
              {!loading && segments.length === 0 && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>No data</div>
              )}
              {!loading && sprintStartPercent !== null && (
                <>
                  <div style={{ position: 'absolute', top: 0, bottom: 0, left: sprintStartPercent + '%', width: '1px', borderLeft: '1px dashed #123770', zIndex: 5, pointerEvents: 'none' }} />
                  <div style={{ position: 'absolute', top: 0, bottom: 0, left: sprintEndPercent + '%', width: '1px', borderLeft: '1px dashed #123770', zIndex: 5, pointerEvents: 'none' }} />
                  <div style={{ position: 'absolute', top: '2px', left: sprintMidPercent + '%', transform: 'translateX(-50%)', fontSize: '9px', color: 'white', background: '#123770', padding: '1px 5px', borderRadius: '2px', whiteSpace: 'nowrap', zIndex: 8, pointerEvents: 'none' }}>
                    {sprintLabel}
                  </div>
                </>
              )}
              {!loading && (
                <div style={{ position: 'absolute', top: 0, bottom: 0, left: clampedTodayPercent + '%', width: '1px', background: '#1e3a8a', opacity: 0.9, zIndex: 10, pointerEvents: 'none' }} />
              )}
            </div>
          </td>
        </tr>
      );
    }

    function FeatureRow({ featureId, title, targetDate, releaseFixVersion, estimation, priority, formatDate, timelineStart, timelineEnd, adoLink, isExpanded, onToggleExpand, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const stateColors = {
        'New': '#94a3b8',
        'In Shaping': '#fbbf24',
        'In Planning': '#fb923c',
        'Planned': '#34d399',
        'In Process': '#60a5fa',
        'Closed': '#a78bfa'
      };

      const today = new Date();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);

      const segments = [];
      if (states.length > 0) {
        states.forEach((state, idx) => {
          const stateStart = new Date(state.changedDate);
          const stateEnd = idx === states.length - 1 ? today : new Date(states[idx + 1].changedDate);
          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            const widthPercent = Math.max(1, clampedEnd - clampedStart);
            segments.push({
              color: stateColors[state.state] || '#cccccc',
              state: state.state,
              startPercent: clampedStart,
              widthPercent: widthPercent
            });
          }
        });
      }

      return (
        <tr style={{ borderBottom: '1px solid #eee', background: isExpanded ? '#f2f2f2' : 'transparent' }}>
          <td className="expand-btn" onClick={onToggleExpand}>
            {isExpanded ? '▼' : '►'}
          </td>
          <td style={{ width: '36px', textAlign: 'center', fontSize: '12px', fontWeight: 'bold', color: priority ? '#1e3a8a' : '#ccc' }}>
            {priority || '—'}
          </td>
          <td><a href={adoLink(featureId)} target="_blank" rel="noopener noreferrer">{featureId}</a></td>
          <td
            style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '300px', cursor: 'default' }}
            onMouseEnter={(e) => showTooltip && showTooltip(e, (
              <div>
                <div style={{ marginBottom: '6px', maxWidth: '240px', whiteSpace: 'normal', lineHeight: '1.4' }}>{title}</div>
                {targetDate && <div style={{ color: '#94a3b8', fontSize: '10px' }}>🎯 Target: {formatDate(targetDate)}</div>}
              </div>
            ))}
            onMouseMove={(e) => moveTooltip && moveTooltip(e)}
            onMouseLeave={() => hideTooltip && hideTooltip()}
          >{title}</td>
          <td style={{ padding: '4px 6px', overflow: 'hidden' }}>
            <div style={{ minHeight: '32px', background: isExpanded ? '#e0e0e0' : '#f9f9f9', borderRadius: '4px', padding: '0', overflow: 'hidden', position: 'relative' }}>
              {!loading && (() => {
                const todayPercent = ((today - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
                if (todayPercent < 0 || todayPercent > 100) return null;
                return <div style={{ position: 'absolute', top: '0', bottom: '0', left: todayPercent + '%', width: '1px', background: '#1e3a8a', opacity: 0.9, zIndex: 10 }} />;
              })()}
              {!loading && targetDate && (() => {
                const target = parseDashboardDate(targetDate);
                  if (!target) { return null;}
          
                const targetPercent = ((target - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
                if (targetPercent < 0 || targetPercent > 100) return null;
                return (
                  <div style={{ position: 'absolute', top: '-4px', left: targetPercent + '%', transform: 'translateX(-50%)', zIndex: 11, width: '0', height: '0', borderLeft: '8px solid transparent', borderRight: '8px solid transparent', borderTop: '12px solid #f43f5e' }} title={'Target: ' + formatDate(targetDate)} />
                );
              })()}
              {!loading && releaseFixVersion && releaseDates[releaseFixVersion] && (() => {
                const releaseDate = parseDashboardDate( releaseDates[releaseFixVersion] );
                  if (!releaseDate) { return null; }
          
                const releasePercent = ((releaseDate - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
                if (releasePercent < 0 || releasePercent > 100) return null;
                return (
                  <div style={{ position: 'absolute', top: '50%', left: releasePercent + '%', transform: 'translate(-50%, -50%) rotate(45deg)', zIndex: 12, width: '10px', height: '10px', background: '#1e3a8a' }} title={releaseFixVersion + ': ' + formatDate(releaseDates[releaseFixVersion])} />
                );
              })()}
              {loading ? (
                <span style={{ fontSize: '11px', color: '#999' }}>Loading...</span>
              ) : segments.length === 0 ? (
                <span style={{ fontSize: '11px', color: '#999' }}>No data</span>
              ) : (
                <div style={{ width: '100%', position: 'relative', height: '20px' }}>
                  {segments.map((seg, idx) => {
                    const est = estimation || {};
                    const tooltipContent = (
                      <div>
                        <div style={{ fontWeight: 'bold', color: seg.color, marginBottom: '6px', fontSize: '12px' }}>● {seg.state}</div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '6px', textAlign: 'center' }}>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>BE</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.be || '—'}</div></div>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>FE</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.fe || '—'}</div></div>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>QA</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.qa || '—'}</div></div>
                        </div>
                      </div>
                    );
                    return (
                      <div
                        key={idx}
                        style={{ position: 'absolute', left: seg.startPercent + '%', width: seg.widthPercent + '%', height: '28px', background: seg.color, borderRadius: '3px', opacity: 0.85, minWidth: '6px', cursor: 'pointer' }}
                        onMouseEnter={(e) => showTooltip && showTooltip(e, tooltipContent)}
                        onMouseMove={(e) => moveTooltip && moveTooltip(e)}
                        onMouseLeave={() => hideTooltip && hideTooltip()}
                      />
                    );
                  })}
                </div>
              )}
            </div>
          </td>
        </tr>
      );
    }

    /* ── Clasificación única de Features & Stories ── */
    const deliveryDoneStates = [
      'Approved for Release',
      'Ready for Deployment',
      'Closed'
    ];

    const deliveryInProgressStates = [
      'In Process',
      'QA Testing',
      'Business Sprint Testing',
      'Sprint Complete',
      'User Acceptance Testing'
    ];

    /* Debe coincidir con ESTIMABLE_WORK_STATES del backend. Sólo estos estados requieren que el work item tenga estimación.
      Los elementos Closed, Removed u otros estados tempranos no generan la alerta actual "No estimated work". */
    const estimateRequiredStates = [
      'Planned',
      'Ready for Development',
      'In Process',
      'QA Testing',
      'Business Sprint Testing',
      'User Acceptance Testing',
      'Approved for Release',
      'Ready for Deployment',
      'Sprint Complete'
    ];
    
    /*
      La fuente de verdad preferida es el backend. Cuando el backend entregue isUnestimated, el frontend no debe
      reinterpretar Story Points ni Work Item Type. El fallback conserva la misma regla mientras exista una respuesta cacheada antigua. */
    function isWorkItemUnestimated(workItem) {
      if (typeof workItem?.isUnestimated === 'boolean') {
        return workItem.isUnestimated;
      }
    
      const value = workItem?.storyPoints;
      const state = String(workItem?.state || '').trim();
    
      const hasMissingOrZeroEstimate =
        value === null ||
        value === undefined ||
        String(value).trim() === '' ||
        Number(value) <= 0;
    
      return (
        estimateRequiredStates.includes(state) &&
        hasMissingOrZeroEstimate
      );
    }
    
    function hasWorkItemEstimate(workItem) {
      return !isWorkItemUnestimated(workItem);
    }

    function getWorkItemDeliveryCategory(workItem) {
      if (workItem?.state === 'Removed') {
        return 'removed';
      }

      if (deliveryDoneStates.includes(workItem?.state)) {
        return 'done';
      }

      if (deliveryInProgressStates.includes(workItem?.state)) {
        return 'inProgress';
      }

      /*
        Cualquier Story/Bug vigente que no esté Done ni In progress
        debe entrar en Discovery. Esto incluye, por ejemplo:
        - New
        - Business Refinement
        - Technical Refinement
        - Ready for Development
      */
      return 'pending';
    }

    function getWorkItemsDeliverySummary(workItems = []) {
      const summary = {
        totalWorkItems: workItems.length,
        includedWorkItems: 0,
        removedWorkItems: 0,
        doneWorkItems: 0,
        inProgressWorkItems: 0,
        pendingWorkItems: 0,
        openWorkItems: 0,
        unestimatedWorkItems: 0,
        discoveryWithoutSprintWorkItems: 0
      };

      workItems.forEach(workItem => {
        const category = getWorkItemDeliveryCategory(workItem);

        if (category === 'removed') {
          summary.removedWorkItems += 1;
          return;
        }

        summary.includedWorkItems += 1;

        if (category === 'done') {
          summary.doneWorkItems += 1;
        } else if (category === 'inProgress') {
          summary.inProgressWorkItems += 1;
        } else {
          summary.pendingWorkItems += 1;
        }

        /*
          Removed queda fuera de este cálculo por definición:
          no debe afectar la cobertura de estimación de delivery.
        */
        if (!hasWorkItemEstimate(workItem)) {
          summary.unestimatedWorkItems += 1;
        }

        const hasIterationPath = typeof workItem.iterationPath === 'string' && workItem.iterationPath.trim() !== '';
        
        if (category === 'pending' && !hasIterationPath) {
          summary.discoveryWithoutSprintWorkItems += 1;
        }      
      });

        summary.openWorkItems =
        summary.inProgressWorkItems +
        summary.pendingWorkItems;

      return summary;
    }

    function getShortAssignedToName(value) {
      if (!value) { return 'Unassigned'; }

      /*
        Ejemplo: "Apellido, Nombre (Operations & Technology)" → "Apellido, Nombre"
      */
      return String(value)
        .replace(/\s*\([^)]*\)\s*$/, '')
        .trim();
    }

    function getFeatureHistoryStateColor(state) {
      const colors = {'New': '#94a3b8', 'In Shaping': '#fbbf24', 'In Planning': '#fb923c', 'Planned': '#34d399', 'In Process': '#60a5fa', 'Closed': '#a78bfa' };

      return colors[state] || '#94a3b8'; }

    function getWorkItemDisplayOrder(workItem) {
      /*
        Bugs primero; después las User Stories.
        Si surgiera otro tipo, quedará después de ambos.
      */
      if (workItem?.workItemType === 'Bug') return 0;
      if (workItem?.workItemType === 'User Story') return 1;
      return 2;
    }

    function sortFeatureWorkItems(workItems = []) {
      return [...workItems]
        .filter(workItem => workItem.state !== 'Removed')
        .sort((a, b) => {
          const typeDifference =
            getWorkItemDisplayOrder(a) - getWorkItemDisplayOrder(b);

          if (typeDifference !== 0) {
            return typeDifference;
          }

          return Number(b.id || 0) - Number(a.id || 0);
        });
    }

    function FeatureStateHistory({
      history,
      loading,
      formatDate
    }) {
      if (loading) {
        return (
          <div style={{ fontSize: '12px', color: '#64748b' }}>
            Loading feature history...
          </div>
        );
      }

      const sortedHistory = [...(history || [])]
        .filter(event => event && event.state && event.changedDate)
        .sort(
          (a, b) =>
            new Date(a.changedDate).getTime() -
            new Date(b.changedDate).getTime()
        );

      if (sortedHistory.length === 0) {
        return (
          <div style={{ fontSize: '12px', color: '#64748b' }}>
            No state history is available for this Feature.
          </div>
        );
      }

      /*
        Se reservan al menos seis columnas para representar el happy path:
        New → In Shaping → In Planning → Planned → In Process → Closed.

        Si hay más transiciones por regresos de estado, por ejemplo:
        Planned → In Process → In Planning,
        se generan más columnas y todas se ajustan al ancho disponible.
      */
      const columnCount = Math.max(6, sortedHistory.length);

      return (
        <div className="feature-history">
          <div className="feature-history__header">
            <strong className="feature-history__title">
              Feature state history
            </strong>

            <span className="feature-history__hint">
              Oldest to newest
            </span>
          </div>

          <div
            className="feature-history__timeline"
            style={{
              gridTemplateColumns: `repeat(${columnCount}, minmax(0, 1fr))`
            }}
          >
            {sortedHistory.map((event, index) => (
              <div
                key={`${event.state}-${event.changedDate}-${index}`}
                className="feature-history__event"
              >
                <div
                  className="feature-history__box"
                  style={{
                    '--state-color': getFeatureHistoryStateColor(event.state)
                  }}
                  title={`${event.state} — ${formatDate(event.changedDate)}`}
                >
                  <div className="feature-history__state">
                    {event.state}
                  </div>

                  <div className="feature-history__date">
                    {formatDate(event.changedDate)}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function FeatureStoriesCards({
      stories,
      adoLink
    }) {
      const summary = getWorkItemsDeliverySummary(stories);
      const visibleStories = sortFeatureWorkItems(stories);

      return (
        <div>
          <div
            style={{
              marginBottom: '10px',
              fontSize: '12px',
              fontWeight: 'bold'
            }}
          >
            Stories & Bugs ({summary.includedWorkItems}

            {summary.removedWorkItems > 0 && (
              <span style={{ color: '#94a3b8', fontWeight: 'normal' }}>
                {' '}+{summary.removedWorkItems} removed
              </span>
            )}

            {') — '}

            <span style={{ color: '#34d399' }}>
              {summary.doneWorkItems} done
            </span>

            {' / '}

            <span style={{ color: '#60a5fa' }}>
              {summary.inProgressWorkItems} in progress
            </span>

            {' / '}

            <span style={{ color: '#fbbf24' }}>
              {summary.pendingWorkItems} discovery
            </span>
          </div>

          <div
            style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))',
              gap: '8px'
            }}
          >
            {visibleStories.map(story => {
              const storyDotColor =
                storyStateColors[story.state] || '#ccc';

              const isBug = story.workItemType === 'Bug';

              const sprintLabel = (() => {
                const match =
                  story.iterationPath &&
                  story.iterationPath.match(/(\d{4})_(S\d+)_/);

                if (match) {
                  return `${match[1]} ${match[2]}`;
                }

                return story.iterationPath
                  ? story.iterationPath.split('\\').pop()
                  : '—';
              })();

              return (
                <div
                  key={story.id}
                  style={{
                    padding: '8px 12px',
                    background: 'white',
                    borderLeft: `3px solid ${storyDotColor}`,
                    borderRadius: '4px',
                    boxShadow: '0 1px 3px rgba(0,0,0,0.06)'
                  }}
                >
                  <div
                    style={{
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'flex-start',
                      gap: '8px'
                    }}
                  >
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div
                        style={{
                          display: 'flex',
                          alignItems: 'center',
                          gap: '6px',
                          marginBottom: '4px'
                        }}
                      >
                        {isBug && (
                          <span
                            style={{
                              fontSize: '9px',
                              background: '#fee2e2',
                              color: '#dc2626',
                              padding: '1px 5px',
                              borderRadius: '3px',
                              fontWeight: 'bold',
                              flexShrink: 0
                            }}
                          >
                            BUG
                          </span>
                        )}

                        <a href={adoLink(story.id)} 
                          target="_blank" rel="noopener noreferrer"
                          style={{ fontSize: '11px', fontWeight: 'bold', color: '#007bff', flexShrink: 0 }}>
                          #{story.id}
                        </a>
                        <span title={story.title}
                          style={{ fontSize: '11px', color: '#333', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                          {story.title}
                        </span>
                      </div>
                      <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                        <span style={{ fontSize: '10px', background: storyDotColor, color: 'white', padding: '1px 6px', borderRadius: '3px', whiteSpace: 'nowrap' }}>
                          {story.state}
                        </span>
                        <span style={{ fontSize: '10px', color: '#666' }}>
                          📍 {sprintLabel}
                        </span>
                        <span style={{ fontSize: '10px', color: hasWorkItemEstimate(story) ? '#666' : '#dc2626', fontWeight: hasWorkItemEstimate(story) ? 'normal' : 'bold' }}>
                          🎯 {story.storyPoints ?? 'Missing'}{story.storyPoints !== null && story.storyPoints !== undefined ? ' pts' : ''}
                        </span>
                        <span className="feature-story-card__assigned-to">
                          👤 {getShortAssignedToName(story.assignedTo)}
                        </span>
                      </div>

            })}

    function sortDeliveryWorkItemsByTypeAndId(workItems = []) {
      return [...workItems].sort((a, b) => {
        const typeDifference =
          getWorkItemDisplayOrder(a) - getWorkItemDisplayOrder(b);

        if (typeDifference !== 0) {
          return typeDifference;
        }

        return Number(b.id || 0) - Number(a.id || 0);
      });
    }

            <a href={adoLink(story.id)} target="_blank" rel="noopener noreferrer" style={{ fontSize: '11px', fontWeight: 'bold', color: '#007bff', flexShrink: 0 }}>

          <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '7px'}}>

        }
      
        if (workItemSubfilter === 'pending') {
          return getWorkItemDeliveryCategory(story) === 'pending';
        }
      
        if (workItemSubfilter === 'inProgress') {
          return getWorkItemDeliveryCategory(story) === 'inProgress';
        }

            !hasIterationPath

        }

            <button type="button" className={[

            <button type="button" className={[

            {summary.discoveryWithoutSprintWorkItems > 0 && (
              <button
                type="button"
                className={[
                  'delivery-details__metric',

                    ? 'delivery-details__metric--active'
                    : ''
                ].filter(Boolean).join(' ')}
                onClick={() => setWorkItemSubfilter('discoveryWithoutSprint')}

              >

          <div className="delivery-alerts-grid">

          {pendingStories.length > 0 && (

            <DeliveryWorkItemGroup
              title="In Progress"
              stories={inProgressStories}
              adoLink={adoLink}
            />
          )}
          
          {doneStories.length > 0 && (
            <DeliveryWorkItemGroup
              title="Done"
              stories={doneStories}
              adoLink={adoLink}
            />
          )}
          
          {visibleStories.length === 0 && (
            <div className="delivery-work-group__empty">
              No Stories or Bugs match the selected subfilter.

    function Dashboard() {
      const { tooltip, showTooltip, moveTooltip, hideTooltip } = useTooltip();
      const [features, setFeatures] = useState([]);
      const [loading, setLoading] = useState(true);
      const [warnings, setWarnings] = useState([]);
      const [filterAreaPath, setFilterAreaPath] = useState([]);
      const [filterIteration, setFilterIteration] = useState([]);
      const [currentPage, setCurrentPage] = useState('roadmap');
      /* Un solo panel abierto en Feature List. Ejemplo: { featureId: 123456, panel: 'history' } En los próximos puntos también permitirá readiness y delivery, pero ahora sólo se utiliza el panel "history". */
      const [expandedFeaturePanel, setExpandedFeaturePanel] = useState(null);
      const [searchTitle, setSearchTitle] = useState('');
      const [searchInput, setSearchInput] = useState('');
      const [sortColumn, setSortColumn] = useState('id');
      const [sortOrder, setSortOrder] = useState('asc');
      const currentYear = String(new Date().getFullYear());
      const [filterState, setFilterState] = useState([]);
      const [filterTargetDate, setFilterTargetDate] = useState([currentYear]);
      const [filterReleaseVersion, setFilterReleaseVersion] = useState([]);
      const [roadmapPage, setRoadmapPage] = useState(1);
      const [timelineOffset, setTimelineOffset] = useState(-8);
      const [weekOffset, setWeekOffset] = useState(-8);
      const [expandedRoadmapFeatureId, setExpandedRoadmapFeatureId] = useState(null);
      const [historyCache, setHistoryCache] = useState({});
      const [loadingHistory, setLoadingHistory] = useState(false);
      const [storiesCache, setStoriesCache] = useState({});
      const [loadingStoriesIds, setLoadingStoriesIds] = useState({});
      const [loadingFeatureHistoryIds, setLoadingFeatureHistoryIds] = useState({});
      const [storyHistoryCache, setStoryHistoryCache] = useState({});
      const [loadingStoryHistory, setLoadingStoryHistory] = useState(false);
      const [featuresPage, setFeaturesPage] = useState(1);
      const [filterAssignedTo, setFilterAssignedTo] = useState([]);
      const [saveAsDefault, setSaveAsDefault] = useState(false);
      const [legendExpanded, setLegendExpanded] = useState(false);
      const [refreshing, setRefreshing] = useState(false);
      const [cacheInfo, setCacheInfo] = useState(null);
      const [readinessFilter, setReadinessFilter] = useState('All');
      const [healthGroupFilter, setHealthGroupFilter] = useState('All');
      const [healthRuleFilter, setHealthRuleFilter] = useState('All');

      useEffect(() => {
        const timer = setTimeout(() => { setSearchTitle(searchInput); }, 300);
        return () => clearTimeout(timer);
      }, [searchInput]);

      useEffect(() => {
        setRoadmapPage(1);
        setFeaturesPage(1);
        setExpandedFeaturePanel(null);
        setExpandedRoadmapFeatureId(null);
      }, [filterAreaPath, filterIteration, filterState, filterTargetDate, filterReleaseVersion, filterAssignedTo, searchTitle, readinessFilter, healthGroupFilter, healthRuleFilter ]);

      async function loadFeatures(forceRefresh = false) {
        if (forceRefresh) { 
          setRefreshing(true); 
          setStoriesCache({});
          setHistoryCache({});
          setStoryHistoryCache({});
          setLoadingStoriesIds({});
          setLoadingFeatureHistoryIds({});} 
        else { setLoading(true); }
        try {
          const url = forceRefresh ? '/api/features?refresh=1' : '/api/features';
          const res = await fetch(url);
          const json = await res.json();
          setFeatures(json.features || []);
          setCacheInfo(json.cacheInfo);
          setWarnings(json.warnings || []);
        } catch (err) {
          console.error('Error loading features:', err);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      }

      useEffect(() => { loadFeatures(false); }, []);
      useEffect(() => { setExpandedRoadmapFeatureId(null); }, [roadmapPage]);
      useEffect(() => { setExpandedFeaturePanel(null); }, [featuresPage]);

      const areaPaths = [...new Set(features.map(f => f.areaPath).filter(a => a))].sort();
      const iterations = [...new Set(features.map(f => f.iterationPath).filter(a => a))].sort();
      const states = [...new Set(features.map(f => f.state).filter(a => a))].sort();
      const targetYears = [...new Set(features.map(f => parseDashboardDate(f.targetDate)?.getFullYear()) .filter(year => year !== undefined))].sort((a, b) => b - a);
      const releaseVersions = [...new Set(features.map(f => f.releaseFixVersion).filter(v => v))].sort();
      const assignedTos = [...new Set(features.map(f => f.assignedTo).filter(a => a))].sort();
      const monthsByYear = {};
      features.forEach(f => {
        const d = parseDashboardDate(f.targetDate);
        if (d) {
          const y = d.getFullYear();
          const m = d.getMonth();
          if (!monthsByYear[y]) { monthsByYear[y] = new Set(); }
          monthsByYear[y].add(m);
        }
      });

      const FILTER_STORAGE_KEY = 'featureTracker_defaultFilters';

      useEffect(() => {
        const saved = localStorage.getItem(FILTER_STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setFilterAreaPath(parsed.filterAreaPath || []);
            setFilterIteration(parsed.filterIteration || []);
            setFilterState(parsed.filterState || []);
            setFilterTargetDate(parsed.filterTargetDate || []);
            setFilterReleaseVersion(parsed.filterReleaseVersion || []);
            setFilterAssignedTo(parsed.filterAssignedTo || []);
            setReadinessFilter(parsed.readinessFilter || 'All');
            setHealthRuleFilter(parsed.healthRuleFilter || 'All');
            setSaveAsDefault(true);
          } catch (e) { console.error('Error loading saved filters:', e); }
        }
      }, []);

      useEffect(() => {
        if (!saveAsDefault) return;
        const filtersToSave = { filterAreaPath, filterIteration, filterState, filterTargetDate, filterReleaseVersion, filterAssignedTo, readinessFilter, healthRuleFilter };
        localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify(filtersToSave));
      }, [saveAsDefault, filterAreaPath, filterIteration, filterState, filterTargetDate, filterReleaseVersion, filterAssignedTo, readinessFilter, healthRuleFilter]);

      const handleSaveAsDefaultChange = (e) => {
        const checked = e.target.checked;
        setSaveAsDefault(checked);
        if (!checked) localStorage.removeItem(FILTER_STORAGE_KEY);
      };
      // Applies every dashboard filter except Readiness.
      // This collection is used by the Readiness overview counters.
      const filteredBeforeReadiness = features.filter(f => {
        const areaOk = filterAreaPath.length === 0 ||filterAreaPath.includes(f.areaPath);
        const iterOk = filterIteration.length === 0 || filterIteration.includes(f.iterationPath);
        const stateOk = filterState.length === 0 || filterState.includes(f.state);
        const assignedOk = filterAssignedTo.length === 0 || filterAssignedTo.includes(f.assignedTo);

        let dateOk = filterTargetDate.length === 0;
      
        if (filterTargetDate.length > 0 && f.targetDate) {
          const d = parseDashboardDate(f.targetDate);
        
          if (d) {
            const yearMonthKey = d.getFullYear() + '-' + d.getMonth();
            const yearKey = String(d.getFullYear());
        
            dateOk =
              filterTargetDate.includes(yearMonthKey) ||
              filterTargetDate.includes(yearKey);
          }
        }
      
        const normalizedSearch = searchTitle.toLowerCase();
        const searchOk = searchTitle === '' || (f.title || '').toLowerCase().includes(normalizedSearch) || (f.tags || '').toLowerCase().includes(normalizedSearch);
        const releaseOk = filterReleaseVersion.length === 0 || filterReleaseVersion.includes(f.releaseFixVersion);
      
        return (
          areaOk &&
          iterOk &&
          stateOk &&
          dateOk &&
          searchOk &&
          releaseOk &&
          assignedOk
        );
      });
      
      // The overview always represents the current selection from all
      // filters other than Readiness.
      const readinessCounts = {
        total: filteredBeforeReadiness.length,
        healthy: filteredBeforeReadiness.filter(f => getFeatureReadiness(f) === 'Healthy').length,
        incomplete: filteredBeforeReadiness.filter(f => getFeatureReadiness(f) === 'Incomplete').length,
        unknown: filteredBeforeReadiness.filter(f => getFeatureReadiness(f) === 'Unknown').length
      };

      /* Los contadores usan todas las alertas aplicables de cada Feature, no solamente el estado principal del badge.
        not-started queda fuera de los KPI: es un estado informativo que podrá revisarse posteriormente mediante un filtro específico.*/
      
      const requiresActionHealthKeys = [
        'overdue',
        'target-date-near-unscheduled-discovery',
        'target-next-month-without-release'
      ];

      const requiresAttentionHealthKeys = [
        'closed-with-open-work',
        'unable-to-evaluate',
        'needs-estimate',
        'no-stories',
        'no-active-work',
        'unestimated-work'
      ];

      const deliveryHealthCounts = {
        requiresAction: filteredBeforeReadiness.filter(f => {
          const healthAlertKeys = getDeliveryHealthAlerts(f)
            .map(alert => alert.key);

          return requiresActionHealthKeys.some(
            key => healthAlertKeys.includes(key)
          );
        }).length,

        requiresAttention: filteredBeforeReadiness.filter(f => {
          const healthAlertKeys = getDeliveryHealthAlerts(f)
            .map(alert => alert.key);

          return requiresAttentionHealthKeys.some(
            key => healthAlertKeys.includes(key)
          );
        }).length,

        healthy: filteredBeforeReadiness.filter(f => {
          const healthAlertKeys = getDeliveryHealthAlerts(f)
            .map(alert => alert.key);

          return healthAlertKeys.includes('healthy');
        }).length
      };
      
            // Aplica el filtro de Readiness después de calcular los contadores.
      const filteredByReadiness = filteredBeforeReadiness.filter(f => {
        const readiness = getFeatureReadiness(f);

        if (readinessFilter === 'All') {
          return true;
        }

        return readiness === readinessFilter;
      });

      /*
        Las tarjetas de Health usan las alertas individuales, no solamente
        la alerta principal mostrada por el badge.

        Esto permite que, si un Feature tiene más de una alarma, aparezca
        dentro de cada grupo que le corresponda.
      */
      const filtered = filteredByReadiness.filter(f => {
        const healthAlertKeys = getDeliveryHealthAlerts(f)
          .map(alert => alert.key);
      
        const matchesHealthGroup = (() => {
          if (healthGroupFilter === 'All') {
            return true;
          }
      
          if (healthGroupFilter === 'requires-action') {
            return requiresActionHealthKeys.some(
              key => healthAlertKeys.includes(key)
            );
          }
      
          if (healthGroupFilter === 'requires-attention') {
            return requiresAttentionHealthKeys.some(
              key => healthAlertKeys.includes(key)
            );
          }
      
          if (healthGroupFilter === 'healthy') {
            return healthAlertKeys.includes('healthy');
          }
      
          return true;
        })();
      
        const matchesHealthRule =
          healthRuleFilter === 'All' ||
          healthAlertKeys.includes(healthRuleFilter);
      
        return matchesHealthGroup && matchesHealthRule;
      });

      let sortedFiltered = [...filtered];
      if (sortColumn) {
        sortedFiltered.sort((a, b) => {
          let valA = '', valB = '';
          if (sortColumn === 'id') { valA = a.id; valB = b.id; }
          else if (sortColumn === 'title') { valA = (a.title || '').toLowerCase(); valB = (b.title || '').toLowerCase(); }
          else if (sortColumn === 'areaPath') { valA = (a.areaPath || '').toLowerCase(); valB = (b.areaPath || '').toLowerCase(); }
          else if (sortColumn === 'iteration') {
            const extractYearQuarter = (path) => {
              const yearMatch = (path || '').match(/(\d{4})/);
              const quarterMatch = (path || '').match(/Q(\d)/);
              const year = yearMatch ? parseInt(yearMatch[1]) : 9999;
              const quarter = quarterMatch ? parseInt(quarterMatch[1]) : 9;
              return year * 10 + quarter;
            };
            valA = extractYearQuarter(a.iterationPath);
            valB = extractYearQuarter(b.iterationPath);
          }
          else if (sortColumn === 'priority') { valA = parseInt(a.priority) || 0; valB = parseInt(b.priority) || 0; }
          else if (sortColumn === 'state') { valA = (a.state || '').toLowerCase(); valB = (b.state || '').toLowerCase(); }
          else if (sortColumn === 'targetDate') { valA = (a.targetDate || ''); valB = (b.targetDate || ''); }
          else if (sortColumn === 'assignedTo') { valA = (a.assignedTo || '').toLowerCase(); valB = (b.assignedTo || '').toLowerCase(); }
          else if (sortColumn === 'readiness') { const readinessOrder = { 'Incomplete': 1, 'Unknown': 2, 'Healthy': 3 }; valA = readinessOrder[getFeatureReadiness(a)] || 4; valB = readinessOrder[getFeatureReadiness(b)] || 4; }
          if (sortOrder === 'asc') return valA < valB ? -1 : valA > valB ? 1 : 0;
          else return valA > valB ? -1 : valA < valB ? 1 : 0;
        });
      }

      const ensureFeatureHistoryLoaded = (featureId) => {
        const alreadyLoaded = Object.prototype.hasOwnProperty.call(
          historyCache,
          featureId
        );

        if (alreadyLoaded || loadingFeatureHistoryIds[featureId]) {
          return;
        }

        setLoadingFeatureHistoryIds(prev => ({
          ...prev,
          [featureId]: true
        }));

        fetch('/api/features-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids: [featureId] })
        })
          .then(response => response.json())
          .then(data => {
            setHistoryCache(prev => ({
              ...prev,
              [featureId]: data.results?.[featureId] || []
            }));
          })
          .catch(() => {
            /*
              Guardamos un arreglo vacío para no solicitar
              repetidamente un historial que falló.
            */
            setHistoryCache(prev => ({
              ...prev,
              [featureId]: []
            }));
          })
          .finally(() => {
            setLoadingFeatureHistoryIds(prev => ({
              ...prev,
              [featureId]: false
            }));
          });
      };

      const toggleFeatureExpand = (featureId) => {
        const panelIsAlreadyOpen =
          expandedFeaturePanel?.featureId === featureId &&
          expandedFeaturePanel?.panel === 'history';

        /*
          Clic en el mismo triángulo: cerrar el panel History.
          Clic desde otra Feature o desde Readiness: reemplazar el
          estado para que sólo exista un panel abierto globalmente.
        */
        if (panelIsAlreadyOpen) {
          setExpandedFeaturePanel(null);
          return;
        }

        setExpandedFeaturePanel({
          featureId,
          panel: 'history'
        });

        /*
          Las Stories/Bugs pueden estar precargadas por la página actual.
          Si no están disponibles, se solicitan al abrir History.
        */
        if (!storiesCache[featureId] && !loadingStoriesIds[featureId]) {
          setLoadingStoriesIds(prev => ({
            ...prev,
            [featureId]: true
          }));

          fetch('/api/feature-stories/' + featureId)
            .then(response => response.json())
            .then(data => {
              setStoriesCache(prev => ({
                ...prev,
                [featureId]: data.stories || []
              }));
            })
            .catch(() => {
              setStoriesCache(prev => ({
                ...prev,
                [featureId]: []
              }));
            })
            .finally(() => {
              setLoadingStoriesIds(prev => ({
                ...prev,
                [featureId]: false
              }));
            });
        }

        ensureFeatureHistoryLoaded(featureId);
      };

      const toggleFeatureReadiness = (featureId) => {
        const panelIsAlreadyOpen =
          expandedFeaturePanel?.featureId === featureId &&
          expandedFeaturePanel?.panel === 'readiness';

        /*
          Clic en el mismo badge: cerrar.
          Si estaba abierto History o Delivery, el estado se reemplaza
          y queda abierto solamente Readiness.
        */
        if (panelIsAlreadyOpen) {
          setExpandedFeaturePanel(null);

      // Vive dentro de la tabla para que use exactamente el mismo ancho
      // que las barras, marcadores y líneas del Timeline.
      function TimelineSubHeader({ isWeekMode, timelineOffset, weekOffset }) {
        const today = new Date();

        if (isWeekMode) {
          const dayOfWeek = today.getDay();
          const thisMonday = new Date(today);
          thisMonday.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));

          const groups = [];
          let currentGroup = null;
          for (let i = 0; i < 12; i++) {
            const weekStart = new Date(thisMonday);
            weekStart.setDate(thisMonday.getDate() + (weekOffset + i) * 7);
            const year = weekStart.getFullYear();
            const quarter = Math.floor(weekStart.getMonth() / 3) + 1;
            const quarterKey = year + '-Q' + quarter;
            const label = weekStart.toLocaleString('default', { month: 'short', day: 'numeric' });
            if (!currentGroup || currentGroup.key !== quarterKey) {
              currentGroup = { key: quarterKey, label: year + ' · Q' + quarter, weeks: [] };
              groups.push(currentGroup);
            }
            currentGroup.weeks.push(label);
          }

          return (
            <div style={{ width: '100%', minWidth: 0 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
                {groups.map((g, gi) => (
                  <div
                    key={gi}
                    style={{
                      gridColumn: 'span ' + g.weeks.length,
                      background: (() => {
                        const parts = g.key.split('-Q');
                        return (parseInt(parts[0]) * 4 + parseInt(parts[1])) % 2 === 0 ? '#1e3a8a' : '#2563eb';
                      })(),
                      color: 'white',
                      textAlign: 'center',
                      fontSize: '10px',
                      fontWeight: 'bold',
                      padding: '3px 0',
                      borderRadius: '3px'
                    }}
                  >
                    {g.label}
                  </div>
                ))}
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
                {groups.map((g, gi) =>
                  g.weeks.map((week, wi) => (
                    <div key={gi + '-' + wi} style={{ background: '#e2e8f0', textAlign: 'center', fontSize: '9px', fontWeight: 'bold', padding: '3px 0', borderRadius: '3px', color: '#334155' }}>
                      {week}
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        }

        // Modo meses
        const timelineStart = new Date(today.getFullYear(), today.getMonth() + timelineOffset, 1);
        const groups = [];
        let currentGroup = null;
        for (let i = 0; i < 12; i++) {
          const m = new Date(timelineStart.getFullYear(), timelineStart.getMonth() + i, 1);
          const year = m.getFullYear();
          const monthName = m.toLocaleString('default', { month: 'short' });
          if (!currentGroup || currentGroup.year !== year) {
            currentGroup = { year, months: [] };
            groups.push(currentGroup);
          }
          currentGroup.months.push(monthName);
        }

        return (
          <div style={{ width: '100%', minWidth: 0 }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
              {groups.map((g, gi) => (
                <div key={gi} style={{
                    gridColumn: 'span ' + g.months.length,
                    background: gi % 2 === 0 ? '#1e3a8a' : '#2563eb',
                    color: 'white',
                    textAlign: 'center',
                    fontSize: '10px',
                    fontWeight: 'bold',
                    padding: '3px 0',
                    borderRadius: '3px'
                  }}
                >
                  {g.year}
                </div>
              ))}
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
              {groups.map((g, gi) =>
                g.months.map((month, mi) => (
                  <div
                    key={gi + '-' + mi}
                    style={{ background: '#e2e8f0', textAlign: 'center', fontSize: '10px', fontWeight: 'bold', padding: '3px 0', borderRadius: '3px', color: '#334155' }}
                  >
                    {month}
                  </div>
                ))
              )}
            </div>
          </div>
        );
      }
