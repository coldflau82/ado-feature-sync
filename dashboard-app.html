<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ADO DEC Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    .header h1 { font-size: 24px; }
    .tabs { margin-top: 12px; display: flex; gap: 10px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .tab-btn { padding: 8px 16px; background: white; color: black; border: none; cursor: pointer; border-radius: 4px; font-size: 13px; }
    .tab-btn.active { background: #007bff; color: white; }
    .warnings { background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffc107; }
    .filters { display: grid; gap: 15px; background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; overflow-x: auto; }
    .filter-div { }
    .filter-label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
    .filter-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .filter-count { font-size: 11px; color: #666; margin-top: 5px; }
    .clear-btn { width: 100%; padding: 10px 16px; background: #dc3545; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; margin-bottom: 12px; }
    .table-wrapper { background: white; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f9f9f9; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #eee; font-size: 13px; }
    td { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; }
    tr:hover { background: #f5f5f5; }
    a { color: #007bff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .expand-btn { cursor: pointer; user-select: none; text-align: center; width: 30px; }
    .readiness-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: bold; white-space: nowrap; }
    .readiness-badge__icon { width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 10px; line-height: 1; }
    .readiness--ready { color: #166534; background: #dcfce7; }
    .readiness--ready .readiness-badge__icon { color: white; background: #16a34a; }
    .readiness--needs-info { color: #9a3412; background: #ffedd5; }
    .readiness--needs-info .readiness-badge__icon { color: white; background: #ea580c; }
    .readiness--unknown { color: #475569; background: #e2e8f0; }
    .readiness--unknown .readiness-badge__icon { color: white; background: #64748b; }
    .readiness-details { margin: 0; padding: 0; background: transparent; border: none; border-radius: 0; }
    .readiness-details__header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .readiness-checks-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 7px; width:100%; }
    .readiness-check { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 8px 8px; border-radius: 5px; font-size: 10px; border: 1px solid transparent; white-space: nowrap;  overflow: hidden; }
    .readiness-check > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .readiness-check__icon { width: 16px; height: 16px; display: inline-flex; justify-content: center; align-items: center; border-radius: 50%; color: white; font-size: 9px; font-weight: bold; flex-shrink: 0; }
    .check--pass { color: #166534; background: #f0fdf4; border-color: #bbf7d0; }
    .check--pass .readiness-check__icon { background: #16a34a; }
    .check--fail { color: #991b1b; background: #fef2f2; border-color: #fecaca; }
    .check--fail .readiness-check__icon { background: #dc2626; }
    .check--unknown { color: #475569; background: #f8fafc; border-color: #cbd5e1; }
    .check--unknown .readiness-check__icon { background: #64748b; }
    .readiness-summary { margin-top: 10px; font-size: 11px; line-height: 1.5; }
    .readiness-summary--missing { color: #b91c1c; }
    .readiness-summary--unknown { color: #475569; }
    .readiness-overview { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 8px; margin: 0; } 
    .readiness-overview-card { min-width: 118px; padding: 8px 11px; border: 1px solid #e2e8f0; border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; text-align: left; } 
    .readiness-overview-card:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08); } 
    .readiness-overview-card--active { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.16); } 
    .readiness-overview-card__label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #475569; } 
    .readiness-overview-card__count { display: block; margin-top: 4px; font-size: 22px; line-height: 1; font-weight: 700; color: #1e293b; } 
    .readiness-overview-card--ready .readiness-overview-card__label { color: #166534; } 
    .readiness-overview-card--needs-info .readiness-overview-card__label { color: #9a3412; } 
    .readiness-overview-card--unknown .readiness-overview-card__label { color: #475569; } 
    .readiness-filter { min-width: 165px; }
    .readiness-badge--icon-only {display: inline-flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: none; }
    .readiness-badge--icon-only .readiness-badge__label { display: none;}
    .readiness-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: bold; white-space: nowrap; }
    .readiness-badge__icon { width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 10px; line-height: 1; }
    /*  El badge normal ahora se usa como botón en la Feature List. Reset mínimo para conservar su apariencia de óvalo/badge. */
    .readiness-badge--button { border: 1px solid transparent; cursor: pointer; font: inherit; text-align: left; transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease; }
    .readiness-badge--button:hover { transform: translateY(-1px); }
    .readiness-badge--button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    /* Estado presionado: se invierten los colores para indicar visualmente que el panel de Readiness de esa Feature está abierto. */
    .readiness-badge--active.readiness--ready { color: white; background: #16a34a; border-color: #15803d; }
    .readiness-badge--active.readiness--ready .readiness-badge__icon { color: #166534; background: white; }
    .readiness-badge--active.readiness--needs-info { color: white; background: #ea580c; border-color: #c2410c; }
    .readiness-badge--active.readiness--needs-info .readiness-badge__icon { color: #9a3412; background: white; }
    .readiness-badge--active.readiness--unknown { color: white; background: #64748b; border-color: #475569; }
    .readiness-badge--active.readiness--unknown .readiness-badge__icon { color: #475569; background: white; }
    .readiness--ready { color: #166534; background: #dcfce7; }
    .readiness--ready .readiness-badge__icon { color: white; background: #16a34a; }
    .readiness--needs-info { color: #9a3412; background: #ffedd5; }
    .readiness--needs-info .readiness-badge__icon { color: white; background: #ea580c; }
    .readiness--unknown { color: #475569; background: #e2e8f0; }
    .readiness--unknown .readiness-badge__icon { color: white; background: #64748b; }.delivery--overdue { color: #991b1b; background: #fee2e2; } 
    .delivery--overdue .delivery-badge__icon { background: #dc2626; }
    .delivery--needs-info { color: #9a3412; background: #ffedd5; } 
    .delivery--needs-info .delivery-badge__icon { background: #ea580c; } 
    .delivery--attention { color: #854d0e; background: #fef9c3; }
    .delivery--attention .delivery-badge__icon { background: #ca8a04; } 
    .delivery--healthy { color: #166534; background: #dcfce7; } 
    .delivery--healthy .delivery-badge__icon { background: #16a34a; } 
    .delivery--not-started { color: #1e40af; background: #dbeafe; } 
    .delivery--not-started .delivery-badge__icon { background: #2563eb; } 
    .delivery--unknown { color: #475569; background: #e2e8f0; } 
    .delivery--unknown .delivery-badge__icon { background: #64748b; }
    .feature-list-tooltip { min-width: 220px; max-width: 340px;font-size: 12px; line-height: 1.45; }
    .feature-list-tooltip strong { display: block; margin-bottom: 3px; font-size: 12px; }
    .feature-list-tooltip__detail { padding-left: 12px; }
    .feature-list-tooltip__subdetail { padding-left: 24px; }
    .feature-list-tooltip__metric { margin-top: 3px; padding-left: 12px; color: #cbd5e1; font-size: 11px; }
    .feature-list-tooltip__warning { padding-left: 12px; color: #b45309; font-size: 11px; }
    .feature-expand-control { width: 28px; height: 28px; border: none; border-radius: 4px; background: transparent; color: #334155; cursor: pointer; font-size: 13px; line-height: 1; } 
    .feature-expand-control:hover, .feature-expand-control:focus-visible { background: #dbeafe; color: #1d4ed8; outline: none; } 
    .feature-history { margin: 0; } 
    .feature-history__header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; } 
    .feature-history__title { font-size: 13px; color: #1e293b; } 
    .feature-history__hint { font-size: 10px; color: #64748b; } 
    .feature-history__timeline { display: grid; gap: 8px; width: 100%; } 
    .feature-history__event { min-width: 0; position: relative; } 
    .feature-history__event:not(:last-child)::after { content: ''; position: absolute; top: 25px; left: calc(50% + 25px); right: calc(-50% + 25px); height: 2px; background: #cbd5e1; z-index: 0; } 
    .feature-history__box { position: relative; z-index: 1; min-height: 62px; display: flex; flex-direction: column; justify-content: center; padding: 8px; border: 1px solid #cbd5e1; border-top: 4px solid var(--state-color, #94a3b8); border-radius: 6px; background: white; text-align: center; overflow: hidden; } 
    .feature-history__state { color: #1e293b; font-size: 11px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
    .feature-history__date { margin-top: 5px; color: #64748b; font-size: 10px; white-space: nowrap; } 
    .feature-stories-panel__divider { height: 1px; background: #dbe4ee; margin: 14px 0 12px; } 
    .feature-story-card__assigned-to { color: #475569; font-size: 10px; }
    
    
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const releaseDates = {
      'CE-2026-FEB': '2026-02-09',
      'CE-2026-FEB-SEMIMONTHLY': '2026-02-23',
      'CE-2026-MAR': '2026-03-09',
      'CE-2026-MAR-SEMIMONTHLY': '2026-03-23',
      'CE-2026-APR': '2026-04-12',
      'CE-2026-APR-SEMIMONTHLY': '2026-04-27',
      'CE-2026-MAY': '2026-05-11',
      'CE-2026-MAY-SEMIMONTHLY': '2026-05-25',
      'CE-2026-JUN': '2026-06-08',
      'CE-2026-JUN-SEMIMONTHLY': '2026-06-22',
      'CE-2026-JUL': '2026-07-13',
      'CE-2026-JUL-SEMIMONTHLY': '2026-07-27',
      'CE-2026-AUG': '2026-08-10',
      'CE-2026-AUG-SEMIMONTHLY': '2026-08-24',
      'CE-2026-SEP': '2026-09-14',
      'CE-2026-SEP-SEMIMONTHLY': '2026-09-28',
      'CE-2026-OCT': '2026-10-12',
      'CE-2026-OCT-SEMIMONTHLY': '2026-10-26',
      'CE-2026-NOV': '2026-11-09',
      'CE-2026-NOV-SEMIMONTHLY': '2026-11-23',
      'CE-2026-DEC': '2026-12-14'
    };

    const storyStateColors = {
      'New': '#94a3b8',
      'Business Refinement': '#facc15',
      'Technical Refinement': '#fb923c',
      'Ready for Development': '#f97316',
      'In Process': '#60a5fa',
      'QA Testing': '#38bdf8',
      'Business Sprint Testing': '#22d3ee',
      'Sprint Complete': '#2dd4bf',
      'User Acceptance Testing': '#34d399',
      'Approved for Release': '#4ade80',
      'Ready for Deployment': '#84cc16',
      'Closed': '#a78bfa'
    };

    const readinessCheckLabels = {
      description: 'Description',
      acceptanceCriteria: 'Acceptance Criteria',
      businessImpact: 'Business Impact',
      parent: 'Parent',
      priority: 'Priority',
      targetDate: 'Target Date'      
    };

    function getReadinessMeta(readiness) {
      switch (readiness) {
        case 'Healthy':
          return {
            label: 'Ready',
            className: 'readiness--ready',
            icon: '✓'
          };

        case 'Incomplete':
          return {
            label: 'Needs info',
            className: 'readiness--needs-info',
            icon: '!'
          };

        case 'Unknown':
          return {
            label: 'Unable to validate',
            className: 'readiness--unknown',
            icon: '?'
          };

        default:
          return {
            label: 'Readiness unavailable',
            className: 'readiness--unknown',
            icon: '?'
          };
      }
    }

    /*
      Compatibilidad durante la migración del contrato API.

      El frontend nuevo prefiere los campos readiness.
      El fallback permite seguir leyendo respuestas cacheadas o versiones
      antiguas del backend que aún entreguen health.
    */
    function getFeatureReadiness(feature) {
      return feature.readiness ?? feature.health ?? 'Unknown';
    }

    function getFeatureReadinessChecks(feature) {
      return feature.readinessChecks ?? feature.requiredFields ?? {};
    }

    function getFeatureReadinessMissingChecks(feature) {
      return feature.readinessMissingChecks ?? feature.missingChecks ?? [];
    }

    function getFeatureReadinessUnknownChecks(feature) {
      return feature.readinessUnknownChecks ?? feature.unknownChecks ?? [];
    }
    
    function getCheckMeta(value) {
      if (value === true) {
        return {
          label: 'Complete',
          className: 'check--pass',
          icon: '✓'
        };
      }

      if (value === false) {
        return {
          label: 'Missing',
          className: 'check--fail',
          icon: '✕'
        };
      }

      return {
        label: 'Unable to validate',
        className: 'check--unknown',
        icon: '?'
      };
    }

    function ReadinessBadge({ readiness, iconOnly = false, onClick, isActive = false, featureId }) 
    {
      const meta = getReadinessMeta(readiness);

      /*
        Modo compacto para FeatureReadinessDetails:
        muestra sólo el círculo de color y el icono.
        No es un control interactivo porque el botón principal
        ya está en la columna Readiness de la tabla.
      */
      if (iconOnly) {
        return (
          <span
            className={`readiness-badge readiness-badge--icon-only ${meta.className}`}
            title={meta.label}
            aria-label={`Feature readiness: ${meta.label}`}
          >
            <span className="readiness-badge__icon">
              {meta.icon}
            </span>
          </span>
        );
      }

      /* Modo normal para Feature List: el óvalo completo es un botón y controla el panel Readiness. */
      return (
        <button
          type="button"
          className={[
            'readiness-badge',
            'readiness-badge--button',
            meta.className,
            isActive ? 'readiness-badge--active' : ''
          ].filter(Boolean).join(' ')}
          onClick={onClick}
          title={
            isActive
              ? `Close Readiness details — ${meta.label}`
              : `Show Readiness details — ${meta.label}`
          }
          aria-label={
            isActive
              ? `Close Readiness details for Feature ${featureId}`
              : `Show Readiness details for Feature ${featureId}`
          }
          aria-expanded={isActive}
          aria-controls={featureId ? `feature-panel-${featureId}` : undefined}
        >
          <span className="readiness-badge__icon">
            {meta.icon}
          </span>

          <span className="readiness-badge__label">
            {meta.label}
          </span>
        </button>
      );
    }
    
    function FeatureReadinessDetails({ feature }) {
      const checks = getFeatureReadinessChecks(feature);
      const missingChecks = getFeatureReadinessMissingChecks(feature);
      const unknownChecks = getFeatureReadinessUnknownChecks(feature);
      
      const orderedChecks = [
        'description',
        'acceptanceCriteria',
        'businessImpact',
        'parent',
        'priority',
        'targetDate'        
      ];

      return (
        <div className="readiness-details">
          <div className="readiness-details__header">
            <strong style={{ fontSize: '13px', color: '#1e293b' }}>
              Feature readiness
            </strong>

            {/* El icono se muestra después del título y sin repetir el texto */}
            <ReadinessBadge readiness={getFeatureReadiness(feature)} iconOnly />
          </div>

          <div className="readiness-checks-grid">
            {orderedChecks.map((key) => {
              const meta = getCheckMeta(checks[key]);

              return (
                <div
                  key={key}
                  className={`readiness-check ${meta.className}`}
                  title={`${readinessCheckLabels[key]}: ${meta.label}`}
                >
                  <span className="readiness-check__icon">
                    {meta.icon}
                  </span>

                  <span>
                    <strong>{readinessCheckLabels[key]}</strong>
                    <span style={{ marginLeft: '5px', opacity: 0.85 }}>
                      — {meta.label}
                    </span>
                  </span>
                </div>
              );
            })}
          </div>

          {missingChecks.length > 0 && (
            <div className="readiness-summary readiness-summary--missing">
              <strong>Missing:</strong>{' '}
              {missingChecks
                .map(check => readinessCheckLabels[check] || check)
                .join(', ')}
            </div>
          )}

          {unknownChecks.length > 0 && (
            <div className="readiness-summary readiness-summary--unknown">
              <strong>Unable to validate:</strong>{' '}
              {unknownChecks
                .map(check => readinessCheckLabels[check] || check)
                .join(', ')}
            </div>
          )}
        </div>
      );
    }

    /*
      Delivery Health se calcula exclusivamente con feature.deliverySummary.

      Esto es intencional:
      - deliverySummary ya viene precalculado desde el backend.
      - Evita falsos "No Stories" mientras storiesCache está cargando.
      - Mantiene la evaluación consistente entre Feature List y Roadmap.
    */

    const deliveryExecutionStates = ['Planned', 'In Process'];
    const deliveryClosedStates = ['Closed'];
    
    function hasFeatureEstimate(feature) {
      const estimation = feature.estimation || {};
    
      return [estimation.be, estimation.fe, estimation.qa].some(value => {
        return (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ''
        );
      });
    }
    
    function isPastTargetDate(targetDate) {
      if (!targetDate) return false;
    
      const target = new Date(targetDate);
    
      if (Number.isNaN(target.getTime())) {
        return false;
      }
    
      const today = new Date();
    
      target.setHours(0, 0, 0, 0);
      today.setHours(0, 0, 0, 0);
    
      return target < today;
    }
    
    function getDeliveryHealth(feature) {
      const summary = feature.deliverySummary;
      const state = feature.state || '';
      const isClosed = deliveryClosedStates.includes(state);
      const isExecutionState = deliveryExecutionStates.includes(state);
    
      /*
        Estado técnico:
        No significa que no existan Stories ni que esté On track;
        simplemente no fue posible recuperar/resumir el trabajo.
      */
      if (!summary || summary.source !== 'ok') {
        return {
          key: 'unable-to-evaluate',
          label: 'Unable to evaluate',
          shortLabel: 'Unavailable',
          className: 'delivery--unknown',
          icon: '?',
          reason: 'Delivery work information could not be retrieved.'
        };
      }
    
      /*
        1. Máxima prioridad:
        Target Date vencido y aún existe trabajo pendiente.
    
        Ejemplo:
        Target Date: 18 November 2025
        Fecha actual: 20 August 2026
        Pending work items > 0
        Resultado: Overdue
      */
      if (
        !isClosed &&
        isPastTargetDate(feature.targetDate) &&
        summary.workItemsPendingDelivery
      ) {
        return {
          key: 'overdue',
          label: 'Overdue',
          shortLabel: 'Overdue',
          className: 'delivery--overdue',
          icon: '!',
          reason: 'The Target Date has passed and delivery work remains pending.'
        };
      }
    
      /*
        2. Regla exclusiva para New:
        No se usa para In Planning ni In Shaping.
      */
      if (
        state === 'New' &&
        !summary.hasWorkItems &&
        summary.totalWorkItems === 0
      ) {
        return {
          key: 'not-started',
          label: 'Not started',
          shortLabel: 'Not started',
          className: 'delivery--not-started',
          icon: '○',
          reason: 'This Feature is New and does not have associated Stories or Bugs yet.'
        };
      }
    
      /*
        3. Un Feature Closed no debe mostrar alertas de trabajo
        pendiente histórico ni de estimación.
      */
      if (isClosed) {
        return {
          key: 'healthy',
          label: 'Healthy',
          shortLabel: 'Healthy',
          className: 'delivery--healthy',
          icon: '✓',
          reason: 'This Feature is Closed.'
        };
      }
    
      /*
        4. Estados tempranos:
        No se penalizan todavía por no tener Stories o estimaciones.
        New ya fue tratado arriba.
      */
      if (!isExecutionState) {
        return {
          key: 'healthy',
          label: 'Healthy',
          shortLabel: 'Healthy',
          className: 'delivery--healthy',
          icon: '✓',
          reason: 'Delivery execution checks apply from Planned onward.'
        };
      }
    
      /*
        5. Needs estimate se conserva.
    
        Aplica desde Planned e In Process:
        todo Feature debe tener al menos una estimación
        BE, FE o QA antes/durante la ejecución.
      */
      if (!hasFeatureEstimate(feature)) {
        return {
          key: 'needs-estimate',
          label: 'Needs estimate',
          shortLabel: 'Needs estimate',
          className: 'delivery--needs-info',
          icon: '!',
          reason: 'The Feature does not have a BE, FE, or QA estimate.'
        };
      }
    
      /*
        6. Planned o In Process sin Stories/Bugs.
      */
      if (!summary.hasWorkItems || summary.totalWorkItems === 0) {
        return {
          key: 'no-stories',
          label: 'No Stories',
          shortLabel: 'No Stories',
          className: 'delivery--attention',
          icon: '!',
          reason: 'This Feature is in delivery execution but has no associated Stories or Bugs.'
        };
      }
    
      /*
        7. Existe trabajo pendiente, pero ninguno está activo.
      */
      if (
        state === 'In Process' && summary.pendingWorkItems > 0 && (summary.inProgressWorkItems ?? summary.activeWorkItems ?? 0) === 0
      ) {
        return {
          key: 'no-active-work',
          label: 'No active work',
          shortLabel: 'No active work',
          className: 'delivery--attention',
          icon: '!',
          reason: 'There is pending delivery work, but no Story or Bug is currently active.'
        };
      }
    
      /*
        8. Las Stories/Bugs asociadas tienen trabajo sin estimar.
        Esto es distinto de Needs estimate:
        - Needs estimate: el Feature no tiene BE/FE/QA.
        - Unestimated work: existen Stories/Bugs sin estimación.
      */
      if (summary.unestimatedWorkItems > 0) {
        return {
          key: 'unestimated-work',
          label: 'Unestimated work',
          shortLabel: 'Unestimated',
          className: 'delivery--attention',
          icon: '!',
          reason: `${summary.unestimatedWorkItems} associated work item(s) do not have an estimate.`
        };
      }
    
      return {
        key: 'healthy',
        label: 'Healthy',
        shortLabel: 'Healthy',
        className: 'delivery--healthy',
        icon: '✓',
        reason: 'No delivery execution risks were detected.'
      };

    // ── Tooltip global ──────────────────────────────────────────────
    function useTooltip() {
      const [tooltip, setTooltip] = React.useState({ visible: false, x: 0, y: 0, content: null });
      const showTooltip = React.useCallback((e, content) => {
        setTooltip({ visible: true, x: e.clientX, y: e.clientY, content });
      }, []);
      const moveTooltip = React.useCallback((e) => {
        setTooltip(prev => ({ ...prev, x: e.clientX, y: e.clientY }));
      }, []);
      const hideTooltip = React.useCallback(() => {
        setTooltip(prev => ({ ...prev, visible: false }));
      }, []);
      return { tooltip, showTooltip, moveTooltip, hideTooltip };
    }

    function Tooltip({ tooltip }) {
      if (!tooltip.visible || !tooltip.content) return null;
      const style = {
        position: 'fixed',
        left: tooltip.x + 14,
        top: tooltip.y - 10,
        background: 'rgba(15, 23, 42, 0.93)',
        color: 'white',
        padding: '8px 12px',
        borderRadius: '6px',
        fontSize: '11px',
        lineHeight: '1.6',
        pointerEvents: 'none',
        zIndex: 9999,
        maxWidth: '260px',
        boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
        whiteSpace: 'pre-wrap'
      };
      const adjustedLeft = tooltip.x + 14 + 260 > window.innerWidth
        ? tooltip.x - 274
        : tooltip.x + 14;
      return (
        <div style={{ ...style, left: adjustedLeft }}>
          {tooltip.content}
        </div>
      );
    }

    function StoryRow({ storyId, title, storyPoints, state, iterationPath, formatDate, timelineStart, timelineEnd, adoLink, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const today = new Date();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);
      const todayPercent = ((today - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
      const clampedTodayPercent = Math.max(0, Math.min(100, todayPercent));

      const segments = [];
      if (states.length > 0) {
        states.forEach((st, idx) => {
          const stateStart = new Date(st.changedDate);
          const stateEnd = idx === states.length - 1 ? today : new Date(states[idx + 1].changedDate);
          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            segments.push({
              color: storyStateColors[st.state] || '#cccccc',
              state: st.state,
              startPercent: clampedStart,
              widthPercent: Math.max(1, clampedEnd - clampedStart)
            });
          }
        });
      }

      let sprintStart = null;
      let sprintEnd = null;
      let sprintLabel = '';
      const sprintMatch = iterationPath && iterationPath.match(/(\d{4})_(S\d+)_([A-Za-z]+)(\d+)-([A-Za-z]+)(\d+)/);
      if (sprintMatch) {
        const year = parseInt(sprintMatch[1]);
        sprintLabel = sprintMatch[2];
        const monthMap = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
        const startMonth = sprintMatch[3];
        const startDay = parseInt(sprintMatch[4]);
        const endMonth = sprintMatch[5];
        const endDay = parseInt(sprintMatch[6]);
        sprintStart = new Date(year, monthMap[startMonth], startDay);
        sprintEnd = new Date(year, monthMap[endMonth], endDay);
        if (monthMap[endMonth] < monthMap[startMonth]) {
          sprintEnd = new Date(year + 1, monthMap[endMonth], endDay);
        }
      }

      const getSprintPercent = (date) => {
        const days = (date - timelineStart) / (1000 * 60 * 60 * 24);
        return (days / timelineTotalDays) * 100;
      };

      let sprintStartPercent = null;
      let sprintEndPercent = null;
      let sprintMidPercent = null;
      if (sprintStart && sprintEnd) {
        const rawStart = getSprintPercent(sprintStart);
        const rawEnd = getSprintPercent(sprintEnd);
        if (rawEnd > 0 && rawStart < 100) {
          sprintStartPercent = Math.max(0, rawStart);
          sprintEndPercent = Math.min(100, rawEnd);
          sprintMidPercent = (sprintStartPercent + sprintEndPercent) / 2;
        }
      }

      return (
        <tr style={{ borderBottom: '1px solid #eee', background: '#f2f2f2' }}>
          <td></td>
          <td></td>
          <td><a href={adoLink(storyId)} target="_blank">{storyId}</a></td>
          <td style={{ maxWidth: '300px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span title={title} style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', flex: '0 1 auto', minWidth: '0' }}>{title}</span>
              <span style={{ color: '#696969', flexShrink: 0, fontSize: '11px' }}>({storyPoints} pts)</span>
            </div>
          </td>
          <td style={{ padding: '6px 8px' }}>
            <div style={{ height: '36px', background: '#e0e0e0', borderRadius: '4px', overflow: 'hidden', position: 'relative' }}>
              {!loading && segments.map((seg, idx) => {
                const segStartDate = new Date(timelineStart.getTime() + (seg.startPercent / 100) * (timelineEnd - timelineStart));
                const segEndDate = new Date(timelineStart.getTime() + ((seg.startPercent + seg.widthPercent) / 100) * (timelineEnd - timelineStart));
                const diffDays = Math.round((segEndDate - segStartDate) / (1000 * 60 * 60 * 24));
                const tooltipContent = (
                  <div>
                    <div style={{ fontWeight: 'bold', marginBottom: '4px', color: seg.color, fontSize: '12px' }}>● {seg.state}</div>
                    <div>From: {segStartDate.toLocaleDateString('es-CO')}</div>
                    <div>To:&nbsp;&nbsp; {segEndDate.toLocaleDateString('es-CO')}</div>
                    <div style={{ marginTop: '4px', color: '#94a3b8' }}>{diffDays} day{diffDays !== 1 ? 's' : ''} in this state</div>
                  </div>
                );
                return (
                  <div
                    key={idx}
                    style={{ position: 'absolute', top: '8px', left: seg.startPercent + '%', width: seg.widthPercent + '%', height: '20px', background: seg.color, borderRadius: '3px', opacity: 0.85, minWidth: '6px', cursor: 'pointer', zIndex: 2 }}
                    onMouseEnter={(e) => showTooltip && showTooltip(e, tooltipContent)}
                    onMouseMove={(e) => moveTooltip && moveTooltip(e)}
                    onMouseLeave={() => hideTooltip && hideTooltip()}
                  />
                );
              })}
              {loading && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>Loading...</div>
              )}
              {!loading && segments.length === 0 && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>No data</div>
              )}
              {!loading && sprintStartPercent !== null && (
                <>
                  <div style={{ position: 'absolute', top: 0, bottom: 0, left: sprintStartPercent + '%', width: '1px', borderLeft: '1px dashed #123770', zIndex: 5, pointerEvents: 'none' }} />
                  <div style={{ position: 'absolute', top: 0, bottom: 0, left: sprintEndPercent + '%', width: '1px', borderLeft: '1px dashed #123770', zIndex: 5, pointerEvents: 'none' }} />
                  <div style={{ position: 'absolute', top: '2px', left: sprintMidPercent + '%', transform: 'translateX(-50%)', fontSize: '9px', color: 'white', background: '#123770', padding: '1px 5px', borderRadius: '2px', whiteSpace: 'nowrap', zIndex: 8, pointerEvents: 'none' }}>
                    {sprintLabel}
                  </div>
                </>
              )}
              {!loading && (
                <div style={{ position: 'absolute', top: 0, bottom: 0, left: clampedTodayPercent + '%', width: '1px', background: '#1e3a8a', opacity: 0.9, zIndex: 10, pointerEvents: 'none' }} />
              )}
            </div>
          </td>
        </tr>
      );
    }

    // ── Hook: mide el ancho real de la celda Timeline en la tabla ──
    function useTimelineWidth(tableRef) {
      const [timelineWidth, setTimelineWidth] = useState(null);

      useEffect(() => {
        function measure() {
          if (!tableRef.current) return;
          // La última columna (Timeline) es la 5ta <th> (índice 4)
          const ths = tableRef.current.querySelectorAll('thead th');
          if (ths.length >= 5) {
            const lastTh = ths[ths.length - 1];
            const rect = lastTh.getBoundingClientRect();
            // Descontamos el padding horizontal de la celda (6px cada lado según td padding: '4px 6px')
            setTimelineWidth(rect.width - 12);
          }
        }
        measure();
        const ro = new ResizeObserver(measure);
        if (tableRef.current) ro.observe(tableRef.current);
        return () => ro.disconnect();
      }, [tableRef]);

      return timelineWidth;
    }

    /* ── Clasificación única de Features & Stories ── */
    const deliveryDoneStates = [
      'Sprint Complete',
      'User Acceptance Testing',
      'Approved for Release',
      'Ready for Deployment',
      'Closed'
    ];

    const deliveryInProgressStates = [
      'In Process',
      'QA Testing',
      'Business Sprint Testing'
    ];

    function hasWorkItemEstimate(workItem) {
      const value = workItem?.storyPoints;

      // 0 se considera un valor informado; sólo null, undefined o vacío
      // representan un Work Item sin estimación.
      return (
        value !== null &&
        value !== undefined &&
        String(value).trim() !== ''
      );
    }

    function getWorkItemDeliveryCategory(workItem) {
      if (workItem?.state === 'Removed') {
        return 'removed';
      }

      if (deliveryDoneStates.includes(workItem?.state)) {
        return 'done';
      }

      if (deliveryInProgressStates.includes(workItem?.state)) {
        return 'inProgress';
      }

      /*
        Cualquier Story/Bug vigente que no esté Done ni In progress
        debe entrar aquí. Esto incluye, por ejemplo:
        New, Business Refinement, Technical Refinement,
        Ready for Development, UAT, etc.
      */
      return 'pending';
    }

    function getWorkItemsDeliverySummary(workItems = []) {
      const summary = {
        totalWorkItems: workItems.length,
        includedWorkItems: 0,
        removedWorkItems: 0,
        doneWorkItems: 0,
        inProgressWorkItems: 0,
        pendingWorkItems: 0,
        openWorkItems: 0,
        unestimatedWorkItems: 0
      };

      workItems.forEach(workItem => {
        const category = getWorkItemDeliveryCategory(workItem);

        if (category === 'removed') {
          summary.removedWorkItems += 1;
          return;
        }

        summary.includedWorkItems += 1;

        if (category === 'done') {
          summary.doneWorkItems += 1;
        } else if (category === 'inProgress') {
          summary.inProgressWorkItems += 1;
        } else {
          summary.pendingWorkItems += 1;
        }

        /*
          Removed queda fuera de este cálculo por definición:
          no debe afectar la cobertura de estimación de delivery.
        */
        if (!hasWorkItemEstimate(workItem)) {
          summary.unestimatedWorkItems += 1;
        }
      });

        summary.openWorkItems =
        summary.inProgressWorkItems +
        summary.pendingWorkItems;

      return summary;
    }

    function getShortAssignedToName(value) {
      if (!value) { return 'Unassigned'; }

      /*
        Ejemplo: "Apellido, Nombre (Operations & Technology)" → "Apellido, Nombre"
      */
      return String(value)
        .replace(/\s*\([^)]*\)\s*$/, '')
        .trim();
    }

    function getFeatureHistoryStateColor(state) {
      const colors = {'New': '#94a3b8', 'In Shaping': '#fbbf24', 'In Planning': '#fb923c', 'Planned': '#34d399', 'In Process': '#60a5fa', 'Closed': '#a78bfa' };

      return colors[state] || '#94a3b8'; }

    function getWorkItemDisplayOrder(workItem) {
      /*
        Bugs primero; después las User Stories.
        Si surgiera otro tipo, quedará después de ambos.
      */
      if (workItem?.workItemType === 'Bug') return 0;
      if (workItem?.workItemType === 'User Story') return 1;
      return 2;
    }

    function sortFeatureWorkItems(workItems = []) {
      return [...workItems]
        .filter(workItem => workItem.state !== 'Removed')
        .sort((a, b) => {
          const typeDifference =
            getWorkItemDisplayOrder(a) - getWorkItemDisplayOrder(b);

          if (typeDifference !== 0) {
            return typeDifference;
          }

          return Number(b.id || 0) - Number(a.id || 0);
        });
    }

    function FeatureStateHistory({
      history,
      loading,
      formatDate
    }) {
      if (loading) {
        return (
          <div style={{ fontSize: '12px', color: '#64748b' }}>
            Loading feature history...
          </div>
        );
      }

      const sortedHistory = [...(history || [])]
        .filter(event => event && event.state && event.changedDate)
        .sort(
          (a, b) =>
            new Date(a.changedDate).getTime() -
            new Date(b.changedDate).getTime()
        );

      if (sortedHistory.length === 0) {
        return (
          <div style={{ fontSize: '12px', color: '#64748b' }}>
            No state history is available for this Feature.
          </div>
        );
      }

      /*
        Se reservan al menos seis columnas para representar el happy path:
        New → In Shaping → In Planning → Planned → In Process → Closed.

        Si hay más transiciones por regresos de estado, por ejemplo:
        Planned → In Process → In Planning,
        se generan más columnas y todas se ajustan al ancho disponible.
      */
      const columnCount = Math.max(6, sortedHistory.length);

      return (
        <div className="feature-history">
          <div className="feature-history__header">
            <strong className="feature-history__title">
              Feature state history
            </strong>

            <span className="feature-history__hint">
              Oldest to newest
            </span>
          </div>

          <div
            className="feature-history__timeline"
            style={{
              gridTemplateColumns: `repeat(${columnCount}, minmax(0, 1fr))`
            }}
          >
            {sortedHistory.map((event, index) => (
              <div
                key={`${event.state}-${event.changedDate}-${index}`}
                className="feature-history__event"
              >
                <div
                  className="feature-history__box"
                  style={{
                    '--state-color': getFeatureHistoryStateColor(event.state)
                  }}
                  title={`${event.state} — ${formatDate(event.changedDate)}`}
                >
                  <div className="feature-history__state">
                    {event.state}
                  </div>

                  <div className="feature-history__date">
                    {formatDate(event.changedDate)}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function FeatureStoriesCards({
      stories,
      adoLink
    }) {
      const summary = getWorkItemsDeliverySummary(stories);
      const visibleStories = sortFeatureWorkItems(stories);

      return (
        <div>
          <div
            style={{
              marginBottom: '10px',
              fontSize: '12px',
              fontWeight: 'bold'
            }}
          >
            Stories & Bugs ({summary.includedWorkItems}

            {summary.removedWorkItems > 0 && (
              <span style={{ color: '#94a3b8', fontWeight: 'normal' }}>
                {' '}+{summary.removedWorkItems} removed
              </span>
            )}

    function Dashboard() {
      const { tooltip, showTooltip, moveTooltip, hideTooltip } = useTooltip();
      const [features, setFeatures] = useState([]);
      const [loading, setLoading] = useState(true);
      const [warnings, setWarnings] = useState([]);
      const [filterAreaPath, setFilterAreaPath] = useState([]);
      const [filterIteration, setFilterIteration] = useState([]);
      const [currentPage, setCurrentPage] = useState('roadmap');
      /* Un solo panel abierto en Feature List. Ejemplo: { featureId: 123456, panel: 'history' } En los próximos puntos también permitirá readiness y delivery, pero ahora sólo se utiliza el panel "history". */
      const [expandedFeaturePanel, setExpandedFeaturePanel] = useState(null);
      const [searchTitle, setSearchTitle] = useState('');
      const [searchInput, setSearchInput] = useState('');
      const [sortColumn, setSortColumn] = useState('id');
      const [sortOrder, setSortOrder] = useState('asc');
      const currentYear = String(new Date().getFullYear());
      const [filterState, setFilterState] = useState([]);
      const [filterTargetDate, setFilterTargetDate] = useState([currentYear]);
      const [filterReleaseVersion, setFilterReleaseVersion] = useState([]);
      const [roadmapPage, setRoadmapPage] = useState(1);
      const [timelineOffset, setTimelineOffset] = useState(-8);
      const [weekOffset, setWeekOffset] = useState(-8);
      const [expandedRoadmapFeatureId, setExpandedRoadmapFeatureId] = useState(null);
      const [historyCache, setHistoryCache] = useState({});
      const [loadingHistory, setLoadingHistory] = useState(false);
      const [storiesCache, setStoriesCache] = useState({});
      const [loadingStoriesIds, setLoadingStoriesIds] = useState({});
      const [loadingFeatureHistoryIds, setLoadingFeatureHistoryIds] = useState({});
      const [storyHistoryCache, setStoryHistoryCache] = useState({});
      const [loadingStoryHistory, setLoadingStoryHistory] = useState(false);
      const [featuresPage, setFeaturesPage] = useState(1);
      const [filterAssignedTo, setFilterAssignedTo] = useState([]);
      const [saveAsDefault, setSaveAsDefault] = useState(false);
      const [legendExpanded, setLegendExpanded] = useState(false);
      const [refreshing, setRefreshing] = useState(false);
      const [cacheInfo, setCacheInfo] = useState(null);
      const [readinessFilter, setReadinessFilter] = useState('All');

      // ── Ref a la tabla del Roadmap para medir la columna Timeline ──
      const roadmapTableRef = useRef(null);
      const timelineWidth = useTimelineWidth(roadmapTableRef);

      useEffect(() => {
        const timer = setTimeout(() => { setSearchTitle(searchInput); }, 300);
        return () => clearTimeout(timer);
      }, [searchInput]);

      useEffect(() => {
        setRoadmapPage(1);
        setFeaturesPage(1);
        setExpandedFeaturePanel(null);
        setExpandedRoadmapFeatureId(null);
      }, [filterAreaPath, filterIteration, filterState, filterTargetDate, filterReleaseVersion, filterAssignedTo, searchTitle, readinessFilter]);

      async function loadFeatures(forceRefresh = false) {
        if (forceRefresh) { setRefreshing(true); } else { setLoading(true); }
        try {
          const url = forceRefresh ? '/api/features?refresh=1' : '/api/features';
          const res = await fetch(url);
          const json = await res.json();
          setFeatures(json.features);
          setCacheInfo(json.cacheInfo);
          setWarnings(json.warnings || []);
        } catch (err) {
          console.error('Error loading features:', err);
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      }

      useEffect(() => { loadFeatures(false); }, []);
      useEffect(() => { setExpandedRoadmapFeatureId(null); }, [roadmapPage]);
      useEffect(() => { setExpandedFeaturePanel(null); }, [featuresPage]);

      const areaPaths = [...new Set(features.map(f => f.areaPath).filter(a => a))].sort();
      const iterations = [...new Set(features.map(f => f.iterationPath).filter(a => a))].sort();
      const states = [...new Set(features.map(f => f.state).filter(a => a))].sort();
      const targetYears = [...new Set(features.map(f => f.targetDate ? new Date(f.targetDate).getFullYear() : null).filter(y => y))].sort((a, b) => b - a);
      const releaseVersions = [...new Set(features.map(f => f.releaseFixVersion).filter(v => v))].sort();
      const assignedTos = [...new Set(features.map(f => f.assignedTo).filter(a => a))].sort();

      const monthsByYear = {};
      features.forEach(f => {
        if (f.targetDate) {
          const d = new Date(f.targetDate);
          const y = d.getFullYear();
          const m = d.getMonth();
          if (!monthsByYear[y]) monthsByYear[y] = new Set();
          monthsByYear[y].add(m);
        }
      });

      const FILTER_STORAGE_KEY = 'featureTracker_defaultFilters';

      useEffect(() => {
        const saved = localStorage.getItem(FILTER_STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setFilterAreaPath(parsed.filterAreaPath || []);
            setFilterIteration(parsed.filterIteration || []);
            setFilterState(parsed.filterState || []);
            setFilterTargetDate(parsed.filterTargetDate || []);
            setFilterReleaseVersion(parsed.filterReleaseVersion || []);
            setFilterAssignedTo(parsed.filterAssignedTo || []);
            setReadinessFilter(parsed.readinessFilter ?? parsed.healthFilter ?? 'All' );
            setSaveAsDefault(true);
          } catch (e) { console.error('Error loading saved filters:', e); }
        }
      }, []);

      useEffect(() => {
        if (!saveAsDefault) return;
        const filtersToSave = { filterAreaPath, filterIteration, filterState, filterTargetDate, filterReleaseVersion, filterAssignedTo, readinessFilter };
        localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify(filtersToSave));
      }, [saveAsDefault, filterAreaPath, filterIteration, filterState, filterTargetDate, filterReleaseVersion, filterAssignedTo, readinessFilter]);

      const handleSaveAsDefaultChange = (e) => {
        const checked = e.target.checked;
        setSaveAsDefault(checked);
        if (!checked) localStorage.removeItem(FILTER_STORAGE_KEY);
      };
      // Applies every dashboard filter except Readiness.
      // This collection is used by the Readiness overview counters.
      const filteredBeforeReadiness = features.filter(f => {
        const areaOk = filterAreaPath.length === 0 ||filterAreaPath.includes(f.areaPath);
        const iterOk = filterIteration.length === 0 || filterIteration.includes(f.iterationPath);
        const stateOk = filterState.length === 0 || filterState.includes(f.state);
        const assignedOk = filterAssignedTo.length === 0 || filterAssignedTo.includes(f.assignedTo);

        let dateOk = filterTargetDate.length === 0;
      
        if (filterTargetDate.length > 0 && f.targetDate) {
          const d = new Date(f.targetDate);
          const yearMonthKey = d.getFullYear() + '-' + d.getMonth();
          const yearKey = String(d.getFullYear());
      
          dateOk =
            filterTargetDate.includes(yearMonthKey) ||
            filterTargetDate.includes(yearKey);
        }
      
        const normalizedSearch = searchTitle.toLowerCase();
        const searchOk = searchTitle === '' || (f.title || '').toLowerCase().includes(normalizedSearch) || (f.tags || '').toLowerCase().includes(normalizedSearch);
        const releaseOk = filterReleaseVersion.length === 0 || filterReleaseVersion.includes(f.releaseFixVersion);
      
        return (
          areaOk &&
          iterOk &&
          stateOk &&
          dateOk &&
          searchOk &&
          releaseOk &&
          assignedOk
        );
      });
      
      // The overview always represents the current selection from all
      // filters other than Readiness.
      const readinessCounts = {
        total: filteredBeforeReadiness.length,
        healthy: filteredBeforeReadiness.filter(f => getFeatureReadiness(f) === 'Healthy').length,
        incomplete: filteredBeforeReadiness.filter(f => getFeatureReadiness(f) === 'Incomplete').length,
        unknown: filteredBeforeReadiness.filter(f => getFeatureReadiness(f) === 'Unknown').length
      };
      
      // Applies the Readiness selection after calculating the overview counters.
      const filtered = filteredBeforeReadiness.filter(f => {
         const readiness = getFeatureReadiness(f);
          if (readinessFilter === 'All') {
            return true;
          }
          return readiness === readinessFilter;
        });

      let sortedFiltered = [...filtered];
      if (sortColumn) {
        sortedFiltered.sort((a, b) => {
          let valA = '', valB = '';
          if (sortColumn === 'id') { valA = a.id; valB = b.id; }
          else if (sortColumn === 'title') { valA = (a.title || '').toLowerCase(); valB = (b.title || '').toLowerCase(); }
          else if (sortColumn === 'areaPath') { valA = (a.areaPath || '').toLowerCase(); valB = (b.areaPath || '').toLowerCase(); }
          else if (sortColumn === 'iteration') {
            const extractYearQuarter = (path) => {
              const yearMatch = (path || '').match(/(\d{4})/);
              const quarterMatch = (path || '').match(/Q(\d)/);
              const year = yearMatch ? parseInt(yearMatch[1]) : 9999;
              const quarter = quarterMatch ? parseInt(quarterMatch[1]) : 9;
              return year * 10 + quarter;
            };
            valA = extractYearQuarter(a.iterationPath);
            valB = extractYearQuarter(b.iterationPath);
          }
          else if (sortColumn === 'priority') { valA = parseInt(a.priority) || 0; valB = parseInt(b.priority) || 0; }
          else if (sortColumn === 'state') { valA = (a.state || '').toLowerCase(); valB = (b.state || '').toLowerCase(); }
          else if (sortColumn === 'targetDate') { valA = (a.targetDate || ''); valB = (b.targetDate || ''); }
          else if (sortColumn === 'assignedTo') { valA = (a.assignedTo || '').toLowerCase(); valB = (b.assignedTo || '').toLowerCase(); }
          else if (sortColumn === 'readiness') { const readinessOrder = { 'Incomplete': 1, 'Unknown': 2, 'Healthy': 3 }; valA = readinessOrder[getFeatureReadiness(a)] || 4; valB = readinessOrder[getFeatureReadiness(b)] || 4; }
          if (sortOrder === 'asc') return valA < valB ? -1 : valA > valB ? 1 : 0;
          else return valA > valB ? -1 : valA < valB ? 1 : 0;
        });
      }

      const ensureFeatureHistoryLoaded = (featureId) => {
        const alreadyLoaded = Object.prototype.hasOwnProperty.call(
          historyCache,
          featureId
        );

        if (alreadyLoaded || loadingFeatureHistoryIds[featureId]) {
          return;
        }

        setLoadingFeatureHistoryIds(prev => ({
          ...prev,
          [featureId]: true
        }));

        fetch('/api/features-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids: [featureId] })
        })
          .then(response => response.json())
          .then(data => {
            setHistoryCache(prev => ({
              ...prev,
              [featureId]: data.results?.[featureId] || []
            }));
          })
          .catch(() => {
            /*
              Guardamos un arreglo vacío para no solicitar
              repetidamente un historial que falló.
            */
            setHistoryCache(prev => ({
              ...prev,
              [featureId]: []
            }));
          })
          .finally(() => {
            setLoadingFeatureHistoryIds(prev => ({
              ...prev,
              [featureId]: false
            }));
          });
      };

      const toggleFeatureExpand = (featureId) => {
        const panelIsAlreadyOpen =
          expandedFeaturePanel?.featureId === featureId &&
          expandedFeaturePanel?.panel === 'history';

        /*
          Clic en el mismo triángulo: cerrar el panel History.
          Clic desde otra Feature o desde Readiness: reemplazar el
          estado para que sólo exista un panel abierto globalmente.
        */
        if (panelIsAlreadyOpen) {
          setExpandedFeaturePanel(null);
          return;
        }

        setExpandedFeaturePanel({
          featureId,
          panel: 'history'
        });

        /*
          Las Stories/Bugs pueden estar precargadas por la página actual.
          Si no están disponibles, se solicitan al abrir History.
        */
        if (!storiesCache[featureId] && !loadingStoriesIds[featureId]) {
          setLoadingStoriesIds(prev => ({
            ...prev,
            [featureId]: true
          }));

          fetch('/api/feature-stories/' + featureId)
            .then(response => response.json())
            .then(data => {
              setStoriesCache(prev => ({
                ...prev,
                [featureId]: data.stories || []
              }));
            })
            .catch(() => {
              setStoriesCache(prev => ({
                ...prev,
                [featureId]: []
              }));
            })
            .finally(() => {
              setLoadingStoriesIds(prev => ({
                ...prev,
                [featureId]: false
              }));
            });
        }

        ensureFeatureHistoryLoaded(featureId);
      };

      const toggleFeatureReadiness = (featureId) => {
        const panelIsAlreadyOpen =
          expandedFeaturePanel?.featureId === featureId &&
          expandedFeaturePanel?.panel === 'readiness';

        /*
          Clic en el mismo badge: cerrar.
          Si estaba abierto History —o un futuro Delivery—, el estado se
          reemplaza y queda abierto solamente Readiness.
        */
        if (panelIsAlreadyOpen) {
          setExpandedFeaturePanel(null);
          return;
        }

        setExpandedFeaturePanel({
          featureId,
          panel: 'readiness'
        });
      };

      const featuresItemsPerPage = 15;
      const featuresTotalPages = Math.ceil(sortedFiltered.length / featuresItemsPerPage);
      const featuresStartIdx = (featuresPage - 1) * featuresItemsPerPage;
      const featuresPageItems = sortedFiltered.slice(featuresStartIdx, featuresStartIdx + featuresItemsPerPage);

      useEffect(() => {
        const featuresToLoad = featuresPageItems
          .map(f => f.id)
          .filter(id => !storiesCache[id] && !loadingStoriesIds[id]);
        if (featuresToLoad.length === 0) return;
        featuresToLoad.forEach(featureId => {
          setLoadingStoriesIds(prev => ({ ...prev, [featureId]: true }));
          fetch('/api/feature-stories/' + featureId)
            .then(r => r.json())
            .then(d => {
              setStoriesCache(prev => ({ ...prev, [featureId]: d.stories || [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            })
            .catch(() => {
              setStoriesCache(prev => ({ ...prev, [featureId]: [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            });
        });
      }, [featuresPage, sortedFiltered.length, filterAreaPath.join(','), filterIteration.join(','), filterState.join(','), filterTargetDate.join(','), filterReleaseVersion.join(','), filterAssignedTo.join(','), readinessFilter, searchTitle]);

      const toggleRoadmapFeature = (featureId) => {
        if (expandedRoadmapFeatureId === featureId) { setExpandedRoadmapFeatureId(null); return; }
        setExpandedRoadmapFeatureId(featureId);
        if (!storiesCache[featureId]) {
          setLoadingStoriesIds(prev => ({ ...prev, [featureId]: true }));
          fetch('/api/feature-stories/' + featureId)
            .then(r => r.json())
            .then(d => {
              setStoriesCache(prev => ({ ...prev, [featureId]: d.stories || [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            })
            .catch(() => {
              setStoriesCache(prev => ({ ...prev, [featureId]: [] }));
              setLoadingStoriesIds(prev => ({ ...prev, [featureId]: false }));
            });
        }
      };

      const adoLink = (id) => `https://dev.azure.com/tr-commercial-eng/Commercial%20Engineering/_workitems/edit/${id}`;
      const formatDate = (date) => { if (!date) return '-'; return new Date(date).toLocaleDateString('es-CO'); };

      const itemsPerPage = 15;
      const totalPages = Math.ceil(sortedFiltered.length / itemsPerPage);
      const startIdx = (roadmapPage - 1) * itemsPerPage;
      const pageItems = sortedFiltered.slice(startIdx, startIdx + itemsPerPage);
      const pageItemIds = pageItems.map(item => item.id).join(',');

      const expandedRoadmapStories = expandedRoadmapFeatureId ? (storiesCache[expandedRoadmapFeatureId] || []) : [];
      const expandedStoryIds = expandedRoadmapStories.map(s => s.id).join(',');

      useEffect(() => {
        if (currentPage !== 'roadmap' || pageItems.length === 0) return;
        const ids = pageItems.map(item => item.id).filter(id => !historyCache[id]);
        if (ids.length === 0) return;
        setLoadingHistory(true);
        fetch('/api/features-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids })
        })
          .then(r => r.json())
          .then(d => {
            setHistoryCache(prev => ({ ...prev, ...(d.results || {}) }));
            setLoadingHistory(false);
          })
          .catch(() => { setLoadingHistory(false); });
      }, [pageItemIds, currentPage]);

      useEffect(() => {
        if (currentPage !== 'roadmap') return;
        const nextStart = roadmapPage * itemsPerPage;
        const nextPageItems = sortedFiltered.slice(nextStart, nextStart + itemsPerPage);
        if (nextPageItems.length === 0) return;
        const ids = nextPageItems.map(item => item.id).filter(id => !historyCache[id]);
        if (ids.length === 0) return;
        fetch('/api/features-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids })
        })
          .then(r => r.json())
          .then(d => {
            setHistoryCache(prev => ({ ...prev, ...(d.results || {}) }));
          })
          .catch(() => {});
      }, [roadmapPage, currentPage, sortedFiltered.length, filterAreaPath.join(','), filterIteration.join(','), filterState.join(','), filterTargetDate.join(','), filterReleaseVersion.join(','), filterAssignedTo.join(','), readinessFilter, searchTitle]);

      useEffect(() => {
        if (!expandedRoadmapFeatureId || expandedRoadmapStories.length === 0) return;
        const ids = expandedRoadmapStories.map(s => s.id).filter(id => !storyHistoryCache[id]);
        if (ids.length === 0) return;
        setLoadingStoryHistory(true);
        fetch('/api/stories-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids })
        })
          .then(r => r.json())
          .then(d => {
            setStoryHistoryCache(prev => ({ ...prev, ...(d.results || {}) }));
            setLoadingStoryHistory(false);
          })
          .catch(() => { setLoadingStoryHistory(false); });
      }, [expandedRoadmapFeatureId, expandedStoryIds]);

        function FeatureTooltipContent({ feature }) {
        /*
          Reutilizamos exactamente la lógica de display ya utilizada
          en la columna Iteration: tomar el último segmento del path.

          Area:
          Commercial Engineering\Digital\Acquisition\Global Product 1
          → Global Product 1

          Iteration:
          Commercial Engineering\2026\Q4
          → Q4
        */
        const shortArea = feature.areaPath
          ? feature.areaPath.split('\\').pop()
          : '—';

        const shortIteration = feature.iterationPath
          ? feature.iterationPath.split('\\').pop()
          : '—';

        return (
          <div className="feature-list-tooltip">
            <strong>
              #{feature.id} — {feature.title || 'Untitled Feature'}
            </strong>
            <div>Area Path: {shortArea}</div>
            <div>Iteration Path: {shortIteration}</div>
            <div>Assigned to: {feature.assignedTo || '—'}</div>
          </div>
        );
      }

      function DeliveryHealthTooltipContent({ feature }) {
        const delivery = getDeliveryHealth(feature);
        const backendSummary = feature.deliverySummary;
        const loadedStories = storiesCache[feature.id];

        /*
          Cuando las Stories/Bugs ya fueron cargadas, esta es la fuente
          de verdad para el tooltip y para el detalle expandido.
        */
        const storySummary = Array.isArray(loadedStories)
          ? getWorkItemsDeliverySummary(loadedStories)
          : null;

        /*
          Fallback temporal mientras las Stories/Bugs todavía cargan.
          Este fallback conserva los campos actuales del backend, pero
          no puede separar de forma fiable In progress vs Pending si
          el backend no los entrega por separado.
        */
        const totalWorkItems = storySummary
          ? storySummary.totalWorkItems
          : Number(backendSummary?.totalWorkItems || 0);

        const removedWorkItems = storySummary
          ? storySummary.removedWorkItems
          : Number(backendSummary?.removedWorkItems ?? backendSummary?.excludedWorkItems ?? 0);

        const includedWorkItems = storySummary
          ? storySummary.includedWorkItems
          : Number(backendSummary?.includedWorkItems ?? Math.max(0, totalWorkItems - removedWorkItems));

        const doneWorkItems = storySummary
          ? storySummary.doneWorkItems
          : Number(backendSummary?.doneWorkItems ?? backendSummary?.completedWorkItems ?? 0);

        const inProgressWorkItems = storySummary
          ? storySummary.inProgressWorkItems : backendSummary?.inProgressWorkItems ?? backendSummary?.activeWorkItems ?? null;

        const pendingWorkItems = storySummary
          ? storySummary.pendingWorkItems : backendSummary?.pendingWorkItems ?? backendSummary?.pendingNonActiveWorkItems ?? null;

        const unestimatedWorkItems = storySummary
          ? storySummary.unestimatedWorkItems
          : Number(backendSummary?.unestimatedWorkItems || 0);

        if (!backendSummary || backendSummary.source !== 'ok') {
          return (
            <div className="feature-list-tooltip">
              <strong>Delivery health: {delivery.label}</strong>
              <div>{delivery.reason}</div>
            </div>
          );
        }

        return (
          <div className="feature-list-tooltip">
            <strong>Delivery health: {delivery.label}</strong>

            <div>{delivery.reason}</div>

            {feature.targetDate && (
              <div>
                Target Date: {formatDate(feature.targetDate)}
              </div>
            )}

            <div style={{ marginTop: '4px' }}>
              Work items: {totalWorkItems} total
            </div>

            <div className="feature-list-tooltip__detail">
              Included in delivery: {includedWorkItems}
            </div>

            <div className="feature-list-tooltip__subdetail">
              Done: {doneWorkItems}
            </div>

            {inProgressWorkItems !== null && pendingWorkItems !== null ? (
              <>
                <div className="feature-list-tooltip__subdetail">
                  In progress: {inProgressWorkItems}
                </div>

                <div className="feature-list-tooltip__subdetail">

      // ── Renderiza el header de la línea de tiempo (meses o semanas) ──
      // Vive dentro de la tabla para que use exactamente el mismo ancho
      // que las barras, marcadores y líneas del Timeline.
      function TimelineSubHeader({ isWeekMode, timelineOffset, weekOffset }) {
        const today = new Date();

        if (isWeekMode) {
          const dayOfWeek = today.getDay();
          const thisMonday = new Date(today);
          thisMonday.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));

          const groups = [];
          let currentGroup = null;
          for (let i = 0; i < 12; i++) {
            const weekStart = new Date(thisMonday);
            weekStart.setDate(thisMonday.getDate() + (weekOffset + i) * 7);
            const year = weekStart.getFullYear();
            const quarter = Math.floor(weekStart.getMonth() / 3) + 1;
            const quarterKey = year + '-Q' + quarter;
            const label = weekStart.toLocaleString('default', { month: 'short', day: 'numeric' });
            if (!currentGroup || currentGroup.key !== quarterKey) {
              currentGroup = { key: quarterKey, label: year + ' · Q' + quarter, weeks: [] };
              groups.push(currentGroup);
            }
            currentGroup.weeks.push(label);
          }

          return (
            <div style={{ width: '100%', minWidth: 0 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
                {groups.map((g, gi) => (
                  <div
                    key={gi}
                    style={{
                      gridColumn: 'span ' + g.weeks.length,
                      background: (() => {
                        const parts = g.key.split('-Q');
                        return (parseInt(parts[0]) * 4 + parseInt(parts[1])) % 2 === 0 ? '#1e3a8a' : '#2563eb';
                      })(),
                      color: 'white',
                      textAlign: 'center',
                      fontSize: '10px',
                      fontWeight: 'bold',
                      padding: '3px 0',
                      borderRadius: '3px'
                    }}
                  >
                    {g.label}
                  </div>
                ))}
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
                {groups.map((g, gi) =>
                  g.weeks.map((week, wi) => (
                    <div key={gi + '-' + wi} style={{ background: '#e2e8f0', textAlign: 'center', fontSize: '9px', fontWeight: 'bold', padding: '3px 0', borderRadius: '3px', color: '#334155' }}>
                      {week}
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        }

        // Modo meses
        const timelineStart = new Date(today.getFullYear(), today.getMonth() + timelineOffset, 1);
        const groups = [];
        let currentGroup = null;
        for (let i = 0; i < 12; i++) {
          const m = new Date(timelineStart.getFullYear(), timelineStart.getMonth() + i, 1);
          const year = m.getFullYear();
          const monthName = m.toLocaleString('default', { month: 'short' });
          if (!currentGroup || currentGroup.year !== year) {
            currentGroup = { year, months: [] };
            groups.push(currentGroup);
          }
          currentGroup.months.push(monthName);
        }

        return (
          <div style={{ width: '100%', minWidth: 0 }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
              {groups.map((g, gi) => (
                <div key={gi} style={{
                    gridColumn: 'span ' + g.months.length,
                    background: gi % 2 === 0 ? '#1e3a8a' : '#2563eb',
                    color: 'white',
                    textAlign: 'center',
                    fontSize: '10px',
                    fontWeight: 'bold',
                    padding: '3px 0',
                    borderRadius: '3px'
                  }}
                >
                  {g.year}
                </div>
              ))}
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
              {groups.map((g, gi) =>
                g.months.map((month, mi) => (
                  <div
                    key={gi + '-' + mi}
                    style={{ background: '#e2e8f0', textAlign: 'center', fontSize: '10px', fontWeight: 'bold', padding: '3px 0', borderRadius: '3px', color: '#334155' }}
                  >
                    {month}
                  </div>
                ))
              )}
            </div>
          </div>
        );
      }
