<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Obligatorio para diseño responsive: hace que el ancho CSS coincida con el ancho real del dispositivo. Sin esta etiqueta, un móvil renderiza la página como si tuviera
    aproximadamente 980px de ancho y luego la reduce visualmente.  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" >
  <title>ADO DEC Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Luxon se usa para que el navegador interprete todas las fechas operativas en la misma zona oficial del backend. -->
  <script src="https://unpkg.com/luxon@3.7.2/build/global/luxon.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      color-scheme: light;
    
      /* ── Superficies ───────────────────────────────────────────── */
      --surface-page: #eef2f7;
      --surface-raised: #ffffff;
      --surface-sunken: #f8fafc;
      --surface-chrome: rgba(255, 255, 255, 0.72);
    
      /* ── Texto ─────────────────────────────────────────────────── */
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #64748b;
    
      /* ── Bordes ────────────────────────────────────────────────── */
      --line-hairline: #e3e9f0;
      --line-strong: #cbd5e1;
    
      /* ── Semántica ─────────────────────────────────────────────── */
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --accent-soft: #eff6ff;
      --risk: #dc2626;
      --risk-soft: #fef2f2;
      --warn: #b45309;
      --warn-soft: #fffbeb;
      --ok: #15803d;
      --ok-soft: #f0fdf4;
      --neutral: var(--text-tertiary);
      --neutral-soft: #f1f5f9;
    
      /* ── Tipografía ────────────────────────────────────────────── */
      --step--2: 0.6875rem; /* 11px */
      --step--1: 0.75rem;   /* 12px */
      --step-0: 0.8125rem;  /* 13px */
      --step-1: 0.9375rem;  /* 15px */
      --step-2: 1.375rem;   /* 22px */
      --step-3: 1.6875rem;  /* 27px */
    
      /* ── Radios ────────────────────────────────────────────────── */
      --radius-chip: 999px;
      --radius-control: 6px;
      --radius-card: 10px;
      --radius-panel: 14px;
    
      /* ── Sombras ───────────────────────────────────────────────── */
      --shadow-chip: 0 1px 1px rgba(15, 23, 42, 0.04);
      --shadow-card:
        0 1px 2px rgba(15, 23, 42, 0.06),
        0 4px 12px -6px rgba(15, 23, 42, 0.10);
      --shadow-chrome: 0 8px 24px -12px rgba(15, 23, 42, 0.28);
    
      /* ── Movimiento ────────────────────────────────────────────── */
      --response-ui: 320ms;
      --ease-ui: cubic-bezier(0.32, 0.72, 0, 1);
      --response-momentum: 420ms;
      --ease-momentum: cubic-bezier(0.16, 1.06, 0.3, 1);
      --press: 110ms;
    }
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI Variable Text",
        "Segoe UI",
        system-ui,
        "Helvetica Neue",
        sans-serif;
      font-size: var(--step-0);
      line-height: 1.45;
      color: var(--text-primary);
      background: var(--surface-page);
      -webkit-font-smoothing: antialiased;
      font-optical-sizing: auto;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { background: var(--surface-raised); }
    .header h1 { font-size: 24px; }
    .warnings { position: relative; background: #fff3cd; color: #856404; padding: 15px 46px 15px 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffc107;}
    .warnings__close-button { position: absolute; top: 8px; right: 9px; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 4px;
      background: transparent; color: #856404; cursor: pointer; font-family: inherit; font-size: 22px; font-weight: 700; line-height: 1; display: inline-flex;
      align-items: center; justify-content: center; transition: background 0.15s ease, color 0.15s ease; }
    .warnings__close-button:hover { background: rgba(133, 100, 4, 0.12); color: #5f4703; }
    .warnings__close-button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.35); outline-offset: 2px; }
    .filter-label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
    .filter-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .filter-count { font-size: 11px; color: #666; margin-top: 5px; }
    .table-wrapper { background: var(--surface-raised); }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f9f9f9; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #eee; font-size: 13px; }
    td { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; }
    tr:hover { background: #f5f5f5; }
    a { color: #007bff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .readiness-overview { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 9px; margin: 0; } 
    .readiness-overview-card { width: 130px; min-width: 130px; height: 58px; min-height: 58px; padding: 8px 11px; border: 1px solid var(--neutral-soft); border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); cursor: pointer; transition:   transform 0.15s ease,   box-shadow 0.15s ease,   border-color 0.15s ease; text-align: left; overflow: hidden; }
    .readiness-overview-card:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08); }
    .readiness-overview-card--active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.16); } 
    .readiness-overview-card__label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; } 
    .readiness-overview-card__count { display: block; margin-top: 4px; font-size: 22px; line-height: 1; font-weight: 700; color: var(--text-primary); } 
    .readiness-overview-card--ready { background: var(--ok-soft); border-color: #86efac; }
    .readiness-overview-card--ready .readiness-overview-card__label { color: #166534; }
    .readiness-overview-card--needs-info { background: #fff7ed; border-color: #fb923c; }
    .readiness-overview-card--needs-info .readiness-overview-card__label { color: #9a3412; }
    .readiness-overview-card--unknown { background: var(--surface-sunken); border-color: var(--line-strong); }
    .readiness-overview-card--unknown .readiness-overview-card__label { color: var(--text-secondary); } 
    .health-overview { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 9px; margin: 0;}
    .health-overview-card {  width: 130px; min-width: 130px; height: 58px; min-height: 58px; padding: 8px 11px; border: 1px solid var(--neutral-soft); border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); text-align: left; overflow: hidden; }
    .health-overview-card__label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .health-overview-card__count { display: block; margin-top: 4px; font-size: 22px; line-height: 1; font-weight: 700; color: var(--text-primary); }
    .health-overview-card--action { background: var(--risk-soft); border-color: #fca5a5; }
    .health-overview-card--action .health-overview-card__label { color: #991b1b; }
    .health-overview-card--attention { background: #fef3c7; border-color: #fbbf24; }
    .health-overview-card--attention .health-overview-card__label { color: #854d0e; }
    .health-overview-card--healthy { background: var(--ok-soft); border-color: #86efac; }
    .health-overview-card--healthy .health-overview-card__label { color: #166534; }
    .health-overview-card:hover { border-color: #94a3b8; transform: translateY(-1px); }
    .health-overview-card--selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18); }
    .health-overview-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Base compartida de los badges de Readiness y Delivery Health. Las clases readiness--* y delivery--* sólo definen colores específicos por estado; 
    estas clases definen la forma, espaciado y alineación visual. */
    .readiness-badge, .delivery-badge { display: inline-flex; align-items: center; justify-content: center; gap: 4px; max-width: 100%; padding: 3px 6px 3px 4px;
      border-radius: 999px; font-size: 10px; font-weight: 700; line-height: 1.2; white-space: nowrap; vertical-align: middle; }
    .readiness-badge__icon, .delivery-badge__icon { width: 14px;  height: 14px; flex: 0 0 14px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; color: var(--surface-raised); font-size: 9px; font-weight: 700; line-height: 1; }
    .readiness-badge__label, .delivery-badge__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* En las celdas de la tabla, permite que badges largos como "Unable to validate" o "Needs HLE" sigan siendo legibles sin alterar el layout de las columnas. */
    .feature-list-centered-cell .readiness-badge,.feature-list-centered-cell .delivery-badge { max-width: 100%; }
    .readiness--ready { color: #166534; background: var(--ok-soft); }
    .readiness--ready .readiness-badge__icon { color: white; background: var(--ok); }
    .readiness--needs-info { color: #9a3412; background: #ffedd5; }
    .readiness--needs-info .readiness-badge__icon { color: white; background: #ea580c; }
    .readiness--unknown { color: var(--text-secondary); background: var(--neutral-soft); }
    .readiness--unknown .readiness-badge__icon { color: white; background: var(--text-tertiary); }
    .delivery--overdue { color: #991b1b; background: #fee2e2; } 
    .delivery--overdue .delivery-badge__icon { background: var(--risk); }
    .delivery--needs-info { color: #9a3412; background: #ffedd5; } 
    .delivery--needs-info .delivery-badge__icon { background: #ea580c; } 
    .delivery--attention { color: #854d0e; background: var(--warn-soft); }
    .delivery--attention .delivery-badge__icon { background: var(--warn); } 
    .delivery--healthy { color: #166534; background: var(--ok-soft); } 
    .delivery--healthy .delivery-badge__icon { background: var(--ok); } 
    .delivery--not-started { color: #1e40af; background: #dbeafe; } 
    .delivery--not-started .delivery-badge__icon { background: var(--accent); } 
    .delivery--unknown { color: var(--text-secondary); background: var(--neutral-soft); } 
    .delivery--unknown .delivery-badge__icon { background: var(--text-tertiary); }
    .feature-list-tooltip { min-width: 220px; max-width: 340px;font-size: 12px; line-height: 1.45; }
    .feature-list-tooltip strong { display: block; margin-bottom: 3px; font-size: 12px; }
    /* FEATURE LIST Esta tabla debe ocupar el ancho disponible del dashboard, sin necesitar scroll horizontal. */
    .feature-list-table-wrapper { width: 100%; margin-bottom: 0; overflow: visible; font-size: 11px}
    .feature-list-table { width: 100%;  min-width: 0; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
    /* Anchos compactos para que las doce columnas se vean completas en el área disponible de una pantalla laptop/desktop.
       ID y Feature reciben espacio adicional para mostrar IDs de 7–8 dígitos y más texto del título. */
    .feature-list-col--id { width: 7%; }
    .feature-list-col--title { width: 26%; }
    .feature-list-col--priority { width: 5%; }
    .feature-list-col--target-date { width:11%; }
    .feature-list-col--release-fix-version { width: 8%; }
    .feature-list-col--estimate { width: 4%; }
    .feature-list-col--state { width: 8%; }
    .feature-list-col--readiness { width: 11%; }
    .feature-list-col--delivery { width: 12%; }
    .feature-list-col--progress { width: 10%; }
    .feature-list-table th, .feature-list-table td { padding: 8px 7px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }
    .feature-list-table th { white-space: nowrap; font-size: 11px; }
    .feature-list-table td { white-space: nowrap; }
    /* El título puede reducirse con ellipsis, pero el texto completo queda disponible en el tooltip que ya usa FeatureTooltipContent.*/
    .feature-list-title-cell { min-width: 0; }
    /* Estado: punto de color + nombre del estado. Además de esta indicación, la fila conserva su línea de color izquierda según el estado. */
    .feature-state-cell { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .feature-state-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; display: inline-block; }
    .feature-list-date-cell { font-size: 11px; }
    .feature-list-centered-cell { text-align: center; padding: 8px !important; }
    .feature-list-progress-cell { text-align: center; padding: 8px !important; white-space: normal !important; }
    /* Paneles de Readiness y Delivery Health. History ya no forma parte de Feature List. */
    .feature-detail-panel {   background: var(--surface-sunken); border: 1px solid var(--line-hairline);}
    .feature-detail-panel-message { padding: 10px 0; font-size: 12px; color: var(--text-tertiary); }
    .feature-detail-panel-warning { padding: 10px 0; font-size: 12px; color: var(--warn); }
    .feature-story-card__assigned-to { color: var(--text-secondary); font-size: 10px; }
    .feature-story-card__release-fix-version { min-width: 0; max-width: 100%; color: var(--text-secondary); font-size: 10px; line-height: 1.3; overflow-wrap: anywhere; }
    .delivery-details { margin: 0; } 
    /* Contenedor de Stories and Bugs:Agrupa filtros y resultados directos de una Feature en una misma superficie visual, separada de Feature Status y Delivery Activity. */
    .feature-work-items-panel { min-width: 0; padding: 12px; border-radius: 7px; background: var(--surface-raised); border: 1px solid var(--line-hairline); }
    .feature-work-items-panel__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; min-width: 0;}
    .feature-work-items-panel__heading { min-width: 0;}
    .feature-work-items-panel__title { display: block; color: var(--text-primary); font-size: 13px; font-weight: 700; line-height: 1.35;}
    .feature-work-items-panel__description { display: block; margin-top: 3px; color: var(--text-tertiary); font-size: 11px; line-height: 1.4;}
    /* Muestra el equipo temporalmente aplicado dentro del panel de resultados, evitando que el usuario pierda contexto al filtrar desde Delivery Activity. */
    .feature-work-items-panel__team-context { flex: 0 0 auto; max-width: 42%; padding: 4px 7px; border: 1px solid #bfdbfe; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-size: 10px;
      font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; text-align: right;}
    .feature-work-items-panel__filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px;}
    .delivery-details__summary { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
    .delivery-details__metric { appearance: none; display: inline-flex; align-items: center; justify-content: center; min-height: 27px; padding: 5px 8px; border: 1px solid var(--line-hairline); border-radius: 999px;
        background: var(--surface-sunken); color: var(--text-secondary); cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; line-height: 1.2; text-align: center;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
    .delivery-details__metric:hover { border-color: #93c5fd; background: var(--accent-soft); color: var(--accent-strong); }
    .delivery-details__metric--active { background: var(--accent); border-color: var(--accent); color: var(--surface-raised); }
    .delivery-details__metric:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Linked Items representa una fuente de relaciones diferente de los hijos directos. Por eso conserva una variante neutral para no competir con el filtro activo de Stories/Bugs. */
    .delivery-details__metric--relationships { border-color: var(--line-strong); background: var(--surface-raised); color: #334155;}
    .delivery-details__metric--relationships:hover { border-color: #94a3b8; background: var(--surface-sunken); color: #1e3a8a;}
    .delivery-details__metric--relationships.delivery-details__metric--active { border-color: var(--text-secondary); background: var(--text-secondary); color: var(--surface-raised);}
    .feature-work-items-panel__divider { height: 1px; margin: 12px 0 0; background: #e5edf5;}
    .feature-work-items-panel__results { min-width: 0;}
    .delivery-work-group { margin-top: 14px; } 
    .delivery-work-group:first-child { margin-top: 12px; }
    .delivery-work-group__title { display: block; margin-bottom: 8px; color: #334155; font-size: 12px;  line-height: 1.35; } 
    .delivery-work-group__empty { padding: 9px 10px; border: 1px dashed var(--line-strong); border-radius: 5px; color: var(--text-tertiary); font-size: 11px; line-height: 1.45; }
    .delivery-work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
    @media (max-width: 560px) {.feature-work-items-panel { padding: 10px;}
    .feature-work-items-panel__header { flex-direction: column; gap: 7px;}
    .feature-work-items-panel__team-context { max-width: 100%; text-align: left;}
    .feature-work-items-panel__filters { gap: 5px; margin-top: 10px;}
    .delivery-details__metric { min-height: 28px; padding: 5px 7px; font-size: 10px;}}
    @media (max-width: 380px) {.delivery-details__metric { flex: 1 1 auto;}}
    .refresh-button { width: 40px; height: 40px; min-width: 40px; border: 0; border-radius: 6px; background: #4f7fc4; color: #fff; cursor: pointer;  display: inline-flex; align-items: center; justify-content: center;  transition: background 0.15s ease, transform 0.15s ease; }
    .refresh-button span { font-size: 23px; line-height: 1; font-weight: 500; }
    .refresh-button:hover:not(:disabled) { background: #3e6eaf; }
    .refresh-button:active:not(:disabled) { transform: scale(0.96); }
    .refresh-button:focus-visible { outline: 3px solid rgba(79, 127, 196, 0.35); outline-offset: 2px; }
    .refresh-button:disabled { opacity: 0.65; cursor: wait; }
    .refresh-button--loading span { animation: refresh-spin 0.85s linear infinite; }
    @keyframes refresh-spin { to { transform: rotate(360deg); }}
    .top-filters-bar  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;  overflow-x: auto; overflow-y: hidden; background: #fff; padding: 10px 14px; border-radius: 8px; margin-bottom: 0px; }
    .top-filters-main { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; }
    .top-filter-group { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; min-width: 0; }
    .top-filter-group .filter-label { margin: 0; white-space: nowrap; font-size: 13px }
    .top-filter-group .filter-select { min-height: 34px; padding: 6px 28px 6px 8px; font-size: 12px; }
    .top-filter-search { width: 31ch; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    .top-filter-readiness { width: 145px; }
    .top-filter-delivery-health { width: 220px; }
    .cache-info { width: 72px; min-width: 72px; color: #888; font-size: 10px; line-height: 1.2; text-align: center; }
    .cache-info strong { display: block; color: var(--text-tertiary); font-size: 10px; font-weight: 700; }
    @media (max-width: 1150px) { .top-filters-bar { justify-content: flex-start; }}
    /* Navegación principal: Feature List / Roadmap */
    .view-switcher { display: inline-flex; gap: 8px; align-items: stretch; }
    .view-switcher__button { appearance: none; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface-raised); color: var(--text-secondary); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; line-height: 1.2;
      text-align: left; display: inline-flex; align-items: center; justify-content: flex-start; gap: 8px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); 
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease; }
    .view-switcher__button:hover:not(.view-switcher__button--active) { background: var(--neutral-soft); border-color: #94a3b8; color: var(--accent-strong); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08); }
    .view-switcher__button:active { transform: scale(0.98); }
    .view-switcher__button--active { background: var(--accent); border-color: var(--accent-strong); color: var(--surface-raised); box-shadow: 0 3px 8px rgba(37, 99, 235, 0.28); }
    .view-switcher__button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.3); outline-offset: 2px; }
    .view-switcher__icon { width: 18px; height: 18px; flex: 0 0 18px; display: inline-flex; align-items: center; justify-content: center; }
    .view-switcher__label { display: block; }
    /* ── Header del dashboard y KPI cards ── */
    .dashboard-header { display: grid; grid-template-columns: 145px minmax(0, 1fr) 336px; grid-template-areas: "title kpis navigation"; align-items: center; column-gap: 16px; margin-bottom: 12px; }
    .dashboard-title { grid-area: title; margin: 0; min-width: 0; white-space: nowrap; font-size: 22px; line-height: 1.05; letter-spacing: 0.5px; }
    /* ReadinessOverview y DeliveryHealthOverview no agregan una capa visual dentro del header: sus cards son celdas directas de la grilla. */
    .dashboard-kpis .readiness-overview, .dashboard-kpis .health-overview { margin: 0 }
    /* Fuente única de verdad para las KPI cards.
      Se preserva el diseño actual:
      - ancho adaptable a la grilla;
      - altura fija de 74px;
      - sin ancho fijo de 130px;
      - sin altura antigua de 58px.  */
    .dashboard-kpis .readiness-overview-card, .dashboard-kpis .health-overview-card { width: 100%; min-width: 0; height: 74px; min-height: 74px; margin: 0; padding: 9px 10px; border: 1px solid var(--neutral-soft); border-radius: 7px;
      background: var(--surface-raised); box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; overflow: hidden; text-align: left; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
    .dashboard-kpis .readiness-overview-card { cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
    .dashboard-kpis .readiness-overview-card:hover { transform: translateY(-1px);  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08); }
    .dashboard-kpis .health-overview-card { cursor: pointer; }
    .dashboard-kpis .health-overview-card:hover { border-color: #94a3b8; transform: translateY(-1px); }
    .dashboard-kpis .health-overview-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .mobile-feature-activity__track { position: relative; height: 20px; overflow: hidden; border-radius: 4px; background: var(--neutral-soft); }
      .mobile-feature-activity__segment { position: absolute; top: 3px; height: 14px; min-width: 5px; border-radius: 3px; opacity: 0.9; }
      .mobile-feature-activity__today { position: absolute; top: 0; bottom: 0; z-index: 5; width: 2px; background: #1e3a8a; }
      .mobile-feature-activity__today-label { position: absolute; top: 39px; z-index: 6; color: #1e3a8a; font-size: 9px; font-weight: 800; line-height: 1;
        white-space: nowrap; transform: translateX(-50%); pointer-events: none; }
      .mobile-feature-activity__empty { display: block; margin-top: 5px; color: #94a3b8; font-size: 10px; line-height: 1.35; }
      /* Alertas compactas debajo del timeline. No se renderizan para Ready, Healthy ni Not started. */

      font-size: 10px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
      .mobile-feature-timeline-alert--readiness { border-left-color: #ea580c; background: #fff7ed; color: #9a3412; }
      .mobile-feature-timeline-alert--delivery-overdue { border-left-color: var(--risk); background: var(--risk-soft); color: #991b1b; }
      .mobile-feature-timeline-alert--delivery-attention { border-left-color: var(--warn); background: var(--warn-soft); color: #854d0e; }
      .mobile-feature-timeline-alert--delivery-needs-info { border-left-color: #ea580c; background: #fff7ed; color: #9a3412; }}
    .mobile-workspace-controls { display: none; }
    @media (max-width: 820px) {/* overflow-x: hidden puede crear un contenedor de scroll implícito y hacer que position: sticky deje de seguir el 
      scroll real de la página. clip evita scroll horizontal sin crear ese contenedor.*/
      html, body,#root { overflow-x: clip !important; overflow-y: visible !important; }
      .container.dashboard-shell { overflow: visible !important; }
      /* El control ya está correctamente renderizado como hermano de dashboard-fixed-content y dashboard-results-scroll.*/
      .mobile-workspace-controls { display: block; position: -webkit-sticky; position: sticky; top: 0; z-index: 1000; width: calc(100% + 24px); margin: 0 -12px 8px;
        padding: 8px 12px; border-top: 1px solid var(--line-hairline); border-bottom: 1px solid var(--line-strong); background: rgba(248, 250, 252, 0.99);
        box-shadow: 0 3px 8px rgba(15, 23, 42, 0.12); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
      /* Evita que una tarjeta enfocada mediante paginación o navegación programática termine oculta debajo de los controles sticky. */
      .mobile-feature-card { scroll-margin-top: 105px; }}
    /* ── Sistema tipográfico y materiales: overrides finales ─────── */
    .dashboard-title { font-size: var(--step-2); line-height: 1.06; letter-spacing: -0.018em; font-weight: 700; color: var(--text-primary); }
    .readiness-overview-card__count,.health-overview-card__count,.dashboard-kpis .readiness-overview-card__count,.dashboard-kpis .health-overview-card__count {
      font-size: var(--step-3); line-height: 1; letter-spacing: -0.022em; font-variant-numeric: tabular-nums; }
    .feature-list-table,.roadmap-table,.dashboard-pagination { font-variant-numeric: tabular-nums; }
    .mobile-feature-card__info-label { text-transform: none; letter-spacing: 0; font-size: var(--step--2); font-weight: 650; color: var(--text-tertiary); }

    /* La posición sticky ya hace que th sea un elemento posicionado. El pseudo-elemento crea una transición suave entre el header

    /* ── Retroalimentación inmediata al presionar ────────────────── */

    /* Evita el retraso de tap y el highlight gris nativo de Android para controles que ya tienen retroalimentación visual propia. */
    .feature-row--expandable,.roadmap-feature-row--expandable,.mobile-feature-card__header,.mobile-feature-card__action-button,.view-switcher__button,.readiness-overview-card,
    .health-overview-card,.delivery-details__metric,.dashboard-pagination__button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    /* ── Preferencias del sistema ────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {

      .readiness-overview-card:hover,.health-overview-card:hover,.dashboard-kpis .readiness-overview-card:hover,.dashboard-kpis .health-overview-card:hover,

    /* prefers-reduced-transparency no tiene soporte uniforme en todos los navegadores; los navegadores que no lo soporten simplemente

    @media (prefers-reduced-transparency: reduce) {
     .dashboard-results-scroll .feature-list-table thead th,.dashboard-results-scroll .roadmap-table thead th,.mobile-workspace-controls {
        background: var(--surface-raised); backdrop-filter: none; -webkit-backdrop-filter: none; }}

    @media (max-width: 820px) {.mobile-workspace-controls { background: rgba(248, 250, 252, 0.78); border-bottom: 1px solid rgba(255, 255, 255, 0.5); box-shadow: var(--shadow-chrome);

    /* ── Selectores preparados para componentes futuros ─────────── */

    .delivery-progress,.target-cell {font-variant-numeric: tabular-nums;}
    /* Preparación para disclosures reutilizables. Actualmente el detalle expandido usa FeatureDeliveryDetails y mobile-feature-card__action-button, pero estas clases permitirán
    migrar futuras secciones colapsables sin inventar estilos nuevos. */
    .feature-detail-disclosure { transition: opacity var(--response-ui) var(--ease-ui), transform var(--response-ui) var(--ease-ui); }
    .disclosure-button,.sortable-header__button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .disclosure-button:active,.sortable-header__button:active { transform: scale(0.985); transition: transform var(--press) ease-out; }
    /* Preparación para migrar RoadmapLegend, que hoy utiliza estilos inline. Esta clase no tendrá efecto hasta que RoadmapLegend use: <div className="gantt-legend"> */
    .gantt-legend { margin-bottom: 8px; padding: 7px 12px; background: var(--surface-chrome); border: 1px solid var(--line-hairline); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
      backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); }
    /* Variante sólida para usuarios que solicitan menos transparencia. Se mantiene aunque .gantt-legend todavía no esté montado. */
    @media (prefers-reduced-transparency: reduce) { .gantt-legend { background: var(--surface-raised); backdrop-filter: none; -webkit-backdrop-filter: none; }}
    @media (prefers-reduced-motion: reduce) { .feature-detail-disclosure { transition: opacity 140ms ease; }
    .disclosure-button:active,.sortable-header__button:active { transform: none;}}
    /* ── Controles táctiles y feedback inmediato ────────────────── */
    .mobile-workspace-controls__nav-button,.mobile-workspace-controls__refresh,.mobile-workspace-controls__more-filters,.mobile-workspace-controls__select,.mobile-workspace-controls__input,
    .filters-card__toggle,.filters-card__clear-all-button,.filters-card__save-my-filter,.delivery-activity__team,.relationship-retry-button,.relationship-show-all-button,
    .story-linked-items-button,.refresh-button,.dashboard-results-state__action { touch-action: manipulation; -webkit-tap-highlight-color: transparent;}
    .mobile-workspace-controls__nav-button:active,.mobile-workspace-controls__refresh:active:not(:disabled),.mobile-workspace-controls__more-filters:active,
    .filters-card__clear-all-button:active:not(:disabled),.filters-card__save-my-filter:active,.relationship-retry-button:active,.relationship-show-all-button:active,
    .story-linked-items-button:active,.dashboard-results-state__action:active:not(:disabled) { transform: scale(0.985); transition: transform var(--press) ease-out;}
    @media (prefers-reduced-motion: reduce) {.mobile-workspace-controls__nav-button:active,.mobile-workspace-controls__refresh:active:not(:disabled),.mobile-workspace-controls__more-filters:active,
      .filters-card__clear-all-button:active:not(:disabled),.filters-card__save-my-filter:active,.relationship-retry-button:active,.relationship-show-all-button:active,
      .story-linked-items-button:active,.dashboard-results-state__action:active:not(:disabled) { transform: none; }}
    /* ── Barra de progreso segmentada ───────────────────────────── */
    .delivery-progress { display: grid; gap: 4px; min-width: 0; }
    .delivery-progress__header { display: flex; align-items: baseline; justify-content: center; gap: 5px; }
    .delivery-progress__percent { color: var(--text-primary); font-size: var(--step--1); font-weight: 700; }
    .delivery-progress__ratio { color: var(--text-tertiary); font-size: var(--step--2); }
    .delivery-progress__track { display: flex; gap: 1px; height: 7px; overflow: hidden; border-radius: var(--radius-chip); background: var(--line-hairline); }
    .delivery-progress__segment { min-width: 3px; /* Cuando llega storiesCache, el backend summary puede ser refinado.
      La transición hace que el cambio se perciba como el mismo objeto actualizándose, no como una barra completamente reemplazada. */
      transition: flex-grow var(--response-ui) var(--ease-ui); }
    /* Colores alineados con los estados ya utilizados por el Gantt: Closed = violeta; To Release = verde; In Progress = azul.
    In Planning es gris estructural porque todavía no representa ejecución activa. */
    .delivery-progress__segment--completed { background: #a78bfa; }
    .delivery-progress__segment--to-release { background: #34d399; }
    .delivery-progress__segment--in-progress { background: #60a5fa; }
    .delivery-progress__segment--in-planning { background: var(--line-strong); }
    .delivery-progress__flags { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    .delivery-progress__flag { font-size: var(--step--2); font-weight: 700; line-height: 1.2; }
    .delivery-progress__flag--warn { color: var(--warn); }
    .delivery-progress__none { color: var(--text-tertiary); font-size: var(--step--2); }
    /* ── Target Date: fecha absoluta + urgencia operativa ───────── */
    .target-cell { display: grid; gap: 1px; line-height: 1.25; min-width: 0; }
    .target-cell__date { color: var(--text-secondary); font-size: var(--step--1); }
    .target-cell__delta { font-size: var(--step--2); font-weight: 700; white-space: nowrap; }
    .target-cell--overdue .target-cell__delta,.target-cell--today .target-cell__delta { color: var(--risk); }
    .target-cell--near .target-cell__delta { color: var(--warn); }
    .target-cell--ok .target-cell__delta { color: var(--text-tertiary); }
    .target-cell--done .target-cell__delta { color: var(--ok); }
    .target-cell--none .target-cell__date { color: var(--text-tertiary); }
    /* Sólo el atraso merece un marcador fuerte en la fila. El indicador se proyecta ligeramente fuera de la celda para que pueda escanearse
      rápido sin convertir todos los estados en alertas visuales. */
    .target-cell--overdue { position: relative; }
    .target-cell--overdue::before { content: ''; position: absolute; top: -6px; bottom: -6px; left: -9px; width: 2px; border-radius: 1px; background: var(--risk); }
    /* Permite que el marcador de atraso se proyecte fuera de la celda sin afectar el resto de las columnas de la tabla. */
    .feature-list-date-cell:has(.target-cell--overdue) { overflow: visible; }
    /* ── Release Fix Version compacto en Feature List ──────────── */
    .release-fix-version-cell { display: grid; gap: 1px; min-width: 0; color: var(--text-secondary); font-size: var(--step--2); font-weight: 700; line-height: 1.2; text-align: left; }
    /* Cada tramo no se vuelve a cortar: ReleaseFixVersionCell ya divide el valor exactamente después de los primeros 13 caracteres. */
    .release-fix-version-cell__line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .release-fix-version-cell__empty { color: var(--text-tertiary); font-size: var(--step--1); }
    /* ── Target Date compacto en cards móviles ─────────────────── */

    .mobile-target-date__delta { font-size: var(--step--2); font-weight: 800; line-height: 1.25; white-space: nowrap; }
    .mobile-target-date--overdue .mobile-target-date__delta,.mobile-target-date--today .mobile-target-date__delta { color: var(--risk); }

    .mobile-feature-card__rfv { display: block; overflow: hidden; text-overflow: ellipsis; overflow-wrap: anywhere; white-space: normal; }

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { DateTime } = luxon;

    /* Fallback seguro antes de recibir /api/features. El backend devuelve dashboard.timeZone y reemplaza este valor durante la carga. 
    El fallback evita que haya un render inicial inconsistente si la respuesta todavía no llegó. */
    let dashboardTimeZone = 'America/Chicago';

    /* Este valor debe mantenerse alineado con targetDateNearDays en las reglas de Delivery Health del backend.
    Cuando /api/features exponga dashboard.thresholds.targetDateNearDays, este valor deberá actualizarse desde loadFeatures() para que UI y
    reglas del servidor compartan la misma fuente de verdad. */
    let targetDateNearDays = 14;
    
    function getDashboardNow() {
      return DateTime.now().setZone(dashboardTimeZone);
    }

    function getDashboardToday() {
      return getDashboardNow()
        .startOf('day')
        .toJSDate();
    }

    /*
      Interpreta YYYY-MM-DD como una fecha de negocio en Chicago.
      No se debe usar new Date('YYYY-MM-DD'), porque JavaScript trata
      esa forma como UTC y puede desplazar visualmente el día.
    */
    function parseDashboardDate(value) {
      if (!value) {
        return null;
      }

      const normalizedValue = String(value).trim();

      const parsed = /^\d{4}-\d{2}-\d{2}$/.test(normalizedValue)
        ? DateTime.fromISO(normalizedValue, {
            zone: dashboardTimeZone
          })
        : DateTime.fromISO(normalizedValue, {
            setZone: true
          }).setZone(dashboardTimeZone);

      return parsed.isValid
        ? parsed.toJSDate()
        : null;
    }

    function getDashboardDateTime(value) {
      const date = parseDashboardDate(value);

      return date
        ? DateTime.fromJSDate(date).setZone(dashboardTimeZone)
        : null;
    }

    /* Convierte Target Date a la unidad que realmente permite decidir: días restantes o días de retraso.
      No se usa la zona local del navegador: tanto la fecha objetivo como "today" se evalúan bajo dashboardTimeZone, que llega desde el backend. */
    function getTargetDateStatus(targetDate, featureState) {
      const target = getDashboardDateTime(targetDate);

      if (!target) {
        return {
          tone: 'none',
          days: null,
          text: 'No target date'
        };
      }

      const days = Math.round(
        target
          .startOf('day')
          .diff(
            getDashboardNow().startOf('day'),
            'days'
          )
          .days
      );

      /* Una Feature cerrada no debe aparecer como overdue aunque su fecha objetivo haya quedado atrás: visualmente ya representa entrega.  */
      if (String(featureState || '') === 'Closed') {
        return {
          tone: 'done',
          days,
          text: 'Delivered'
        };
      }

      if (days < 0) {
        const overdueDays = Math.abs(days);

        return {
          tone: 'overdue',
          days,
          text: `${overdueDays} day${overdueDays === 1 ? '' : 's'} overdue`
        };
      }

      if (days === 0) {
        return {
          tone: 'today',
          days,
          text: 'Due today'
        };
      }

      if (days <= targetDateNearDays) {
        return {
          tone: 'near',
          days,
          text: `in ${days} day${days === 1 ? '' : 's'}`
        };
      }

      return {
        tone: 'ok',
        days,
        text: `in ${days} day${days === 1 ? '' : 's'}`
      };
    }

    /* Celda reutilizable para Feature List. La fecha absoluta sigue visible para referencia y el texto inferior
      expresa urgencia en días, que es la unidad operativa útil. */
    function TargetDateCell({
      targetDate,
      featureState,
      formatDate
    }) {
      const status = getTargetDateStatus(
        targetDate,
        featureState
      );

      return (
        <div
          className={`target-cell target-cell--${status.tone}`}
          title={
            status.days === null
              ? 'No Target Date assigned'
              : `${formatDate(targetDate)} · ${status.text}`
          }
        >
          <span className="target-cell__date">
            {formatDate(targetDate)}
          </span>

          {status.days !== null && (
            <span className="target-cell__delta">
              {status.text}
            </span>
          )}
        </div>
      );
    }

    /* Versión compacta de Target Date para cards móviles. Reutiliza exactamente getTargetDateStatus(), por lo que desktop y
      móvil no pueden calcular distinto el estado de una misma fecha. */
    /* Target Date compacto para cards móviles. La fecha absoluta y el estado relativo comparten la misma línea:
      10/03/2026 · 3 days overdue
      getTargetDateStatus() sigue siendo la única fuente de verdad para desktop y móvil; sólo cambia la presentación visual. */
    function MobileTargetDateValue({
      targetDate,
      featureState,
      formatDate
    }) {
      const status = getTargetDateStatus(
        targetDate,
        featureState
      );

      if (status.days === null) {
        return (
          <span className="mobile-feature-card__info-value mobile-target-date--none">
            No target date
          </span>
        );
      }

      return (
        <span
          className={[
            'mobile-feature-card__info-value',
            'mobile-target-date',
            `mobile-target-date--${status.tone}`
          ].join(' ')}
          title={`${formatDate(targetDate)} · ${status.text}`}
        >
          <span className="mobile-target-date__date">
            {formatDate(targetDate)}
          </span>

          <span
            className="mobile-target-date__separator"
            aria-hidden="true"
          >
            ·
          </span>

          <span className="mobile-target-date__delta">
            {status.text}
          </span>
        </span>
      );
    }

    /* La columna de Release Fix Version está diseñada para permanecer compacta.*/
    function ReleaseFixVersionCell({ value }) {
      const releaseFixVersion = String(value || '').trim();

      if (!releaseFixVersion) {
        return (
          <span className="release-fix-version-cell__empty">
            —
          </span>
        );
      }

      const firstLine = releaseFixVersion.slice(0, 13);
      const secondLine = releaseFixVersion.slice(13);

      return (
        <span
          className="release-fix-version-cell"
          title={releaseFixVersion}
          aria-label={`Release Fix Version: ${releaseFixVersion}`}
        >

    function createDashboardDate(year, month, day = 1) {
      const date = DateTime.fromObject(
        { year, month: month + 1, day },
        { zone: dashboardTimeZone }
      );

      return date.isValid
        ? date.toJSDate()
        : null;
    }

    function addDashboardDays(date, days) {
      return DateTime
        .fromJSDate(date)
        .setZone(dashboardTimeZone)
        .plus({ days })
        .toJSDate();
    }

    function formatDashboardMonth(date, options = {}) {
      return DateTime
        .fromJSDate(date)
        .setZone(dashboardTimeZone)
        .setLocale('en-US')
        .toLocaleString({
          month: 'short',
          ...options
        });
    }

    /* El backend entrega el calendario validado en: /api/features -> dashboard.releaseCalendar.
    Se inicializa vacío para evitar errores durante el primer render, antes de que termine la carga. */
    let releaseCalendar = {};

    function getReleaseDate(releaseFixVersion) {
      return releaseCalendar?.[releaseFixVersion]?.date || null;
    }
    
    function getReleaseSequence(releaseFixVersion) {
      const sequence = releaseCalendar?.[releaseFixVersion]?.sequence;
    
      return Number.isInteger(sequence)
        ? sequence
        : null;
    }

   /* Delivery Health:
      La fuente de verdad preferida es feature.deliveryHealth, calculada por el backend. El frontend solamente asigna color, icono y clases
      CSS para renderizarla.

      La lógica antigua basada en deliverySummary se conserva por ahora como fallback temporal para respuestas cacheadas antiguas. */

    function getDeliveryVisualMeta(key) {
      switch (key) {
        case 'overdue':
        case 'target-date-near-unscheduled-discovery':
        case 'target-next-month-without-release':
          return {
            className: 'delivery--overdue',
            alertClassName: 'delivery-alert--overdue',
            icon: '!'
          };

        case 'needs-estimate':
          return {
            className: 'delivery--needs-info',
            alertClassName: 'delivery-alert--needs-info',
            icon: '!'
          };

        case 'healthy':
          return {
            className: 'delivery--healthy',
            alertClassName: 'delivery-alert--healthy',
            icon: '✓'
          };

       case 'not-started':
          return {
            className: 'delivery--not-started',
            alertClassName: 'delivery-alert--not-started',
            icon: '○'
          };

        case 'unable-to-evaluate':
          return {
            className: 'delivery--unknown',
            alertClassName: 'delivery-alert--unknown',
            icon: '?'
          };

        default:
          return {
            className: 'delivery--attention',
            alertClassName: 'delivery-alert--attention',
            icon: '!'
          };
      }
    }

    function getDeliveryHealthDisplayLabels(key, fallbackLabel) {
      if (key === 'needs-estimate') {
        return {
          label: 'Needs High Level Estimation',
          shortLabel: 'Needs HLE'
        };
      }
    
      return {
        label: fallbackLabel,
        shortLabel: fallbackLabel
      };
    }

    /*
      parseDashboardDate() se declara una sola vez al inicio del script.
      Usa Luxon y dashboardTimeZone para interpretar fechas operativas
      bajo America/Chicago.
    */

    /* Delivery Health es calculado exclusivamente por el backend.
      El frontend solo:
      - asigna estilos, iconos y clases CSS;
      - renderiza primary y alerts;
      - usa group para KPI y filtros. */

    function getDeliveryHealth(feature) {
      const primary = feature.deliveryHealth?.primary;

      /* Este caso no es un fallback de negocio: es una protección visual para una respuesta incompleta o inválida. */
      if (!primary || typeof primary !== 'object') {
        const visual = getDeliveryVisualMeta('unable-to-evaluate');

        return {
          key: 'unable-to-evaluate',
          label: 'Unable to evaluate',
          shortLabel: 'Unavailable',
          group: 'requires-attention',
          className: visual.className,
          icon: visual.icon,
          reason:
            'Delivery Health information was not returned by the server.',
          recommendedAction:
            'Refresh the dashboard and verify Azure DevOps availability.'
        };
      }

      const visual = getDeliveryVisualMeta(primary.key);

      const labels = getDeliveryHealthDisplayLabels(
        primary.key,
        primary.label
      );
      
      return {
        key: primary.key,
        label: labels.label,
        shortLabel:
          primary.key === 'needs-estimate'
            ? labels.shortLabel
            : (primary.shortLabel || labels.shortLabel),
        group: primary.group,
        className: visual.className,
        icon: visual.icon,
        reason: primary.reason,
        recommendedAction: primary.recommendedAction
      };
    }
    function getDeliveryHealthAlerts(feature) {
      const backendAlerts = feature.deliveryHealth?.alerts;

      /* El backend envía [] cuando no existen alertas aplicables, por ejemplo para un Feature Healthy o Not started. */
      if (!Array.isArray(backendAlerts)) {
        const visual = getDeliveryVisualMeta('unable-to-evaluate');

        return [{
          key: 'unable-to-evaluate',
          label: 'Unable to evaluate',
          group: 'requires-attention',
          className: visual.alertClassName,
          reason:
            'Delivery Health alert information was not returned by the server.',
          recommendedAction:
            'Refresh the dashboard and verify Azure DevOps availability.'
        }];
      }

      return backendAlerts.map(alert => {
        const visual = getDeliveryVisualMeta(alert.key);
      
        const labels = getDeliveryHealthDisplayLabels(
          alert.key,
          alert.label
        );
      
        return {
          key: alert.key,
          label: labels.label,
          group: alert.group,
          className: visual.alertClassName,
          reason: alert.reason,
          recommendedAction: alert.recommendedAction
        };
      });
    }

    // ── Tooltip global ──────────────────────────────────────────────
    function useTooltip() {
      const [tooltip, setTooltip] = React.useState({ visible: false, x: 0, y: 0, content: null });
      const showTooltip = React.useCallback((e, content) => {
        setTooltip({ visible: true, x: e.clientX, y: e.clientY, content });
      }, []);
      const moveTooltip = React.useCallback((e) => {
        setTooltip(prev => ({ ...prev, x: e.clientX, y: e.clientY }));
      }, []);
      const hideTooltip = React.useCallback(() => {
        setTooltip(prev => ({ ...prev, visible: false }));
      }, []);
      return { tooltip, showTooltip, moveTooltip, hideTooltip };
    }

    function Tooltip({ tooltip }) {
      if (!tooltip.visible || !tooltip.content) return null;
      const style = {
        position: 'fixed',
        left: tooltip.x + 14,
        top: tooltip.y - 10,
        background: 'rgba(15, 23, 42, 0.93)',
        color: 'white',
        padding: '8px 12px',
        borderRadius: '6px',
        fontSize: '11px',
        lineHeight: '1.6',
        pointerEvents: 'none',
        zIndex: 9999,
        maxWidth: '260px',
        boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
        whiteSpace: 'pre-wrap'
      };
      const adjustedLeft = tooltip.x + 14 + 260 > window.innerWidth
        ? tooltip.x - 274
        : tooltip.x + 14;
      return (
        <div style={{ ...style, left: adjustedLeft }}>
          {tooltip.content}
        </div>
      );
    }

    function getStorySprintInfo(iterationPath) {
      const rawIterationPath = String(iterationPath || '').trim();
    
      if (!rawIterationPath) {
        return {
          label: 'No Sprint assigned',
          hasAssignedSprint: false,
          start: null,
          end: null
        };
      }
    
      const sprintNumberMatch = rawIterationPath.match(
        /(?:^|_)(S\d+)(?:_|$)/i
      );
    
      const label = sprintNumberMatch
        ? sprintNumberMatch[1].toUpperCase()
        : 'Sprint assigned';
    
      const sprintRangeMatch = rawIterationPath.match(
        /(\d{4})_(S\d+)_([A-Za-z]+)(\d{1,2})-([A-Za-z]+)(\d{1,2})/
      );
    
      if (!sprintRangeMatch) {
        return {
          label,
          hasAssignedSprint: true,
          start: null,
          end: null
        };
      }
    
      const year = Number(sprintRangeMatch[1]);
    
      const monthMap = {
        jan: 0,
        feb: 1,
        mar: 2,
        apr: 3,
        may: 4,
        jun: 5,
        jul: 6,
        aug: 7,
        sep: 8,
        oct: 9,
        nov: 10,
        dec: 11
      };
    
      const startMonth = monthMap[
        sprintRangeMatch[3].slice(0, 3).toLowerCase()
      ];
    
      const endMonth = monthMap[
        sprintRangeMatch[5].slice(0, 3).toLowerCase()
      ];
    
      const startDay = Number(sprintRangeMatch[4]);
      const endDay = Number(sprintRangeMatch[6]);
    
      if (
        !Number.isInteger(year) ||
        startMonth === undefined ||
        endMonth === undefined ||
        !Number.isInteger(startDay) ||
        !Number.isInteger(endDay)
      ) {
        return {
          label,
          hasAssignedSprint: true,
          start: null,
          end: null
        };
      }
    
      const endYear = endMonth < startMonth
        ? year + 1
        : year;
    
      return {
        label,
        hasAssignedSprint: true,
        start: createDashboardDate(year, startMonth, startDay),
        end: createDashboardDate(endYear, endMonth, endDay)
      };
    }
    
    function StoryRow({ storyId, title, storyPoints, state, iterationPath, formatDate, timelineStart, timelineEnd, adoLink, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const today = getDashboardToday();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);
      const todayPercent = ((today - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
      const clampedTodayPercent = Math.max(0, Math.min(100, todayPercent));

      const segments = [];
      if (states.length > 0) {
        states.forEach((st, idx) => {
          const stateStart = parseDashboardDate(st.changedDate);
          const stateEnd = idx === states.length - 1
            ? today
            : parseDashboardDate(states[idx + 1].changedDate);

          if (!stateStart || !stateEnd) {
            return;
          }

          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            segments.push({
              color: storyStateColors[st.state] || '#cccccc',
              state: st.state,
              startPercent: clampedStart,
              widthPercent: Math.max(1, clampedEnd - clampedStart)
            });
          }
        });
      }

      const sprintInfo = getStorySprintInfo(iterationPath);
      const sprintStart = sprintInfo.start;
      const sprintEnd = sprintInfo.end;
      const sprintLabel = sprintInfo.label;
      const getSprintPercent = (date) => {
        const days = (date - timelineStart) / (1000 * 60 * 60 * 24);
        return (days / timelineTotalDays) * 100;
      };

      let sprintStartPercent = null;
      let sprintEndPercent = null;
      let sprintMidPercent = null;
      let isSprintFullyVisible = false;
      
      if (sprintStart && sprintEnd) {
        const rawStart = getSprintPercent(sprintStart);
        const rawEnd = getSprintPercent(sprintEnd);
      
        /*
          Sólo se dibujan las dos líneas cuando el Sprint completo
          cabe dentro de la ventana de 12 semanas.
        */
        if (rawStart >= 0 && rawEnd <= 100) {
          sprintStartPercent = rawStart;
          sprintEndPercent = rawEnd;
          sprintMidPercent =
            (sprintStartPercent + sprintEndPercent) / 2;
      
          isSprintFullyVisible = true;
        }
      }

      return (
        <tr style={{ borderBottom: '1px solid #eee', background: '#f2f2f2' }}>
          <td></td>
          <td>
            <a href={adoLink(storyId)} target="_blank" rel="noopener noreferrer">
              {storyId}
            </a>
          </td>
          <td style={{ maxWidth: '300px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span title={title} style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', flex: '0 1 auto', minWidth: '0' }}>{title}</span>
              <span
                style={{
                  color: storyPoints === null || storyPoints === undefined ? 'var(--risk)' : '#696969',
                  flexShrink: 0,
                  fontSize: '11px',
                  fontWeight: storyPoints === null || storyPoints === undefined ? 'bold' : 'normal'
                }}
              >
                ({storyPoints ?? 'No data'}{storyPoints !== null && storyPoints !== undefined ? ' pts' : ''})
              </span>
            </div>
          </td>
          <td style={{ padding: '6px 8px' }}>
            <div style={{ height: '36px', background: '#e0e0e0', borderRadius: '4px', overflow: 'hidden', position: 'relative' }}>
              {!loading && segments.map((seg, idx) => {
                const segStartDate = new Date(timelineStart.getTime() + (seg.startPercent / 100) * (timelineEnd - timelineStart));
                const segEndDate = new Date(timelineStart.getTime() + ((seg.startPercent + seg.widthPercent) / 100) * (timelineEnd - timelineStart));
                const diffDays = Math.round((segEndDate - segStartDate) / (1000 * 60 * 60 * 24));
                const tooltipContent = (
                <div>
                  <div style={{ fontWeight: 'bold', marginBottom: '4px', color: seg.color, fontSize: '12px' }}>
                    ● {seg.state}
                  </div>

                  <div>
                    From: {segStartDate.toLocaleDateString(
                      'es-CO',
                      { timeZone: dashboardTimeZone }
                    )}
                  </div>

                  <div>
                    To:&nbsp;&nbsp; {segEndDate.toLocaleDateString(
                      'es-CO',
                      { timeZone: dashboardTimeZone }
                    )}
                  </div>

                  <div style={{ marginTop: '4px', color: '#94a3b8' }}>
                    {diffDays} day{diffDays !== 1 ? 's' : ''} in this state
                  </div>
                </div>
                );
                return (
                  <div
                    key={idx}
                    style={{ position: 'absolute', top: '8px', left: seg.startPercent + '%', width: seg.widthPercent + '%', height: '20px', background: seg.color, borderRadius: '3px', opacity: 0.85, minWidth: '6px', cursor: 'pointer', zIndex: 2 }}
                    onMouseEnter={(e) => showTooltip && showTooltip(e, tooltipContent)}
                    onMouseMove={(e) => moveTooltip && moveTooltip(e)}
                    onMouseLeave={() => hideTooltip && hideTooltip()}
                  />
                );
              })}
              {loading && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>Loading...</div>
              )}
              {!loading && segments.length === 0 && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>No data</div>
              )}
              {!loading && isSprintFullyVisible && (
                <>
                  <div
                    style={{ position: 'absolute', top: 0, bottom: 0, left: `${sprintStartPercent}%`, width: '1px', borderLeft: '1px dashed #123770', 
                      zIndex: 5, pointerEvents: 'none' }}
                  />
              
                  <div
                    style={{ position: 'absolute', top: 0, bottom: 0, left: `${sprintEndPercent}%`, width: '1px', borderLeft: '1px dashed #123770', 
                      zIndex: 5, pointerEvents: 'none' }}
                  />
              
                  <div
                    style={{ position: 'absolute', top: '2px', left: `${sprintMidPercent}%`, transform: 'translateX(-50%)', padding: '1px 5px', 
                      borderRadius: '2px', background: '#123770', color: 'var(--surface-raised)', fontSize: '9px', fontWeight: '700', lineHeight: '1.2', 
                      whiteSpace: 'nowrap', zIndex: 8, pointerEvents: 'none' }}
                  >
                    {sprintLabel}
                  </div>
                </>
              )}
              
              {!loading &&
              sprintInfo.hasAssignedSprint &&
              !isSprintFullyVisible && (
                <div
                  style={{ position: 'absolute', top: '2px', left: '6px', padding: '1px 5px', borderRadius: '2px', background: '#123770', color: 'var(--surface-raised)',
                    fontSize: '9px', fontWeight: '700', lineHeight: '1.2', zIndex: 8, pointerEvents: 'none' }}
                  title={`Assigned Sprint: ${sprintLabel}`}
                >
                  {sprintLabel}
                </div>
              )}
              {!loading && (
                <div style={{ position: 'absolute', top: 0, bottom: 0, left: clampedTodayPercent + '%', width: '1px', background: '#1e3a8a', opacity: 0.9, 
                  zIndex: 10, pointerEvents: 'none' }} 
                />
              )}
            </div>
          </td>
        </tr>
      );
    }

    function FeatureRow({ featureId, title,  assignedTo, targetDate, releaseFixVersion, techGoLiveRFV, estimation, priority, formatDate, timelineStart, timelineEnd, adoLink, isExpanded, onToggleExpand, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const stateColors = {
        'New': '#94a3b8',
        'In Shaping': '#fbbf24',
        'In Planning': '#fb923c',
        'Planned': '#34d399',
        'In Process': '#60a5fa',
        'Closed': '#a78bfa'
      };

      const today = getDashboardToday();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);

      const segments = [];
      if (states.length > 0) {
        states.forEach((state, idx) => {
          const stateStart = parseDashboardDate(state.changedDate);
          const stateEnd = idx === states.length - 1
            ? today
            : parseDashboardDate(states[idx + 1].changedDate);

          if (!stateStart || !stateEnd) {
            return;
          }
          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            const widthPercent = Math.max(1, clampedEnd - clampedStart);
            segments.push({
              color: stateColors[state.state] || '#cccccc',
              state: state.state,
              startPercent: clampedStart,
              widthPercent: widthPercent
            });
          }
        });
      }

      return (
        <tr
          className={[
            'roadmap-feature-row--expandable',
            isExpanded ? 'roadmap-feature-row--expanded' : ''
          ].filter(Boolean).join(' ')}
          style={{
            borderBottom: '1px solid #eee',
            background: isExpanded ? '#f2f7ff' : 'transparent'
          }}
          onClick={onToggleExpand}
          onKeyDown={(event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              onToggleExpand();
            }
          }}
          role="button"
          tabIndex="0"
          aria-expanded={isExpanded}
          aria-label={
            isExpanded
              ? `Collapse timeline for Feature ${featureId}`
              : `Expand timeline for Feature ${featureId}`
          }
        >
          <td style={{ width: '36px', textAlign: 'center', fontSize: '12px', fontWeight: 'bold', color: priority ? '#1e3a8a' : '#ccc' }}>
            {priority || '—'}
          </td>
          <td>
            <a href={adoLink(featureId)} target="_blank" rel="noopener noreferrer" onClick={(event) => event.stopPropagation()}
              onKeyDown={(event) => event.stopPropagation()}
              aria-label={`Open Feature ${featureId} in Azure DevOps`}>
              {featureId}
            </a>
          </td>
          <td
            style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '300px', cursor: 'default' }}
            onMouseEnter={(e) => showTooltip && showTooltip(e, (
              <div>
                <div style={{ marginBottom: '6px', maxWidth: '240px', whiteSpace: 'normal', lineHeight: '1.4' }}>{title}</div>
                <div style={{ color: '#94a3b8', fontSize: '10px' }}>👤 Assigned to: {getShortAssignedToName(assignedTo)}</div>
                {targetDate && <div style={{ color: '#94a3b8', fontSize: '10px', marginTop: '2px' }}>🎯 Target: {formatDate(targetDate)}</div>}
                {releaseFixVersion && <div style={{ color: '#94a3b8', fontSize: '10px', marginTop: '2px' }}>🚀 RFV: {releaseFixVersion}</div>}
                {techGoLiveRFV && ( <div style={{ color: '#94a3b8', fontSize: '10px', marginTop: '2px' }}>📣 Tech Go Live: {techGoLiveRFV}</div>)}
              </div>
            ))}
            onMouseMove={(e) => moveTooltip && moveTooltip(e)}
            onMouseLeave={() => hideTooltip && hideTooltip()}
          >{title}</td>
          <td style={{ padding: '4px 6px', overflow: 'hidden' }}>
            <div style={{ minHeight: '32px', background: isExpanded ? '#e0e0e0' : '#f9f9f9', borderRadius: '4px', padding: '0', overflow: 'hidden', position: 'relative' }}>
              {!loading && (() => {
                const todayPercent = ((today - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
                if (todayPercent < 0 || todayPercent > 100) return null;
                return <div style={{ position: 'absolute', top: '0', bottom: '0', left: todayPercent + '%', width: '1px', background: '#1e3a8a', opacity: 0.9, zIndex: 10 }} />;
              })()}
              {!loading && targetDate && (() => {
                const target = parseDashboardDate(targetDate);
                  if (!target) { return null;}
          
                const targetPercent = ((target - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
                if (targetPercent < 0 || targetPercent > 100) return null;
                return (
                  <div style={{ position: 'absolute', top: '-4px', left: targetPercent + '%', transform: 'translateX(-50%)', zIndex: 11, 
                    width: '0', height: '0', borderLeft: '8px solid transparent', borderRight: '8px solid transparent', borderTop: '12px solid #f43f5e' }} 
                    title={'Target: ' + formatDate(targetDate)} />
                );
              })()}
              {/* Release Fix Version: diamante azul */}
              {!loading &&
                releaseFixVersion &&
                getReleaseDate(releaseFixVersion) &&
                (() => {
                  const releaseDate = parseDashboardDate(
                    getReleaseDate(releaseFixVersion)
                  );
              
                  if (!releaseDate) {
                    return null;
                  }
              
                  const releasePercent =
                    ((releaseDate - timelineStart) /
                      (1000 * 60 * 60 * 24) /
                      timelineTotalDays) *
                    100;
              
                  if (releasePercent < 0 || releasePercent > 100) {
                    return null;
                  }
              
                  return (
                    <div
                      style={{
                        position: 'absolute',
                        top: '55%',
                        left: `${releasePercent}%`,
                        transform: 'translate(-50%, -50%) rotate(45deg)',
                        zIndex: 12,
                        width: '10px',
                        height: '10px',
                        background: '#1e3a8a',
                      }}
                      title={
                        `Release Fix Version: ${releaseFixVersion} · ` +
                        formatDate(getReleaseDate(releaseFixVersion))
                      }
                    />
                  );
                })()}
              
              {/* Tech Go Live RFV: estrella amarilla */}
              {!loading &&
                techGoLiveRFV &&
                getReleaseDate(techGoLiveRFV) &&
                (() => {
                  const techGoLiveDate = parseDashboardDate(
                    getReleaseDate(techGoLiveRFV)
                  );
              
                  if (!techGoLiveDate) {
                    return null;
                  }
              
                  const techGoLivePercent =
                    ((techGoLiveDate - timelineStart) /
                      (1000 * 60 * 60 * 24) /
                      timelineTotalDays) *
                    100;
              
                  if (
                    techGoLivePercent < 0 ||
                    techGoLivePercent > 100
                  ) {
                    return null;
                  }
              
                  const isSameDateAsRelease =
                    releaseFixVersion &&
                    getReleaseDate(releaseFixVersion) ===
                      getReleaseDate(techGoLiveRFV);
              
                  return (
                    <span
                      style={{
                        position: 'absolute',
                        top: '55%',
                        left: `${techGoLivePercent}%`,
                        transform: isSameDateAsRelease
                          ? 'translate(calc(-50% + 11px), calc(-50% - 7px))'
                          : 'translate(-50%, -50%)',
                        zIndex: 13,
                        color: '#f59e0b',
                        fontSize: '17px',
                        fontWeight: '700',
                        lineHeight: '1',
                        textShadow:
                          '0 0 1px #78350f, 0 1px 2px rgba(15, 23, 42, 0.45)',
                      }}
                      title={
                        `Tech Go Live RFV: ${techGoLiveRFV} · ` +
                        formatDate(getReleaseDate(techGoLiveRFV))
                      }
                    >
                      ★
                    </span>
                  );
                })()}
              {loading ? (
                <span style={{ fontSize: '11px', color: '#999' }}>Loading...</span>
              ) : segments.length === 0 ? (
                <span style={{ fontSize: '11px', color: '#999' }}>No data</span>
              ) : (
                <div style={{ width: '100%', position: 'relative', height: '20px' }}>
                  {segments.map((seg, idx) => {
                    const est = estimation || {};
                    const tooltipContent = (
                      <div>
                        <div style={{ fontWeight: 'bold', color: seg.color, marginBottom: '6px', fontSize: '12px' }}>● {seg.state}</div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '6px', textAlign: 'center' }}>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>BE</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.be || '—'}</div></div>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>FE</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.fe || '—'}</div></div>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>QA</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.qa || '—'}</div></div>
                        </div>
                      </div>
                    );
                    return (
                      <div
                        key={idx}
                        style={{ position: 'absolute', left: seg.startPercent + '%', width: seg.widthPercent + '%', height: '28px', background: seg.color, borderRadius: '3px', opacity: 0.85, minWidth: '6px', cursor: 'pointer' }}
                        onMouseEnter={(e) => showTooltip && showTooltip(e, tooltipContent)}
                        onMouseMove={(e) => moveTooltip && moveTooltip(e)}
                        onMouseLeave={() => hideTooltip && hideTooltip()}
                      />
                    );
                  })}
                </div>
              )}
            </div>
          </td>
        </tr>
      );
    }

    /*
      ───────────────────────────────────────────────────────────────
      COMPONENTES MÓVILES
      ───────────────────────────────────────────────────────────────

      Desktop/tablet conserva las tablas actuales.

      En móvil se renderizan cards independientes para no depender de:
      - tablas de 12 columnas;
      - min-width de 1180px;
      - scroll horizontal general;
      - alturas internas que bloquean el scroll vertical.
    */

    function MobileDeliveryBadge({ feature }) {
      const delivery = getDeliveryHealth(feature);

      return (
        <span
          className={`delivery-badge ${delivery.className}`}
          aria-label={`Delivery health: ${delivery.label}`}
          title={`Delivery health: ${delivery.label}`}
        >
          <span
            className="delivery-badge__icon"
            aria-hidden="true"
          >
            {delivery.icon}
          </span>

          <span className="delivery-badge__label">
            {delivery.shortLabel}
          </span>
        </span>
      );
    }

    function getFeatureStateColor(state) {
      return {
        New: '#94a3b8',
        'In Shaping': '#fbbf24',
        'In Planning': '#fb923c',
        Planned: '#34d399',
        'In Process': '#60a5fa',
        Closed: '#a78bfa'
      }[state] || '#94a3b8';
    }

    function MobileFeatureCardHeader({
      feature,
      adoLink,
      formatDate,
      isExpanded,
      onToggle,
      expandLabel,
      collapseLabel,
      children
    }) {
      const featureStateColor = getFeatureStateColor(feature.state);
    
      const detailsId =
        `mobile-feature-details-${feature.id}`;
    
      const actionLabel = isExpanded
        ? collapseLabel
        : expandLabel;
    
      return (
        <div className="mobile-feature-card__header">
          <div className="mobile-feature-card__meta-row">
            <div className="mobile-feature-card__identity">
              <span
                className="mobile-feature-card__priority"
                title="Priority"
              >
                {feature.priority || '—'}
              </span>
    
              <a
                href={adoLink(feature.id)}
                target="_blank"
                rel="noopener noreferrer"
                className="mobile-feature-card__id-link"
                aria-label={`Open Feature ${feature.id} in Azure DevOps`}
              >
                #{feature.id}
              </a>
            </div>
          </div>
    
          <span className="mobile-feature-card__title">
            {feature.title || 'Untitled Feature'}
          </span>
    
          <div className="mobile-feature-card__state-row">
            <span
              className="mobile-feature-card__state-dot"
              style={{
                background: featureStateColor
              }}
            />
    
            <span>{feature.state || 'No state'}</span>
          </div>
    
          <div className="mobile-feature-card__info-grid">
            <div className="mobile-feature-card__info-item">
              <span className="mobile-feature-card__info-label">
                Owner
              </span>
    
              <span
                className={[
                  'mobile-feature-card__info-value',
                  'mobile-feature-card__info-value--wrap'
                ].join(' ')}
                title={getShortAssignedToName(feature.assignedTo)}
              >
                {getShortAssignedToName(feature.assignedTo)}
              </span>
            </div>
    
            <div className="mobile-feature-card__info-item">
              <span className="mobile-feature-card__info-label">
                Estimates
              </span>
    
              <span className="mobile-feature-card__info-value">
                BE {feature.estimation?.be || '—'} · FE{' '}
                {feature.estimation?.fe || '—'} · QA{' '}
                {feature.estimation?.qa || '—'}
              </span>
            </div>
    
            <div className="mobile-feature-card__info-item">
              <span className="mobile-feature-card__info-label">
                Target Date
              </span>

              <MobileTargetDateValue
                targetDate={feature.targetDate}
                featureState={feature.state}
                formatDate={formatDate}
              />
            </div>
    
            <div className="mobile-feature-card__info-item">
              <span className="mobile-feature-card__info-label">
                Release Fix Version
              </span>
    
              <span
                className="mobile-feature-card__info-value"
                title={feature.releaseFixVersion || 'Not assigned'}
              >
                {feature.releaseFixVersion || '—'}
              </span>
            </div>
          </div>
    
          <div className="mobile-feature-card__badges">
            <ReadinessBadge
              readiness={getFeatureReadiness(feature)}

            <MobileDeliveryBadge feature={feature} />

          {children}
    
          <button
            type="button"
            className={[
              'mobile-feature-card__action-button',
              isExpanded
                ? 'mobile-feature-card__action-button--expanded'
                : ''
            ]
              .filter(Boolean)
              .join(' ')}
            onClick={onToggle}
            aria-expanded={isExpanded}
            aria-controls={detailsId}
            title={actionLabel}
          >
            <span>{actionLabel}</span>
    
            <span
              className="mobile-feature-card__action-icon"
              aria-hidden="true"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2.8"
                strokeLinecap="round"
                strokeLinejoin="round"
              >
                <path d="m6 9 6 6 6-6" />
