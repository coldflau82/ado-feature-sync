<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ADO DEC Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Luxon se usa para que el navegador interprete todas las fechas operativas en la misma zona oficial del backend. -->
  <script src="https://unpkg.com/luxon@3.7.2/build/global/luxon.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    .header h1 { font-size: 24px; }
    .tabs { margin-top: 12px; display: flex; gap: 10px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .tab-btn { padding: 8px 16px; background: white; color: black; border: none; cursor: pointer; border-radius: 4px; font-size: 13px; }
    .tab-btn.active { background: #007bff; color: white; }
    .warnings { position: relative; background: #fff3cd; color: #856404; padding: 15px 46px 15px 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffc107;}
    .warnings__close-button { position: absolute; top: 8px; right: 9px; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 4px;
      background: transparent; color: #856404; cursor: pointer; font-family: inherit; font-size: 22px; font-weight: 700; line-height: 1; display: inline-flex;
      align-items: center; justify-content: center; transition: background 0.15s ease, color 0.15s ease; }
    .warnings__close-button:hover { background: rgba(133, 100, 4, 0.12); color: #5f4703; }
    .warnings__close-button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.35); outline-offset: 2px; }
    .filters { display: grid; gap: 15px; background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; overflow-x: auto; }
    .filter-div { }
    .filter-label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
    .filter-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .filter-count { font-size: 11px; color: #666; margin-top: 5px; }
    .clear-btn { width: 100%; padding: 10px 16px; background: #dc3545; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; margin-bottom: 12px; }
    .table-wrapper { background: white; border-radius: 8px; overflow: visible; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f9f9f9; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #eee; font-size: 13px; }
    td { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; }
    tr:hover { background: #f5f5f5; }
    a { color: #007bff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .readiness-overview { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 9px; margin: 0; } 
    .readiness-overview-card { width: 130px; min-width: 130px; height: 58px; min-height: 58px; padding: 8px 11px; border: 1px solid #e2e8f0; border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); cursor: pointer; transition:   transform 0.15s ease,   box-shadow 0.15s ease,   border-color 0.15s ease; text-align: left; overflow: hidden; }
    .readiness-overview-card:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08); }
    .readiness-overview-card--active { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.16); } 
    .readiness-overview-card__label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #475569; white-space: nowrap; } 
    .readiness-overview-card__count { display: block; margin-top: 4px; font-size: 22px; line-height: 1; font-weight: 700; color: #1e293b; } 
    .readiness-overview-card--ready { background: #f0fdf4; border-color: #86efac; }
    .readiness-overview-card--ready .readiness-overview-card__label { color: #166534; }
    .readiness-overview-card--needs-info { background: #fff7ed; border-color: #fb923c; }
    .readiness-overview-card--needs-info .readiness-overview-card__label { color: #9a3412; }
    .readiness-overview-card--unknown { background: #f8fafc; border-color: #cbd5e1; }
    .readiness-overview-card--unknown .readiness-overview-card__label { color: #475569; } 
    .health-overview { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 9px; margin: 0;}
    .health-overview-card {  width: 130px; min-width: 130px; height: 58px; min-height: 58px; padding: 8px 11px; border: 1px solid #e2e8f0; border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); text-align: left; overflow: hidden; }
    .health-overview-card__label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .health-overview-card__count { display: block; margin-top: 4px; font-size: 22px; line-height: 1; font-weight: 700; color: #1e293b; }
    .health-overview-card--action { background: #fef2f2; border-color: #fca5a5; }
    .health-overview-card--action .health-overview-card__label { color: #991b1b; }
    .health-overview-card--attention { background: #fef3c7; border-color: #fbbf24; }
    .health-overview-card--attention .health-overview-card__label { color: #854d0e; }
    .health-overview-card--healthy { background: #f0fdf4; border-color: #86efac; }
    .health-overview-card--healthy .health-overview-card__label { color: #166534; }
    .health-overview-card:hover { border-color: #94a3b8; transform: translateY(-1px); }
    .health-overview-card--selected { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18); }
    .health-overview-card:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .readiness-filter { min-width: 165px; }
    /* Base compartida de los badges de Readiness y Delivery Health. Las clases readiness--* y delivery--* sólo definen colores específicos por estado; 
    estas clases definen la forma, espaciado y alineación visual. */
    .readiness-badge, .delivery-badge { display: inline-flex; align-items: center; justify-content: center; gap: 4px; max-width: 100%; padding: 3px 6px 3px 4px;
      border-radius: 999px; font-size: 10px; font-weight: 700; line-height: 1.2; white-space: nowrap; vertical-align: middle; }
    .readiness-badge__icon, .delivery-badge__icon { width: 14px;  height: 14px; flex: 0 0 14px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; color: #ffffff; font-size: 9px; font-weight: 700; line-height: 1; }
    .readiness-badge__label, .delivery-badge__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* En las celdas de la tabla, permite que badges largos como "Unable to validate" o "Needs HLE" sigan siendo legibles sin alterar el layout de las columnas. */
    .feature-list-centered-cell .readiness-badge,.feature-list-centered-cell .delivery-badge { max-width: 100%; }
    .readiness--ready { color: #166534; background: #dcfce7; }
    .readiness--ready .readiness-badge__icon { color: white; background: #16a34a; }
    .readiness--needs-info { color: #9a3412; background: #ffedd5; }
    .readiness--needs-info .readiness-badge__icon { color: white; background: #ea580c; }
    .readiness--unknown { color: #475569; background: #e2e8f0; }
    .readiness--unknown .readiness-badge__icon { color: white; background: #64748b; }
    .delivery--overdue { color: #991b1b; background: #fee2e2; } 
    .delivery--overdue .delivery-badge__icon { background: #dc2626; }
    .delivery--needs-info { color: #9a3412; background: #ffedd5; } 
    .delivery--needs-info .delivery-badge__icon { background: #ea580c; } 
    .delivery--attention { color: #854d0e; background: #fef9c3; }
    .delivery--attention .delivery-badge__icon { background: #ca8a04; } 
    .delivery--healthy { color: #166534; background: #dcfce7; } 
    .delivery--healthy .delivery-badge__icon { background: #16a34a; } 
    .delivery--not-started { color: #1e40af; background: #dbeafe; } 
    .delivery--not-started .delivery-badge__icon { background: #2563eb; } 
    .delivery--unknown { color: #475569; background: #e2e8f0; } 
    .delivery--unknown .delivery-badge__icon { background: #64748b; }
    .feature-list-tooltip { min-width: 220px; max-width: 340px;font-size: 12px; line-height: 1.45; }
    .feature-list-tooltip strong { display: block; margin-bottom: 3px; font-size: 12px; }
    .feature-list-tooltip__detail { padding-left: 12px; }
    .feature-list-tooltip__subdetail { padding-left: 24px; }
    .feature-list-tooltip__metric { margin-top: 3px; padding-left: 12px; color: #cbd5e1; font-size: 11px; }
    .feature-list-tooltip__warning { padding-left: 12px; color: #b45309; font-size: 11px; }
    /* FEATURE LIST Esta tabla debe ocupar el ancho disponible del dashboard, sin necesitar scroll horizontal. */
    .feature-list-table-wrapper { width: 100%; margin-bottom: 0; overflow: visible; font-size: 11px}
    .feature-list-table { width: 100%;  min-width: 0; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
    /* Anchos compactos para que las doce columnas se vean completas en el área disponible de una pantalla laptop/desktop.
       ID y Feature reciben espacio adicional para mostrar IDs de 7–8 dígitos y más texto del título. */
    .feature-list-col--id { width: 7%; }
    .feature-list-col--title { width: 26%; }
    .feature-list-col--priority { width: 5%; }
    .feature-list-col--target-date { width: 7%; }
    .feature-list-col--planned-month { width: 8%; }
    .feature-list-col--estimate { width: 4%; }
    .feature-list-col--state { width: 10%; }
    .feature-list-col--readiness { width: 11%; }
    .feature-list-col--delivery { width: 12%; }
    .feature-list-col--progress { width: 10%; }
    .feature-list-table th, .feature-list-table td { padding: 8px 7px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }
    .feature-list-table th { white-space: nowrap; font-size: 11px; }
    .feature-list-table td { white-space: nowrap; }
    /* El título puede reducirse con ellipsis, pero el texto completo queda disponible en el tooltip que ya usa FeatureTooltipContent.*/
    .feature-list-title-cell { min-width: 0; }
    /* El header permanece visible al hacer scroll vertical dentro de: .dashboard-results-scroll */
    .dashboard-results-scroll .feature-list-table thead th { position: sticky; top: 0; z-index: 50; background: #f9f9f9; box-shadow: 0 2px 4px rgba(15, 23, 42, 0.12); }
    /* Estado: punto de color + nombre del estado. Además de esta indicación, la fila conserva su línea de color izquierda según el estado. */
    .feature-state-cell { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .feature-state-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; display: inline-block; }
    .feature-list-date-cell { font-size: 11px; }
    .feature-list-centered-cell { text-align: center; padding: 8px !important; }
    .feature-list-progress-cell { text-align: center; padding: 8px !important; white-space: normal !important; }
    .feature-list-progress-label { font-size: 10px; color: #666; margin-bottom: 3px; white-space: nowrap; }
    .feature-list-progress-track { height: 6px; width: 100%; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
    .feature-list-progress-bar { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
    .feature-list-progress-loading { font-size: 10px; color: #aaa; font-style: italic; }
    .feature-list-progress-empty { font-size: 10px; color: #bbb; }
    /* Paneles de Readiness y Delivery Health. History ya no forma parte de Feature List. */
    .feature-detail-panel { background: #f8fafc; border: 1px solid #dbe4ee; border-radius: 8px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); }
    .feature-detail-panel-message { padding: 10px 0; font-size: 12px; color: #64748b; }
    .feature-detail-panel-warning { padding: 10px 0; font-size: 12px; color: #b45309; }
   /* .feature-stories-panel__divider { height: 1px; background: #dbe4ee; margin: 14px 0 12px; } */
    .feature-story-card__assigned-to { color: #475569; font-size: 10px; }
    .delivery-details { margin: 0; } 
    .delivery-details__title { color: #1e293b; font-size: 13px; } 
    .delivery-details__summary { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
    .delivery-details__metric { appearance: none; padding: 4px 7px; border: 1px solid transparent; border-radius: 999px; background: #f1f5f9; color: #475569; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; line-height: 1.2; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
    .delivery-details__metric:hover { background: #e2e8f0; border-color: #cbd5e1; }
    .delivery-details__metric--active { background: #dbeafe; border-color: #60a5fa; color: #1d4ed8; }
    .delivery-details__metric:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .delivery-work-group { margin-top: 14px; } 
    .delivery-work-group__title { margin-bottom: 8px; color: #334155; font-size: 12px; } 
    .delivery-work-group__empty { padding: 8px 10px; border: 1px dashed #cbd5e1; border-radius: 5px; color: #64748b; font-size: 11px; }
    .delivery-work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
    .refresh-button { width: 40px; height: 40px; min-width: 40px; border: 0; border-radius: 6px; background: #4f7fc4; color: #fff; cursor: pointer;  display: inline-flex; align-items: center; justify-content: center;  transition: background 0.15s ease, transform 0.15s ease; }
    .refresh-button span { font-size: 23px; line-height: 1; font-weight: 500; }
    .refresh-button:hover:not(:disabled) { background: #3e6eaf; }
    .refresh-button:active:not(:disabled) { transform: scale(0.96); }
    .refresh-button:focus-visible { outline: 3px solid rgba(79, 127, 196, 0.35); outline-offset: 2px; }
    .refresh-button:disabled { opacity: 0.65; cursor: wait; }
    .refresh-button--loading span { animation: refresh-spin 0.85s linear infinite; }
    @keyframes refresh-spin { to { transform: rotate(360deg); }}
    .clear-filters-button { width: 68px; min-width: 68px; height: 40px; padding: 4px 6px; border: 0; border-radius: 6px; background: #dc3545; color: white; cursor: pointer;
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; font-size: 11px; font-weight: 700; line-height: 12px; text-align: center; 
      transition: background 0.15s ease, transform 0.15s ease; }
    .clear-filters-button:hover { background: #bd2130; }
    .clear-filters-button:active { transform: scale(0.97); }
    .clear-filters-button:focus-visible { outline: 3px solid rgba(220, 53, 69, 0.28); outline-offset: 2px; }
    .top-filters-bar  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;  overflow-x: auto; overflow-y: hidden; background: #fff; padding: 10px 14px; border-radius: 8px; margin-bottom: 0px; }
    .top-filters-main { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; }
    .top-filter-group { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; min-width: 0; }
    .top-filter-group .filter-label { margin: 0; white-space: nowrap; font-size: 13px }
    .top-filter-group .filter-select { min-height: 34px; padding: 6px 28px 6px 8px; font-size: 12px; }
    .top-filter-search { width: 31ch; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    .top-filter-readiness { width: 145px; }
    .top-filter-delivery-health { width: 220px; }
    .cache-info { width: 72px; min-width: 72px; color: #888; font-size: 10px; line-height: 1.2; text-align: center; }
    .cache-info strong { display: block; color: #64748b; font-size: 10px; font-weight: 700; }
    @media (max-width: 1150px) { .top-filters-bar { justify-content: flex-start; }}
    /* Navegación principal: Feature List / Roadmap */
    .view-switcher { display: inline-flex; grid-template-columns: repeat(2, minmax(128px, 1fr)); gap: 8px; align-items: stretch; }
    /* ── Navegación principal: Feature List / Roadmap ── */
    /* Esta regla define solamente la apariencia compartida. Los tamaños se definen exclusivamente dentro de .dashboard-navigation para evitar contradicciones. */
    .view-switcher { display: inline-flex; gap: 8px; align-items: stretch; }
    .view-switcher__button { appearance: none; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 7px; background: #ffffff; color: #475569; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; line-height: 1.2;
      text-align: left; display: inline-flex; align-items: center; justify-content: flex-start; gap: 8px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); 
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease; }
    .view-switcher__button:hover:not(.view-switcher__button--active) { background: #f1f5f9; border-color: #94a3b8; color: #1d4ed8; transform: translateY(-1px); box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08); }
    .view-switcher__button:active { transform: scale(0.98); }
    .view-switcher__button--active { background: #2563eb; border-color: #1d4ed8; color: #ffffff; box-shadow: 0 3px 8px rgba(37, 99, 235, 0.28); }
    .view-switcher__button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.3); outline-offset: 2px; }
    .view-switcher__icon { width: 18px; height: 18px; flex: 0 0 18px; display: inline-flex; align-items: center; justify-content: center; }
    .view-switcher__label { display: block; }
    /* ── Header del dashboard y KPI cards ── */
    .dashboard-header { display: grid; grid-template-columns: 145px minmax(0, 1fr) 336px; grid-template-areas: "title kpis navigation"; align-items: center; column-gap: 16px; margin-bottom: 12px; }
    .dashboard-title { grid-area: title; margin: 0; min-width: 0; white-space: nowrap; font-size: 22px; line-height: 1.05; letter-spacing: 0.5px; }
    /* El bloque central ocupa únicamente el espacio disponible entre el título y los botones de navegación. */
    .dashboard-kpis { grid-area: kpis; display: grid; grid-template-columns: repeat( var(--kpi-card-count), minmax(0, 1fr) );  gap: 9px; min-width: 0; align-items: stretch; }
    .dashboard-kpis--6 { --kpi-card-count: 6; }
    .dashboard-kpis--7 { --kpi-card-count: 7; }
    /* ReadinessOverview y DeliveryHealthOverview no agregan una capa visual dentro del header: sus cards son celdas directas de la grilla. */
    .dashboard-kpis .readiness-overview, .dashboard-kpis .health-overview { margin: 0 }
    /* Fuente única de verdad para las KPI cards.
      Se preserva el diseño actual:
      - ancho adaptable a la grilla;
      - altura fija de 74px;
      - sin ancho fijo de 130px;
      - sin altura antigua de 58px.  */
    .dashboard-kpis .readiness-overview-card, .dashboard-kpis .health-overview-card { width: 100%; min-width: 0; height: 74px; min-height: 74px; margin: 0; padding: 9px 10px; border: 1px solid #e2e8f0; border-radius: 7px;
      background: #ffffff; box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; overflow: hidden; text-align: left; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
    .dashboard-kpis .readiness-overview-card { cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
    .dashboard-kpis .readiness-overview-card:hover { transform: translateY(-1px);  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08); }
    .dashboard-kpis .health-overview-card { cursor: pointer; }
    .dashboard-kpis .health-overview-card:hover { border-color: #94a3b8; transform: translateY(-1px); }
    .dashboard-kpis .health-overview-card:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .dashboard-kpis .readiness-overview-card__label, .dashboard-kpis .health-overview-card__label { display: block; min-height: 28px; margin: 0; font-size: 11px; line-height: 14px; font-weight: 700; white-space: normal; overflow-wrap: anywhere; }
    .dashboard-kpis .readiness-overview-card__count, .dashboard-kpis .health-overview-card__count { display: block; margin-top: 0; font-size: 22px; line-height: 22px; font-weight: 700; color: #1e293b; }
    .dashboard-kpis .readiness-overview-card--active { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.16); }
    .dashboard-kpis .readiness-overview-card--ready { background: #f0fdf4; border-color: #86efac; }
    .dashboard-kpis .readiness-overview-card--ready .readiness-overview-card__label { color: #166534; }
    .dashboard-kpis .readiness-overview-card--needs-info { background: #fff7ed; border-color: #fb923c; }
    .dashboard-kpis .readiness-overview-card--needs-info .readiness-overview-card__label { color: #9a3412; }
    .dashboard-kpis .readiness-overview-card--unknown { background: #f8fafc; border-color: #cbd5e1; }
    .dashboard-kpis .readiness-overview-card--unknown .readiness-overview-card__label { color: #475569; }
    .dashboard-kpis .health-overview-card--action { background: #fef2f2; border-color: #fca5a5; }
    .dashboard-kpis .health-overview-card--action .health-overview-card__label { color: #991b1b; }
    .dashboard-kpis .health-overview-card--attention { background: #fef3c7; border-color: #fbbf24; }
    .dashboard-kpis .health-overview-card--attention .health-overview-card__label { color: #854d0e; }
    .dashboard-kpis .health-overview-card--healthy { background: #f0fdf4; border-color: #86efac; }
    .dashboard-kpis .health-overview-card--healthy .health-overview-card__label { color: #166534; }
    .dashboard-kpis .health-overview-card--selected { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18); }
    /*  Navegación a la derecha. Importante:
      - estos botones son los únicos elementos de 160px × 74px;
      - las KPI cards mantienen ancho flexible y altura de 74px. */
    .dashboard-navigation { grid-area: navigation; justify-self: end; min-width: 0; }
    .dashboard-navigation .view-switcher { display: grid; grid-template-columns: repeat(2, 160px); gap: 8px; align-items: stretch; }
    .dashboard-navigation .view-switcher__button { width: 160px; min-width: 160px; height: 74px; min-height: 74px; box-sizing: border-box; }
    /* Pantallas medianas: título y navegación conservan la primera fila; las tarjetas KPI pasan a una fila propia. */

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { DateTime } = luxon;

    /*
      Fallback seguro antes de recibir /api/features.
      El backend devuelve dashboard.timeZone y reemplaza este valor durante la carga. El fallback evita que haya un render inicial inconsistente si la respuesta todavía no llegó.
    */
    let dashboardTimeZone = 'America/Chicago';

    function getDashboardNow() {
      return DateTime.now().setZone(dashboardTimeZone);
    }

    function getDashboardToday() {
      return getDashboardNow()
        .startOf('day')
        .toJSDate();
    }

    /*
      Interpreta YYYY-MM-DD como una fecha de negocio en Chicago.
      No se debe usar new Date('YYYY-MM-DD'), porque JavaScript trata
      esa forma como UTC y puede desplazar visualmente el día.
    */
    function parseDashboardDate(value) {
      if (!value) {
        return null;
      }

      const normalizedValue = String(value).trim();

      const parsed = /^\d{4}-\d{2}-\d{2}$/.test(normalizedValue)
        ? DateTime.fromISO(normalizedValue, {
            zone: dashboardTimeZone
          })
        : DateTime.fromISO(normalizedValue, {
            setZone: true
          }).setZone(dashboardTimeZone);

      return parsed.isValid
        ? parsed.toJSDate()
        : null;
    }

    function getDashboardDateTime(value) {
      const date = parseDashboardDate(value);

      return date
        ? DateTime.fromJSDate(date).setZone(dashboardTimeZone)
        : null;
    }

    function createDashboardDate(year, month, day = 1) {
      const date = DateTime.fromObject(
        { year, month: month + 1, day },
        { zone: dashboardTimeZone }
      );

      return date.isValid
        ? date.toJSDate()
        : null;
    }

    function addDashboardDays(date, days) {
      return DateTime
        .fromJSDate(date)
        .setZone(dashboardTimeZone)
        .plus({ days })
        .toJSDate();
    }

    function formatDashboardMonth(date, options = {}) {
      return DateTime
        .fromJSDate(date)
        .setZone(dashboardTimeZone)
        .setLocale('en-US')
        .toLocaleString({
          month: 'short',
          ...options
        });
    }

    const releaseDates = {
      'CE-2026-FEB': '2026-02-09',
      'CE-2026-FEB-SEMIMONTHLY': '2026-02-23',
      'CE-2026-MAR': '2026-03-09',
      'CE-2026-MAR-SEMIMONTHLY': '2026-03-23',
      'CE-2026-APR': '2026-04-12',
      'CE-2026-APR-SEMIMONTHLY': '2026-04-27',
      'CE-2026-MAY': '2026-05-11',
      'CE-2026-MAY-SEMIMONTHLY': '2026-05-25',
      'CE-2026-JUN': '2026-06-08',
      'CE-2026-JUN-SEMIMONTHLY': '2026-06-22',
      'CE-2026-JUL': '2026-07-13',
      'CE-2026-JUL-SEMIMONTHLY': '2026-07-27',
      'CE-2026-AUG': '2026-08-10',
      'CE-2026-AUG-SEMIMONTHLY': '2026-08-24',
      'CE-2026-SEP': '2026-09-14',
      'CE-2026-SEP-SEMIMONTHLY': '2026-09-28',
      'CE-2026-OCT': '2026-10-12',
      'CE-2026-OCT-SEMIMONTHLY': '2026-10-26',
      'CE-2026-NOV': '2026-11-09',
      'CE-2026-NOV-SEMIMONTHLY': '2026-11-23',
      'CE-2026-DEC': '2026-12-14'
    };

    const storyStateColors = {
      'New': '#94a3b8',
      'Business Refinement': '#facc15',
      'Technical Refinement': '#fb923c',
      'Ready for Development': '#f97316',
      'In Process': '#60a5fa',
      'QA Testing': '#38bdf8',
      'Business Sprint Testing': '#22d3ee',
      'Sprint Complete': '#2dd4bf',
      'User Acceptance Testing': '#34d399',
      'Approved for Release': '#4ade80',
      'Ready for Deployment': '#84cc16',
      'Closed': '#a78bfa'
    };

    const readinessCheckLabels = {
      description: 'Description',
      acceptanceCriteria: 'Acceptance Criteria',
      businessImpact: 'Customer Benefit',
      parent: 'Parent',
      priority: 'Priority',
      targetDate: 'Target Date'      
    };

    function getReadinessMeta(readiness) {
      switch (readiness) {
        case 'Healthy':
          return {
            label: 'Ready',
            className: 'readiness--ready',
            icon: '✓'
          };

        case 'Incomplete':
          return {
            label: 'Not Ready',
            className: 'readiness--needs-info',
            icon: '!'
          };

        case 'Unknown':
          return {
            label: 'Unable to validate',
            className: 'readiness--unknown',
            icon: '?'
          };

        default:
          return {
            label: 'Readiness unavailable',
            className: 'readiness--unknown',
            icon: '?'
          };
      }
    }

    /*
      El frontend nuevo prefiere los campos readiness.
      El fallback permite seguir leyendo respuestas cacheadas o versiones
      antiguas del backend que aún entreguen health.
    */
    function getFeatureReadiness(feature) {
      return feature.readiness || feature.health || 'Unknown';
    }
     
    function getFeatureReadinessMissingChecks(feature) {
      return feature.readinessMissingChecks || [];
    }
    
    function getFeatureReadinessUnknownChecks(feature) {
      return feature.readinessUnknownChecks || [];
    }

    function ReadinessBadge({ readiness, iconOnly = false }) {
      const meta = getReadinessMeta(readiness);
    
      return (
        <span
          className={[
            'readiness-badge',
            iconOnly ? 'readiness-badge--icon-only' : '',
            meta.className
          ].filter(Boolean).join(' ')}
          aria-label={`Feature readiness: ${meta.label}`}
          title={`Feature readiness: ${meta.label}`}
        >
          <span className="readiness-badge__icon" aria-hidden="true">
            {meta.icon}
          </span>
    
          {!iconOnly && (
            <span className="readiness-badge__label">
              {meta.label}
            </span>
          )}
        </span>
      );
    }
    
    function FeatureReadinessDetails({ feature }) {
      const readiness = getFeatureReadiness(feature);
      const meta = getReadinessMeta(readiness);
      const missingChecks = getFeatureReadinessMissingChecks(feature);
      const unknownChecks = getFeatureReadinessUnknownChecks(feature);
    
      return (
        <section
          className="readiness-details"
          aria-label={`Feature readiness: ${meta.label}`}
        >
          <div className="feature-readiness-summary">
            <strong className="feature-readiness-summary__title">
              Feature Readiness:
            </strong>
    
            <ReadinessBadge readiness={readiness} />
          </div>
    
          {missingChecks.length > 0 && (
            <div className="feature-readiness-summary__message feature-readiness-summary__message--missing">
              <strong>Data missing:</strong>{' '}
              {missingChecks
                .map(check => readinessCheckLabels[check] || check)
                .join(', ')}
            </div>
          )}
    
          {unknownChecks.length > 0 && (
            <div className="feature-readiness-summary__message feature-readiness-summary__message--unknown">
              <strong>Unable to validate:</strong>{' '}
              {unknownChecks
                .map(check => readinessCheckLabels[check] || check)
                .join(', ')}
            </div>
          )}
        </section>
      );
    }

   /* Delivery Health:
      La fuente de verdad preferida es feature.deliveryHealth, calculada por el backend. El frontend solamente asigna color, icono y clases
      CSS para renderizarla.

      La lógica antigua basada en deliverySummary se conserva por ahora como fallback temporal para respuestas cacheadas antiguas. */

    function getDeliveryVisualMeta(key) {
      switch (key) {
        case 'overdue':
        case 'target-date-near-unscheduled-discovery':
        case 'target-next-month-without-release':
          return {
            className: 'delivery--overdue',
            alertClassName: 'delivery-alert--overdue',
            icon: '!'
          };

        case 'needs-estimate':
          return {
            className: 'delivery--needs-info',
            alertClassName: 'delivery-alert--needs-info',
            icon: '!'
          };

        case 'healthy':
          return {
            className: 'delivery--healthy',
            alertClassName: 'delivery-alert--healthy',
            icon: '✓'
          };

       case 'not-started':
          return {
            className: 'delivery--not-started',
            alertClassName: 'delivery-alert--not-started',
            icon: '○'
          };

        case 'unable-to-evaluate':
          return {
            className: 'delivery--unknown',
            alertClassName: 'delivery-alert--unknown',
            icon: '?'
          };

        default:
          return {
            className: 'delivery--attention',
            alertClassName: 'delivery-alert--attention',
            icon: '!'
          };
      }
    }

    function getDeliveryHealthDisplayLabels(key, fallbackLabel) {
      if (key === 'needs-estimate') {
        return {
          label: 'Needs High Level Estimation',
          shortLabel: 'Needs HLE'
        };
      }
    
      return {
        label: fallbackLabel,
        shortLabel: fallbackLabel
      };
    }

    /*
      parseDashboardDate() se declara una sola vez al inicio del script.
      Usa Luxon y dashboardTimeZone para interpretar fechas operativas
      bajo America/Chicago.
    */

    /* Delivery Health es calculado exclusivamente por el backend.
      El frontend solo:
      - asigna estilos, iconos y clases CSS;
      - renderiza primary y alerts;
      - usa group para KPI y filtros. */

    function getDeliveryHealth(feature) {
      const primary = feature.deliveryHealth?.primary;

      /* Este caso no es un fallback de negocio: es una protección visual para una respuesta incompleta o inválida. */
      if (!primary || typeof primary !== 'object') {
        const visual = getDeliveryVisualMeta('unable-to-evaluate');

        return {
          key: 'unable-to-evaluate',
          label: 'Unable to evaluate',
          shortLabel: 'Unavailable',
          group: 'requires-attention',
          className: visual.className,
          icon: visual.icon,
          reason:
            'Delivery Health information was not returned by the server.',
          recommendedAction:
            'Refresh the dashboard and verify Azure DevOps availability.'
        };
      }

      const visual = getDeliveryVisualMeta(primary.key);

      const labels = getDeliveryHealthDisplayLabels(
        primary.key,
        primary.label
      );
      
      return {
        key: primary.key,
        label: labels.label,
        shortLabel:
          primary.key === 'needs-estimate'
            ? labels.shortLabel
            : (primary.shortLabel || labels.shortLabel),
        group: primary.group,
        className: visual.className,
        icon: visual.icon,
        reason: primary.reason,
        recommendedAction: primary.recommendedAction
      };
    }
    function getDeliveryHealthAlerts(feature) {
      const backendAlerts = feature.deliveryHealth?.alerts;

      /* El backend envía [] cuando no existen alertas aplicables, por ejemplo para un Feature Healthy o Not started. */
      if (!Array.isArray(backendAlerts)) {
        const visual = getDeliveryVisualMeta('unable-to-evaluate');

        return [{
          key: 'unable-to-evaluate',
          label: 'Unable to evaluate',
          group: 'requires-attention',
          className: visual.alertClassName,
          reason:
            'Delivery Health alert information was not returned by the server.',
          recommendedAction:
            'Refresh the dashboard and verify Azure DevOps availability.'
        }];
      }

      return backendAlerts.map(alert => {
        const visual = getDeliveryVisualMeta(alert.key);
      
        const labels = getDeliveryHealthDisplayLabels(
          alert.key,
          alert.label
        );
      
        return {
          key: alert.key,
          label: labels.label,
          group: alert.group,
          className: visual.alertClassName,
          reason: alert.reason,
          recommendedAction: alert.recommendedAction
        };
      });
    }
    
     function ReadinessOverview({
      counts,
      SelectedReadiness,
      isAllFeaturesSelected,
      onSelectReadiness,
      showReadinessCards = true,
      showAllCard = true
    }) {
      const cards = [
        {
          key: 'Healthy',
          label: 'Ready',
          count: counts.healthy,
          icon: '✓',
          className: 'readiness-overview-card--ready'
        },
        {
          key: 'Incomplete',
          label: 'Not Ready',
          count: counts.incomplete,
          icon: '!',
          className: 'readiness-overview-card--needs-info'
        },
        {
          key: 'Unknown',
          label: 'Unable to validate',
          count: counts.unknown,
          icon: '?',
          className: 'readiness-overview-card--unknown'
        },
        {
          key: 'All',
          label: 'All Features',
          count: counts.total,
          className: 'readiness-overview-card--all'
        }
      ].filter(card => {
        /* La tarjeta Unknown solamente se muestra si hay Features sin validar. */
        if (card.key === 'Unknown' && card.count === 0) {
          return false;
        }
    
        /* Esta instancia se utiliza exclusivamente para la tarjeta All Features. */
        if (!showReadinessCards) {
          return card.key === 'All';
        }
    
        /* Esta instancia muestra únicamente las tarjetas propias de Readiness. */
        if (!showAllCard && card.key === 'All') {
          return false;
        }
    
        return true;
      });
    
      return (
        <div className="readiness-overview">
          {cards.map(card => {
            const isSelected =
              card.key === 'All'
                ? isAllFeaturesSelected
                : SelectedReadiness === card.key;
    
            return (
              <button
                key={card.key}
                type="button"
                className={[
                  'readiness-overview-card',
                  card.className,
                  isSelected ? 'readiness-overview-card--active' : ''
                ]
                  .filter(Boolean)
                  .join(' ')}
                onClick={() => onSelectReadiness(card.key)}
                title={
                  card.key === 'All'
                    ? 'Clear KPI filters and show all Features'
                    : `Filter Features by readiness: ${card.label}`
                }
              >
                <span className="readiness-overview-card__label">
                  {card.icon && <span>{card.icon}</span>}
                  {card.label}
                </span>
    
                <span className="readiness-overview-card__count">
                  {card.count}
                </span>
              </button>
            );
          })}
        </div>
      );
    }

    function DeliveryHealthOverview({
      counts,
      selectedHealthGroup,
      onSelectHealthGroup
    }) {
      const cards = [
        {
          key: 'requires-action',
          label: 'Requires Action',
          count: counts.requiresAction,
          icon: '!',
          className: 'health-overview-card--action'
        },
        {
          key: 'requires-attention',
          label: 'Requires Attention',
          count: counts.requiresAttention,
          icon: '!',
          className: 'health-overview-card--attention'
        },
        {
          key: 'healthy',
          label: 'Healthy',
          count: counts.healthy,
          icon: '✓',
          className: 'health-overview-card--healthy'
        }
      ];

      return (
        <div className="health-overview">
          {cards.map(card => {
            const isSelected = selectedHealthGroup === card.key;

            return (
              <button
                key={card.key}
                type="button"
                className={[
                  'health-overview-card',
                  card.className,
                  isSelected ? 'health-overview-card--selected' : ''
                ].filter(Boolean).join(' ')}
                title={`${card.label}: ${card.count} Feature(s)`}
                onClick={() => onSelectHealthGroup(card.key)}
              >
                <span className="health-overview-card__label">
                  <span>{card.icon}</span>
                  {card.label}
                </span>

                <span className="health-overview-card__count">
                  {card.count}
                </span>
              </button>
            );
          })}
        </div>
      );
    }
    
    // ── Tooltip global ──────────────────────────────────────────────
    function useTooltip() {
      const [tooltip, setTooltip] = React.useState({ visible: false, x: 0, y: 0, content: null });
      const showTooltip = React.useCallback((e, content) => {
        setTooltip({ visible: true, x: e.clientX, y: e.clientY, content });
      }, []);
      const moveTooltip = React.useCallback((e) => {
        setTooltip(prev => ({ ...prev, x: e.clientX, y: e.clientY }));
      }, []);
      const hideTooltip = React.useCallback(() => {
        setTooltip(prev => ({ ...prev, visible: false }));
      }, []);
      return { tooltip, showTooltip, moveTooltip, hideTooltip };
    }

    function Tooltip({ tooltip }) {
      if (!tooltip.visible || !tooltip.content) return null;
      const style = {
        position: 'fixed',
        left: tooltip.x + 14,
        top: tooltip.y - 10,
        background: 'rgba(15, 23, 42, 0.93)',
        color: 'white',
        padding: '8px 12px',
        borderRadius: '6px',
        fontSize: '11px',
        lineHeight: '1.6',
        pointerEvents: 'none',
        zIndex: 9999,
        maxWidth: '260px',
        boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
        whiteSpace: 'pre-wrap'
      };
      const adjustedLeft = tooltip.x + 14 + 260 > window.innerWidth
        ? tooltip.x - 274
        : tooltip.x + 14;
      return (
        <div style={{ ...style, left: adjustedLeft }}>
          {tooltip.content}
        </div>
      );
    }

    /* Estado reutilizable para el panel principal de resultados.
      Se usa para Feature List y Roadmap, evitando que una vista quede vacía sin explicación mientras la otra muestra un mensaje distinto. */
    function DashboardResultsState({
      type,
      onClearFilters,
      onRetry,
      retrying = false
    }) {
      const contentByType = {
        loading: {
          icon: '…',
          title: 'Loading Features...',
          description:
            'Retrieving the latest Feature information from Azure DevOps.'
        },

        'empty-filtered': {
          icon: '⌕',
          title: 'No Features match the current filters.',
          description:
            'Try clearing one or more filters.'
        },

        'empty-global': {
          icon: '○',
          title: 'No Features are available at this time.',
          description:
            'No Features were returned from the configured Azure DevOps scope.'
        },

        error: {
          icon: '!',
          title: 'Features could not be loaded.',
          description:
            'The dashboard could not retrieve Feature information. Check your connection and try again.'
        }
      };

      const content = contentByType[type] || contentByType.error;
      const isError = type === 'error';

      return (
        <section
          className={[
            'dashboard-results-state',
            isError ? 'dashboard-results-state--error' : ''
          ].filter(Boolean).join(' ')}
          role={isError ? 'alert' : 'status'}
          aria-live="polite"
        >
          <span
            className="dashboard-results-state__icon"
            aria-hidden="true"
          >
            {content.icon}
          </span>

          <h2 className="dashboard-results-state__title">
            {content.title}
          </h2>

          <p className="dashboard-results-state__description">
            {content.description}
          </p>

          {type === 'empty-filtered' && (
            <button
              type="button"
              className="dashboard-results-state__action"
              onClick={onClearFilters}
            >
              Clear filters
            </button>
          )}

          {type === 'error' && (
            <button
              type="button"
              className="dashboard-results-state__action"
              onClick={onRetry}
              disabled={retrying}
            >
              {retrying ? 'Trying again...' : 'Try again'}
            </button>
          )}
        </section>
      );
    }

    function StoryRow({ storyId, title, storyPoints, state, iterationPath, formatDate, timelineStart, timelineEnd, adoLink, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const today = getDashboardToday();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);
      const todayPercent = ((today - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
      const clampedTodayPercent = Math.max(0, Math.min(100, todayPercent));

      const segments = [];
      if (states.length > 0) {
        states.forEach((st, idx) => {
          const stateStart = parseDashboardDate(st.changedDate);
          const stateEnd = idx === states.length - 1
            ? today
            : parseDashboardDate(states[idx + 1].changedDate);

          if (!stateStart || !stateEnd) {
            return;
          }

          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            segments.push({
              color: storyStateColors[st.state] || '#cccccc',
              state: st.state,
              startPercent: clampedStart,
              widthPercent: Math.max(1, clampedEnd - clampedStart)
            });
          }
        });
      }

      let sprintStart = null;
      let sprintEnd = null;
      let sprintLabel = '';
      const sprintMatch = iterationPath && iterationPath.match(/(\d{4})_(S\d+)_([A-Za-z]+)(\d+)-([A-Za-z]+)(\d+)/);
      if (sprintMatch) {
        const year = parseInt(sprintMatch[1]);
        sprintLabel = sprintMatch[2];
        const monthMap = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
        const startMonth = sprintMatch[3];
        const startDay = parseInt(sprintMatch[4], 10);
        const endMonth = sprintMatch[5];
        const endDay = parseInt(sprintMatch[6], 10);

        const sprintEndYear =
          monthMap[endMonth] < monthMap[startMonth]
            ? year + 1
            : year;

        sprintStart = createDashboardDate(
          year,
          monthMap[startMonth],
          startDay
        );

        sprintEnd = createDashboardDate(
          sprintEndYear,
          monthMap[endMonth],
          endDay
        );
      }

      const getSprintPercent = (date) => {
        const days = (date - timelineStart) / (1000 * 60 * 60 * 24);
        return (days / timelineTotalDays) * 100;
      };

      let sprintStartPercent = null;
      let sprintEndPercent = null;
      let sprintMidPercent = null;
      if (sprintStart && sprintEnd) {
        const rawStart = getSprintPercent(sprintStart);
        const rawEnd = getSprintPercent(sprintEnd);
        if (rawEnd > 0 && rawStart < 100) {
          sprintStartPercent = Math.max(0, rawStart);
          sprintEndPercent = Math.min(100, rawEnd);
          sprintMidPercent = (sprintStartPercent + sprintEndPercent) / 2;
        }
      }

    /* ── Clasificación única de Features & Stories ── */
    const deliveryDoneStates = [
      'Approved for Release',
      'Ready for Deployment',
      'Closed'
    ];

    const deliveryInProgressStates = [
      'In Process',
      'QA Testing',
      'Business Sprint Testing',
      'Sprint Complete',
      'User Acceptance Testing'
    ];

    /* Debe coincidir con ESTIMABLE_WORK_STATES del backend. Sólo estos estados requieren que el work item tenga estimación.
      Los elementos Closed, Removed u otros estados tempranos no generan la alerta actual "No estimated work". */
    const estimateRequiredStates = [
      'Planned',
      'Ready for Development',
      'In Process',
      'QA Testing',
      'Business Sprint Testing',
      'User Acceptance Testing',
      'Approved for Release',
      'Ready for Deployment',
      'Sprint Complete'
    ];
    
    /*
      La fuente de verdad preferida es el backend. Cuando el backend entregue isUnestimated, el frontend no debe
      reinterpretar Story Points ni Work Item Type. El fallback conserva la misma regla mientras exista una respuesta cacheada antigua. */
    function isWorkItemUnestimated(workItem) {
      if (typeof workItem?.isUnestimated === 'boolean') {
        return workItem.isUnestimated;
      }
    
      const value = workItem?.storyPoints;
      const state = String(workItem?.state || '').trim();
    
      const hasMissingOrZeroEstimate =
        value === null ||
        value === undefined ||
        String(value).trim() === '' ||
        Number(value) <= 0;
    
      return (
        estimateRequiredStates.includes(state) &&
        hasMissingOrZeroEstimate
      );
    }
    
    function hasWorkItemEstimate(workItem) {
      return !isWorkItemUnestimated(workItem);
    }

    function getWorkItemDeliveryCategory(workItem) {
      if (workItem?.state === 'Removed') {
        return 'removed';
      }

      if (deliveryDoneStates.includes(workItem?.state)) {
        return 'done';
      }

      if (deliveryInProgressStates.includes(workItem?.state)) {
        return 'inProgress';
      }

      /*
        Cualquier Story/Bug vigente que no esté Done ni In progress
        debe entrar en Discovery. Esto incluye, por ejemplo:
        - New
        - Business Refinement
        - Technical Refinement
        - Ready for Development
      */
      return 'pending';
    }

    function getWorkItemsDeliverySummary(workItems = []) {
      const summary = {
        totalWorkItems: workItems.length,
        includedWorkItems: 0,
        removedWorkItems: 0,
        doneWorkItems: 0,
        inProgressWorkItems: 0,
        pendingWorkItems: 0,
        openWorkItems: 0,
        unestimatedWorkItems: 0,
        discoveryWithoutSprintWorkItems: 0
      };

      workItems.forEach(workItem => {
        const category = getWorkItemDeliveryCategory(workItem);

        if (category === 'removed') {
          summary.removedWorkItems += 1;
          return;
        }

        summary.includedWorkItems += 1;

        if (category === 'done') {
          summary.doneWorkItems += 1;
        } else if (category === 'inProgress') {
          summary.inProgressWorkItems += 1;
        } else {
          summary.pendingWorkItems += 1;
        }

        /*
          Removed queda fuera de este cálculo por definición:
          no debe afectar la cobertura de estimación de delivery.
        */
        if (!hasWorkItemEstimate(workItem)) {
          summary.unestimatedWorkItems += 1;
        }

        const hasIterationPath = typeof workItem.iterationPath === 'string' && workItem.iterationPath.trim() !== '';
        
        if (category === 'pending' && !hasIterationPath) {
          summary.discoveryWithoutSprintWorkItems += 1;
        }      
      });

        summary.openWorkItems =
        summary.inProgressWorkItems +
        summary.pendingWorkItems;

      return summary;
    }

    function getShortAssignedToName(value) {
      if (!value) { return 'Unassigned'; }

      /*
        Ejemplo: "Apellido, Nombre (Operations & Technology)" → "Apellido, Nombre"
      */
      return String(value)
        .replace(/\s*\([^)]*\)\s*$/, '')
        .trim();
    }

    function getWorkItemDisplayOrder(workItem) {
      /*
        Bugs primero; después las User Stories.
        Si surgiera otro tipo, quedará después de ambos.
      */
      if (workItem?.workItemType === 'Bug') return 0;
      if (workItem?.workItemType === 'User Story') return 1;
      return 2;
    }

    function sortFeatureWorkItems(workItems = []) {
      return [...workItems]
        .filter(workItem => workItem.state !== 'Removed')
        .sort((a, b) => {
          const typeDifference =
            getWorkItemDisplayOrder(a) - getWorkItemDisplayOrder(b);

          if (typeDifference !== 0) {
            return typeDifference;
          }

          return Number(b.id || 0) - Number(a.id || 0);
        });
    }

    function sortDeliveryWorkItemsByTypeAndId(workItems = []) {
      return [...workItems].sort((a, b) => {
        const typeDifference =
          getWorkItemDisplayOrder(a) - getWorkItemDisplayOrder(b);

        if (typeDifference !== 0) {
          return typeDifference;
        }

        return Number(b.id || 0) - Number(a.id || 0);
      });
    }

    function FeatureDeliveryDetails({ 
      feature, 
      stories, 
      adoLink, 
      relationshipGraph,
      relationshipLoading,
      relationshipUnavailable,
      onLoadRelationships,
      onRetryRelationships }) {
      
      const [workItemSubfilter, setWorkItemSubfilter] =
        React.useState('all');
      
      /* null = muestra todos los Bugs relacionados con el Feature. Un ID = muestra únicamente Bugs relacionados desde esa Story. */
      const [linkedStoryFilterId, setLinkedStoryFilterId] =
        React.useState(null);

      const delivery = getDeliveryHealth(feature);
      const alerts = getDeliveryHealthAlerts(feature);
      const summary = getWorkItemsDeliverySummary(stories);

      const normalizedRelationshipGraph =
        relationshipGraph?.source === 'ok'
          ? normalizeRelationshipGraph(relationshipGraph)
          : null;
     
      const linkedBugs =
        normalizedRelationshipGraph?.linkedBugs || [];
      
      const storyLinkedBugs =
        normalizedRelationshipGraph?.storyLinkedBugs || [];
      
      const linkedStories =
        normalizedRelationshipGraph?.linkedStories || [];
      
      const relationshipTotal =
        normalizedRelationshipGraph?.total || 0;

      const linkedBugsForSelectedStory = linkedStoryFilterId
        ? storyLinkedBugs.filter(bug =>
            (bug.relatedFromStoryIds || [])
              .map(Number)
              .includes(Number(linkedStoryFilterId))
          )
        : linkedBugs;

      const getLinkedBugCountForStory = (storyId) => {
        const numericStoryId = Number(storyId);
      
        return storyLinkedBugs.filter(bug =>
          (bug.relatedFromStoryIds || [])
            .map(Number)
            .includes(numericStoryId)
        ).length;
      };

      if (Number(feature.id) === 1165429) {
        console.log('[Relationship debug]', {
          featureId: feature.id,
          directFeatureChildBugs:
            normalizedRelationshipGraph?.directFeatureChildBugs,
          linkedBugs,
          storyLinkedBugs,
          linkedStories
        });
      }
      
      const showLinkedBugsForStory = (storyId) => {
        setLinkedStoryFilterId(Number(storyId));
        setWorkItemSubfilter('linkedBugs');
        onLoadRelationships();
      };
      
      const showAllLinkedRelationships = () => {
        setLinkedStoryFilterId(null);
        setWorkItemSubfilter('linkedBugs');

   /* Paginación compacta para evitar mostrar demasiados botones cuando existen muchas páginas.*/
    function DashboardPagination({
      currentPage,
      totalPages,
      onPageChange,
      ariaLabel
    }) {
      const visiblePages = (() => {
        if (totalPages <= 7) {
          return Array.from(
            { length: totalPages },
            (_, index) => index + 1
          );
        }

        if (currentPage <= 4) {
          return [1, 2, 3, 4, 'ellipsis-end', totalPages];
        }

        if (currentPage >= totalPages - 3) {
          return [
            1,
            'ellipsis-start',
            totalPages - 3,
            totalPages - 2,
            totalPages - 1,
            totalPages
          ];
        }

        return [
          1,
          'ellipsis-start',
          currentPage - 1,
          currentPage,
          currentPage + 1,
          'ellipsis-end',
          totalPages
        ];
      })();

      return (
        <nav
          className="dashboard-pagination"
          aria-label={ariaLabel}
        >
          <button
            type="button"
            className="dashboard-pagination__button"
            onClick={() => onPageChange(1)}
            disabled={currentPage === 1}
            title="Go to first page"
          >
            First
          </button>

          <button
            type="button"
            className="dashboard-pagination__button"
            onClick={() => onPageChange(currentPage - 1)}
            disabled={currentPage === 1}
            title="Go to previous page"
          >
            Previous
          </button>

          {visiblePages.map((pageItem, index) => {
            if (typeof pageItem !== 'number') {
              return (
                <span
                  key={`${pageItem}-${index}`}
                  className="dashboard-pagination__ellipsis"
                  aria-hidden="true"
                >
                  …
                </span>
              );
            }

            const isActive = pageItem === currentPage;

            return (
              <button
                key={pageItem}
                type="button"
                className={[
                  'dashboard-pagination__button',
                  isActive
                    ? 'dashboard-pagination__button--active'
                    : ''
                ].filter(Boolean).join(' ')}
                onClick={() => onPageChange(pageItem)}
                disabled={isActive}
                aria-current={isActive ? 'page' : undefined}
                title={`Go to page ${pageItem}`}
              >
                {pageItem}
              </button>
            );
          })}

          <button
            type="button"
            className="dashboard-pagination__button"
            onClick={() => onPageChange(currentPage + 1)}
            disabled={currentPage === totalPages}
            title="Go to next page"
          >
            Next
          </button>

          <button
            type="button"
            className="dashboard-pagination__button"
            onClick={() => onPageChange(totalPages)}
            disabled={currentPage === totalPages}
            title="Go to last page"
          >
            Last
          </button>

          <span className="dashboard-pagination__summary">
            Page {currentPage} of {totalPages}
          </span>
        </nav>
      );
    }

    /* Convierte una lista de valores seleccionados en un texto breve. */
    function getSelectedValuesPreview(values, maxVisible = 2) {
      if (!Array.isArray(values) || values.length === 0) {
        return '';
      }
    
      const visibleValues = values.slice(0, maxVisible);
      const hiddenCount = values.length - visibleValues.length;
    
      return [
        visibleValues.join(', '),
        hiddenCount > 0 ? `+${hiddenCount}` : ''
      ]
        .filter(Boolean)
        .join(' ');
    }

    function getRelationshipItemId(item) {
      const id = Number(item?.id);
    
      return Number.isInteger(id) && id > 0
        ? id
        : null;
    }
    
    function dedupeRelationshipItems(items = []) {
      const itemsById = new Map();
    
      items.forEach(item => {
        const id = getRelationshipItemId(item);
    
        if (id) {
          itemsById.set(id, item);
        }
      });
    
      return [...itemsById.values()];
    }
    
    /* Convierte la respuesta del endpoint a una forma segura para la UI.    
      Los Bugs hijos directos se excluyen deliberadamente de linkedBugs,porque ya pertenecen al endpoint de hijos directos y no deben duplicarse 
      ni afectar la interpretación visual. */
    function normalizeRelationshipGraph(graph) {
      const source = graph?.source || 'unknown';
    
      const directFeatureChildBugs = Array.isArray(
        graph?.directFeatureChildBugs
      )
        ? graph.directFeatureChildBugs
        : [];
    
      const directFeatureRelatedBugs = Array.isArray(
        graph?.directFeatureRelatedBugs
      )
        ? graph.directFeatureRelatedBugs
        : [];
    
      const childStoryRelatedBugs = Array.isArray(
        graph?.childStoryRelatedBugs
      )
        ? graph.childStoryRelatedBugs
        : [];
    
      const directFeatureRelatedStories = Array.isArray(
        graph?.directFeatureRelatedStories
      )
        ? graph.directFeatureRelatedStories
        : [];
    
      /*
        Los Bugs hijos directos siguen siendo work items normales del Feature.
        No deben duplicarse en la vista global "Linked Bugs".
      */
      const directChildIds = new Set(
        directFeatureChildBugs
          .map(getRelationshipItemId)
          .filter(Boolean)
      );
    
      /*
        Une Bugs repetidos y conserva todas las Stories desde las que
        fue encontrada una relación Related.
      */
      const relationshipBugsById = new Map();
    
      [
        ...directFeatureRelatedBugs.map(item => ({
          ...item,
          relatedFromStoryIds: []
        })),
    
        ...childStoryRelatedBugs.map(item => ({
          ...item,
          relatedFromStoryIds: [
            ...new Set(
              [
                ...(Array.isArray(item.relatedFromStoryIds)
                  ? item.relatedFromStoryIds
                  : []),
    
                item.relatedFromStoryId
              ]
                .map(Number)
                .filter(id => Number.isInteger(id) && id > 0)
            )
          ]
        }))
      ].forEach(item => {
        const id = getRelationshipItemId(item);
    
        if (!id) {
          return;
        }
    
        const previousItem = relationshipBugsById.get(id);
    
        if (!previousItem) {
          relationshipBugsById.set(id, item);
          return;
        }
    
        relationshipBugsById.set(id, {
          ...previousItem,
    
          /*
            Mantiene toda Story vinculada al Bug.
            Ejemplo:
            Bug #1222712 -> Story #1211928 y Story #1211930.
          */
          relatedFromStoryIds: [
            ...new Set([
              ...(previousItem.relatedFromStoryIds || []),
              ...(item.relatedFromStoryIds || [])
            ])
          ]
        });
      });
    
      /* Incluye TODOS los Bugs que tengan una relación con una Story hija, incluso si además son hijos directos del Feature.
        Esta colección se usa exclusivamente para:
        - el contador de cada Story;
        - el detalle "Bugs linked to Story #...".
        No participa en Progress ni Delivery Health.   */
      const storyLinkedBugs = [...relationshipBugsById.values()].filter(
        item => (item.relatedFromStoryIds || []).length > 0
      );
    
      /* Vista global: excluye Bugs hijos directos para no mostrar un duplicado, porque estos ya aparecen en Discovery / In Progress / Done. */
      const linkedBugs = [...relationshipBugsById.values()].filter(
        item => !directChildIds.has(getRelationshipItemId(item))
      );
      
      const linkedStories = dedupeRelationshipItems(
        directFeatureRelatedStories
      );
    
      return {
        source,
        directFeatureChildBugs,
        linkedBugs,
        storyLinkedBugs,
        linkedStories,
        total: linkedBugs.length + linkedStories.length
      };
    }

            <DashboardResultsState
              type="error"
              onRetry={() => loadFeatures(false)}
              retrying={loading || refreshing}
            />
          );
        }

        if (loading) {
          return (
            <DashboardResultsState
              type="loading"
            />
          );
        }

        if (sortedFiltered.length === 0) {
          return (
            <DashboardResultsState
              type={
                hasActiveDashboardFilters
                  ? 'empty-filtered'
                  : 'empty-global'
              }
              onClearFilters={clearAllFilters}
            />
          );
        }

        return null;
      };

      /* Carga Stories/Bugs de múltiples Features con UNA llamada HTTP.
        Esta función centraliza los cuatro escenarios que antes usaban fetch('/api/feature-stories/:id') individualmente:
        1. Precarga de los Features visibles en Feature List.
        2. Apertura de History.
        3. Apertura de Delivery Health.
        4. Expansión de una fila del Roadmap. */
      const loadStoriesForFeatures = (featureIds) => {
        const ids = [
          ...new Set(
            (featureIds || [])
              .map(Number)
              .filter(id => Number.isInteger(id) && id > 0)
          )
        ].filter(featureId =>
          !Object.prototype.hasOwnProperty.call(
            storiesCache,
            featureId
          ) &&
          !loadingStoriesIds[featureId] &&
          !unavailableStoriesIds[featureId] &&
          !storiesRequestInFlightRef.current.has(featureId)
        );

        if (ids.length === 0) {
          return;
        }
        
        ids.forEach(featureId => {
          storiesRequestInFlightRef.current.add(featureId);
        });
        
        /* Marcamos todos los IDs antes de realizar fetch para evitar peticiones repetidas mientras React procesa el siguiente render. */
        setLoadingStoriesIds(previous => {
          const next = { ...previous };

          ids.forEach(featureId => {
            next[featureId] = true;
          });

          return next;
        });

        fetch('/api/features-stories-batch', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ids })
        })
          .then(async response => {
            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                data.error ||
                'Unable to load Stories/Bugs for the selected Features.'
              );
            }

            return data;
          })
          .then(data => {
            const results = data.results || {};
            const unavailableIds = new Set(
              (data.unavailableFeatureIds || [])
                .map(Number)
                .filter(Number.isInteger)
            );

            /* Guardamos un arreglo por cada ID solicitado, incluso cuando esté unavailable. Esto evita una precarga infinita. La UI usa unavailableStoriesIds para mostrar el error correcto. */
            setStoriesCache(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = Array.isArray(results[featureId])
                  ? results[featureId]
                  : [];
              });

              return next;
            });

            setUnavailableStoriesIds(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                if (unavailableIds.has(featureId)) {
                  next[featureId] = true;
                } else {
                  delete next[featureId];
                }
              });

              return next;
            });
          })
          .catch(error => {
            console.error(
              'Error loading Stories/Bugs batch:',
              error
            );

            /*  Un error HTTP general no permite saber qué Feature falló. Marcamos todos los IDs de esta solicitud como unavailable, evitando reintentos automáticos repetidos cada vez que la página vuelva a renderizarse. */
            setStoriesCache(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = [];
              });

              return next;
            });

            setUnavailableStoriesIds(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = true;
              });

              return next;
            });
          })
          .finally(() => {
            ids.forEach(featureId => {
              storiesRequestInFlightRef.current.delete(featureId);
            });
            
            setLoadingStoriesIds(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = false;
              });

              return next;
            });
          });
      };

   /*   useEffect(() => {

    */

      /*─ Renderiza el header de la línea de tiempo (meses o semanas). Vive dentro de la tabla para que use exactamente el mismo ancho que las barras, marcadores y líneas del Timeline.*/
      function TimelineSubHeader({ isWeekMode, timelineOffset, weekOffset }) {
        const dashboardToday = getDashboardNow().startOf('day');

        if (isWeekMode) {
          /*
            Luxon usa lunes como inicio de semana para startOf('week').
            Esto elimina la lógica manual anterior basada en getDay().
          */
          const thisMonday = dashboardToday.startOf('week');

          const groups = [];
          let currentGroup = null;
          for (let i = 0; i < 12; i++) {
            const weekStart = thisMonday.plus({
              weeks: weekOffset + i
            });

            const year = weekStart.year;
            const quarter = Math.floor((weekStart.month - 1) / 3) + 1;
            const quarterKey = year + '-Q' + quarter;

            const label = weekStart
              .setLocale('en-US')
              .toLocaleString({
                month: 'short',
                day: 'numeric'
              });

            if (!currentGroup || currentGroup.key !== quarterKey) {
              currentGroup = { key: quarterKey, label: year + ' · Q' + quarter, weeks: [] };
              groups.push(currentGroup);
            }
            currentGroup.weeks.push(label);
          }

          return (
            <div style={{ width: '100%', minWidth: 0 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
                {groups.map((g, gi) => (
                  <div
                    key={gi}
                    style={{
                      gridColumn: 'span ' + g.weeks.length,
                      background: (() => {
                        const parts = g.key.split('-Q');
                        return (parseInt(parts[0]) * 4 + parseInt(parts[1])) % 2 === 0 ? '#1e3a8a' : '#2563eb';
                      })(),
                      color: 'white',
                      textAlign: 'center',
                      fontSize: '10px',
                      fontWeight: 'bold',
                      padding: '3px 0',
                      borderRadius: '3px'
                    }}
                  >
                    {g.label}
                  </div>
                ))}
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
                {groups.map((g, gi) =>
                  g.weeks.map((week, wi) => (
                    <div key={gi + '-' + wi} style={{ background: '#e2e8f0', textAlign: 'center', fontSize: '9px', fontWeight: 'bold', padding: '3px 0', borderRadius: '3px', color: '#334155' }}>
                      {week}
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        }

        // Modo meses
        const timelineStart = dashboardToday
          .startOf('month')
          .plus({ months: timelineOffset });

        const groups = [];
        let currentGroup = null;

        for (let i = 0; i < 12; i++) {
          const month = timelineStart.plus({ months: i });
          const year = month.year;

          const monthName = month
            .setLocale('en-US')
            .toLocaleString({ month: 'short' });

          if (!currentGroup || currentGroup.year !== year) {
            currentGroup = { year, months: [] };
            groups.push(currentGroup);
          }
          currentGroup.months.push(monthName);
        }

        return (
          <div style={{ width: '100%', minWidth: 0 }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
              {groups.map((g, gi) => (
                <div key={gi} style={{
                    gridColumn: 'span ' + g.months.length,
                    background: gi % 2 === 0 ? '#1e3a8a' : '#2563eb',
                    color: 'white',
                    textAlign: 'center',
                    fontSize: '10px',
                    fontWeight: 'bold',
                    padding: '3px 0',

                    {month}
                  </div>
                ))
              )}
            </div>
          </div>
        );
      }
