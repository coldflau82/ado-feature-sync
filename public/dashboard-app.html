      async function loadFeatures(forceRefresh = false) {
        /* Limpiar el error anterior permite que el estado visual cambie inmediatamente a loading mientras el usuario intenta de nuevo. */
        setLoadError('');

        if (forceRefresh) {
          setRefreshing(true);

          /* Los Features fueron solicitados explícitamente de nuevo. Se invalidan también los detalles dependientes de ellos. */
          setStoriesCache({});
          setUnavailableStoriesIds({});
          setLoadingStoriesIds({});
        
          setRelationshipGraphCache({});
          setUnavailableRelationshipIds({});
          setLoadingRelationshipIds({});
        
          setHistoryCache({});
          setStoryHistoryCache({});
        } else {
          setLoading(true);
        }

        try {
          const url = forceRefresh
            ? '/api/features?refresh=1'
            : '/api/features';

          const res = await fetch(url);

          /* Un endpoint puede devolver un body vacío ante un error de infraestructura. Por eso el parse JSON también se protege. */
          const json = await res.json().catch(() => ({}));

          /* HTTP 4xx / 5xx no debe convertirse en una lista vacía. Se muestra el estado de error y se conserva en consola el
            mensaje seguro proporcionado por el backend. */
          if (!res.ok) {
            throw new Error(
              json.error ||
              'Unable to load Features from Azure DevOps.'
            );
          }

          const receivedWarnings = Array.isArray(json.warnings)
            ? json.warnings
            : [];

          /*
            El backend es la fuente de verdad de la zona de negocio. Se actualiza antes de guardar Features para que el render posterior use la misma zona que Delivery Health.
          */
          if (
            json.dashboard?.timeZone &&
            DateTime.now().setZone(json.dashboard.timeZone).isValid
          ) {
            dashboardTimeZone = json.dashboard.timeZone;
          }
          if (
            json.dashboard?.releaseCalendar &&
            typeof json.dashboard.releaseCalendar === 'object'
          ) {
            releaseCalendar = json.dashboard.releaseCalendar;
          }
          
          setFeatures(Array.isArray(json.features) ? json.features : []);
          setCacheInfo(json.cacheInfo || null);
          setWarnings(receivedWarnings);
          /* Si el usuario había cerrado una advertencia anterior, una carga nueva —especialmente Refresh cache— debe mostrar las advertencias
            vigentes que devuelva el backend. */
          setAreWarningsDismissed(false);
        } catch (err) {
          console.error('Error loading features:', err);

          /* Evita que KPIs, filtros y tablas muestren datos antiguos o interpreten el error como una respuesta válida sin Features. */
          setFeatures([]);
          setWarnings([]);
          setCacheInfo(null);

          setLoadError(
            err?.message ||
            'Unable to load Features from Azure DevOps.'
          );
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      }

      useEffect(() => { loadFeatures(false); }, []);
      useEffect(() => { setExpandedRoadmapFeatureId(null); }, [roadmapPage]);
      useEffect(() => { setExpandedFeatureId(null); }, [featuresPage]);

      const areaPaths = [...new Set(features.map(f => f.areaPath).filter(a => a))].sort();
      const iterations = [...new Set(features.map(f => f.iterationPath).filter(a => a))].sort();
      const states = [...new Set(features.map(f => f.state).filter(a => a))].sort();

      const targetYears = [
        ...new Set(
          features
            .map(f => getDashboardDateTime(f.targetDate)?.year)
            .filter(year => year !== undefined)
        )
      ].sort((a, b) => b - a);

      const releaseVersions = [...new Set(features.map(f => f.releaseFixVersion).filter(v => v))].sort();
      const assignedTos = [...new Set(features.map(f => f.assignedTo).filter(a => a))].sort();
    
      /* Lista de equipos ejecutores obtenida desde Stories/Bugs.
      No se toma del Area Path del Feature: una Feature puede ser responsable de Cart and Checkout y tener ejecución en Service-Online. */
      const deliveryTeams = [
        ...new Map(
          features
            .flatMap(feature => getFeatureExecutionTeams(feature))
            .filter(team => team?.areaPath)
            .map(team => [
              team.areaPath,
              {
                areaPath: team.areaPath,
                name: team.name ||
                  getAreaPathDisplayName(team.areaPath)
              }
            ])
        ).values()
      ].sort((a, b) =>
        a.name.localeCompare(
          b.name,
          undefined,
          { sensitivity: 'base' }
        )
      );
          
      const monthsByYear = {};

      features.forEach(f => {
        const dashboardDate = getDashboardDateTime(f.targetDate);

        if (dashboardDate) {
          const year = dashboardDate.year;
          const monthIndex = dashboardDate.month - 1;

          if (!monthsByYear[year]) {
            monthsByYear[year] = new Set();
          }

          monthsByYear[year].add(monthIndex);
        }
      });

      const [selectedFilterPreset, setSelectedFilterPreset] = useState('my-filter');

      /* Si el usuario modifica manualmente cualquier filtro, ya no está usando exactamente un preset guardado o predefinido. El selector mostrará
        "Custom" para permitir volver a elegir My filter u otro preset. */
      const markPresetAsCustom = () => {
        setSelectedFilterPreset(currentPreset =>
          currentPreset === 'custom'
            ? currentPreset
            : 'custom'
        );
      };
      
      useEffect(() => { const saved = localStorage.getItem(FILTER_STORAGE_KEY);
        if (!saved) {
          return;
        }
        try {
          const parsed = JSON.parse(saved);
          setFilterAreaPath(parsed.filterAreaPath || []);
          setFilterIteration(parsed.filterIteration || []);
          setFilterAssignedTo(parsed.filterAssignedTo || []);
          setFilterDeliveryTeam( parsed.filterDeliveryTeam || []);
          setFilterState(parsed.filterState || []);
          setFilterTargetDate(parsed.filterTargetDate || []);
          setFilterReleaseVersion(parsed.filterReleaseVersion || []);
          setReadinessDropdownFilter(
            parsed.readinessDropdownFilter || 'All'
          );
          setHealthRuleFilter(parsed.healthRuleFilter || 'All');
          setReadinessKpiFilter('All');
          setHealthGroupKpiFilter('All');
        } catch (error) {
          console.error('Unable to load My filter:', error);
        }
      }, []);
      
      // Applies every dashboard filter except Readiness. This collection is used by the Readiness overview counters.
      const filteredBeforeReadiness = features.filter(f => {
        const areaOk = filterAreaPath.length === 0 ||filterAreaPath.includes(f.areaPath);
        const iterOk = filterIteration.length === 0 || filterIteration.includes(f.iterationPath);
        const stateOk = filterState.length === 0 || filterState.includes(f.state);
        const assignedOk = filterAssignedTo.length === 0 || filterAssignedTo.includes(f.assignedTo);
        const deliveryTeamOk = filterDeliveryTeam.length === 0 || filterDeliveryTeam.some(areaPath => featureHasExecutionTeam(f, areaPath) );

        let dateOk = filterTargetDate.length === 0;

        if (filterTargetDate.length > 0 && f.targetDate) {
          /* No usar Date#getFullYear() ni Date#getMonth() aquí: esos métodos usan la zona local del navegador.
            getDashboardDateTime() conserva la interpretación oficial de la fecha bajo America/Chicago. */
          const dashboardDate = getDashboardDateTime(f.targetDate);

          if (dashboardDate) {
            const yearMonthKey =
              `${dashboardDate.year}-${dashboardDate.month - 1}`;

            const yearKey = String(dashboardDate.year);

            dateOk =
              filterTargetDate.includes(yearMonthKey) ||
              filterTargetDate.includes(yearKey);
          }
        }

        const normalizedSearch = searchTitle.toLowerCase();

        const searchOk =
          searchTitle === '' ||
          (f.title || '')
            .toLowerCase()
            .includes(normalizedSearch) ||
          (f.tags || '')
            .toLowerCase()
            .includes(normalizedSearch);

        const releaseOk =
          filterReleaseVersion.length === 0 ||
          filterReleaseVersion.includes(f.releaseFixVersion);
      
        return (
          areaOk &&
          iterOk &&
          stateOk &&
          dateOk &&
          searchOk &&
          releaseOk &&
          assignedOk && 
          deliveryTeamOk
        );
      });
      
      // The overview always represents the current selection from all filters other than Readiness.
      const readinessCounts = {
        total: filteredBeforeReadiness.length,
        healthy: filteredBeforeReadiness.filter(f => getFeatureReadiness(f) === 'Healthy').length,
        incomplete: filteredBeforeReadiness.filter(f => getFeatureReadiness(f) === 'Incomplete').length,
        unknown: filteredBeforeReadiness.filter(f => getFeatureReadiness(f) === 'Unknown').length
      };

      /* Los contadores usan todas las alertas aplicables de cada Feature, no solamente el estado principal del badge.
        not-started queda fuera de los KPI: es un estado informativo que podrá revisarse posteriormente mediante un filtro específico.*/
      
      /* Los grupos vienen directamente desde el backend.
        - alertas: Requires Action / Requires Attention;
        - primary: permite identificar Healthy, porque los Features sanos
          tienen alerts: [] y primary.group === 'healthy';
        - Not started conserva group: 'not-started' y queda fuera de KPI. */
      
      function getDeliveryHealthGroups(feature) {
        const groups = new Set();

        const primary = feature.deliveryHealth?.primary;
        if (primary?.group) {
          groups.add(primary.group);
        }

        const alerts = feature.deliveryHealth?.alerts;

        if (Array.isArray(alerts)) {
          alerts.forEach(alert => {
            if (alert?.group) {
              groups.add(alert.group);
            }
          });
        }

        return groups;
      }
          
      const deliveryHealthCounts = {
        requiresAction: filteredBeforeReadiness.filter(feature =>
          getDeliveryHealthGroups(feature).has('requires-action')
        ).length,

        requiresAttention: filteredBeforeReadiness.filter(feature =>
          getDeliveryHealthGroups(feature).has('requires-attention')
        ).length,

        healthy: filteredBeforeReadiness.filter(feature =>
          getDeliveryHealthGroups(feature).has('healthy')
        ).length
      };
      
      /* Aplica el filtro de Readiness después de calcular los contadores.
      Readiness puede originarse desde uno de dos controles independientes:
        1. Una tarjeta KPI.
        2. El dropdown superior.
      Normalmente sólo uno estará activo porque las acciones KPI limpian los dropdowns. Sin embargo, esta lógica es segura incluso si ambos recibieran valores por cualquier motivo. */
      const filteredByReadiness = filteredBeforeReadiness.filter(feature => {
        const readiness = getFeatureReadiness(feature);
        const matchesReadinessKpi = readinessKpiFilter === 'All' || readiness === readinessKpiFilter;
        const matchesReadinessDropdown = readinessDropdownFilter === 'All' || readiness === readinessDropdownFilter;
        return matchesReadinessKpi && matchesReadinessDropdown;
      });

      /* Las tarjetas de Health usan las alertas individuales, no solamente la alerta principal mostrada por el badge.
         Esto permite que, si un Feature tiene más de una alarma, aparezca dentro de cada grupo que le corresponda. */
      const filtered = filteredByReadiness.filter(f => {
        const delivery = getDeliveryHealth(f);

        const healthRuleKeys = new Set([
          delivery.key,
          ...getDeliveryHealthAlerts(f).map(alert => alert.key)
        ]);

        const healthGroups = getDeliveryHealthGroups(f);
      
        const matchesHealthGroupKpi = (() => {
          if (healthGroupKpiFilter === 'All') {
            return true;
          }
        
          if (healthGroupKpiFilter === 'requires-action') {
            return healthGroups.has('requires-action');
          }
        
          if (healthGroupKpiFilter === 'requires-attention') {
            return healthGroups.has('requires-attention');
          }
        
          if (healthGroupKpiFilter === 'healthy') {
            return healthGroups.has('healthy');
          }
        
          return true;
        })();
      
        const matchesHealthRule =
          healthRuleFilter === 'All' ||
          healthRuleKeys.has(healthRuleFilter);
      
        return matchesHealthGroupKpi && matchesHealthRule;
      });

      let sortedFiltered = [...filtered];
      if (sortColumn) {
        sortedFiltered.sort((a, b) => {
          let valA = '', valB = '';
          if (sortColumn === 'id') { valA = a.id; valB = b.id; }
          else if (sortColumn === 'title') { valA = (a.title || '').toLowerCase(); valB = (b.title || '').toLowerCase(); }
          else if (sortColumn === 'areaPath') { valA = (a.areaPath || '').toLowerCase(); valB = (b.areaPath || '').toLowerCase(); }
          else if (sortColumn === 'iteration') {
            const extractYearQuarter = (path) => {
              const yearMatch = (path || '').match(/(\d{4})/);
              const quarterMatch = (path || '').match(/Q(\d)/);
              const year = yearMatch ? parseInt(yearMatch[1]) : 9999;
              const quarter = quarterMatch ? parseInt(quarterMatch[1]) : 9;
              return year * 10 + quarter;
            };
            valA = extractYearQuarter(a.iterationPath);
            valB = extractYearQuarter(b.iterationPath);
          }
          else if (sortColumn === 'priority') {
            /* Features sin Priority se muestran después de cualquier Priority numérica. Number.MAX_SAFE_INTEGER es mayor que cualquier valor real de prioridad. */
            valA = a.priority === null || a.priority === undefined || a.priority === '' ? Number.MAX_SAFE_INTEGER : parseInt(a.priority, 10);        
            valB = b.priority === null || b.priority === undefined || b.priority === '' ? Number.MAX_SAFE_INTEGER : parseInt(b.priority, 10);
          }
            else if (sortColumn === 'state') { valA = (a.state || '').toLowerCase(); valB = (b.state || '').toLowerCase(); }
            else if (sortColumn === 'targetDate') { valA = (a.targetDate || ''); valB = (b.targetDate || ''); }
            else if (sortColumn === 'assignedTo') { valA = (a.assignedTo || '').toLowerCase(); valB = (b.assignedTo || '').toLowerCase(); }
            else if (sortColumn === 'readiness') { const readinessOrder = { 'Incomplete': 1, 'Unknown': 2, 'Healthy': 3 }; valA = readinessOrder[getFeatureReadiness(a)] || 4; valB = readinessOrder[getFeatureReadiness(b)] || 4; }
            if (sortOrder === 'asc') return valA < valB ? -1 : valA > valB ? 1 : 0;
            else return valA > valB ? -1 : valA < valB ? 1 : 0;
          });
        }

      /* Se usa para diferenciar:
        - no existen Features en el alcance configurado;
        - sí hay Features cargadas, pero ninguna coincide con los filtros. */
      const hasActiveDashboardFilters =
        filterAreaPath.length > 0 ||
        filterIteration.length > 0 ||
        filterAssignedTo.length > 0 ||
        filterDeliveryTeam.length > 0 ||
        filterState.length > 0 ||
        filterTargetDate.length > 0 ||
        filterReleaseVersion.length > 0 ||
        readinessKpiFilter !== 'All' ||
        healthGroupKpiFilter !== 'All' ||
        readinessDropdownFilter !== 'All' ||
        healthRuleFilter !== 'All' ||
        searchTitle.trim() !== '';

      /* Genera el mismo estado visual en Feature List y Roadmap. No se muestran tablas vacías sin explicación. */
      const renderDashboardResultsState = () => {
        if (loadError) {
          return (
            <DashboardResultsState
              type="error"
              onRetry={() => loadFeatures(false)}
              retrying={loading || refreshing}
            />
          );
        }

        if (loading) {
          return (
            <DashboardResultsState
              type="loading"
            />
          );
        }

        if (sortedFiltered.length === 0) {
          return (
            <DashboardResultsState
              type={
                hasActiveDashboardFilters
                  ? 'empty-filtered'
                  : 'empty-global'
              }
              onClearFilters={clearAllFilters}
            />
          );
        }

        return null;
      };

      /* Carga Stories/Bugs de múltiples Features con UNA llamada HTTP.
        Esta función centraliza los cuatro escenarios que antes usaban fetch('/api/feature-stories/:id') individualmente:
        1. Precarga de los Features visibles en Feature List.
        2. Apertura de History.
        3. Apertura de Delivery Health.
        4. Expansión de una fila del Roadmap. */
      const loadStoriesForFeatures = (featureIds) => {
        const ids = [
          ...new Set(
            (featureIds || [])
              .map(Number)
              .filter(id => Number.isInteger(id) && id > 0)
          )
        ].filter(featureId =>
          !Object.prototype.hasOwnProperty.call(
            storiesCache,
            featureId
          ) &&
          !loadingStoriesIds[featureId] &&
          !unavailableStoriesIds[featureId] &&
          !storiesRequestInFlightRef.current.has(featureId)
        );

        if (ids.length === 0) {
          return;
        }
        
        ids.forEach(featureId => {
          storiesRequestInFlightRef.current.add(featureId);
        });
        
        /* Marcamos todos los IDs antes de realizar fetch para evitar peticiones repetidas mientras React procesa el siguiente render. */
        setLoadingStoriesIds(previous => {
          const next = { ...previous };

          ids.forEach(featureId => {
            next[featureId] = true;
          });

          return next;
        });

        fetch('/api/features-stories-batch', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ids })
        })
        .then(response =>
          parseApiJsonResponse(
            response,
            'Unable to load Stories/Bugs for the selected Features.'
          )
        )
          .then(data => {
            const results = data.results || {};
            const unavailableIds = new Set(
              (data.unavailableFeatureIds || [])
                .map(Number)
                .filter(Number.isInteger)
            );

            /* Guardamos un arreglo por cada ID solicitado, incluso cuando esté unavailable. Esto evita una precarga infinita. La UI usa unavailableStoriesIds para mostrar el error correcto. */
            setStoriesCache(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = Array.isArray(results[featureId])
                  ? results[featureId]
                  : [];
              });

              return next;
            });

            setUnavailableStoriesIds(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                if (unavailableIds.has(featureId)) {
                  next[featureId] = true;
                } else {
                  delete next[featureId];
                }
              });

              return next;
            });
          })
          .catch(error => {
            console.error(
              'Error loading Stories/Bugs batch:',
              error
            );

            /*  Un error HTTP general no permite saber qué Feature falló. Marcamos todos los IDs de esta solicitud como unavailable, evitando reintentos automáticos repetidos cada vez que la página vuelva a renderizarse. */
            setStoriesCache(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = [];
              });

              return next;
            });

            setUnavailableStoriesIds(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = true;
              });

              return next;
            });
          })
          .finally(() => {
            ids.forEach(featureId => {
              storiesRequestInFlightRef.current.delete(featureId);
            });
            
            setLoadingStoriesIds(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = false;
              });

              return next;
            });
          });
      };

      const toggleFeatureDetails = (featureId) => {
        const isAlreadyOpen = expandedFeatureId === featureId;

        if (isAlreadyOpen) {
          setExpandedFeatureId(null);
          return;
        }

        setExpandedFeatureId(featureId);

        /* Ambas solicitudes son independientes y pueden ejecutarse en paralelo. Cada función ya tiene protección contra:
          - datos existentes en caché;
          - solicitudes en progreso;
          - duplicados generados por renders consecutivos. */
        loadStoriesForFeatures([featureId]);

        loadRelationshipGraphForFeatures([featureId]);
      };

      const deliveryHealthRuleOptions = [
        { key: 'healthy', label: 'Healthy'},
        { key: 'overdue', label: 'Overdue' },
        { key: 'target-date-near-unscheduled-discovery', label: 'Target date near' },
        { key: 'target-next-month-without-release', label: 'Target date near w/o RFV' },
        { key: 'closed-with-open-work', label: 'Closed w/open work' },
        { key: 'unable-to-evaluate', label: 'Unable to evaluate' },
        { key: 'needs-estimate', label: 'Needs High Level Estimation' },
        { key: 'no-stories', label: 'No Stories' },
        { key: 'no-active-work', label: 'No active work' },
        { key: 'unestimated-work', label: 'No estimated work' },
        { key: 'not-started', label: 'Not started' },
      ];

      const featuresItemsPerPage = 15;
      const featuresTotalPages =  Math.max( 1, Math.ceil(sortedFiltered.length / featuresItemsPerPage));
      const featuresStartIdx = (featuresPage - 1) * featuresItemsPerPage;
      const featuresPageItems = sortedFiltered.slice(featuresStartIdx, featuresStartIdx + featuresItemsPerPage);

       /* Los dos handlers centralizan:
        - límites mínimos y máximos;
        - cierre de paneles expandidos;
        - retorno al inicio del panel de resultados. */
      const changeFeaturesPage = (nextPage) => {
        const targetPage = Math.max( 1, Math.min(featuresTotalPages, Number(nextPage) || 1));
        if (targetPage === featuresPage) { return; }
        setFeaturesPage(targetPage);
        setExpandedFeatureId(null);

        requestAnimationFrame(() => { scrollResultsToTop('smooth'); });
      };

      /* Precarga los Stories/Bugs de los 15 Features visibles con una sola petición al backend, solamente cuando Feature List está activa.
        En Roadmap no necesitamos esta carga para todas las Features visibles: las Stories/Bugs se solicitan únicamente al expandir una Feature.
        Esto evita competir con las solicitudes de historial del Roadmap. */
      useEffect(() => { if (currentPage !== 'features') {
          return;
        }
        const featuresToLoad = featuresPageItems
          .map(feature => feature.id)
          .filter(featureId =>
            !Object.prototype.hasOwnProperty.call(
              storiesCache,
              featureId
            ) &&
            !loadingStoriesIds[featureId] &&
            !unavailableStoriesIds[featureId]
          );

        if (featuresToLoad.length === 0) {
          return;
        }

        loadStoriesForFeatures(featuresToLoad);
      }, [currentPage,
          featuresPage,
          sortedFiltered.length,
          filterAreaPath.join(','),
          filterIteration.join(','),
          filterState.join(','),
          filterTargetDate.join(','),
          filterReleaseVersion.join(','),
          filterAssignedTo.join(','),
          filterDeliveryTeam.join(','),
          readinessKpiFilter,
          healthGroupKpiFilter,
          readinessDropdownFilter,
          healthRuleFilter,
          searchTitle]);

      const toggleRoadmapFeature = (featureId) => {
        if (expandedRoadmapFeatureId === featureId) {
          setExpandedRoadmapFeatureId(null);
          return;
        }

        setExpandedRoadmapFeatureId(featureId);

        /*
          En móvil, el navegador conserva scroll natural. No hacemos
          scroll automático aquí para evitar que la card expandida se
          desplace inesperadamente mientras cargan Stories o timelines.
        */
        loadStoriesForFeatures([featureId]);
      };

      const adoLink = (id) =>
        `https://dev.azure.com/tr-commercial-eng/Commercial%20Engineering/_workitems/edit/${id}`;

      const formatDate = (date) => {
        const parsedDate = parseDashboardDate(date);

        if (!parsedDate || Number.isNaN(parsedDate.getTime())) {
          return '-';
        }

        return parsedDate.toLocaleDateString(
          'es-CO',
          {
            timeZone: dashboardTimeZone
          }
        );
      };

      const itemsPerPage = 15;
      const totalPages = Math.max( 1, Math.ceil(sortedFiltered.length / itemsPerPage));
      const startIdx = (roadmapPage - 1) * itemsPerPage;
      const pageItems = sortedFiltered.slice(startIdx, startIdx + itemsPerPage);
      const pageItemIds = pageItems.map(item => item.id).join(',');

      const changeRoadmapPage = (nextPage) => {
        const targetPage = Math.max( 1, Math.min(totalPages, Number(nextPage) || 1) );
        if (targetPage === roadmapPage) { return; }

        setRoadmapPage(targetPage);
        setExpandedRoadmapFeatureId(null);

        requestAnimationFrame(() => {
          scrollResultsToTop('smooth');
        });
      };
    
      const expandedRoadmapStories = expandedRoadmapFeatureId ? (storiesCache[expandedRoadmapFeatureId] || []) : [];
      const expandedStoryIds = expandedRoadmapStories.map(s => s.id).join(',');
    
      useEffect(() => {

        const ids = pageItems.map(item => item.id).filter(id => !historyCache[id]);
        if (ids.length === 0) return;
        setLoadingHistory(true);
        fetch('/api/features-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids })
        })
          .then(response =>
            parseApiJsonResponse(

          )
          .then(data => {
            setHistoryCache(previous => ({
              ...previous,
              ...(data.results || {})
            }));
          })
          .catch(error => {
            console.error(
              'Error loading Feature timeline history:',

            );
          })
          .finally(() => {
            setLoadingHistory(false);
          });
       }, [pageItemIds, currentPage]);

   /*   useEffect(() => {
        if (currentPage !== 'roadmap') return;
        const nextStart = roadmapPage * itemsPerPage;
        const nextPageItems = sortedFiltered.slice(nextStart, nextStart + itemsPerPage);
        if (nextPageItems.length === 0) return;
        const ids = nextPageItems.map(item => item.id).filter(id => !historyCache[id]);
        if (ids.length === 0) return;
        fetch('/api/features-history-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },

        })
          .then(r => r.json())
          .then(d => {

      }, [roadmapPage, currentPage, sortedFiltered.length, filterAreaPath.join(','), filterIteration.join(','), filterState.join(','), filterTargetDate.join(','), filterReleaseVersion.join(','), filterAssignedTo.join(','), readinessDropdownFilter, searchTitle]);
    */
    useEffect(() => {
      if ( !expandedRoadmapFeatureId || expandedRoadmapStories.length === 0 ) {

        .map(story => Number(story.id))

        );

      .then(response =>

        .then(data => {

          setStoryHistoryCache(previous => {

    }, [

        function FeatureTooltipContent({ feature }) {
        /*
          Reutilizamos exactamente la lógica de display ya utilizada en la columna Iteration: tomar el último segmento del path.
          Area: Commercial Engineering\Digital\Acquisition\Global Product 1 → Global Product 1
          Iteration: Commercial Engineering\2026\Q4  → Q4 */
        const shortArea = feature.areaPath
          ? feature.areaPath.split('\\').pop()
          : '—';

        const shortIteration = feature.iterationPath
          ? feature.iterationPath.split('\\').pop()
          : '—';

        return (
          <div className="feature-list-tooltip">
            <strong>
              #{feature.id} — {feature.title || 'Untitled Feature'}
            </strong>
            <div>
                Area Path: {shortArea}
            </div>
            <div>
              Iteration Path: {shortIteration}
            </div>
            <div>
              Assigned to: {feature.assignedTo || '—'}
            </div>
            <div>
              Release Fix Version: {feature.releaseFixVersion || '—'}
            </div>
            <div>
              Tech Go Live RFV: {feature.techGoLiveRFV || '—'}
            </div>
          </div>
        );
      }

      const handleSortColumn = (column) => {
        setSortColumn(column);

        setSortOrder(currentOrder => {
          if (sortColumn === column) {
            return currentOrder === 'asc' ? 'desc' : 'asc';
          }

          return 'asc';
        });

        setFeaturesPage(1);
        setRoadmapPage(1);

        requestAnimationFrame(() => {
          scrollResultsToTop('smooth');
        });
      };

      const getSortIndicator = (column) => {
        if (sortColumn !== column) {
          return '';
        }

        return sortOrder === 'asc' ? ' ▲' : ' ▼';
      };
      
      /*─ Renderiza el header de la línea de tiempo (meses o semanas). Vive dentro de la tabla para que use exactamente el mismo ancho que las barras, marcadores y líneas del Timeline.*/
      function TimelineSubHeader({ isWeekMode, timelineOffset, weekOffset }) {
        const dashboardToday = getDashboardNow().startOf('day');

        if (isWeekMode) {
          /*
            Luxon usa lunes como inicio de semana para startOf('week').
            Esto elimina la lógica manual anterior basada en getDay().
          */
          const thisMonday = dashboardToday.startOf('week');

          const groups = [];
          let currentGroup = null;
          for (let i = 0; i < 12; i++) {
            const weekStart = thisMonday.plus({
              weeks: weekOffset + i
            });

            const year = weekStart.year;
            const quarter = Math.floor((weekStart.month - 1) / 3) + 1;
            const quarterKey = year + '-Q' + quarter;

            const label = weekStart
              .setLocale('en-US')
              .toLocaleString({
                month: 'short',
                day: 'numeric'
              });

            if (!currentGroup || currentGroup.key !== quarterKey) {
              currentGroup = { key: quarterKey, label: year + ' · Q' + quarter, weeks: [] };
              groups.push(currentGroup);
            }
            currentGroup.weeks.push(label);
          }

          return (
            <div style={{ width: '100%', minWidth: 0 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
                {groups.map((g, gi) => (
                  <div
                    key={gi}
                    style={{
                      gridColumn: 'span ' + g.weeks.length,
                      background: (() => {
                        const parts = g.key.split('-Q');
                        return (parseInt(parts[0]) * 4 + parseInt(parts[1])) % 2 === 0 ? '#1e3a8a' : 'var(--accent)';
                      })(),
                      color: 'white',
                      textAlign: 'center',
                      fontSize: '10px',
                      fontWeight: 'bold',
                      padding: '3px 0',
                      borderRadius: '3px'
                    }}
                  >
                    {g.label}
                  </div>
                ))}
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
                {groups.map((g, gi) =>
                  g.weeks.map((week, wi) => (
                    <div key={gi + '-' + wi} style={{ background: 'var(--neutral-soft)', textAlign: 'center', fontSize: '9px', fontWeight: 'bold', padding: '3px 0', borderRadius: '3px', color: '#334155' }}>
                      {week}
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        }

        // Modo meses
        const timelineStart = dashboardToday
          .startOf('month')
          .plus({ months: timelineOffset });

        const groups = [];
        let currentGroup = null;

        for (let i = 0; i < 12; i++) {
          const month = timelineStart.plus({ months: i });
          const year = month.year;

          const monthName = month
            .setLocale('en-US')
            .toLocaleString({ month: 'short' });

            groups.push(currentGroup);
          }
          currentGroup.months.push(monthName);

                    textAlign: 'center',
                    fontSize: '10px',
                    fontWeight: 'bold',
                    padding: '3px 0',
                    borderRadius: '3px'
                  }}

                  {g.year}
                </div>

                  </div>

            </div>

                  Delivery Health, Delivery Activity, and associated Stories and Bugs.

                      formatDate={formatDate}

                      isExpanded={

                      onToggle={() =>
                        toggleFeatureDetails(feature.id)

                      storiesCache={storiesCache}
                      loadingStoriesIds={loadingStoriesIds}
                      unavailableStoriesIds={unavailableStoriesIds}

                        relationshipGraphCache[feature.id]

                      relationshipLoading={
                        !!loadingRelationshipIds[feature.id]

                      relationshipUnavailable={
                        !!unavailableRelationshipIds[feature.id]
                      }
                      onLoadRelationships={() =>

                      onRetryRelationships={() =>
                        loadRelationshipGraphForFeatures(

                {/* Tabla exclusiva para desktop/tablet. */}
                <div className="table-wrapper feature-list-table-wrapper">
                <table className="feature-list-table">

                    <col className="feature-list-col--priority" />

                    <col className="feature-list-col--planned-month" />
                    <col className="feature-list-col--estimate" />
                    <col className="feature-list-col--estimate" />
                    <col className="feature-list-col--estimate" />
                    <col className="feature-list-col--state" />

                    <col className="feature-list-col--delivery" />

                              : 'asc'

                          setFeaturesPage(1);
                        }}
                      >
                        Priority{' '}
                        {sortColumn === 'priority'
                          ? sortOrder === 'asc'
                            ? '▲'
                            : '▼'
                          : ''}
                      </th>
                      
                      <th
                        style={{ cursor: 'pointer' }}
                        onClick={() => {
                          setSortColumn('id');
                          setSortOrder(
                            sortColumn === 'id' && sortOrder === 'asc'
                              ? 'desc'
                              : 'asc'
                          );
                          setFeaturesPage(1);
                        }}
                      >
                        ID{' '}
                        {sortColumn === 'id'
                          ? sortOrder === 'asc'
                            ? '▲'
                            : '▼'
                          : ''}
                      </th>
                      
                      <th
                        style={{ cursor: 'pointer' }}
                        onClick={() => {
                          setSortColumn('title');
                          setSortOrder(
                            sortColumn === 'title' && sortOrder === 'asc'
                              ? 'desc'
                              : 'asc'
                          );
                          setFeaturesPage(1);
                        }}
                      >
                        Feature{' '}
                        {sortColumn === 'title'
                          ? sortOrder === 'asc'
                            ? '▲'
                            : '▼'
                          : ''}
                      </th>
        
                      <th
                        style={{ cursor: 'pointer' }}
                        onClick={() => {
                          setSortColumn('targetDate');
                          setSortOrder(
                            sortColumn === 'targetDate' && sortOrder === 'asc'
                              ? 'desc'
                              : 'asc'
                          );
                          setFeaturesPage(1);
                        }}
                      >
                        Target Date{' '}
                        {sortColumn === 'targetDate'
                          ? sortOrder === 'asc'
                            ? '▲'
                            : '▼'
                          : ''}
                      </th>
        
                      <thth title="Release Fix Version">RFV</th>
                      <th>BE</th>
                      <th>FE</th>
                      <th>QA</th>
        
                      <th
                        style={{ cursor: 'pointer' }}
                        onClick={() => {
                          setSortColumn('state');
                          setSortOrder(
                            sortColumn === 'state' && sortOrder === 'asc'
                              ? 'desc'
                              : 'asc'
                          );
                          setFeaturesPage(1);
                        }}
                      >
                        State{' '}
                        {sortColumn === 'state'
                          ? sortOrder === 'asc'
                            ? '▲'
                            : '▼'
                          : ''}
                      </th>
        
                      <th
                        style={{
                          textAlign: 'center',
                          cursor: 'pointer'
                        }}
                        onClick={() => {
                          setSortColumn('readiness');
                          setSortOrder(
                            sortColumn === 'readiness' && sortOrder === 'asc'
                              ? 'desc'
                              : 'asc'
                          );
                          setFeaturesPage(1);
                        }}
                      >
                        Readiness{' '}
                        {sortColumn === 'readiness'
                          ? sortOrder === 'asc'
                            ? '▲'
                            : '▼'
                          : ''}
                      </th>
        
                      <th style={{ textAlign: 'center' }}>
                        Delivery Health
                      </th>
        
                      <th style={{ textAlign: 'center' }}>
                        Progress
                      </th>
                    </tr>
                  </thead>
        
                  <tbody>
                    {featuresPageItems.length === 0 ? (
                      <tr>
                        <td
                          colSpan="12"
                          style={{
                            padding: '28px',
                            textAlign: 'center',
                            color: 'var(--text-tertiary)'
                          }}
                        >
                          No Features match the selected filters.
                        </td>
                      </tr>
                    ) : (
                      featuresPageItems.map(f => {
                        const featureStateDot = {
                          New: '#94a3b8',
                          'In Shaping': '#fbbf24',
                          'In Planning': '#fb923c',
                          Planned: '#34d399',
                          'In Process': '#60a5fa',
                          Closed: '#a78bfa'
                        }[f.state] || '#ccc';
        
                       const isFeatureExpanded = expandedFeatureId === f.id;
        
                        return (
                          <React.Fragment key={f.id}>
                            <tr
                              className={[
                                'feature-row--expandable',
                                isFeatureExpanded ? 'feature-row--expanded' : ''
                              ].filter(Boolean).join(' ')}
                              style={{
                                background: 'white',
                                borderLeft: `3px solid ${featureStateDot}`
                              }}
                              onClick={() => toggleFeatureDetails(f.id)}
                              onKeyDown={(event) => {
                                if (event.key === 'Enter' || event.key === ' ') {
                                  event.preventDefault();
                                  toggleFeatureDetails(f.id);
                                }
                              }}
                              role="button"
                              tabIndex="0"
                              aria-expanded={isFeatureExpanded}
                              aria-controls={`feature-details-panel-${f.id}`}
                              aria-label={
                                isFeatureExpanded
                                  ? `Collapse details for Feature ${f.id}`
                                  : `Expand details for Feature ${f.id}`
                              }
                            >
                              <td>{f.priority || '-'}</td>
                            <td>
                              <a
                                href={adoLink(f.id)}
                                target="_blank"
                                rel="noopener noreferrer"
                                onClick={(event) => event.stopPropagation()}
                                onKeyDown={(event) => event.stopPropagation()}
                                aria-label={`Open Feature ${f.id} in Azure DevOps`}
                              >
                                {f.id}
                              </a>
                            </td>
                            
                            <td className="feature-list-title-cell">
                              <span
                                className="feature-title"
                                style={{
                                  overflow: 'hidden',
                                  textOverflow: 'ellipsis',
                                  whiteSpace: 'nowrap',
                                  display: 'block'
                                }}
                                onMouseEnter={(event) =>
                                  showTooltip(
                                    event,
                                    <FeatureTooltipContent feature={f} />
                                  )
                                }
                                onMouseMove={moveTooltip}
                                onMouseLeave={hideTooltip}
                              >
                                {f.title}
                              </span>
                            </td>
        
                              <td className="feature-list-date-cell">
                                <TargetDateCell
                                  targetDate={f.targetDate}
                                  featureState={f.state}
                                  formatDate={formatDate}
                                />
                              </td>
        
                              <td className="feature-list-date-cell">
                                <ReleaseFixVersionCell value={f.releaseFixVersion}
                                />
                              </td>
        
                              <td>{f.estimation?.be || '-'}</td>
                              <td>{f.estimation?.fe || '-'}</td>
                              <td>{f.estimation?.qa || '-'}</td>
        
                              <td>
                                <span className="feature-state-cell">
                                  <span
                                    className="feature-state-dot"
                                    style={{ background: featureStateDot }}
                                  />
                                  <span>{f.state || '-'}</span>
                                </span>
                              </td>
        
                              <td className="feature-list-centered-cell">
                                <ReadinessBadge
                                  readiness={getFeatureReadiness(f)}
                                />
                              </td>
                              
                              <td className="feature-list-centered-cell">
                                {(() => {
                                  const delivery = getDeliveryHealth(f);
                              
                                  return (
                                    <span
                                      className={`delivery-badge ${delivery.className}`}
                                      aria-label={`Delivery health: ${delivery.label}`}
                                      title={`Delivery health: ${delivery.label}`}
                                    >
                                      <span className="delivery-badge__icon" aria-hidden="true">
                                        {delivery.icon}
                                      </span>
                              
                                      <span className="delivery-badge__label">
                                        {delivery.shortLabel}
                                      </span>
                                    </span>
                                  );
                                })()}
                              </td>
                              <td className="feature-list-progress-cell">
                                <DeliveryProgressBar
                                  summary={getFeatureDeliverySummary(
                                    f,
                                    storiesCache
                                  )}
                                />
                              </td>
                            </tr>
        
                            {isFeatureExpanded && (
                              <tr style={{ background: '#f9f9f9' }}>
                                <td
                                  id={`feature-details-panel-${f.id}`}
                                  colSpan="12"
                                  style={{
                                    paddingLeft: '20px',
                                    paddingTop: '12px',
                                    paddingBottom: '12px',
                                    paddingRight: '20px'
                                  }}
                                >
                                  <div className="feature-detail-panel">
                                    {loadingStoriesIds[f.id] ? (
                                      <>
                                        <FeatureStatusDetails feature={f} />

                                        <div className="feature-detail-panel__divider" />

                                        <div className="feature-detail-panel-message">
                                          Loading Stories and Bugs...
                                        </div>
                                      </>
                                    ) : unavailableStoriesIds[f.id] ? (
                                      <>
                                        <FeatureStatusDetails feature={f} />

                                        <div className="feature-detail-panel__divider" />

                                        <div className="feature-detail-panel-warning">
                                          Stories and Bugs could not be fully retrieved from Azure DevOps.
                                          Delivery Health rules remain based on the server-provided Feature
                                          summary.
                                        </div>
                                      </>
                                    ) : (
                                      <FeatureDeliveryDetails
                                        feature={f}
                                        stories={storiesCache[f.id] || []}
                                        deliveryTeamFilter={filterDeliveryTeam}
                                        adoLink={adoLink}
                                        relationshipGraph={relationshipGraphCache[f.id]}
                                        relationshipLoading={!!loadingRelationshipIds[f.id]}
                                        relationshipUnavailable={!!unavailableRelationshipIds[f.id]}
                                        onLoadRelationships={() =>
                                          loadRelationshipGraphForFeatures([f.id])
                                        }
                                        onRetryRelationships={() =>
                                          loadRelationshipGraphForFeatures(
                                            [f.id],
                                            { retry: true }
                                          )
                                        }
                                      />
                                    )}
                                  </div>
                                </td>
                              </tr>
                            )}
                          </React.Fragment>
                        );
                      })
                    )}
                  </tbody>
               </table>
            </div>
            </>
          )}
        </>
      )}
  
     {currentPage === 'roadmap' && (
        <>
          {loadError || loading || sortedFiltered.length === 0 ? (
            renderDashboardResultsState()
          ) : (
            <>
              <div className="dashboard-interaction-hint">
                <strong>Tip:</strong> Tap a Feature card to view Story
                and Bug timelines. The Roadmap line shows Today, Target
                Date and Release Fix Version.
              </div>

              <section
                className="mobile-roadmap-list"
                aria-label="Roadmap mobile cards"
              >
                {pageItems.map(feature => (
                  <MobileRoadmapCard
                    key={feature.id}
                    feature={feature}
                    adoLink={adoLink}
                    formatDate={formatDate}
                    isExpanded={
                      expandedRoadmapFeatureId === feature.id
                    }
                    onToggle={() =>
                      toggleRoadmapFeature(feature.id)
                    }
                    stories={storiesCache[feature.id] || []}
                    loadingStories={
                      !!loadingStoriesIds[feature.id]
                    }
                    storiesUnavailable={
                      !!unavailableStoriesIds[feature.id]
                    }
                    storyHistoryCache={storyHistoryCache}
                    loadingStoryHistoryIds={loadingStoryHistoryIds}
                    featureHistory={historyCache[feature.id] || []}
                    loadingFeatureHistory={loadingHistory}
                    weekOffset={weekOffset}
                  />
                ))}
              </section>

              {/* ── ROADMAP DESKTOP/TABLET ─────────────────────── */}
              <div className="table-wrapper">
                {/* ── TABLA PRINCIPAL DEL ROADMAP ── */}
                {/* El header permanece sticky dentro del único panel de resultados. */}
                <div className="gantt-horizontal-scroll">
                <table className="roadmap-table" style={{ tableLayout: 'fixed', width: '100%' }}>
                  <thead>
                    <tr>
                      <th style={{ width: '40px', textAlign: 'center', cursor: 'pointer', fontSize: '12px', whiteSpace: 'nowrap' }}
                        onClick={() => {
                          setSortColumn('priority');
                          setSortOrder(
                            sortColumn === 'priority' && sortOrder === 'asc'
                              ? 'desc'
                              : 'asc'
                          );
                        }}
                      >
                        P{' '}
                        {sortColumn === 'priority'
                          ? (sortOrder === 'asc' ? '▲' : '▼')
                          : ''}
                      </th>
                  
                      <th style={{ width: '80px' }}>
                        ID
                      </th>
                  
                      <th
                        style={{
                          width: '300px',
                          padding: '12px 4px 12px 12px'
                        }}
                      >
                        <div
                          style={{
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'space-between',
                            height: '100%'
                          }}
                        >
                          <span>Feature</span>
                  
                          <div
                            style={{
                              display: 'flex',
                              alignItems: 'center',
                              gap: '4px',
                              flexShrink: 0
                            }}
                          >
                            <button
                              type="button"
                              title={
                                expandedRoadmapFeatureId !== null
                                  ? 'Previous week'
                                  : 'Previous month'
                              }
                              aria-label={
                                expandedRoadmapFeatureId !== null
                                  ? 'Previous week'
                                  : 'Previous month'
                              }
                              style={{
                                width: '28px',
                                height: '28px',
                                background: '#537fbd',
                                color: 'white',
                                border: 'none',
                                cursor: 'pointer',
                                fontSize: '12px',
                                borderRadius: '4px',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center'
                              }}
                              onClick={() =>
                                expandedRoadmapFeatureId !== null
                                  ? setWeekOffset(weekOffset - 1)
                                  : setTimelineOffset(timelineOffset - 1)
                              }
                            >
                              ◄
                            </button>
                  
                            <button
                              type="button"
                              title={
                                expandedRoadmapFeatureId !== null
                                  ? 'Next week'
                                  : 'Next month'
                              }
                              aria-label={
                                expandedRoadmapFeatureId !== null
                                  ? 'Next week'
                                  : 'Next month'
                              }
                              style={{
                                width: '28px',
                                height: '28px',
                                background: '#537fbd',
                                color: 'white',
                                border: 'none',
                                cursor: 'pointer',
                                fontSize: '12px',
                                borderRadius: '4px',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center'
                              }}
                              onClick={() =>
                                expandedRoadmapFeatureId !== null
                                  ? setWeekOffset(weekOffset + 1)
                                  : setTimelineOffset(timelineOffset + 1)
                              }
                            >
                              ►
                            </button>
                          </div>
                        </div>
                      </th>
                  
                      <th
                        style={{
                          padding: '4px 6px',
                          verticalAlign: 'middle',
                          fontWeight: 'normal'
                        }}
                      >
                        <TimelineSubHeader
                          isWeekMode={expandedRoadmapFeatureId !== null}
                          timelineOffset={timelineOffset}
                          weekOffset={weekOffset}
                        />
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    {(() => {
                      const dashboardToday = getDashboardNow().startOf('day');

                      const monthTimelineStart = dashboardToday
                        .startOf('month')
                        .plus({ months: timelineOffset })
                        .toJSDate();

                      const monthTimelineEnd = dashboardToday
                        .startOf('month')
                        .plus({ months: timelineOffset + 12 })
                        .minus({ days: 1 })
                        .endOf('day')
                        .toJSDate();

                      const weekTimelineStart = dashboardToday
                        .startOf('week')
                        .plus({ weeks: weekOffset })
                        .toJSDate();

                      const weekTimelineEnd = dashboardToday
                        .startOf('week')
                        .plus({ weeks: weekOffset + 12 })
                        .toJSDate();

                      return pageItems.map(f => {
                        const isExpanded = expandedRoadmapFeatureId === f.id;
                        const featureTimelineStart = isExpanded ? weekTimelineStart : monthTimelineStart;
                        const featureTimelineEnd = isExpanded ? weekTimelineEnd : monthTimelineEnd;
                        return (
                          <React.Fragment key={f.id}>
                            <FeatureRow
                              featureId={f.id}
                              title={f.title}
                              assignedTo={f.assignedTo}
                              targetDate={f.targetDate}
                              releaseFixVersion={f.releaseFixVersion}
                              techGoLiveRFV={f.techGoLiveRFV}
                              estimation={f.estimation}
                              priority={f.priority}
                              formatDate={formatDate}
                              timelineStart={featureTimelineStart}
                              timelineEnd={featureTimelineEnd}
                              adoLink={adoLink}
                              isExpanded={isExpanded}
                              onToggleExpand={() => toggleRoadmapFeature(f.id)}
                              states={historyCache[f.id] || []}
                              loading={loadingHistory}
                              showTooltip={showTooltip}
                              moveTooltip={moveTooltip}
                              hideTooltip={hideTooltip}
                            />
                          {isExpanded && (
                            loadingStoriesIds[f.id] ? (
                              <tr style={{ background: '#f2f2f2' }}>
                                <td
                                  colSpan="4"
                                  style={{
                                    padding: '20px',
                                    textAlign: 'center',
                                    color: 'var(--text-tertiary)',
                                    fontSize: '12px'
                                  }}
                                >
                                  Loading Stories and Bugs...
                                </td>
                              </tr>
                            ) : unavailableStoriesIds[f.id] ? (
                              <tr style={{ background: '#fefce8' }}>
                                <td
                                  colSpan="4"
                                  style={{
                                    padding: '20px',
                                    textAlign: 'center',
                                    color: 'var(--warn)',
                                    fontSize: '12px'
                                  }}
                                >
                                  Stories and Bugs could not be fully retrieved
                                  from Azure DevOps. Refresh the dashboard and
                                  try again.
                                </td>
                              </tr>
                            ) : (storiesCache[f.id] || []).length === 0 ? (
                              /* Resultado válido: ADO respondió correctamente, pero este Feature no tiene Stories/Bugs hijos directos.
                                La fila conserva la misma estructura de cuatro columnas usada por StoryRow:
                                - Priority vacía;
                                - identificador informativo;
                                - mensaje dentro del espacio de título;
                                - timeline gris, sin barras de estado. */
                              <tr
                                style={{
                                  borderBottom: '1px solid #eee',
                                  background: '#f2f2f2'
                                }}
                              >
                                <td />

                                <td
                                  style={{
                                    color: 'var(--text-tertiary)',
                                    fontSize: '10px',
                                    fontWeight: '700',
                                    textAlign: 'center'
                                  }}
                                  aria-label="No child work items"
                                  title="No Stories or Bugs"
                                >
                                  —
                                </td>

                                <td
                                  style={{
                                    maxWidth: '300px',
                                    padding: '10px 12px'
                                  }}
                                >
                                  <strong
                                    style={{
                                      display: 'block',
                                      color: '#334155',
                                      fontSize: '10px',
                                      lineHeight: '1.15'
                                    }}
                                  >
                                    No Stories or Bugs are associated with this Feature.
                                  </strong>

                                  <span
                                    style={{
                                      display: 'block',
                                      marginTop: '3px',
                                      color: 'var(--text-tertiary)',
                                      fontSize: '10px',
                                      lineHeight: '1.15'
                                    }}
                                  >
                                    Click the Feature row again to collapse it.
                                  </span>
                                </td>

                                <td style={{ padding: '6px 8px' }}>
                                  <div
                                    style={{
                                      height: '36px',
                                      borderRadius: '4px',
                                      background: '#e0e0e0',
                                      position: 'relative',
                                      overflow: 'hidden'
                                    }}
                                    aria-label="No Story or Bug timeline is available for this Feature"
                                  >
                                    <span
                                      style={{
                                        position: 'absolute',
                                        top: '50%',
                                        left: '8px',
                                        transform: 'translateY(-50%)',
                                        color: '#94a3b8',
                                        fontSize: '11px'
                                      }}
                                    >
                                      No child work items
                                    </span>
                                  </div>
                                </td>
                              </tr>
                            ) : (
                              (storiesCache[f.id] || []).map(s => (
                                <StoryRow
                                  key={s.id}
                                  storyId={s.id}
                                  title={s.title}
                                  storyPoints={s.storyPoints}
                                  state={s.state}
                                  iterationPath={s.iterationPath}
                                  formatDate={formatDate}
                                  timelineStart={weekTimelineStart}
                                  timelineEnd={weekTimelineEnd}
                                  adoLink={adoLink}
                                  states={storyHistoryCache[s.id] || []}
                                  loading={!!loadingStoryHistoryIds[s.id]}
                                  showTooltip={showTooltip}
                                  moveTooltip={moveTooltip}
                                  hideTooltip={hideTooltip}
                                />
                              ))
                            )
                          )}
                          </React.Fragment>
                        );
                      });
                    })()}
                  </tbody>
                </table>
              </div>
            </div>
           </>
            )}
          </>
          )}
          </main>

          {!loading && !loadError && sortedFiltered.length > 0 && (
            <div className="dashboard-pagination-footer">
              {currentPage === 'features' ? (
                <DashboardPagination
                  currentPage={featuresPage}
                  totalPages={featuresTotalPages}
                  onPageChange={changeFeaturesPage}
                  ariaLabel="Feature List pagination"
                />
              ) : (
                <DashboardPagination
                  currentPage={roadmapPage}
                  totalPages={totalPages}
                  onPageChange={changeRoadmapPage}
                  ariaLabel="Roadmap pagination"
                />
              )}
            </div>
          )}
          <Tooltip tooltip={tooltip} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>
