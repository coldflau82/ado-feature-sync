    /* ── Clasificación única de Features & Stories ── */
    const deliveryInPlanningStates = [
      'New',
      'Business Refinement',
      'Technical Refinement',
      'Ready for Development'
    ];
    
    const deliveryInProgressStates = [
      'In Process',
      'QA Testing',
      'Business Sprint Testing',
      'User Acceptance Testing'
    ];
    
    const deliveryToReleaseStates = [
      'Ready for Deployment',
      'Sprint Complete',
      'Approved for Release'
    ];
    
    const deliveryCompletedStates = [
      'Closed'
    ];

    /* Debe coincidir con ESTIMABLE_WORK_STATES del backend. Sólo estos estados requieren que el work item tenga estimación.
      Los elementos Closed, Removed u otros estados tempranos no generan la alerta actual "No estimated work". */
    const estimateRequiredStates = [
      'Ready for Development',
      'In Process',
      'QA Testing',
      'Business Sprint Testing',
      'User Acceptance Testing',
      'Approved for Release',
      'Ready for Deployment',
      'Sprint Complete'
    ];
    
    /*
      La fuente de verdad preferida es el backend. Cuando el backend entregue isUnestimated, el frontend no debe
      reinterpretar Story Points ni Work Item Type. El fallback conserva la misma regla mientras exista una respuesta cacheada antigua. */
    function isWorkItemUnestimated(workItem) {
      if (typeof workItem?.isUnestimated === 'boolean') {
        return workItem.isUnestimated;
      }
    
      const value = workItem?.storyPoints;
      const state = String(workItem?.state || '').trim();
    
      const hasMissingOrZeroEstimate =
        value === null ||
        value === undefined ||
        String(value).trim() === '' ||
        Number(value) <= 0;
    
      return (
        estimateRequiredStates.includes(state) &&
        hasMissingOrZeroEstimate
      );
    }
    
    function hasWorkItemEstimate(workItem) {
      return !isWorkItemUnestimated(workItem);
    }

    function getWorkItemDeliveryCategory(workItem) {
      const backendCategory = String(
        workItem?.deliveryCategory || ''
      ).trim();
    
      const allowedCategories = new Set([
        'removed',
        'inPlanning',
        'inProgress',
        'toRelease',
        'completed'
      ]);
    
      if (allowedCategories.has(backendCategory)) {
        return backendCategory;
      }
    
      /*
        Fallback temporal para respuestas antiguas que todavía no incluyan
        deliveryCategory.
      */
      const state = String(workItem?.state || '').trim();
    
      if (state === 'Removed') {
        return 'removed';
      }
    
      if (deliveryInPlanningStates.includes(state)) {
        return 'inPlanning';
      }
    
      if (deliveryInProgressStates.includes(state)) {
        return 'inProgress';
      }
    
      if (deliveryToReleaseStates.includes(state)) {
        return 'toRelease';
      }
    
      if (deliveryCompletedStates.includes(state)) {
        return 'completed';
      }
    
      return 'inPlanning';
    }

    function getWorkItemsDeliverySummary(workItems = []) {
      const summary = {
        totalWorkItems: workItems.length,
        includedWorkItems: 0,
        removedWorkItems: 0,
    
        inPlanningWorkItems: 0,
        inProgressWorkItems: 0,
        toReleaseWorkItems: 0,
        completedWorkItems: 0,
    
        completedForProgressWorkItems: 0,
        openWorkItems: 0,
        progressPercent: 0,
    
        unestimatedWorkItems: 0,
        discoveryWithoutSprintWorkItems: 0,
    
        /* Aliases temporales. */
        doneWorkItems: 0,
        pendingWorkItems: 0
      };
    
      workItems.forEach(workItem => {
        const category = getWorkItemDeliveryCategory(workItem);
    
        if (category === 'removed') {
          summary.removedWorkItems += 1;
          return;
        }
    
        summary.includedWorkItems += 1;
    
        if (category === 'inPlanning') {
          summary.inPlanningWorkItems += 1;
        } else if (category === 'inProgress') {
          summary.inProgressWorkItems += 1;
        } else if (category === 'toRelease') {
          summary.toReleaseWorkItems += 1;
        } else if (category === 'completed') {
          summary.completedWorkItems += 1;
        }
    
        if (isWorkItemUnestimated(workItem)) {
          summary.unestimatedWorkItems += 1;
        }
    
        const hasIterationPath =
          typeof workItem.iterationPath === 'string' &&
          workItem.iterationPath.trim() !== '';
    
        if (category === 'inPlanning' && !hasIterationPath) {
          summary.discoveryWithoutSprintWorkItems += 1;
        }
      });
    
      summary.completedForProgressWorkItems =
        summary.toReleaseWorkItems +
        summary.completedWorkItems;
    
      summary.openWorkItems =
        summary.inPlanningWorkItems +
        summary.inProgressWorkItems;
    
      summary.progressPercent =
        summary.includedWorkItems === 0
          ? 0
          : Math.round(
              (summary.completedForProgressWorkItems /
                summary.includedWorkItems) * 100
            );
    
      /*
        Compatibilidad temporal con usos existentes.
      */
      summary.doneWorkItems =
        summary.completedForProgressWorkItems;
    
      summary.pendingWorkItems =
        summary.inPlanningWorkItems +
        summary.inProgressWorkItems;
    
      return summary;
    }

    /* Resumen listo para pintar en el primer frame. Prioridad:
    1. El detalle ya cargado en storiesCache, porque es la información más fresca y permite recalcular el resumen con los mismos campos.
    2. feature.deliverySummary, enviado por /api/features y disponible antes de que termine la precarga de Stories/Bugs.
    Ninguna celda de Progress debería depender de una petición posterior para mostrar información. */
    /* Returns the best available delivery summary for a Feature.
      Priority:
      1. Server summary when Stories/Bugs detail is unavailable. An empty storiesCache array in this scenario represents a failed
         request, not a confirmed "no work items" result.
      2. Successfully loaded Stories/Bugs from storiesCache.
      3. Server summary available from /api/features. */
    function getFeatureDeliverySummary(
      feature,
      storiesCache,
      unavailableStoriesIds = {}
    ) {
      const featureId = Number(feature?.id);

      const server = feature?.deliverySummary;

      const hasAvailableServerSummary =
        server &&
        server.source !== 'unknown' &&
        Number.isInteger(server.includedWorkItems);

      /* If the detail request failed or was incomplete, never interpret storiesCache[featureId] = [] as a confirmed absence of work items. */
      if (
        unavailableStoriesIds?.[featureId] &&
        hasAvailableServerSummary
      ) {
        return {
          ...server,
          source: 'server'
        };
      }

      const cached = storiesCache?.[featureId];

      if (Array.isArray(cached)) {
        return {
          ...getWorkItemsDeliverySummary(cached),
          source: 'stories'
        };
      }

      if (hasAvailableServerSummary) {
        return {
          ...server,
          source: 'server'
        };
      }

      return null;
    }

    /* Declarative Risk Score configuration. To adjust prioritization, update this table without changing scoring logic or UI components. */
    const RISK_WEIGHTS = {
      overdue: 50,
      targetWithin7Days: 22,
      targetWithinThreshold: 12,

      requiresActionAlert: 18,
      requiresAttentionAlert: 7,

      readinessIncomplete: 14,
      readinessUnknown: 5,

      noWorkItemsInExecution: 16,
      unestimatedWorkItem: 3,
      discoveryWithoutSprintWorkItem: 4,

      stalledPerWeekAfter14Days: 5
    };

    /* Caps prevent one repeated signal from dominating the entire score. For example, twenty unestimated work items should not outweigh
      every other delivery risk in the portfolio. */
    const RISK_LIMITS = {
      unestimatedWorkItems: 4,
      discoveryWithoutSprintWorkItems: 4,
      stalledWeeks: 4
    };

    /* Risk levels are intentionally based on the final accumulated score.
      The numerical score remains the comparable and sortable value. */
    const RISK_LEVELS = [
      {
        minScore: 60,
        key: 'critical',
        label: 'Critical'
      },
      {
        minScore: 40,
        key: 'high',
        label: 'High'
      },
      {
        minScore: 20,
        key: 'moderate',
        label: 'Moderate'
      },
      {
        minScore: 1,
        key: 'watch',
        label: 'Watch'
      },
      {
        minScore: 0,
        key: 'low',
        label: 'Low'
      }
    ];

    /* Returns the display level for a completed Risk Score. */
    function getFeatureRiskLevel(score) {
      const normalizedScore = Number.isFinite(Number(score))
        ? Number(score)
        : 0;

      return (
        RISK_LEVELS.find(
          level => normalizedScore >= level.minScore
        ) ||
        RISK_LEVELS[RISK_LEVELS.length - 1]
      );
    }

    /* Returns true only when Delivery Health explicitly identifies the Feature as having no direct Stories or Bugs during execution.
      This prevents New Features with no child work items from receiving an incorrect delivery-risk penalty. */
    function featureHasNoStoriesRisk(feature) {
      return getDeliveryHealthAlerts(feature).some(
        alert => alert.key === 'no-stories'
      );
    }

    /* Builds the detailed list of individual signals contributing to Risk. This detail is used by the tooltip and later by the Aging panel.
      Keeping it separate from the final score makes the calculation transparent to users and easy to audit. */
    function getFeatureRiskBreakdown(
      feature,
      storiesCache = {},
      unavailableStoriesIds = {}
    ) {
      const breakdown = [];
      const isClosed = String(
        feature?.state || ''
      ).trim() === 'Closed';

      const target = getTargetDateStatus(
        feature?.targetDate,
        feature?.state
      );

      if (!isClosed && target.days !== null) {
        if (target.days < 0) {
          breakdown.push({
            key: 'overdue',
            label: 'Overdue Target Date',
            points: RISK_WEIGHTS.overdue
          });
        } else if (target.days <= 7) {
          breakdown.push({
            key: 'target-within-7-days',
            label: 'Target Date within 7 days',
            points: RISK_WEIGHTS.targetWithin7Days
          });
        } else if (target.days <= targetDateNearDays) {
          breakdown.push({
            key: 'target-within-threshold',
            label:
              `Target Date within ${targetDateNearDays} days`,
            points: RISK_WEIGHTS.targetWithinThreshold
          });
        }
      }

      getDeliveryHealthAlerts(feature).forEach(alert => {
        if (alert.group === 'requires-action') {
          breakdown.push({
            key: `delivery-action-${alert.key}`,
            label: `Requires Action: ${alert.label}`,
            points: RISK_WEIGHTS.requiresActionAlert
          });
        } else if (alert.group === 'requires-attention') {
          breakdown.push({
            key: `delivery-attention-${alert.key}`,
            label: `Requires Attention: ${alert.label}`,
            points: RISK_WEIGHTS.requiresAttentionAlert
          });
        }
      });

      const readiness = getFeatureReadiness(feature);

      if (readiness === 'Incomplete') {
        breakdown.push({
          key: 'readiness-incomplete',
          label: 'Readiness incomplete',
          points: RISK_WEIGHTS.readinessIncomplete
        });
      } else if (readiness === 'Unknown') {
        breakdown.push({
          key: 'readiness-unknown',
          label: 'Readiness unavailable',
          points: RISK_WEIGHTS.readinessUnknown
        });
      }

      if (featureHasNoStoriesRisk(feature)) {
        breakdown.push({
          key: 'no-work-items-in-execution',
          label: 'No Stories or Bugs in execution',
          points: RISK_WEIGHTS.noWorkItemsInExecution
        });
      }

      const summary = getFeatureDeliverySummary(
        feature,
        storiesCache,
        unavailableStoriesIds
      );

      if (summary) {
        const unestimatedWorkItems = Math.min(
          RISK_LIMITS.unestimatedWorkItems,
          Math.max(
            0,
            Number(summary.unestimatedWorkItems) || 0
          )
        );

        if (unestimatedWorkItems > 0) {
          breakdown.push({
            key: 'unestimated-work-items',
            label:
              `${unestimatedWorkItems} unestimated work item${
                unestimatedWorkItems === 1 ? '' : 's'
              }`,
            points:
              unestimatedWorkItems *
              RISK_WEIGHTS.unestimatedWorkItem
          });
        }

        const discoveryWithoutSprintWorkItems = Math.min(
          RISK_LIMITS.discoveryWithoutSprintWorkItems,
          Math.max(
            0,
            Number(
              summary.discoveryWithoutSprintWorkItems
            ) || 0
          )
        );

        if (discoveryWithoutSprintWorkItems > 0) {
          breakdown.push({
            key: 'discovery-without-sprint',
            label:
              `${discoveryWithoutSprintWorkItems} Discovery item${
                discoveryWithoutSprintWorkItems === 1 ? '' : 's'
              } without Sprint`,
            points:
              discoveryWithoutSprintWorkItems *
              RISK_WEIGHTS.discoveryWithoutSprintWorkItem
          });
        }
      }

      const daysInCurrentState = Number(
        feature?.aging?.daysInCurrentState
      );

      if (
        !isClosed &&
        Number.isFinite(daysInCurrentState) &&
        daysInCurrentState > 14
      ) {
        const stalledWeeks = Math.min(
          RISK_LIMITS.stalledWeeks,
          Math.ceil(
            (daysInCurrentState - 14) / 7
          )
        );

        if (stalledWeeks > 0) {
          breakdown.push({
            key: 'aging-current-state',
            label:
              `${daysInCurrentState} days in current state`,
            points:
              stalledWeeks *
              RISK_WEIGHTS.stalledPerWeekAfter14Days
          });
        }
      }

      return breakdown;
    }

    /* Returns one comparable score answering: "Which Feature should I review first?"
      Risk does not replace Delivery Health. Delivery Health explains the
      delivery issue; Risk accumulates signals to support prioritization.  */
    function getFeatureRiskScore(
      feature,
      storiesCache = {},
      unavailableStoriesIds = {}
    ) {
      return getFeatureRiskBreakdown(
        feature,
        storiesCache,
        unavailableStoriesIds
      ).reduce(
        (total, item) => total + item.points,
        0
      );
    }

    /* Compact plain-text explanation for the Risk tooltip. The UI component will be added in the next implementation step. */
    function getFeatureRiskTooltipText(
      feature,
      storiesCache = {},
      unavailableStoriesIds = {}
    ) {
      const score = getFeatureRiskScore(
        feature,
        storiesCache,
        unavailableStoriesIds
      );

      const level = getFeatureRiskLevel(score);

      const breakdown = getFeatureRiskBreakdown(
        feature,
        storiesCache,
        unavailableStoriesIds
      );

      if (breakdown.length === 0) {
        return `${level.label} risk · ${score}\nNo risk signals detected.`;
      }

      return [
        `${level.label} risk · ${score}`,
        'Risk signals:',
        ...breakdown.map(
          item => `+${item.points}: ${item.label}`
        )
      ].join('\n');
    }

    /* Risk Indicator compacto para la tabla. El score exacto sigue disponible en el tooltip porque es útil para
      ordenar y auditar, pero la tabla prioriza el nivel visual de riesgo. */
    function RiskIndicator({
      score,
      breakdown = [],
      showTooltip,
      moveTooltip,
      hideTooltip
    }) {
      const level = getFeatureRiskLevel(score);

      /* El modelo tiene cinco niveles internos, pero la columna usa tres intensidades visuales para conservar lectura rápida:
        - Low: sin señales detectadas;
        - Watch: verde;
        - Moderate: ámbar;
        - High / Critical: rojo. */
      const visualLevel =
        level.key === 'critical' || level.key === 'high'
          ? 'high'
          : level.key === 'moderate'
            ? 'medium'
            : level.key === 'watch'
              ? 'low'
              : 'none';

      const accessibleLabel =
        visualLevel === 'high'
          ? `High risk. Score ${score}.`
          : visualLevel === 'medium'
            ? `Moderate risk. Score ${score}.`
            : visualLevel === 'low'
              ? `Watch risk. Score ${score}.`
              : 'Low risk. No risk signals detected.';

      return (
        <span
          className={`risk-indicator risk-indicator--${visualLevel}`}
          role="img"
          aria-label={accessibleLabel}
          onMouseEnter={(event) => {
            if (!showTooltip) {
              return;
            }

            showTooltip(
              event,
              <div>
                <strong>
                  {level.label} risk · {score}
                </strong>

                {breakdown.length > 0 ? (
                  <ul className="risk-indicator__list">
                    {breakdown.map(item => (
                      <li key={item.key}>
                        +{item.points}: {item.label}
                      </li>
                    ))}
                  </ul>
                ) : (
                  <div>
                    No risk signals detected.
                  </div>
                )}
              </div>
            );
          }}
          onMouseMove={moveTooltip}
          onMouseLeave={hideTooltip}
        >
          <span className="risk-indicator__bar" />
          <span className="risk-indicator__bar" />
          <span className="risk-indicator__bar" />
        </span>
      );
    }

    /* Barra de entrega segmentada. Los segmentos conservan el mismo lenguaje visual del Gantt:
    - Closed: violeta.
    - To Release: verde.
    - In Progress: azul.
    - In Planning: gris.
    La fuente puede cambiar silenciosamente de deliverySummary del backend a storiesCache, y flex-grow anima la proporción ajustada. */
    function DeliveryProgressBar({
      summary,
      compact = false,
      showFlags = true
    }) {
      /* Normalmente este caso sólo ocurrirá si el backend no envió deliverySummary o si los Stories/Bugs todavía no están disponibles. */
      if (!summary) {
        return (
          <span className="delivery-progress__none">
            Progress unavailable
          </span>
        );
      }

      if (!summary.includedWorkItems) {
        return (
          <span className="delivery-progress__none">
            No work items
          </span>
        );
      }

      const total = summary.includedWorkItems;

      const segments = [
        {
          key: 'completed',
          label: 'Closed',
          count: summary.completedWorkItems || 0
        },
        {
          key: 'to-release',
          label: 'Ready to release',
          count: summary.toReleaseWorkItems || 0
        },
        {
          key: 'in-progress',
          label: 'In progress',
          count: summary.inProgressWorkItems || 0
        },
        {
          key: 'in-planning',
          label: 'In planning',
          count: summary.inPlanningWorkItems || 0
        }
      ].filter(segment => segment.count > 0);

      const percent = Number.isInteger(summary.progressPercent)
        ? summary.progressPercent
        : 0;

      const completedForProgress =
        Number(summary.completedForProgressWorkItems) || 0;

      const description = segments.length > 0
        ? segments
            .map(segment => `${segment.count} ${segment.label}`)
            .join(', ')
        : 'No categorized work items';

      return (
        <div className="delivery-progress">
          {!compact && (
            <div className="delivery-progress__header">
              <span className="delivery-progress__percent">
                {percent}%
              </span>

              <span className="delivery-progress__ratio">
                {completedForProgress}/{total}
              </span>
            </div>
          )}

          <div
            className="delivery-progress__track"
            role="img"
            aria-label={`Delivery progress: ${description}`}
          >
            {segments.map(segment => (
              <span
                key={segment.key}
                className={[
                  'delivery-progress__segment',
                  `delivery-progress__segment--${segment.key}`
                ].join(' ')}
                style={{
                  flexGrow: segment.count
                }}
                title={`${segment.count} ${segment.label}`}
              />
            ))}
          </div>

          {showFlags && (
            <div className="delivery-progress__flags">
              {summary.unestimatedWorkItems > 0 && (
                <span className="delivery-progress__flag delivery-progress__flag--warn">
                  {summary.unestimatedWorkItems} unestimated
                </span>
              )}

              {summary.discoveryWithoutSprintWorkItems > 0 && (
                <span className="delivery-progress__flag delivery-progress__flag--warn">
                  {summary.discoveryWithoutSprintWorkItems} without Sprint
                </span>
              )}
            </div>
          )}
        </div>
      );
    }

    function getShortAssignedToName(value) {
      if (!value) { return 'Unassigned'; }

      /*
        Ejemplo: "Apellido, Nombre (Operations & Technology)" → "Apellido, Nombre"
      */
      return String(value)
        .replace(/\s*\([^)]*\)\s*$/, '')
        .trim();
    }

        function getAreaPathDisplayName(areaPath) {
      const parts = String(areaPath || '')
        .split('\\')
        .map(part => part.trim())
        .filter(Boolean);

      return parts.length > 0
        ? parts[parts.length - 1]
        : '—';
    }

    /* Valor interno reservado para permitir que el detalle expandido muestre todos los equipos de una Feature, incluso cuando existe un filtro global de Delivery Team en el dashboard.
      No se usa como Area Path real; únicamente representa una vista temporal dentro de FeatureDeliveryDetails. */
    const ALL_DELIVERY_TEAMS_VIEW =
      '__all_delivery_teams__';

    function getFeatureExecutionTeams(feature, stories = []) {
      const backendExecutionTeams =
        feature?.deliverySummary?.executionTeams;

      const teamsByAreaPath = new Map();

      /* Fuente preferida: resumen entregado por backend. Conserva métricas como currentSprintWorkItems cuando existen. */
      if (Array.isArray(backendExecutionTeams)) {
        backendExecutionTeams.forEach(team => {
          const areaPath = String(team?.areaPath || '').trim();

          if (!areaPath) {
            return;
          }

          teamsByAreaPath.set(areaPath, {
            areaPath,
            name:
              team.name ||
              getAreaPathDisplayName(areaPath),
            totalWorkItems:
              Number(team.totalWorkItems) || 0,
            currentSprintWorkItems:
              Number(team.currentSprintWorkItems) || 0
          });
        });
      }

      /* Fallback visual: si Stories/Bugs ya fueron cargados y contienen un Area Path que no vino en deliverySummary.executionTeams, se agrega ese equipo al detalle de Delivery Activity.
        Esto evita mostrar "No execution teams..." cuando ADO sí devolvió work items asociados a la Feature.  */
      if (Array.isArray(stories)) {
        stories.forEach(story => {
          const areaPath = String(story?.areaPath || '').trim();

          if (!areaPath || teamsByAreaPath.has(areaPath)) {
            return;
          }

          teamsByAreaPath.set(areaPath, {
            areaPath,
            name: getAreaPathDisplayName(areaPath),
            totalWorkItems: 1,
            currentSprintWorkItems: 0
          });
        });
      }

      return [...teamsByAreaPath.values()].sort((teamA, teamB) =>
        teamA.name.localeCompare(
          teamB.name,
          undefined,
          { sensitivity: 'base' }
        )
      );
    }

    function featureHasExecutionTeam(feature, areaPath) {
      const normalizedAreaPath = String(areaPath || '')
        .trim()
        .toLowerCase();
    
      if (!normalizedAreaPath) {
        return false;
      }
    
      return getFeatureExecutionTeams(feature).some(team =>
        String(team.areaPath || '')
          .trim()
          .toLowerCase() === normalizedAreaPath
      );
    }

    function workItemMatchesDeliveryTeam(
      workItem,
      areaPath
    ) {
      const normalizedWorkItemAreaPath = String(
        workItem?.areaPath || ''
      )
        .trim()
        .toLowerCase();
    
      const normalizedTeamAreaPath = String(areaPath || '')
        .trim()
        .toLowerCase();
    
      return Boolean(
        normalizedWorkItemAreaPath &&
        normalizedTeamAreaPath &&
        normalizedWorkItemAreaPath === normalizedTeamAreaPath
      );
    }
        
    function getWorkItemDisplayOrder(workItem) {
      /* Bugs primero; después las User Stories. Si surgiera otro tipo, quedará después de ambos. */
      if (workItem?.workItemType === 'Bug') return 0;
      if (workItem?.workItemType === 'User Story') return 1;
      return 2;
    }

    function sortFeatureWorkItems(workItems = []) {
      return [...workItems]
        .filter(workItem => workItem.state !== 'Removed')
        .sort((a, b) => {
          const typeDifference =
            getWorkItemDisplayOrder(a) - getWorkItemDisplayOrder(b);

          if (typeDifference !== 0) {
            return typeDifference;
          }

          return Number(b.id || 0) - Number(a.id || 0);
        });
    }

    function sortDeliveryWorkItemsByTypeAndId(workItems = []) {
      return [...workItems].sort((a, b) => {
        const typeDifference =
          getWorkItemDisplayOrder(a) - getWorkItemDisplayOrder(b);

        if (typeDifference !== 0) {
          return typeDifference;
        }

        return Number(b.id || 0) - Number(a.id || 0);
      });
    }

    function DeliveryWorkItemCard({
      story,
      adoLink,
      linkedItemCount,
      relationshipLoading,
      relationshipUnavailable,
      onShowLinkedItems
    }) {
      const storyDotColor =
        storyStateColors[story.state] || '#94a3b8';

      const isBug = story.workItemType === 'Bug';

      const sprintLabel = (() => {
        const match =
          story.iterationPath &&
          story.iterationPath.match(/(\d{4})_(S\d+)_/);

        if (match) {
          return `${match[1]} ${match[2]}`;
        }

        return story.iterationPath
          ? story.iterationPath.split('\\').pop()
          : '—';
      })();

      /* Incluye User Story y Simple User Story. Si en el futuro ADO usa otro nombre que contenga "Story", también conservará la interacción de Linked Items. */
      const isStoryLikeWorkItem =
        /story/i.test(
          String(story.workItemType || '')
        );

      const canShowLinkedItemsButton =
        isStoryLikeWorkItem &&
        typeof onShowLinkedItems === 'function';

      return (
        <div
          style={{
            padding: '8px 12px',
            background: 'white',
            borderLeft: `3px solid ${storyDotColor}`,
            borderRadius: '4px',
            boxShadow: '0 1px 3px rgba(0,0,0,0.06)'
          }}
        >
          <div
            style={{
              display: 'flex',
              alignItems: 'center',
              gap: '6px',
              marginBottom: '5px'
            }}
          >
            {isBug && (
              <span
                style={{
                  fontSize: '9px',
                  background: '#fee2e2',
                  color: 'var(--risk)',
                  padding: '1px 5px',
                  borderRadius: '3px',
                  fontWeight: 'bold',
                  flexShrink: 0
                }}
              >
                BUG
              </span>
            )}

            <a
              href={adoLink(story.id)}
              target="_blank"
              rel="noopener noreferrer"
              style={{
                fontSize: '11px',
                fontWeight: 'bold',
                color: '#007bff',
                flexShrink: 0
              }}
            >
              #{story.id}
            </a>

            <span
              title={story.title}
              style={{
                minWidth: 0,
                overflow: 'hidden',
                textOverflow: 'ellipsis',
                whiteSpace: 'nowrap',
                color: '#333',
                fontSize: '11px'
              }}
            >
              {story.title}
            </span>
          </div>

          <div
            style={{
              display: 'flex',
              flexWrap: 'wrap',
              alignItems: 'center',
              gap: '7px'
            }}
          >
            <span
              style={{
                fontSize: '10px',
                background: storyDotColor,
                color: 'white',
                padding: '1px 6px',
                borderRadius: '3px',
                whiteSpace: 'nowrap'
              }}
            >
              {story.state}
            </span>

            <span style={{ fontSize: '10px', color: '#666' }}>
              📍 {sprintLabel}
            </span>

            <span
              style={{
                fontSize: '10px',
                color: isWorkItemUnestimated(story)
                  ? 'var(--warn)'
                  : '#666',
                fontWeight: isWorkItemUnestimated(story)
                  ? 'bold'
                  : 'normal'
              }}
            >
              🎯 {story.storyPoints ?? 'No data'}
              {story.storyPoints !== null &&
              story.storyPoints !== undefined
                ? ' pts'
                : ''}
            </span>

            <span className="feature-story-card__assigned-to">
              👤 {getShortAssignedToName(story.assignedTo)}
            </span>

            {story.releaseFixVersion && (
              <span
                className="feature-story-card__release-fix-version"
                title={`Release Fix Version: ${story.releaseFixVersion}`}
              >
                🚀 RFV: {story.releaseFixVersion}
              </span>
            )}

            {canShowLinkedItemsButton && (
              <button
                type="button"
                className="story-linked-items-button"
                onClick={onShowLinkedItems}
                title={
                  `Show work items linked to ${story.workItemType} ` +
                  `#${story.id}`
                }
              >
                {relationshipLoading
                  ? 'Loading Linked Items...'
                  : relationshipUnavailable
                    ? 'Linked Items unavailable'
                    : typeof linkedItemCount === 'number'
                      ? `${linkedItemCount} Linked Item${
                          linkedItemCount === 1 ? '' : 's'
                        }`
                      : 'Linked Items'}
              </button>
            )}
          </div>
        </div>
      );
    }

    function DeliveryWorkItemGroup({
      title,
      stories,
      adoLink,
      getLinkedItemCount,
      relationshipLoading,
      relationshipUnavailable,
      onShowStoryLinkedItems
    }) {
      return (
        <section className="delivery-work-group">
          <strong className="delivery-work-group__title">
            {title} ({stories.length})
          </strong>

          {stories.length === 0 ? (
            <div className="delivery-work-group__empty">
              No Stories or Bugs in this group.
            </div>
          ) : (
            <div className="delivery-work-grid">
              {stories.map(story => (
                <DeliveryWorkItemCard
                  key={story.id}
                  story={story}
                  adoLink={adoLink}
                  linkedItemCount={
                    typeof getLinkedItemCount === 'function'
                      ? getLinkedItemCount(story.id)
                      : undefined
                  }
                  relationshipLoading={relationshipLoading}
                  relationshipUnavailable={
                    relationshipUnavailable
                  }
                  onShowLinkedItems={
                    typeof onShowStoryLinkedItems === 'function'
                      ? () => onShowStoryLinkedItems(story.id)
                      : undefined
                  }
                />
              ))}
            </div>
          )}
        </section>
      );
    }

    function DeliveryHealthAlert({
      alert,
      assignedTo
    }) {
      const owner = getShortAssignedToName(assignedTo);

      const visual = getDeliveryVisualMeta(
        alert.key,
        alert.group
      );

      const alertSummary =
        `${alert.label}: ${alert.reason}`;

      return (
        <article
          className="delivery-inline-alert"
        >
          <div
            className="delivery-inline-alert__summary"
            title={alertSummary}
          >
            <span
              className={[
                'delivery-inline-alert__icon',
                visual.className
              ].join(' ')}
              aria-hidden="true"
            >
              {visual.icon}
            </span>

            <div className="delivery-inline-alert__summary-content">
              <strong className="delivery-inline-alert__title">
                {alert.label}:
              </strong>{' '}

              <span className="delivery-inline-alert__reason">
                {alert.reason}
              </span>
            </div>
          </div>

          <div className="delivery-inline-alert__details">
            <div className="delivery-inline-alert__detail">
              <span className="delivery-inline-alert__detail-label">
                Action:
              </span>

              <span className="delivery-inline-alert__detail-value">
                {alert.recommendedAction ||
                  'No recommended action configured.'}
              </span>
            </div>

            <div className="delivery-inline-alert__detail">
              <span className="delivery-inline-alert__detail-label">
                Owner:
              </span>

              <span className="delivery-inline-alert__detail-value">
                {owner}
              </span>
            </div>
          </div>
        </article>
      );
    }

    function FeatureWorkItemsPanelHeader({
      activeTeamAreaPaths,
      teamViewLabel = ''
    }) {
      const activeTeamNames = Array.isArray(activeTeamAreaPaths)
        ? activeTeamAreaPaths
            .map(getAreaPathDisplayName)
            .filter(Boolean)
        : [];

      const resolvedTeamViewLabel =
        teamViewLabel ||
        (
          activeTeamNames.length > 0
            ? activeTeamNames.join(', ')
            : ''
        );

      return (
        <header className="feature-work-items-panel__header">
          <div className="feature-work-items-panel__heading">
            <strong className="feature-work-items-panel__title">
              Stories and Bugs
            </strong>

            <span className="feature-work-items-panel__description">
              Filter direct work items associated with this Feature.
            </span>
          </div>

          {resolvedTeamViewLabel && (
            <span className="feature-work-items-panel__team-context">
              Team view: {resolvedTeamViewLabel}
            </span>
          )}
        </header>
      );
    }
       
    function FeatureDeliveryDetails({ 
      feature, 
      stories,
      deliveryTeamFilter = [],
      adoLink, 
      relationshipGraph,
      relationshipLoading,
      relationshipUnavailable,
      onLoadRelationships,
      onRetryRelationships }) {
      
      const [workItemSubfilter, setWorkItemSubfilter] = React.useState('all');
      
      /* null = muestra todos los Bugs relacionados con el Feature. Un ID = muestra únicamente Bugs relacionados desde esa Story. */
      const [linkedStoryFilterId, setLinkedStoryFilterId] = React.useState(null);

      /* null: usa el filtro global Delivery Team, si existe. Si no hay filtro global, muestra todos los equipos.    
      Un Area Path: permite cambiar temporalmente el detalle a otro equipo desde los botones de Delivery Activity, sin alterar el filtro global. */
      const [ selectedExecutionTeamAreaPath, setSelectedExecutionTeamAreaPath ] = React.useState(null);

      /* Usa el resumen del backend como fuente principal y Stories/Bugs cargados como fallback para equipos no incluidos en dicho resumen. */
      const executionTeams = getFeatureExecutionTeams( feature, stories );

      const isAllDeliveryTeamsView =
        selectedExecutionTeamAreaPath ===
        ALL_DELIVERY_TEAMS_VIEW;

      /* Los equipos que pertenecen al Feature según el resumen del backend o según los Stories/Bugs que ya fueron cargados para este detalle. */
      const featureExecutionTeamAreaPaths = executionTeams.map(
        team => team.areaPath
      );
      
      /* Si se pulsó un equipo dentro de Delivery Activity, ese equipo tiene prioridad sólo dentro de este detalle.      
        Si no se pulsó ninguno:
        - con Delivery Team global: muestra únicamente los equipos filtrados;
        - sin Delivery Team global: muestra Stories/Bugs de todos los equipos. */
      const effectiveDeliveryTeamAreaPaths =
        isAllDeliveryTeamsView
          ? []
          : selectedExecutionTeamAreaPath
            ? [selectedExecutionTeamAreaPath]
            : deliveryTeamFilter.length > 0
              ? deliveryTeamFilter.filter(areaPath =>
                  featureExecutionTeamAreaPaths.includes(areaPath)
                )
              : [];

      /* Un arreglo vacío significa:
        - no existe filtro de Delivery Team;
        - el filtro global no aplica a esta Feature;
        - o el usuario eligió explícitamente All delivery teams. */
      const teamFilteredStories =
        effectiveDeliveryTeamAreaPaths.length === 0
          ? stories
          : stories.filter(story =>
              effectiveDeliveryTeamAreaPaths.some(areaPath =>
                workItemMatchesDeliveryTeam(story, areaPath)
              )
            );
      
      /* Los contadores de Included, In Progress, Completed, etc. ahora corresponden al equipo visible, no a todos los equipos de la Feature. */
      const summary = getWorkItemsDeliverySummary( teamFilteredStories );

      const currentSprintWorkItems =
        feature?.deliverySummary?.currentSprintWorkItems;
      
      const responsibleTeam =
        feature?.responsibleTeam?.name ||
        getAreaPathDisplayName(feature.areaPath);

      const normalizedRelationshipGraph =
        relationshipGraph?.source === 'ok'
          ? normalizeRelationshipGraph(relationshipGraph)
          : null;
     
      /* Los nombres del payload de backend todavía contienen "Bugs", pero la interfaz los trata como Linked Items porque el grafo completo también puede incluir Stories relacionadas. */
      const linkedItems =
        normalizedRelationshipGraph?.linkedBugs || [];

      const storyLinkedItems =
        normalizedRelationshipGraph?.storyLinkedBugs || [];

      const linkedStories =
        normalizedRelationshipGraph?.linkedStories || [];

      const relationshipTotal =
        normalizedRelationshipGraph?.total || 0;

      const linkedItemsForSelectedStory = linkedStoryFilterId
        ? storyLinkedItems.filter(item =>
             (item.relatedFromStoryIds || [])
              .map(Number)
              .includes(Number(linkedStoryFilterId))
          )
        : linkedItems;

      const getLinkedItemCountForStory = (storyId) => {
        const numericStoryId = Number(storyId);

        return storyLinkedItems.filter(item =>
          (item.relatedFromStoryIds || [])
            .map(Number)
            .includes(numericStoryId)
        ).length;
      };

      /* Debug temporal. Si ya no necesitas investigar la Feature #1165429, puedes eliminar este bloque completo después de validar relaciones. */
      if (Number(feature.id) === 1165429) {
        console.log('[Relationship debug]', {
          featureId: feature.id,
          directFeatureChildBugs:
            normalizedRelationshipGraph?.directFeatureChildBugs,
          linkedItems,
          storyLinkedItems,
          linkedStories
        });
      }

      const showLinkedItemsForStory = (storyId) => {
        setLinkedStoryFilterId(Number(storyId));
        setWorkItemSubfilter('linkedBugs');
        onLoadRelationships();
      };

      const showAllLinkedRelationships = () => {
        setLinkedStoryFilterId(null);
        setWorkItemSubfilter('linkedBugs');
        onLoadRelationships();
      };

      /* Al montar el detalle expandido se solicita el grafo de relaciones. loadRelationshipGraphForFeatures ya evita consultas duplicadas si:
        - la Feature está en caché;
        - la solicitud está en progreso;
        - ocurrió un fallo previo y no es un retry explícito. */
      React.useEffect(() => {
        onLoadRelationships();
      }, [feature.id]);
      
      React.useEffect(() => {
        setWorkItemSubfilter('all');
        setLinkedStoryFilterId(null);
      
        /* Al abrir otra Feature o cambiar el filtro global Delivery Team, volvemos al comportamiento inicial:
          - el filtro global controla los Stories/Bugs visibles;
          - no queda seleccionado temporalmente un equipo de otra Feature. */
        setSelectedExecutionTeamAreaPath(null);
      }, [
        feature.id,
        deliveryTeamFilter.join('|')
      ]);

      /* Removed queda incluido en el resumen, pero no se incluye en ninguno de los tres grupos de cards. */
      const visibleStories = teamFilteredStories.filter(story => {
        /* Linked Bugs proviene de otro endpoint y no pertenece a storiesCache. Por eso no mostramos hijos directos
          mientras ese subfiltro está seleccionado. */
        if (workItemSubfilter === 'linkedBugs') {
          return false;
        }
      
        if (workItemSubfilter === 'all') {
          return getWorkItemDeliveryCategory(story) !== 'removed';
        }
      
        if (workItemSubfilter === 'inPlanning') {
          return getWorkItemDeliveryCategory(story) === 'inPlanning';
        }
      
        if (workItemSubfilter === 'inProgress') {
          return getWorkItemDeliveryCategory(story) === 'inProgress';
        }
      
        if (workItemSubfilter === 'toRelease') {
          return getWorkItemDeliveryCategory(story) === 'toRelease';
        }
        
        if (workItemSubfilter === 'completed') {
          return getWorkItemDeliveryCategory(story) === 'completed';
        }
      
        if (workItemSubfilter === 'unestimated') {
          return isWorkItemUnestimated(story);
        }
      
        if (workItemSubfilter === 'discoveryWithoutSprint') {
          const hasIterationPath =
            typeof story.iterationPath === 'string' &&
            story.iterationPath.trim() !== '';
      
          return (
            getWorkItemDeliveryCategory(story) === 'inPlanning' &&
            !hasIterationPath
          );
        }
      
        return true;
      });

      const inPlanningStories = sortDeliveryWorkItemsByTypeAndId(
        visibleStories.filter(
          story => getWorkItemDeliveryCategory(story) === 'inPlanning'
        )
      );
      
      const inProgressStories = sortDeliveryWorkItemsByTypeAndId(
        visibleStories.filter(
          story => getWorkItemDeliveryCategory(story) === 'inProgress'
        )
      );
      
      const toReleaseStories = sortDeliveryWorkItemsByTypeAndId(
        visibleStories.filter(
          story => getWorkItemDeliveryCategory(story) === 'toRelease'
        )
      );
      
      const completedStories = sortDeliveryWorkItemsByTypeAndId(
        visibleStories.filter(
          story => getWorkItemDeliveryCategory(story) === 'completed'
        )
      );

      return (
        <div className="delivery-details">
          <div className="delivery-details__overview-grid">
            <FeatureStatusDetails feature={feature} />

            <section
              className="delivery-activity"
              aria-label="Delivery execution activity"
            >
              <strong className="delivery-activity__title">
                Delivery Activity
              </strong>

              <div className="delivery-activity__responsible-team">
                <strong>Responsible team:</strong>{' '}
                {responsibleTeam || '—'}
              </div>

              {executionTeams.length === 0 ? (
                <div className="delivery-activity__empty">
                  No execution teams were identified from child
                  Stories or Bugs.
                </div>
              ) : (
                <div className="delivery-activity__teams">
                  <button
                    type="button"
                    className={[
                      'delivery-activity__team',
                      (
                        isAllDeliveryTeamsView ||
                        (
                          !selectedExecutionTeamAreaPath &&
                          deliveryTeamFilter.length === 0
                        )
                      )
                        ? 'delivery-activity__team--active'
                        : ''
                    ]
                      .filter(Boolean)
                      .join(' ')}
                    title={
                      isAllDeliveryTeamsView
                        ? (
                            'Return to the Delivery Team filter ' +
                            'defined in the dashboard.'
                          )
                        : (
                            'Show all direct Stories and Bugs for this ' +
                            'Feature, ignoring the global Delivery Team ' +
                            'filter only inside this expanded detail.'
                          )
                    }
                    onClick={() => {
                      setWorkItemSubfilter('all');
                      setLinkedStoryFilterId(null);

                      setSelectedExecutionTeamAreaPath(
                        currentValue =>
                          currentValue === ALL_DELIVERY_TEAMS_VIEW
                            ? null
                            : ALL_DELIVERY_TEAMS_VIEW
                      );
                    }}
                  >
                    All teams
                  </button>

                  {executionTeams.map(team => {
                    const isActive =
                      effectiveDeliveryTeamAreaPaths.length === 1 &&
                      effectiveDeliveryTeamAreaPaths[0] ===
                        team.areaPath;

                    return (
                      <button
                        key={team.areaPath}
                        type="button"
                        className={[
                          'delivery-activity__team',
                          isActive
                            ? 'delivery-activity__team--active'
                            : ''
                        ]
                          .filter(Boolean)
                          .join(' ')}
                        title={
                          `${team.areaPath}. ` +
                          `Show ${team.totalWorkItems} direct ` +
                          `Story/Bug item(s) for this team.`
                        }
                        onClick={() => {
                          setWorkItemSubfilter('all');
                          setLinkedStoryFilterId(null);

                          /*
                            Un segundo clic sobre el mismo equipo vuelve
                            al comportamiento definido por el filtro global.
                          */
                          setSelectedExecutionTeamAreaPath(
                            currentValue =>
                              currentValue === team.areaPath
                                ? null
                                : team.areaPath
                          );
                        }}
                      >
                        {team.name} · {team.totalWorkItems} item
                        {team.totalWorkItems === 1 ? '' : 's'}

                        {team.currentSprintWorkItems > 0 &&
                          ` · ${team.currentSprintWorkItems} current sprint`}
                      </button>
                    );
                  })}
                </div>
              )}

              {effectiveDeliveryTeamAreaPaths.length > 0 && (
                <div className="delivery-activity__viewing">
                  Viewing work for:{' '}
                  {effectiveDeliveryTeamAreaPaths
                    .map(areaPath =>
                      getAreaPathDisplayName(areaPath)
                    )
                    .join(', ')}
                </div>
              )}

              {typeof currentSprintWorkItems === 'number' && (
                <div className="delivery-activity__sprint">
                  <strong>Feature total current Sprint activity:</strong>{' '}
                  {currentSprintWorkItems} work item
                  {currentSprintWorkItems === 1 ? '' : 's'}
                </div>
              )}
            </section>
          </div>
                    
          <section
            className="feature-work-items-panel"
            aria-label={`Stories and Bugs for Feature ${feature.id}`}
          >
            <div className="feature-work-items-panel__top-grid">
              <div className="feature-work-items-panel__controls-card">            
                <FeatureWorkItemsPanelHeader
                  activeTeamAreaPaths={
                    effectiveDeliveryTeamAreaPaths
                  }
                  teamViewLabel={
                    isAllDeliveryTeamsView
                      ? 'All delivery teams'
                      : ''
                  }
                />

                <div className="feature-work-items-panel__filters">
                  <div className="delivery-details__summary">
                <button
                  type="button"
                  className={[
                    'delivery-details__metric',
                    workItemSubfilter === 'all'
                      ? 'delivery-details__metric--active'
                      : ''
                  ]
                    .filter(Boolean)
                    .join(' ')}
                  onClick={() => {
                    setLinkedStoryFilterId(null);
                    setWorkItemSubfilter('all');
                  }}
                  title="Show all included Stories and Bugs"
                >
                  {summary.includedWorkItems} Included
                </button>

                <button
                  type="button"
                  className={[
                    'delivery-details__metric',
                    workItemSubfilter === 'inPlanning'
                      ? 'delivery-details__metric--active'
                      : ''
                  ]
                    .filter(Boolean)
                    .join(' ')}
                  onClick={() => {
                    setLinkedStoryFilterId(null);
                    setWorkItemSubfilter('inPlanning');
                  }}
                  title="Show In Planning Stories and Bugs"
                >
                  {summary.inPlanningWorkItems} In Planning
                </button>

                <button
                  type="button"
                  className={[
                    'delivery-details__metric',
                    workItemSubfilter === 'inProgress'
                      ? 'delivery-details__metric--active'
                      : ''
                  ]
                    .filter(Boolean)
                    .join(' ')}
                  onClick={() => {
                    setLinkedStoryFilterId(null);
                    setWorkItemSubfilter('inProgress');
                  }}
                  title="Show Stories and Bugs currently in progress"
                >
                  {summary.inProgressWorkItems} In Progress
                </button>

                <button
                  type="button"
                  className={[
                    'delivery-details__metric',
                    workItemSubfilter === 'toRelease'
                      ? 'delivery-details__metric--active'
                      : ''
                  ]
                    .filter(Boolean)
                    .join(' ')}
                  onClick={() => {
                    setLinkedStoryFilterId(null);
                    setWorkItemSubfilter('toRelease');
                  }}
                  title="Show Stories and Bugs pending release"
                >
                  {summary.toReleaseWorkItems} To Release
                </button>

                <button
                  type="button"
                  className={[
                    'delivery-details__metric',
                    workItemSubfilter === 'completed'
                      ? 'delivery-details__metric--active'
                      : ''
                  ]
                    .filter(Boolean)
                    .join(' ')}
                  onClick={() => {
                    setLinkedStoryFilterId(null);
                    setWorkItemSubfilter('completed');
                  }}
                  title="Show closed Stories and Bugs"
                >
                  {summary.completedWorkItems} Completed
                </button>

                {summary.unestimatedWorkItems > 0 && (
                  <button
                    type="button"
                    className={[
                      'delivery-details__metric',
                      workItemSubfilter === 'unestimated'
                        ? 'delivery-details__metric--active'
                        : ''
                    ]
                      .filter(Boolean)
                      .join(' ')}
                    onClick={() => {
                      setLinkedStoryFilterId(null);
                      setWorkItemSubfilter('unestimated');
                    }}
                    title="Show work items that currently need an estimate"
                  >
                    {summary.unestimatedWorkItems} Needs Estimate
                  </button>
                )}

                {summary.discoveryWithoutSprintWorkItems > 0 && (
                  <button
                    type="button"
                    className={[
                      'delivery-details__metric',
                      workItemSubfilter === 'discoveryWithoutSprint'
                        ? 'delivery-details__metric--active'
                        : ''
                    ]
                      .filter(Boolean)
                      .join(' ')}
                    onClick={() => {
                      setLinkedStoryFilterId(null);
                      setWorkItemSubfilter(
                        'discoveryWithoutSprint'
                      );
                    }}
                    title="Show In Planning work items without a Sprint"
                  >
                    {summary.discoveryWithoutSprintWorkItems}{' '}
                    Without Sprint
                  </button>
                )}

                <button
                  type="button"
                  className={[
                    'delivery-details__metric',
                    'delivery-details__metric--relationships',
                    workItemSubfilter === 'linkedBugs'
                      ? 'delivery-details__metric--active'
                      : ''
                  ]
                    .filter(Boolean)
                    .join(' ')}
                  onClick={showAllLinkedRelationships}
                  title={
                    'Show Bugs and work items linked through ' +
                    'Feature relationships'
                  }
                >
                  {relationshipLoading
                    ? 'Loading Linked Items...'
                    : normalizedRelationshipGraph
                      ? `${relationshipTotal} Linked Items`
                      : relationshipUnavailable
                        ? 'Linked Items unavailable'
                        : 'Linked Items'}
                </button>
                  </div>
                </div>
              </div>

              <aside
                className="feature-work-items-panel__alignment"
                aria-label="Release and Sprint Alignment"
              >
                <ReleaseAlignmentDetails feature={feature} />
              </aside>
            </div>

            <div className="feature-work-items-panel__divider" />

            <div className="feature-work-items-panel__results">
              {inPlanningStories.length > 0 && (
                <DeliveryWorkItemGroup
                  title="In Planning"
                  stories={inPlanningStories}
                  adoLink={adoLink}
                  getLinkedItemCount={getLinkedItemCountForStory}
                  relationshipLoading={relationshipLoading}
                  relationshipUnavailable={relationshipUnavailable}
                  onShowStoryLinkedItems={showLinkedItemsForStory}
                />
              )}

              {inProgressStories.length > 0 && (
                <DeliveryWorkItemGroup
                  title="In Progress"
                  stories={inProgressStories}
                  adoLink={adoLink}
                  getLinkedItemCount={getLinkedItemCountForStory}
                  relationshipLoading={relationshipLoading}
                  relationshipUnavailable={relationshipUnavailable}
                  onShowStoryLinkedItems={showLinkedItemsForStory}
                />
              )}

              {toReleaseStories.length > 0 && (
                <DeliveryWorkItemGroup
                  title="To Release"
                  stories={toReleaseStories}
                  adoLink={adoLink}
                  getLinkedItemCount={getLinkedItemCountForStory}
                  relationshipLoading={relationshipLoading}
                  relationshipUnavailable={relationshipUnavailable}
                  onShowStoryLinkedItems={showLinkedItemsForStory}
                />
              )}

              {completedStories.length > 0 && (
                <DeliveryWorkItemGroup
                  title="Completed"
                  stories={completedStories}
                  adoLink={adoLink}
                  getLinkedItemCount={getLinkedItemCountForStory}
                  relationshipLoading={relationshipLoading}
                  relationshipUnavailable={relationshipUnavailable}
                  onShowStoryLinkedItems={showLinkedItemsForStory}
                />
              )}

              {workItemSubfilter === 'linkedBugs' && (
                <section className="delivery-work-group">
                  <strong className="delivery-work-group__title">
                    {linkedStoryFilterId
                      ? `Linked Items for Story #${linkedStoryFilterId}`
                      : 'Feature Relationships'}

                    {!linkedStoryFilterId &&
                    normalizedRelationshipGraph
                      ? ` (${relationshipTotal})`
                      : ''}
                  </strong>

                  {relationshipLoading ? (
                    <div className="delivery-work-group__empty">
                      Loading relationship information...
                    </div>
                  ) : relationshipUnavailable ? (
                    <div className="delivery-work-group__empty">
                      <div>
                        Relationship information is temporarily unavailable.
                      </div>

                      <button
                        type="button"
                        className="relationship-retry-button"
                        onClick={onRetryRelationships}
                      >
                        Retry
                      </button>
                    </div>
                  ) : !normalizedRelationshipGraph ? (
                    <div className="delivery-work-group__empty">
                      Relationship information is temporarily unavailable.
                    </div>
                  ) : (
                    linkedStoryFilterId
                      ? linkedItemsForSelectedStory.length === 0
                      : relationshipTotal === 0
                  ) ? (
                    <div className="delivery-work-group__empty">
                      {linkedStoryFilterId
                        ? `No linked items were found for Story #${linkedStoryFilterId}.`
                        : 'No linked work items were found for this Feature.'}
                    </div>
                  ) : (
                    <>
                      {linkedItemsForSelectedStory.length > 0 && (
                        <DeliveryWorkItemGroup
                          title="Linked Items"
                          stories={sortDeliveryWorkItemsByTypeAndId(
                            linkedItemsForSelectedStory
                          )}
                          adoLink={adoLink}
                        />
                      )}

                      {linkedStoryFilterId && (
                        <button
                          type="button"
                          className="relationship-show-all-button"
                          onClick={showAllLinkedRelationships}
                        >
                          Show all Feature relationships
                        </button>
                      )}

                      {!linkedStoryFilterId &&
                      linkedStories.length > 0 && (
                        <DeliveryWorkItemGroup
                          title="Related User Stories"
                          stories={sortDeliveryWorkItemsByTypeAndId(
                            linkedStories
                          )}
                          adoLink={adoLink}
                        />
                      )}
                    </>
                  )}
                </section>
              )}

              {workItemSubfilter !== 'linkedBugs' &&
              visibleStories.length === 0 && (

   /* Paginación compacta para evitar mostrar demasiados botones cuando existen muchas páginas.*/
    function DashboardPagination({
      currentPage,
      totalPages,
      onPageChange,
      ariaLabel
    }) {
      const visiblePages = (() => {
        if (totalPages <= 7) {
          return Array.from(
            { length: totalPages },
            (_, index) => index + 1
          );
        }

        if (currentPage <= 4) {
          return [1, 2, 3, 4, 'ellipsis-end', totalPages];
        }

        if (currentPage >= totalPages - 3) {
          return [
            1,
            'ellipsis-start',
            totalPages - 3,
            totalPages - 2,
            totalPages - 1,
            totalPages
          ];
        }

        return [
          1,
          'ellipsis-start',
          currentPage - 1,
          currentPage,
          currentPage + 1,
          'ellipsis-end',
          totalPages
        ];
      })();

      return (
        <nav
          className="dashboard-pagination"
          aria-label={ariaLabel}
        >
          <button
            type="button"
            className="dashboard-pagination__button"
            onClick={() => onPageChange(1)}
            disabled={currentPage === 1}
            title="Go to first page"
          >
            First
          </button>

          <button
            type="button"
            className="dashboard-pagination__button"
            onClick={() => onPageChange(currentPage - 1)}
            disabled={currentPage === 1}
            title="Go to previous page"
          >
            Previous
          </button>

          {visiblePages.map((pageItem, index) => {
            if (typeof pageItem !== 'number') {
              return (
                <span
                  key={`${pageItem}-${index}`}
                  className="dashboard-pagination__ellipsis"
                  aria-hidden="true"
                >
                  …
                </span>
              );
            }

            const isActive = pageItem === currentPage;

            return (
              <button
                key={pageItem}
                type="button"
                className={[
                  'dashboard-pagination__button',
                  isActive
                    ? 'dashboard-pagination__button--active'
                    : ''
                ].filter(Boolean).join(' ')}
                onClick={() => onPageChange(pageItem)}
                disabled={isActive}
                aria-current={isActive ? 'page' : undefined}
                title={`Go to page ${pageItem}`}
              >
                {pageItem}
              </button>
            );
          })}

          <button
            type="button"

          <button

            onClick={() => onPageChange(totalPages)}

          <span className="dashboard-pagination__summary">
            Page {currentPage} of {totalPages}
          </span>
        </nav>

    function getRelationshipItemId(item) {
      const id = Number(item?.id);
    
      return Number.isInteger(id) && id > 0
        ? id
        : null;
    }
    
    function dedupeRelationshipItems(items = []) {
      const itemsById = new Map();
    
      items.forEach(item => {
        const id = getRelationshipItemId(item);
    
        if (id) {
          itemsById.set(id, item);
        }
      });
    
      return [...itemsById.values()];
    }
    
    /* Convierte la respuesta del endpoint a una forma segura para la UI.    
      Los Bugs hijos directos se excluyen deliberadamente de linkedBugs,porque ya pertenecen al endpoint de hijos directos y no deben duplicarse 
      ni afectar la interpretación visual. */
    function normalizeRelationshipGraph(graph) {
      const source = graph?.source || 'unknown';
    
      const directFeatureChildBugs = Array.isArray(
        graph?.directFeatureChildBugs
      )
        ? graph.directFeatureChildBugs
        : [];
    
      const directFeatureRelatedBugs = Array.isArray(
        graph?.directFeatureRelatedBugs
      )
        ? graph.directFeatureRelatedBugs
        : [];
    
      const childStoryRelatedBugs = Array.isArray(
        graph?.childStoryRelatedBugs
      )
        ? graph.childStoryRelatedBugs
        : [];
    
      const directFeatureRelatedStories = Array.isArray(
        graph?.directFeatureRelatedStories
      )
        ? graph.directFeatureRelatedStories
        : [];
    
      /*
        Los Bugs hijos directos siguen siendo work items normales del Feature.
        No deben duplicarse en la vista global "Linked Bugs".
      */
      const directChildIds = new Set(
        directFeatureChildBugs
          .map(getRelationshipItemId)
          .filter(Boolean)
      );
    
      /*
        Une Bugs repetidos y conserva todas las Stories desde las que
        fue encontrada una relación Related.
      */
      const relationshipBugsById = new Map();
    
      [
        ...directFeatureRelatedBugs.map(item => ({
          ...item,
          relatedFromStoryIds: []
        })),
    
        ...childStoryRelatedBugs.map(item => ({
          ...item,
          relatedFromStoryIds: [
            ...new Set(
              [
                ...(Array.isArray(item.relatedFromStoryIds)
                  ? item.relatedFromStoryIds
                  : []),
    
                item.relatedFromStoryId
              ]
                .map(Number)
                .filter(id => Number.isInteger(id) && id > 0)
            )
          ]
        }))
      ].forEach(item => {
        const id = getRelationshipItemId(item);
    
        if (!id) {
          return;
        }
    
        const previousItem = relationshipBugsById.get(id);
    
        if (!previousItem) {
          relationshipBugsById.set(id, item);
          return;
        }
    
        relationshipBugsById.set(id, {
          ...previousItem,
    
          /*
            Mantiene toda Story vinculada al Bug.
            Ejemplo:
            Bug #1222712 -> Story #1211928 y Story #1211930.
          */
          relatedFromStoryIds: [
            ...new Set([
              ...(previousItem.relatedFromStoryIds || []),
              ...(item.relatedFromStoryIds || [])
            ])
          ]
        });
      });
    
      /* Incluye TODOS los Bugs que tengan una relación con una Story hija, incluso si además son hijos directos del Feature.
        Esta colección se usa exclusivamente para:
        - el contador de cada Story;
        - el detalle "Bugs linked to Story #...".
        No participa en Progress ni Delivery Health.   */
      const storyLinkedBugs = [...relationshipBugsById.values()].filter(
        item => (item.relatedFromStoryIds || []).length > 0
      );
    
      /* Vista global: excluye Bugs hijos directos para no mostrar un duplicado, porque estos ya aparecen en Discovery / In Progress / Done. */
      const linkedBugs = [...relationshipBugsById.values()].filter(
        item => !directChildIds.has(getRelationshipItemId(item))
      );
      
      const linkedStories = dedupeRelationshipItems(
        directFeatureRelatedStories
      );
    
      return {
        source,
        directFeatureChildBugs,
        linkedBugs,
        storyLinkedBugs,
        linkedStories,
        total: linkedBugs.length + linkedStories.length
      };
    }

    async function parseApiJsonResponse( response, fallbackErrorMessage ) {
      const responseText = await response.text();
    
      let data = {};
    
      try {
        data = responseText
          ? JSON.parse(responseText)
          : {};
      } catch {
        data = {};
      }
    
      if (!response.ok) {
        throw new Error(
          data.error || fallbackErrorMessage
        );
      }
    
      return data;
    }

    function useTimelineColumnBox(containerRef, deps = []) {
      const [box, setBox] = useState(null);
    
      useEffect(() => {
        const container = containerRef.current;
    
        if (!container) {
          setBox(null);
          return;
        }
    
        const measure = () => {
          const cell = container.querySelector(
            '.gantt-timeline-cell'
          );
    
          if (!cell) {
            setBox(null);
            return;
          }
    
          const cellRect = cell.getBoundingClientRect();
          const containerRect = container.getBoundingClientRect();
    
          setBox({
            left: cellRect.left - containerRect.left,
            width: cellRect.width
          });
        };
    
        measure();
    
        const resizeObserver =
          typeof ResizeObserver !== 'undefined'
            ? new ResizeObserver(measure)
            : null;
    
        resizeObserver?.observe(container);
    
        window.addEventListener('resize', measure);
    
        return () => {
          resizeObserver?.disconnect();
          window.removeEventListener('resize', measure);
        };
      }, deps);
    
      return box;
    }

    function GanttRuler({
      box,
      timelineStart,
      timelineEnd,
      unitCount = 12
    }) {
      if (!box || !timelineStart || !timelineEnd) {
        return null;
      }
    
      const totalMs = timelineEnd - timelineStart;
    
      if (totalMs <= 0) {
        return null;
      }
    
      const todayMs =
        getDashboardToday() - timelineStart;
    
      const todayPercent =
        (todayMs / totalMs) * 100;
    
      const isTodayVisible =
        todayPercent >= 0 &&
        todayPercent <= 100;
    
      return (
        <div
          className="gantt-ruler"
          style={{
            left: `${box.left}px`,
            width: `${box.width}px`
          }}
          aria-hidden="true"
        >
          <div
            className="gantt-ruler__grid"
            style={{
              '--gantt-unit': `${100 / unitCount}%`
            }}
          />
    
          {isTodayVisible && (
            <div
              className="gantt-ruler__today"
              style={{
                left: `${todayPercent}%`
              }}
            />
          )}
        </div>
      );
    }

    const DECELERATION_RATE = 0.998;
    const DRAG_THRESHOLD_PX = 8;
    
    function projectMomentum( velocityPxPerSecond, decelerationRate = DECELERATION_RATE) {
      return (
        (velocityPxPerSecond / 1000) * decelerationRate / (1 - decelerationRate) );
    }
    
    function rubberband( overshoot, dimension, constant = 0.55) {
      return (
        (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot)) );
    }
    
    function useTimelinePan({ unitCount = 12, offset, onOffsetChange, minOffset = -60, maxOffset = 36 }) {
      const trackRef = useRef(null);
      const gestureRef = useRef(null);
      const dragOffsetRef = useRef(0);
      const didDragRef = useRef(false);
    
      const [dragOffsetPx, setDragOffsetPx] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
    
      const getUnitWidth = () => {
        const width =
          trackRef.current?.getBoundingClientRect().width || 0;
    
        return width > 0
          ? width / unitCount
          : 0;
      };
    
      const handlePointerDown = event => {
        if (
          event.pointerType === 'mouse' &&
          event.button !== 0
        ) {
          return;
        }
    
        /* El pan sólo inicia dentro de una celda temporal. Así no bloquea enlaces, controles, ID, Feature title ni expansión. */
        if (!event.target.closest('.gantt-timeline-cell')) {
          return;
        }
    
        const track = trackRef.current;
    
        if (!track) {
          return;
        }
    
        gestureRef.current = {
          pointerId: event.pointerId,
          startX: event.clientX,
          history: [
            {
              x: event.clientX,
              t: event.timeStamp
            }
          ],
          committed: false
        };
    
        didDragRef.current = false;
    
        track.setPointerCapture?.(event.pointerId);
      };
    
      const handlePointerMove = event => {
        const gesture = gestureRef.current;
    
        if (
          !gesture ||
          gesture.pointerId !== event.pointerId
        ) {
          return;
        }
    
        const rawDelta = event.clientX - gesture.startX;
    
        /* Menos de 8px conserva comportamiento de clic:
          - tooltip de barras;
          - expansión de Feature;
          - interacción normal. */
        if (!gesture.committed) {
          if (Math.abs(rawDelta) < DRAG_THRESHOLD_PX) {
            return;
          }
    
          gesture.committed = true;
          didDragRef.current = true;
          setIsDragging(true);
        }
    
        gesture.history.push({
          x: event.clientX,
          t: event.timeStamp
        });
    
        if (gesture.history.length > 6) {
          gesture.history.shift();
        }
    
        const unitWidth = getUnitWidth();
    
        if (!unitWidth) {
          return;
        }
    
        const trackWidth = unitWidth * unitCount;
    
        /* Arrastrar hacia la derecha muestra períodos anteriores. Arrastrar hacia la izquierda muestra períodos posteriores. */
        const requestedOffset = offset - rawDelta / unitWidth;
    
        let visualDelta = rawDelta;
    
        if (requestedOffset < minOffset) {
          const overshootPx =
            (minOffset - requestedOffset) * unitWidth;
    
          visualDelta =
            rawDelta -
            overshootPx +
            rubberband(overshootPx, trackWidth);
        } else if (requestedOffset > maxOffset) {
          const overshootPx =
            (requestedOffset - maxOffset) * unitWidth;
    
          visualDelta =
            rawDelta +
            overshootPx -
            rubberband(overshootPx, trackWidth);
        }
    
        dragOffsetRef.current = visualDelta;
        setDragOffsetPx(visualDelta);
      };
    
      const finishGesture = event => {
        const gesture = gestureRef.current;
    
        if (
          !gesture ||
          gesture.pointerId !== event.pointerId
        ) {
          return;
        }
    
        gestureRef.current = null;
    
        trackRef.current?.releasePointerCapture?.(
          event.pointerId
        );
    
        if (!gesture.committed) {
          dragOffsetRef.current = 0;
          setDragOffsetPx(0);
          setIsDragging(false);
          return;
        }
    
        const history = gesture.history;
        const first = history[0];
        const last = history[history.length - 1];
    
        const elapsedMs = Math.max( 1, last.t - first.t );
    
        const velocity = ((last.x - first.x) / elapsedMs) * 1000;
    
        const unitWidth = getUnitWidth();
    
        const projectedPx = dragOffsetRef.current + projectMomentum(velocity);
    
        const projectedOffset = unitWidth ? offset - projectedPx / unitWidth : offset;
    
        const nextOffset = Math.max( minOffset, Math.min( maxOffset, Math.round(projectedOffset) ) );
    
        dragOffsetRef.current = 0;
        setDragOffsetPx(0);
        setIsDragging(false);
    
        if (nextOffset !== offset) {
          onOffsetChange(nextOffset);
        }
      };
    
      const handleWheel = event => {
        const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.shiftKey ? event.deltaY : 0;
    
        if (!delta) {
          return;
        }
    
        event.preventDefault();
    
        const step = delta > 0 ? 1 : -1;
    
        const nextOffset = Math.max( minOffset, Math.min( maxOffset, offset + step ) );
    
        if (nextOffset !== offset) { onOffsetChange(nextOffset); }
      };
    
      /* Evita que el click generado al terminar un drag expanda accidentalmente la Feature o active una barra. */
      const handleClickCapture = event => {
        if (!didDragRef.current) {
          return;
        }
    
        event.preventDefault();
        event.stopPropagation();
    
        didDragRef.current = false;
      };
    
      return {
        panHandlers: {
          ref: trackRef,
          onPointerDown: handlePointerDown,
          onPointerMove: handlePointerMove,
          onPointerUp: finishGesture,
          onPointerCancel: finishGesture,
          onWheel: handleWheel,
          onClickCapture: handleClickCapture
        },
        dragOffsetPx,
        isDragging
      };
    }

          !inFlight &&
          !isLoading &&
          (retry || (!existsInCache && !isUnavailable))
