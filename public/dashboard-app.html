                                color: 'white',
                                border: 'none',
                                cursor: 'pointer',
                                fontSize: '12px',
                                borderRadius: '4px',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center'
                              }}
                              onClick={() =>
                                expandedRoadmapFeatureId !== null
                                  ? setWeekOffset(weekOffset - 1)
                                  : setTimelineOffset(timelineOffset - 1)
                              }
                            >
                              ◄
                            </button>
                  
                            <button
                              type="button"
                              title={
                                expandedRoadmapFeatureId !== null
                                  ? 'Next week'
                                  : 'Next month'
                              }
                              aria-label={
                                expandedRoadmapFeatureId !== null
                                  ? 'Next week'
                                  : 'Next month'
                              }
                              style={{
                                width: '28px',
                                height: '28px',
                                background: '#537fbd',
                                color: 'white',
                                border: 'none',
                                cursor: 'pointer',
                                fontSize: '12px',
                                borderRadius: '4px',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center'
                              }}
                              onClick={() =>
                                expandedRoadmapFeatureId !== null
                                  ? setWeekOffset(weekOffset + 1)
                                  : setTimelineOffset(timelineOffset + 1)
                              }
                            >
                              ►
                            </button>
                          </div>
                        </div>
                      </th>
                  
                      <th
                        style={{
                          padding: '4px 6px',
                          verticalAlign: 'middle',
                          fontWeight: 'normal'
                        }}
                      >
                        <TimelineSubHeader
                          isWeekMode={expandedRoadmapFeatureId !== null}
                          timelineOffset={timelineOffset}
                          weekOffset={weekOffset}
                        />
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    {(() => {
                      const dashboardToday = getDashboardNow().startOf('day');

                      const monthTimelineStart = dashboardToday
                        .startOf('month')
                        .plus({ months: timelineOffset })
                        .toJSDate();

                      const monthTimelineEnd = dashboardToday
                        .startOf('month')
                        .plus({ months: timelineOffset + 12 })
                        .minus({ days: 1 })
                        .endOf('day')
                        .toJSDate();

                      const weekTimelineStart = dashboardToday
                        .startOf('week')
                        .plus({ weeks: weekOffset })
                        .toJSDate();

                      const weekTimelineEnd = dashboardToday
                        .startOf('week')
                        .plus({ weeks: weekOffset + 12 })
                        .toJSDate();

                      return pageItems.map(f => {
                        const isExpanded = expandedRoadmapFeatureId === f.id;
                        const featureTimelineStart = isExpanded ? weekTimelineStart : monthTimelineStart;
                        const featureTimelineEnd = isExpanded ? weekTimelineEnd : monthTimelineEnd;
                        return (
                          <React.Fragment key={f.id}>
                            <FeatureRow
                              featureId={f.id}
                              title={f.title}
                              assignedTo={f.assignedTo}
                              targetDate={f.targetDate}
                              releaseFixVersion={f.releaseFixVersion}
                              estimation={f.estimation}
                              priority={f.priority}
                              formatDate={formatDate}
                              timelineStart={featureTimelineStart}
                              timelineEnd={featureTimelineEnd}
                              adoLink={adoLink}
                              isExpanded={isExpanded}
                              onToggleExpand={() => toggleRoadmapFeature(f.id)}
                              states={historyCache[f.id] || []}
                              loading={loadingHistory}
                              showTooltip={showTooltip}
                              moveTooltip={moveTooltip}
                              hideTooltip={hideTooltip}
                            />
                          {isExpanded && (
                            loadingStoriesIds[f.id] ? (
                              <tr style={{ background: '#f2f2f2' }}>
                                <td
                                  colSpan="4"
                                  style={{
                                    padding: '20px',
                                    textAlign: 'center',
                                    color: '#64748b',
                                    fontSize: '12px'
                                  }}
                                >
                                  Loading Stories and Bugs...
                                </td>
                              </tr>
                            ) : unavailableStoriesIds[f.id] ? (
                              <tr style={{ background: '#fefce8' }}>
                                <td
                                  colSpan="4"
                                  style={{
                                    padding: '20px',
                                    textAlign: 'center',
                                    color: '#b45309',
                                    fontSize: '12px'
                                  }}
                                >
                                  Stories and Bugs could not be fully retrieved
                                  from Azure DevOps. Refresh the dashboard and
                                  try again.
                                </td>
                              </tr>
                            ) : (storiesCache[f.id] || []).length === 0 ? (
                              /* Resultado válido: ADO respondió correctamente, pero este Feature no tiene Stories/Bugs hijos directos.
                                La fila conserva la misma estructura de cuatro columnas usada por StoryRow:
                                - Priority vacía;
                                - identificador informativo;
                                - mensaje dentro del espacio de título;
                                - timeline gris, sin barras de estado. */
                              <tr
                                style={{
                                  borderBottom: '1px solid #eee',
                                  background: '#f2f2f2'
                                }}
                              >
                                <td />

                                <td
                                  style={{
                                    color: '#64748b',
                                    fontSize: '10px',
                                    fontWeight: '700',
                                    textAlign: 'center'
                                  }}
                                  aria-label="No child work items"
                                  title="No Stories or Bugs"
                                >
                                  —
                                </td>

                                <td
                                  style={{
                                    maxWidth: '300px',
                                    padding: '10px 12px'
                                  }}
                                >
                                  <strong
                                    style={{
                                      display: 'block',
                                      color: '#334155',
                                      fontSize: '10px',
                                      lineHeight: '1.15'
                                    }}
                                  >
                                    No Stories or Bugs are associated with this Feature.
                                  </strong>

                                  <span
                                    style={{
                                      display: 'block',
                                      marginTop: '3px',
                                      color: '#64748b',
                                      fontSize: '10px',
                                      lineHeight: '1.15'
                                    }}
                                  >
                                    Click the Feature row again to collapse it.
                                  </span>
                                </td>

                                <td style={{ padding: '6px 8px' }}>
                                  <div
                                    style={{
                                      height: '36px',
                                      borderRadius: '4px',
                                      background: '#e0e0e0',
                                      position: 'relative',
                                      overflow: 'hidden'
                                    }}
                                    aria-label="No Story or Bug timeline is available for this Feature"
                                  >
                                    <span
                                      style={{
                                        position: 'absolute',
                                        top: '50%',
                                        left: '8px',
                                        transform: 'translateY(-50%)',
                                        color: '#94a3b8',
                                        fontSize: '11px'
                                      }}
                                    >
                                      No child work items
                                    </span>
                                  </div>
                                </td>
                              </tr>
                            ) : (
                              (storiesCache[f.id] || []).map(s => (
                                <StoryRow
                                  key={s.id}
                                  storyId={s.id}
                                  title={s.title}
                                  storyPoints={s.storyPoints}
                                  state={s.state}
                                  iterationPath={s.iterationPath}
                                  formatDate={formatDate}
                                  timelineStart={weekTimelineStart}
                                  timelineEnd={weekTimelineEnd}
                                  adoLink={adoLink}
                                  states={storyHistoryCache[s.id] || []}
                                  loading={loadingStoryHistory}
                                  showTooltip={showTooltip}
                                  moveTooltip={moveTooltip}
                                  hideTooltip={hideTooltip}
                                />
                              ))
                            )
                          )}
                          </React.Fragment>
                        );
                      });
                    })()}
                  </tbody>
                </table>
              </div>
            </div>
           </>
            )}
          </>
          )}
          </main>

          {!loading && !loadError && sortedFiltered.length > 0 && (
            <div className="dashboard-pagination-footer">
              {currentPage === 'features' ? (
                <DashboardPagination
                  currentPage={featuresPage}
                  totalPages={featuresTotalPages}
                  onPageChange={changeFeaturesPage}
                  ariaLabel="Feature List pagination"
                />
              ) : (
                <DashboardPagination
                  currentPage={roadmapPage}
                  totalPages={totalPages}
                  onPageChange={changeRoadmapPage}
                  ariaLabel="Roadmap pagination"
                />
              )}
            </div>
          )}
          <Tooltip tooltip={tooltip} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>
