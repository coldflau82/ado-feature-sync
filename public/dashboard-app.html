<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Obligatorio para diseño responsive: hace que el ancho CSS coincida con el ancho real del dispositivo. Sin esta etiqueta, un móvil renderiza la página como si tuviera
    aproximadamente 980px de ancho y luego la reduce visualmente.  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" >
  <title>ADO DEC Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Luxon se usa para que el navegador interprete todas las fechas operativas en la misma zona oficial del backend. -->
  <script src="https://unpkg.com/luxon@3.7.2/build/global/luxon.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      color-scheme: light;
    
      /* ── Superficies ───────────────────────────────────────────── */
      --surface-page: #eef2f7;
      --surface-raised: #ffffff;
      --surface-sunken: #f8fafc;
      --surface-chrome: rgba(255, 255, 255, 0.72);
    
      /* ── Texto ─────────────────────────────────────────────────── */
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #64748b;
    
      /* ── Bordes ────────────────────────────────────────────────── */
      --line-hairline: #e3e9f0;
      --line-strong: #cbd5e1;
    
      /* ── Semántica ─────────────────────────────────────────────── */
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --accent-soft: #eff6ff;
      --risk: #dc2626;
      --risk-soft: #fef2f2;
      --warn: #b45309;
      --warn-soft: #fffbeb;
      --ok: #15803d;
      --ok-soft: #f0fdf4;
      --neutral: var(--text-tertiary);
      --neutral-soft: #f1f5f9;
    
      /* ── Tipografía ────────────────────────────────────────────── */
      --step--2: 0.6875rem; /* 11px */
      --step--1: 0.75rem;   /* 12px */
      --step-0: 0.8125rem;  /* 13px */
      --step-1: 0.9375rem;  /* 15px */
      --step-2: 1.375rem;   /* 22px */
      --step-3: 1.6875rem;  /* 27px */
    
      /* ── Radios ────────────────────────────────────────────────── */
      --radius-chip: 999px;
      --radius-control: 6px;
      --radius-card: 10px;
      --radius-panel: 14px;
    
      /* ── Sombras ───────────────────────────────────────────────── */
      --shadow-chip: 0 1px 1px rgba(15, 23, 42, 0.04);
      --shadow-card:
        0 1px 2px rgba(15, 23, 42, 0.06),
        0 4px 12px -6px rgba(15, 23, 42, 0.10);
      --shadow-chrome: 0 8px 24px -12px rgba(15, 23, 42, 0.28);
    
      /* ── Movimiento ────────────────────────────────────────────── */
      --response-ui: 320ms;
      --ease-ui: cubic-bezier(0.32, 0.72, 0, 1);
      --response-momentum: 420ms;
      --ease-momentum: cubic-bezier(0.16, 1.06, 0.3, 1);
      --press: 110ms;
    }
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI Variable Text",
        "Segoe UI",
        system-ui,
        "Helvetica Neue",
        sans-serif;
      font-size: var(--step-0);
      line-height: 1.45;
      color: var(--text-primary);
      background: var(--surface-page);
      -webkit-font-smoothing: antialiased;
      font-optical-sizing: auto;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { background: var(--surface-raised); }
    .header h1 { font-size: 24px; }
    .warnings { position: relative; background: #fff3cd; color: #856404; padding: 15px 46px 15px 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffc107;}
    .warnings__close-button { position: absolute; top: 8px; right: 9px; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 4px;
      background: transparent; color: #856404; cursor: pointer; font-family: inherit; font-size: 22px; font-weight: 700; line-height: 1; display: inline-flex;
      align-items: center; justify-content: center; transition: background 0.15s ease, color 0.15s ease; }
    .warnings__close-button:hover { background: rgba(133, 100, 4, 0.12); color: #5f4703; }
    .warnings__close-button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.35); outline-offset: 2px; }
    .filter-label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
    .filter-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .filter-count { font-size: 11px; color: #666; margin-top: 5px; }
    .table-wrapper { background: var(--surface-raised); }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f9f9f9; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #eee; font-size: 13px; }
    td { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; }
    tr:hover { background: #f5f5f5; }
    a { color: #007bff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .readiness-overview { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 9px; margin: 0; } 
    .readiness-overview-card { width: 130px; min-width: 130px; height: 58px; min-height: 58px; padding: 8px 11px; border: 1px solid var(--neutral-soft); border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); cursor: pointer; transition:   transform 0.15s ease,   box-shadow 0.15s ease,   border-color 0.15s ease; text-align: left; overflow: hidden; }
    .readiness-overview-card:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08); }
    .readiness-overview-card--active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.16); } 
    .readiness-overview-card__label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; } 
    .readiness-overview-card__count { display: block; margin-top: 4px; font-size: 22px; line-height: 1; font-weight: 700; color: var(--text-primary); } 
    .readiness-overview-card--ready { background: var(--ok-soft); border-color: #86efac; }
    .readiness-overview-card--ready .readiness-overview-card__label { color: #166534; }
    .readiness-overview-card--needs-info { background: #fff7ed; border-color: #fb923c; }
    .readiness-overview-card--needs-info .readiness-overview-card__label { color: #9a3412; }
    .readiness-overview-card--unknown { background: var(--surface-sunken); border-color: var(--line-strong); }
    .readiness-overview-card--unknown .readiness-overview-card__label { color: var(--text-secondary); } 
    .health-overview { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 9px; margin: 0;}
    .health-overview-card {  width: 130px; min-width: 130px; height: 58px; min-height: 58px; padding: 8px 11px; border: 1px solid var(--neutral-soft); border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); text-align: left; overflow: hidden; }
    .health-overview-card__label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .health-overview-card__count { display: block; margin-top: 4px; font-size: 22px; line-height: 1; font-weight: 700; color: var(--text-primary); }
    .health-overview-card--action { background: var(--risk-soft); border-color: #fca5a5; }
    .health-overview-card--action .health-overview-card__label { color: #991b1b; }
    .health-overview-card--attention { background: #fef3c7; border-color: #fbbf24; }
    .health-overview-card--attention .health-overview-card__label { color: #854d0e; }
    .health-overview-card--healthy { background: var(--ok-soft); border-color: #86efac; }
    .health-overview-card--healthy .health-overview-card__label { color: #166534; }
    .health-overview-card:hover { border-color: #94a3b8; transform: translateY(-1px); }
    .health-overview-card--selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18); }
    .health-overview-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Base compartida de los badges de Readiness y Delivery Health. Las clases readiness--* y delivery--* sólo definen colores específicos por estado; 
    estas clases definen la forma, espaciado y alineación visual. */
    .readiness-badge, .delivery-badge { display: inline-flex; align-items: center; justify-content: center; gap: 4px; max-width: 100%; padding: 3px 6px 3px 4px;
      border-radius: 999px; font-size: 10px; font-weight: 700; line-height: 1.2; white-space: nowrap; vertical-align: middle; }
    .readiness-badge__icon, .delivery-badge__icon { width: 14px;  height: 14px; flex: 0 0 14px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; color: var(--surface-raised); font-size: 9px; font-weight: 700; line-height: 1; }
    .readiness-badge__label, .delivery-badge__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* En las celdas de la tabla, permite que badges largos como "Unable to validate" o "Needs HLE" sigan siendo legibles sin alterar el layout de las columnas. */
    .feature-list-centered-cell .readiness-badge,.feature-list-centered-cell .delivery-badge { max-width: 100%; }
    .readiness--ready { color: #166534; background: var(--ok-soft); }
    .readiness--ready .readiness-badge__icon { color: white; background: var(--ok); }
    .readiness--needs-info { color: #9a3412; background: #ffedd5; }
    .readiness--needs-info .readiness-badge__icon { color: white; background: #ea580c; }
    .readiness--unknown { color: var(--text-secondary); background: var(--neutral-soft); }
    .readiness--unknown .readiness-badge__icon { color: white; background: var(--text-tertiary); }
    .delivery--overdue { color: #991b1b; background: #fee2e2; } 
    .delivery--overdue .delivery-badge__icon { background: var(--risk); }
    .delivery--needs-info { color: #9a3412; background: #ffedd5; } 
    .delivery--needs-info .delivery-badge__icon { background: #ea580c; } 
    .delivery--attention { color: #854d0e; background: var(--warn-soft); }
    .delivery--attention .delivery-badge__icon { background: var(--warn); } 
    .delivery--healthy { color: #166534; background: var(--ok-soft); } 
    .delivery--healthy .delivery-badge__icon { background: var(--ok); } 
    .delivery--not-started { color: #1e40af; background: #dbeafe; } 
    .delivery--not-started .delivery-badge__icon { background: var(--accent); } 
    .delivery--unknown { color: var(--text-secondary); background: var(--neutral-soft); } 
    .delivery--unknown .delivery-badge__icon { background: var(--text-tertiary); }
    .feature-list-tooltip { min-width: 220px; max-width: 340px;font-size: 12px; line-height: 1.45; }
    .feature-list-tooltip strong { display: block; margin-bottom: 3px; font-size: 12px; }
    /* FEATURE LIST Esta tabla debe ocupar el ancho disponible del dashboard, sin necesitar scroll horizontal. */
    .feature-list-table-wrapper { width: 100%; margin-bottom: 0; overflow: visible; font-size: 11px}
    .feature-list-table { width: 100%;  min-width: 0; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
    /* Anchos compactos para Feature List.  La tabla ahora tiene 14 columnas: disclosure, risk, priority, ID, Feature, Target, RFV, BE, FE, QA,
    State, Readiness, Delivery Health y Progress.*/
    .feature-list-col--risk { width: 46px; }
    .feature-list-col--id { width: 6%; }
    .feature-list-col--title { width: 22%; }
    .feature-list-col--priority { width: 4%; }
    .feature-list-col--target-date { width: 9%; }
    .feature-list-col--release-fix-version { width: 11%; }
    .feature-list-col--estimate { width: 3.5%; }
    .feature-list-col--state { width: 7%; }
    .feature-list-col--readiness { width: 9%; }
    .feature-list-col--delivery { width: 11%; }
    .feature-list-col--progress { width: 8%; }
    .feature-list-table th,.feature-list-table td { padding: 8px 7px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis;}
    .feature-list-table th { white-space: nowrap; font-size: 11px;}
    .feature-list-table td { white-space: nowrap;}
    /* Risk Indicator: Tres barras de altura creciente comunican severidad también por forma,
    no exclusivamente por color. Esto mejora legibilidad en escala de grises y para usuarios con diferencias en percepción de color.*/
    .risk-indicator { display: inline-flex; align-items: flex-end; justify-content: center; gap: 2px; height: 14px; cursor: help;}
    .risk-indicator__bar { width: 3px; border-radius: 1px; background: var(--line-strong); transition: background var(--response-ui) var(--ease-ui);}
    .risk-indicator__bar:nth-child(1) { height: 6px; }
    .risk-indicator__bar:nth-child(2) { height: 10px; }
    .risk-indicator__bar:nth-child(3) { height: 14px; }
    /* Watch = una barra verde. Moderate = dos barras ámbar. High y Critical = tres barras rojas. Low = gris: no se detectaron señales con los pesos actuales.*/
    .risk-indicator--low .risk-indicator__bar:nth-child(1) { background: var(--ok);}
    .risk-indicator--medium .risk-indicator__bar:nth-child(-n + 2) { background: var(--warn);}
    .risk-indicator--high .risk-indicator__bar { background: var(--risk);}
    .risk-indicator__list { margin: 5px 0 0; padding-left: 16px;}
    .risk-indicator__list li + li { margin-top: 2px;}
    /* El título puede reducirse con ellipsis, pero el texto completo queda disponible en el tooltip que ya usa FeatureTooltipContent.*/
    .feature-list-title-cell { min-width: 0; }
    /* Estado: punto de color + nombre del estado. Además de esta indicación, la fila conserva su línea de color izquierda según el estado. */
    .feature-state-cell { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .feature-state-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; display: inline-block; }
    .feature-list-date-cell { font-size: 11px; }
    .feature-list-centered-cell { text-align: center; padding: 8px !important; }
    .feature-list-progress-cell { text-align: center; padding: 8px !important; white-space: normal !important; }
    /* Paneles de Readiness y Delivery Health. History ya no forma parte de Feature List. */
    .feature-detail-panel {   background: var(--surface-sunken); border: 1px solid var(--line-hairline);}
    .feature-detail-panel-message { padding: 10px 0; font-size: 12px; color: var(--text-tertiary); }
    .feature-detail-panel-warning { padding: 10px 0; font-size: 12px; color: var(--warn); }
    .feature-story-card__assigned-to { color: var(--text-secondary); font-size: 10px; }
    .feature-story-card__release-fix-version { min-width: 0; max-width: 100%; color: var(--text-secondary); font-size: 10px; line-height: 1.3; overflow-wrap: anywhere; }
    .delivery-details { margin: 0; } 
    /* Contenedor de Stories and Bugs:Agrupa filtros y resultados directos de una Feature en una misma superficie visual, separada de Feature Status y Delivery Activity. */
    .feature-work-items-panel { min-width: 0; padding: 0px; border: 0px; border-radius: 0px; background: var(--surface-raised); border: 1px solid var(--line-hairline); }
    .feature-work-items-panel__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; min-width: 0;}
    .feature-work-items-panel__heading { min-width: 0;}
    .feature-work-items-panel__title { display: block; color: var(--text-primary); font-size: 13px; font-weight: 700; line-height: 1.35;}
    .feature-work-items-panel__description { display: block; margin-top: 3px; color: var(--text-tertiary); font-size: 11px; line-height: 1.4;}
    /* Muestra el equipo temporalmente aplicado dentro del panel de resultados, evitando que el usuario pierda contexto al filtrar desde Delivery Activity. */
    .feature-work-items-panel__team-context { flex: 0 0 auto; max-width: 42%; padding: 4px 7px; border: 1px solid #bfdbfe; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-size: 10px;
      font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; text-align: right;}
    .feature-work-items-panel__filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px;}
    .delivery-details__summary { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
    .delivery-details__metric { appearance: none; display: inline-flex; align-items: center; justify-content: center; min-height: 27px; padding: 5px 8px; border: 1px solid var(--line-hairline); border-radius: 999px;
        background: var(--surface-sunken); color: var(--text-secondary); cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; line-height: 1.2; text-align: center;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
    .delivery-details__metric:hover { border-color: #93c5fd; background: var(--accent-soft); color: var(--accent-strong); }
    .delivery-details__metric--active { background: var(--accent); border-color: var(--accent); color: var(--surface-raised); }
    .delivery-details__metric:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Linked Items representa una fuente de relaciones diferente de los hijos directos. Por eso conserva una variante neutral para no competir con el filtro activo de Stories/Bugs. */
    .delivery-details__metric--relationships { border-color: var(--line-strong); background: var(--surface-raised); color: #334155;}
    .delivery-details__metric--relationships:hover { border-color: #94a3b8; background: var(--surface-sunken); color: #1e3a8a;}
    .delivery-details__metric--relationships.delivery-details__metric--active { border-color: var(--text-secondary); background: var(--text-secondary); color: var(--surface-raised);}
    .feature-work-items-panel__divider { height: 1px; margin: 12px 0 0; background: #e5edf5;}
    .feature-work-items-panel__results { min-width: 0;}
    .delivery-work-group { margin-top: 14px; } 
    .delivery-work-group:first-child { margin-top: 12px; }
    .delivery-work-group__title { display: block; margin-bottom: 8px; color: #334155; font-size: 12px;  line-height: 1.35; } 
    .delivery-work-group__empty { padding: 9px 10px; border: 1px dashed var(--line-strong); border-radius: 5px; color: var(--text-tertiary); font-size: 11px; line-height: 1.45; }
    .delivery-work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
    @media (max-width: 560px) {.feature-work-items-panel { padding: 10px;}
    .feature-work-items-panel__header { flex-direction: column; gap: 7px;}
    .feature-work-items-panel__team-context { max-width: 100%; text-align: left;}
    .feature-work-items-panel__filters { gap: 5px; margin-top: 10px;}
    .delivery-details__metric { min-height: 28px; padding: 5px 7px; font-size: 10px;}}
    @media (max-width: 380px) {.delivery-details__metric { flex: 1 1 auto;}}
    .refresh-button { width: 40px; height: 40px; min-width: 40px; border: 0; border-radius: 6px; background: #4f7fc4; color: #fff; cursor: pointer;  display: inline-flex; align-items: center; justify-content: center;  transition: background 0.15s ease, transform 0.15s ease; }
    .refresh-button span { font-size: 23px; line-height: 1; font-weight: 500; }
    .refresh-button:hover:not(:disabled) { background: #3e6eaf; }
    .refresh-button:active:not(:disabled) { transform: scale(0.96); }
    .refresh-button:focus-visible { outline: 3px solid rgba(79, 127, 196, 0.35); outline-offset: 2px; }
    .refresh-button:disabled { opacity: 0.65; cursor: wait; }
    .refresh-button--loading span { animation: refresh-spin 0.85s linear infinite; }
    @keyframes refresh-spin { to { transform: rotate(360deg); }}
    .top-filters-bar  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;  overflow-x: auto; overflow-y: hidden; background: #fff; padding: 10px 14px; border-radius: 8px; margin-bottom: 0px; }
    .top-filters-main { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; }
    .top-filter-group { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; min-width: 0; }
    .top-filter-group .filter-label { margin: 0; white-space: nowrap; font-size: 13px }
    .top-filter-group .filter-select { min-height: 34px; padding: 6px 28px 6px 8px; font-size: 12px; }
    .top-filter-search { width: 31ch; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    .top-filter-readiness { width: 145px; }
    .top-filter-delivery-health { width: 220px; }
    .cache-info { width: 72px; min-width: 72px; color: #888; font-size: 10px; line-height: 1.2; text-align: center; }
    .cache-info strong { display: block; color: var(--text-tertiary); font-size: 10px; font-weight: 700; }
    @media (max-width: 1150px) { .top-filters-bar { justify-content: flex-start; }}
    /* Navegación principal: Feature List / Roadmap */
    .view-switcher { display: inline-flex; gap: 8px; align-items: stretch; }
    .view-switcher__button { appearance: none; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface-raised); color: var(--text-secondary); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; line-height: 1.2;
      text-align: left; display: inline-flex; align-items: center; justify-content: flex-start; gap: 8px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); 
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease; }
    .view-switcher__button:hover:not(.view-switcher__button--active) { background: var(--neutral-soft); border-color: #94a3b8; color: var(--accent-strong); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08); }
    .view-switcher__button:active { transform: scale(0.98); }
    .view-switcher__button--active { background: var(--accent); border-color: var(--accent-strong); color: var(--surface-raised); box-shadow: 0 3px 8px rgba(37, 99, 235, 0.28); }
    .view-switcher__button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.3); outline-offset: 2px; }
    .view-switcher__icon { width: 18px; height: 18px; flex: 0 0 18px; display: inline-flex; align-items: center; justify-content: center; }
    .view-switcher__label { display: block; }
    /* ── Pan directo del Roadmap ──────────────────────────────────── */
    /* Sólo el carril temporal se comporta como superficie de navegación. El resto de la tabla conserva selección de texto, links y controles. */
    .gantt-timeline-cell { touch-action: pan-y; cursor: grab; }
    /* Durante el gesto, Feature rows y Story rows se comportan como un único objeto temporal: el contenido se mueve con el puntero antes de que el
        offset se confirme al soltar. */
    .gantt-horizontal-scroll--dragging .gantt-timeline-canvas { transform: translate3d(var(--gantt-drag-offset, 0px), 0, 0); transition: none; will-change: transform; }
    .gantt-horizontal-scroll--dragging .gantt-timeline-cell { cursor: grabbing; user-select: none; }

    /*  Navegación a la derecha. Importante:

     /* ── Dashboard shell: desktop/tablet con un único scroll interno ── */

      .container.dashboard-shell { height: 100dvh; max-width: 1400px; display: flex; flex-direction: column; overflow: hidden; }

    /* Wrapper horizontal exclusivo para las tablas. No agrega scroll vertical. Sólo aparece scroll horizontal cuando el ancho mínimo del Gantt no cabe en la pantalla.*/
      .gantt-horizontal-scroll { width: 100%; overflow: visible; }
    /* La tabla conserva un ancho mínimo para que no comprima la línea de tiempo y sus barras Gantt sean utilizables. Puedes aumentar este valor si quieres más espacio para el timeline.*/
    .roadmap-table { min-width: 1280px; }

    /* Filas expandibles y detalle consolidado ── */
    .feature-row--expandable, .roadmap-feature-row--expandable {cursor: pointer;}
    .feature-row--expandable:hover,.roadmap-feature-row--expandable:hover { background: #f8fbff !important;}
    /* Feature List conserva el clic sobre la fila como atajo, pero el control semántico para expandir/contraer es disclosure-button.
      Por eso la fila ya no recibe focus ni pretende ser un botón. */
    .feature-row--expanded,.roadmap-feature-row--expanded { background: #f2f7ff !important;}
    .feature-list-disclosure-cell,.feature-list-disclosure-header,.roadmap-disclosure-cell,.roadmap-disclosure-header { padding: 0 !important; text-align: center;}
    .roadmap-disclosure-header { width: 30px;}
    .roadmap-disclosure-cell { width: 30px;}
    .disclosure-button { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: 0;
      border-radius: var(--radius-control); background: transparent; color: var(--text-tertiary); cursor: pointer; transition:
      background var(--press) ease-out, color var(--press) ease-out;}
    .disclosure-button:hover { background: var(--accent-soft); color: var(--accent-strong);}
    .disclosure-button:active { background: #dbeafe;}
    .disclosure-button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 1px;}
    .disclosure-button svg { transition: transform var(--response-ui) var(--ease-ui);}
    .disclosure-button--expanded { color: var(--accent-strong);}
    .disclosure-button--expanded svg { transform: rotate(-180deg);}
    /* Encabezados ordenables reutilizables. El <th> conserva la semántica de columna; el <button> es el control interactivo real que cambia 
    el orden de la tabla.*/
    .sortable-header { padding: 0 !important;}
    .sortable-header__button { display: inline-flex; align-items: center; justify-content: flex-start; gap: 4px; width: 100%; padding: 8px 7px;
      border: 0; background: transparent; color: inherit; cursor: pointer; font: inherit; font-weight: inherit; line-height: inherit; text-align: inherit;
      transition: color var(--press) ease-out;}
    .sortable-header--center .sortable-header__button { justify-content: center;}
    .sortable-header--right .sortable-header__button {  justify-content: flex-end;}
    .sortable-header__button:hover { color: var(--accent-strong);}
    .sortable-header__button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.30); outline-offset: -3px;}
    .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
      border: 0;}
    /* La flecha inactiva confirma que la columna es ordenable sin competir visualmente con la columna que ya está ordenando la tabla.*/
    .sortable-header__arrow { flex: 0 0 auto; opacity: 0.28; font-size: var(--step--2); transition: opacity var(--press) ease-out;}
    .sortable-header__button:hover .sortable-header__arrow { opacity: 0.65;}
    .sortable-header--active .sortable-header__arrow { opacity: 1; color: var(--accent-strong);}
    .sortable-header--active .sortable-header__label { color: var(--accent-strong);}
    .feature-readiness-summary { display: flex; align-items: center; flex-wrap: nowrap; gap: 8px; min-width: 0; min-height: 24px; overflow: hidden;}
    .feature-readiness-summary__title { flex: 0 0 auto; color: var(--text-primary); font-size: 13px; white-space: nowrap;}
    .feature-readiness-summary .readiness-badge { flex: 0 0 auto;}
    .feature-readiness-summary__message { min-width: 0; overflow: hidden; font-size: 11px; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap;}
    .feature-readiness-summary__message--missing { color: #b91c1c;}
    .feature-readiness-summary__message--unknown { color: var(--text-secondary); }
    .feature-detail-panel__divider { height: 1px; margin: 14px 0; background: var(--line-hairline); }
    .dashboard-interaction-hint { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 8px; margin: 0 0 6px; padding: 6px 12px; border: 1px solid var(--line-hairline);
      border-radius: var(--radius-card); background: var(--surface-raised); color: var(--text-secondary); font-size: var(--step--1); line-height: 1.3;
      box-shadow: var(--shadow-chip); }
    .dashboard-interaction-hint__message { color: var(--text-secondary); white-space: nowrap; }
    .dashboard-interaction-hint strong { color: #1e3a8a; font-weight: 700; }
    .dashboard-interaction-hint__legend { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-left: 4px; padding-left: 10px;
      border-left: 1px solid var(--line-hairline); color: var(--text-secondary); font-size: var(--step--2); font-weight: 700; }
    .dashboard-interaction-hint__legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .dashboard-interaction-hint__today-marker { width: 2px; height: 13px; flex: 0 0 2px; background: var(--accent-strong); box-shadow: 0 0 3px rgba(29, 78, 216, 0.32); }
    .dashboard-interaction-hint__target-marker { width: 0; height: 0; flex: 0 0 0; border-top: 9px solid #f43f5e; border-right: 6px solid transparent;
      border-left: 6px solid transparent; }
    .dashboard-interaction-hint__rfv-marker { width: 9px; height: 9px; flex: 0 0 9px; background: #1e3a8a; transform: rotate(45deg); }
    .dashboard-interaction-hint__tech-go-live-marker { display: inline-flex; align-items: center; justify-content: center; width: 13px; color: #f59e0b;
      flex: 0 0 13px; font-size: 16px; font-weight: 800; line-height: 1; text-shadow: 0 0 1px #78350f, 0 1px 2px rgba(15, 23, 42, 0.35); }
    @media (max-width: 980px) { .dashboard-interaction-hint__message { white-space: normal; } 
      .dashboard-interaction-hint__legend { width: 100%; padding-top: 6px; padding-left: 0; border-top: 1px solid var(--line-hairline); border-left: 0; }}
    /* Estados visibles del área principal de resultados: loading; sin resultados por filtros; sin Features disponibles; error de carga. Se reutilizan tanto para Feature List como para Roadmap. */
    .dashboard-results-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 260px;
      margin: 8px 0; padding: 32px 24px; border: 1px dashed var(--line-strong); border-radius: 8px; background: var(--surface-raised); color: var(--text-secondary); text-align: center;}
    .dashboard-results-state--error { border-color: #fecaca; background: #fffafa; }
    .dashboard-results-state__icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; margin-bottom: 12px;
      border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-size: 20px; font-weight: 700; }
    .dashboard-results-state--error .dashboard-results-state__icon { background: #fee2e2; color: #b91c1c; }
    .dashboard-results-state__title { color: var(--text-primary); font-size: 16px; font-weight: 700; line-height: 1.35; }
    .dashboard-results-state__description { max-width: 540px; margin-top: 8px; color: var(--text-tertiary); font-size: 13px; line-height: 1.55; }
    .dashboard-results-state__action { margin-top: 18px; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 5px; background: var(--accent);
      color: var(--surface-raised); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease; }
    .dashboard-results-state__action:hover:not(:disabled) { border-color: var(--accent-strong); background: var(--accent-strong); }
    .dashboard-results-state__action:active:not(:disabled) { transform: scale(0.97); }
    .dashboard-results-state__action:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.28); outline-offset: 2px; }
    .dashboard-results-state__action:disabled { cursor: wait; opacity: 0.7; }
    /* ── Detalle superior de una Feature: Dos tarjetas de igual importancia En desktop/tablet comparten el ancho 50/50, en móvil se apilan para conservar legibilidad.
       1. Estado de la Feature: Readiness + Delivery Health.
       2. Delivery Activity: equipos y actividad de Sprint. */
    .delivery-details__overview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: stretch; margin-bottom: 12px; }
    /* Tarjeta unificada de Readiness y Delivery Health. */
    .feature-status-details { min-width: 0; padding: 12px; border-radius: 7px; background: var(--surface-raised); border: 1px solid var(--line-hairline); }
    .feature-status-details__section { min-width: 0;}
    .feature-status-details__section + .feature-status-details__section { margin-top: 11px; padding-top: 11px; border-top: 1px solid #e5edf5;}
    /* El título y el status viven en una misma línea. */
    .feature-status-details__heading { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; min-width: 0; color: var(--text-primary); font-size: 12px; line-height: 1.35;}
    .feature-status-details__title { color: var(--text-primary); font-size: 12px; font-weight: 700; white-space: nowrap;}
    .feature-status-details__message { display: block; margin-top: 6px; color: var(--text-secondary); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere;}
    .feature-status-details__message--missing { color: #9a3412;}
    .feature-status-details__message--unknown { color: var(--text-secondary);}
    /* Se conserva el color del círculo; el badge no usa fondo semántico dentro de esta tarjeta para reducir el ruido visual. */
    .feature-status-details .readiness-badge,.feature-status-details .delivery-badge { gap: 5px; padding: 0; border-radius: 0; background: transparent; color: #334155; font-size: 11px; line-height: 1.35; white-space: normal;}
    .feature-status-details .readiness-badge__label,.feature-status-details .delivery-badge__label { overflow: visible; text-overflow: clip; white-space: normal;}
    .feature-status-details .readiness-badge__icon,.feature-status-details .delivery-badge__icon { width: 16px; height: 16px; flex: 0 0 16px; font-size: 10px;}
    /* Delivery Activity conserva su propia tarjeta y ahora tiene el mismo peso visual que Feature Status. */
    .delivery-activity { min-width: 0; padding: 12px; border-radius: 7px; background: var(--surface-raised); border: 1px solid var(--line-hairline); }
    .delivery-activity__title { display: block; margin-bottom: 9px; color: var(--text-primary); font-size: 12px; font-weight: 700;}
    .delivery-activity__responsible-team { margin-bottom: 9px; color: var(--text-secondary); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere;}
    .delivery-activity__teams { display: flex; flex-wrap: wrap; gap: 6px;}
    .delivery-activity__team { appearance: none; display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 4px 7px; border: 1px solid transparent; border-radius: 999px; background: var(--accent-soft);
      color: var(--accent-strong); cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere;}
    .delivery-activity__team:hover { border-color: #93c5fd; background: #dbeafe;}
    .delivery-activity__team--active { border-color: var(--accent); background: var(--accent); color: var(--surface-raised);}
    .delivery-activity__team:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px;}
    .delivery-activity__empty { color: var(--text-tertiary); font-size: 11px; line-height: 1.45;}
    .delivery-activity__sprint { margin-top: 10px; padding-top: 9px; border-top: 1px solid #e5edf5; color: var(--text-secondary); font-size: 11px; line-height: 1.45;}
    .delivery-activity__viewing { margin-top: 9px; color: var(--accent-strong); font-size: 10px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere;}
    /* Las alertas dejan de ser tarjetas de colores. El estado se comunica mediante el icono de color. */
    .feature-status-details__alerts { display: grid; gap: 8px; margin-top: 8px;}
    .delivery-inline-alert { display: block; min-width: 0; max-width: 100%; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--text-secondary); font-size: 11px; line-height: 1.45;}
    .delivery-inline-alert__summary { display: flex; align-items: flex-start; gap: 6px; min-width: 0;}
    .delivery-inline-alert__icon { width: 16px; height: 16px; flex: 0 0 16px; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; border-radius: 50%; color: var(--surface-raised);
      font-size: 10px; font-weight: 700; line-height: 1;}
    .delivery-inline-alert__icon.delivery--overdue { background: var(--risk);}
    .delivery-inline-alert__icon.delivery--needs-info { background: #ea580c;}
    .delivery-inline-alert__icon.delivery--attention { background: var(--warn);}
    .delivery-inline-alert__icon.delivery--healthy { background: var(--ok);}
    .delivery-inline-alert__icon.delivery--not-started { background: var(--accent);}
    .delivery-inline-alert__icon.delivery--unknown { background: var(--text-tertiary);}
    .delivery-inline-alert__summary-content { min-width: 0;}
    .delivery-inline-alert__title { color: #334155; font-weight: 700;}
    .delivery-inline-alert__reason { color: var(--text-secondary); overflow-wrap: anywhere;}
    .delivery-inline-alert__details { display: grid; gap: 3px; margin-top: 5px; margin-left: 22px; color: var(--text-tertiary);}
    .delivery-inline-alert__detail { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; column-gap: 5px;}
    .delivery-inline-alert__detail-label { color: var(--text-secondary); font-weight: 700; white-space: nowrap;}
    .delivery-inline-alert__detail-value { min-width: 0; overflow-wrap: anywhere;}
    @media (max-width: 980px) { .delivery-details__overview-grid { grid-template-columns: 1fr; }}
    @media (max-width: 560px) { .feature-status-details,.delivery-activity { padding: 10px; }
      .delivery-inline-alert__details { margin-left: 0;}
      .delivery-inline-alert__detail { grid-template-columns: 1fr; row-gap: 1px; }}
    .relationship-retry-button { margin-top: 8px; padding: 5px 9px; border: 1px solid var(--accent); border-radius: 5px; background: var(--surface-raised); color: var(--accent-strong);
      font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer;}

    .relationship-show-all-button:focus-visible { outline: 3px solid rgba(100, 116, 139, 0.24); outline-offset: 2px; }

    .delivery-progress__segment--completed { background: #a78bfa; }
    .delivery-progress__segment--to-release { background: #34d399; }
    .delivery-progress__segment--in-progress { background: #60a5fa; }
    .delivery-progress__segment--in-planning { background: var(--line-strong); }
    .delivery-progress__flags { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    .delivery-progress__flag { font-size: var(--step--2); font-weight: 700; line-height: 1.2; }
    .delivery-progress__flag--warn { color: var(--warn); }
    .delivery-progress__none { color: var(--text-tertiary); font-size: var(--step--2); }
    /* ── Control explícito de escala del Roadmap ───────────────────── */
    .timeline-scale { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: var(--radius-control); background: var(--neutral-soft);}
    .timeline-scale__segment { padding: 4px 9px; border: 0; border-radius: 4px; background: transparent; color: var(--text-secondary); cursor: pointer;
      font: inherit; font-size: var(--step--2); font-weight: 700; line-height: 1.25; transition: background var(--response-ui) var(--ease-ui),
        color var(--press) ease-out; }
    .timeline-scale__segment:hover:not(.timeline-scale__segment--active) { color: var(--accent-strong); }
    .timeline-scale__segment--active { background: var(--surface-raised); color: var(--text-primary); box-shadow: var(--shadow-chip); }
    .timeline-scale__today { margin-left: 4px; padding: 4px 9px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface-raised);
      color: var(--accent-strong); cursor: pointer; font: inherit; font-size: var(--step--2); font-weight: 700; line-height: 1.25; transition: background var(--press) ease-out,
        border-color var(--press) ease-out, transform var(--press) ease-out;}
    .timeline-scale__today:hover { border-color: var(--accent); background: var(--accent-soft); }
    .timeline-scale__today:active { transform: scale(0.985); }
    .timeline-scale__segment:focus-visible,.timeline-scale__today:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.30); outline-offset: 1px; }
    @media (prefers-reduced-motion: reduce) { .timeline-scale__today:active { transform: none; }}
    /* ── Barras principales del Gantt ─────────────────────────────── */
    .gantt-bar { position: absolute; top: 0; height: 20px; min-width: 6px; border-radius: 3px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: filter var(--press) ease-out; }
    .gantt-bar--story { top: 8px; }
    .gantt-bar:hover { filter: brightness(1.06) saturate(1.1); }
    @media (prefers-reduced-motion: reduce) { .gantt-bar { transition: none; }}
    /* ── Roadmap Feature delivery snapshot ────────────────────────── */
    .gantt-bar--feature { top: 13px; }
    /* La fila Feature ahora usa dos líneas: 1. título; 2. snapshot de Health, Target y Progress. */
    .roadmap-feature-title-cell { width: 420px; min-width: 420px; max-width: 420px; padding: 6px 8px 6px 12px !important; vertical-align: middle; }
    .roadmap-feature-title { min-width: 0; overflow: hidden; color: var(--text-primary); font-size: var(--step-0); font-weight: 600; line-height: 1.25;
      text-overflow: ellipsis; white-space: nowrap; }
    .roadmap-feature-snapshot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 5px 7px; min-width: 0;
      margin-top: 4px; color: var(--text-tertiary); font-size: var(--step--2); line-height: 1.2; }
    .roadmap-feature-snapshot__health { min-width: 0; }
    /* El badge ya tiene semántica por color e icono. En Roadmap se compacta levemente para coexistir con Target y Progress. */
    .roadmap-feature-snapshot__health .delivery-badge { padding: 2px 5px 2px 3px; font-size: 9px; }
    .roadmap-feature-snapshot__health .delivery-badge__icon { width: 13px; height: 13px; flex-basis: 13px; font-size: 8px; }
    .roadmap-feature-snapshot__target { min-width: 0; overflow: hidden; color: var(--text-secondary); text-overflow: ellipsis; white-space: nowrap; }
    .roadmap-feature-snapshot__target strong { color: var(--text-tertiary); font-weight: 700; }
    .roadmap-feature-snapshot__target--overdue { color: #b91c1c; font-weight: 700; }
    .roadmap-feature-snapshot__target--today { color: var(--risk); font-weight: 700; }
    .roadmap-feature-snapshot__target--near { color: var(--warn); font-weight: 700; }
    .roadmap-feature-snapshot__target--done { color: var(--ok); font-weight: 700; }
    .roadmap-feature-snapshot__progress { color: var(--text-secondary); font-size: var(--step--2); font-weight: 800; white-space: nowrap; }
    /* La altura del timeline de la Feature acompaña la nueva altura de la fila, manteniendo la barra visualmente centrada. */
    .gantt-feature-timeline-canvas { min-height: 46px; }
    /* ── Target Date: fecha absoluta + urgencia operativa ───────── */
    .target-cell { display: grid; gap: 1px; line-height: 1.25; min-width: 0; }
    .target-cell__date { color: var(--text-secondary); font-size: var(--step--1); }
    .target-cell__delta { font-size: var(--step--2); font-weight: 700; white-space: nowrap; }
    .target-cell--overdue .target-cell__delta,.target-cell--today .target-cell__delta { color: var(--risk); }
    .target-cell--near .target-cell__delta { color: var(--warn); }
    .target-cell--ok .target-cell__delta { color: var(--text-tertiary); }
    .target-cell--done .target-cell__delta { color: var(--ok); }
    .target-cell--none .target-cell__date { color: var(--text-tertiary); }
    /* Sólo el atraso merece un marcador fuerte en la fila. El indicador se proyecta ligeramente fuera de la celda para que pueda escanearse
      rápido sin convertir todos los estados en alertas visuales. */
    .target-cell--overdue { position: relative; }
    .target-cell--overdue::before { content: ''; position: absolute; top: -6px; bottom: -6px; left: -9px; width: 2px; border-radius: 1px; background: var(--risk); }
    /* Permite que el marcador de atraso se proyecte fuera de la celda sin afectar el resto de las columnas de la tabla. */
    .feature-list-date-cell:has(.target-cell--overdue) { overflow: visible; }
    /* ── Release Fix Version compacto en Feature List ──────────── */
    .release-fix-version-cell { display: grid; gap: 1px; min-width: 0; color: var(--text-secondary); font-size: var(--step--2); font-weight: 700; line-height: 1.2; text-align: left; }
    /* Cada tramo no se vuelve a cortar: ReleaseFixVersionCell ya divide el valor exactamente después de los primeros 12 caracteres. */
    .release-fix-version-cell__line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .release-fix-version-cell__empty { color: var(--text-tertiary); font-size: var(--step--1); }
    /* ── Target Date compacto en cards móviles ─────────────────── */
    .mobile-target-date { display: inline-flex; align-items: baseline; flex-wrap: wrap; column-gap: 4px; row-gap: 1px; min-width: 0; white-space: normal; }
    .mobile-target-date__date { color: var(--text-secondary); font-size: var(--step--1); font-weight: 700; line-height: 1.2; white-space: nowrap; }
    .mobile-target-date__separator { color: var(--text-tertiary); font-size: var(--step--2); font-weight: 700; line-height: 1; }
    .mobile-target-date__delta { font-size: var(--step--2); font-weight: 800; line-height: 1.25; white-space: nowrap; }
    .mobile-target-date--overdue .mobile-target-date__delta,.mobile-target-date--today .mobile-target-date__delta { color: var(--risk); }
    .mobile-target-date--near .mobile-target-date__delta { color: var(--warn); }
    .mobile-target-date--ok .mobile-target-date__delta { color: var(--text-tertiary); }
    .mobile-target-date--done .mobile-target-date__delta { color: var(--ok); }
    .mobile-target-date--none { color: var(--text-tertiary); }
    /* ── Grilla compacta de información en Mobile Feature Card ─── */
    .mobile-feature-card__info-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 10px 14px; }
    .mobile-feature-card__info-item { min-width: 0; }
    .mobile-feature-card__info-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* RFV puede contener identificadores largos. En móvil se permite partir en puntos naturales sin ensanchar o romper la card.*/
    .mobile-feature-card__rfv { display: block; overflow: hidden; text-overflow: ellipsis; overflow-wrap: anywhere; white-space: normal; }
    /* ── Release / Sprint Alignment ─────────────────────────────── */
    .release-alignment-details { min-width: 0; margin-top: 11px; padding-top: 11px; border-top: 1px solid #e5edf5; }
    .release-alignment-details__heading { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; min-width: 0; }
    .release-alignment-details__title { color: var(--text-primary); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .release-alignment-badge { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 2px 7px 2px 5px;
      border-radius: var(--radius-chip); font-size: 10px; font-weight: 700; line-height: 1.25; }
    .release-alignment-badge__icon { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; flex: 0 0 14px;
      border-radius: 50%; color: var(--surface-raised); font-size: 9px; font-weight: 800; }
    .release-alignment-badge--aligned { color: #166534; background: var(--ok-soft); }
    .release-alignment-badge--aligned .release-alignment-badge__icon { background: var(--ok); }
    .release-alignment-badge--at-risk { color: #854d0e; background: var(--warn-soft); }
    .release-alignment-badge--at-risk .release-alignment-badge__icon { background: var(--warn); }
    .release-alignment-badge--missed,
    .release-alignment-badge--release-passed { color: #991b1b; background: var(--risk-soft); }
    .release-alignment-badge--missed .release-alignment-badge__icon,
    .release-alignment-badge--release-passed .release-alignment-badge__icon { background: var(--risk); }
    .release-alignment-badge--unavailable,
    .release-alignment-badge--not-applicable { color: var(--text-secondary); background: var(--neutral-soft); }
    .release-alignment-badge--unavailable .release-alignment-badge__icon,
    .release-alignment-badge--not-applicable .release-alignment-badge__icon { background: var(--text-tertiary); }
    .release-alignment-details__summary { display: block; margin-top: 6px; color: var(--text-secondary); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
    .release-alignment-details__metrics { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .release-alignment-details__metric { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 7px; border: 1px solid var(--line-hairline);
      border-radius: var(--radius-chip); background: var(--surface-sunken); color: var(--text-secondary); font-size: 10px; font-weight: 700; line-height: 1.25; }
    .release-alignment-details__metric--risk { border-color: #fbbf24; background: var(--warn-soft); color: #854d0e; }
    .release-alignment-details__metric--error { border-color: #fca5a5; background: var(--risk-soft); color: #991b1b; }
    .release-alignment-details__next-release { display: block; margin-top: 8px; color: var(--accent-strong); font-size: 10px; font-weight: 700; line-height: 1.4; }
    @media (max-width: 560px) { .release-alignment-details__metrics { gap: 4px; }
      .release-alignment-details__metric { font-size: 9px; }}
    /* Stories and Bugs header: - Left: heading, description, and state/filter buttons. - Right: Release / Sprint Alignment. */
    .feature-work-items-panel__top-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr); gap: 16px; align-items: start;
      min-width: 0; }
    .feature-work-items-panel__controls { min-width: 0; }
    .feature-work-items-panel__alignment { min-width: 0; padding: 11px 12px; border: 1px solid var(--line-hairline); border-radius: 7px; 
      background: var(--surface-sunken); }
    /* Dentro del panel lateral ya existe una tarjeta propia. No debe repetir el borde superior ni crear separación extra. */
    .feature-work-items-panel__alignment.release-alignment-details { margin-top: 0; padding-top: 0; border-top: 0; }
    @media (max-width: 980px) { .feature-work-items-panel__top-grid { grid-template-columns: 1fr; gap: 12px; }}
    /* ── Evita que textos largos de Delivery Health se desborden ─── */
    .feature-status-details__alerts,.delivery-inline-alert,.delivery-inline-alert__summary,.delivery-inline-alert__summary-content { min-width: 0; max-width: 100%;}

    .delivery-inline-alert__title,.delivery-inline-alert__reason,.delivery-inline-alert__detail-value { overflow-wrap: anywhere; word-break: break-word; }
    .delivery-inline-alert__reason { white-space: normal; }
    /* Indicador compacto y clicable dentro de la columna RFV. No usa tooltip: al hacer clic abre el detalle completo de la Feature. */
    .release-alignment-indicator { appearance: none; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex: 0 0 16px;

      font-size: inherit; font-weight: inherit; line-height: 1;}
    /* El color se pinta en el botón, no en el span interno. */
    .release-alignment-indicator.release-alignment-badge--aligned { background: var(--ok);}
    .release-alignment-indicator.release-alignment-badge--at-risk { background: var(--warn);}
    .release-alignment-indicator.release-alignment-badge--missed,.release-alignment-indicator.release-alignment-badge--release-passed {
      background: var(--risk);}
    .release-alignment-indicator.release-alignment-badge--unavailable { background: var(--text-tertiary);}
    .release-alignment-indicator:hover { transform: scale(1.12);}
    .release-alignment-indicator:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px;}

    @media (prefers-reduced-motion: reduce) {.release-alignment-indicator:hover,.release-alignment-indicator:active { transform: none; }}
    /* ── Stories and Bugs + Release Alignment: tarjetas gemelas ─── */
    .feature-work-items-panel__top-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: stretch; min-width: 0; }
    .feature-work-items-panel__controls-card,.feature-work-items-panel__alignment { min-width: 0; padding: 12px;  border: 1px solid var(--line-hairline);
      border-radius: 7px; background: var(--surface-raised); }
    .feature-work-items-panel__controls-card { display: flex; flex-direction: column; align-items: stretch; }
    /*  Los botones pueden ocupar una segunda o tercera línea si no caben.No se reducen de manera ilegible.*/
    .feature-work-items-panel__controls-card.feature-work-items-panel__filters { margin-top: 11px;}
    .feature-work-items-panel__controls-card.delivery-details__summary { align-items: flex-start;}
    /* ReleaseAlignmentDetails ya está dentro de una tarjeta. Por eso no debe dibujar un segundo divisor interno.*/
    .feature-work-items-panel__alignment.release-alignment-details { margin-top: 0; padding-top: 0; border-top: 0;}
    /* La lista de Stories/Bugs se conserva en su propia superficie, debajo de las dos tarjetas superiores.*/
    .feature-work-items-panel__divider { display: none;}

    .feature-work-items-panel__results.delivery-work-group:first-child { margin-top: 0;}
    @media (max-width: 980px) {.feature-work-items-panel__top-grid { grid-template-columns: 1fr; gap: 10px; }}
    .release-fix-version-with-alignment { display: flex; align-items: flex-start; gap: 4px; min-width: 0;}
    .release-fix-version-with-alignment .release-fix-version-cell,.release-fix-version-with-alignment .release-fix-version-cell__empty {

    .release-fix-version-with-alignment .release-alignment-indicator { flex: 0 0 16px; margin-top: 1px; }
    /* ── Regla temporal(tiempo) única del Roadmap ─────────────────────────── */

    .gantt-horizontal-scroll { position: relative; isolation: isolate; }

    /* Divisiones alineadas con las doce unidades del encabezado. Son deliberadamente sutiles: proporcionan estructura temporal sin competir con las barras, los markers ni los estados.*/
    .gantt-ruler__grid { position: absolute; inset: 0; opacity: 0.72; background: repeating-linear-gradient( to right, transparent 0,

    /* Today es una sola línea continua para toda la altura del Roadmap. Se lee como una referencia temporal global, no como quince segmentos independientes dentro de las filas. */
    .gantt-ruler__today { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent-strong); opacity: 1;  box-shadow:

      transform: translateX(-50%); box-shadow: var(--shadow-chip); }

    .roadmap-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; min-width: 0; margin-top: 6px; color: var(--text-tertiary); font-size: var(--step--2);

    .roadmap-legend__marker--today { width: 2px; height: 13px; border-radius: 999px; background: var(--accent, #2563eb);

    .roadmap-legend__marker--target { width: 9px; height: 9px; border: 2px solid var(--risk, #dc2626); border-radius: 50%; background: var(--surface, #fff);}

    .roadmap-legend__marker--rfv { color: var(--warn, #d97706); font-size: 14px; font-weight: 800; transform: translateY(-0.5px);}

    .roadmap-legend__marker--tech-go-live { color: var(--accent, #2563eb); font-size: 13px; font-weight: 800; transform: translateY(-0.5px);}
    .dashboard-interaction-hint__message--mobile { display: none;}
    @media (max-width: 820px) { .dashboard-interaction-hint__legend { display: none; }
      .dashboard-interaction-hint__message--desktop { display: none; }
      .dashboard-interaction-hint__message--mobile { display: inline; }}
    /* ── Protección contra overflow horizontal en cards móviles ───── */
    @media (max-width: 820px) { html, body, #root { width: 100%; max-width: 100%; }
      .container.dashboard-shell, .dashboard-fixed-content, .dashboard-results-scroll, .mobile-feature-list, .mobile-roadmap-list, .mobile-feature-card,
      .mobile-feature-card__header, .mobile-feature-card__details, .feature-detail-panel, .delivery-details, .delivery-details__overview-grid,
      .feature-work-items-panel, .feature-work-items-panel__top-grid, .feature-work-items-panel__controls-card, .feature-work-items-panel__alignment,

      .roadmap-legend__items {flex-basis: 100%;} }

      .roadmap-legend__items { gap: 5px 9px; }
      .roadmap-legend__label { flex-basis: 100%; } }

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { DateTime } = luxon;

    /* Fallback seguro antes de recibir /api/features. El backend devuelve dashboard.timeZone y reemplaza este valor durante la carga. 
    El fallback evita que haya un render inicial inconsistente si la respuesta todavía no llegó. */
    let dashboardTimeZone = 'America/Chicago';

    /* Este valor debe mantenerse alineado con targetDateNearDays en las reglas de Delivery Health del backend.
    Cuando /api/features exponga dashboard.thresholds.targetDateNearDays, este valor deberá actualizarse desde loadFeatures() para que UI y
    reglas del servidor compartan la misma fuente de verdad. */
    let targetDateNearDays = 14;
    
    function getDashboardNow() {
      return DateTime.now().setZone(dashboardTimeZone);
    }

    function getDashboardToday() {
      return getDashboardNow()
        .startOf('day')
        .toJSDate();
    }

    /*
      Interpreta YYYY-MM-DD como una fecha de negocio en Chicago.
      No se debe usar new Date('YYYY-MM-DD'), porque JavaScript trata
      esa forma como UTC y puede desplazar visualmente el día.
    */
    function parseDashboardDate(value) {
      if (!value) {
        return null;
      }

      const normalizedValue = String(value).trim();

      const parsed = /^\d{4}-\d{2}-\d{2}$/.test(normalizedValue)
        ? DateTime.fromISO(normalizedValue, {
            zone: dashboardTimeZone
          })
        : DateTime.fromISO(normalizedValue, {
            setZone: true
          }).setZone(dashboardTimeZone);

      return parsed.isValid
        ? parsed.toJSDate()
        : null;
    }

    function getDashboardDateTime(value) {
      const date = parseDashboardDate(value);

      return date
        ? DateTime.fromJSDate(date).setZone(dashboardTimeZone)
        : null;
    }

    /* Convierte Target Date a la unidad que realmente permite decidir: días restantes o días de retraso.
      No se usa la zona local del navegador: tanto la fecha objetivo como "today" se evalúan bajo dashboardTimeZone, que llega desde el backend. */
    function getTargetDateStatus(targetDate, featureState) {
      const target = getDashboardDateTime(targetDate);

      if (!target) {
        return {
          tone: 'none',
          days: null,
          text: 'No target date'
        };
      }

      const days = Math.round(
        target
          .startOf('day')
          .diff(
            getDashboardNow().startOf('day'),
            'days'
          )
          .days
      );

      /* Una Feature cerrada no debe aparecer como overdue aunque su fecha objetivo haya quedado atrás: visualmente ya representa entrega.  */
      if (String(featureState || '') === 'Closed') {
        return {
          tone: 'done',
          days,
          text: 'Delivered'
        };
      }

      if (days < 0) {
        const overdueDays = Math.abs(days);

        return {
          tone: 'overdue',
          days,
          text: `${overdueDays} day${overdueDays === 1 ? '' : 's'} overdue`
        };
      }

      if (days === 0) {
        return {
          tone: 'today',
          days,
          text: 'Due today'
        };
      }

      if (days <= targetDateNearDays) {
        return {
          tone: 'near',
          days,
          text: `in ${days} day${days === 1 ? '' : 's'}`
        };
      }

      return {
        tone: 'ok',
        days,
        text: `in ${days} day${days === 1 ? '' : 's'}`
      };
    }

    /* Celda reutilizable para Feature List. La fecha absoluta sigue visible para referencia y el texto inferior
      expresa urgencia en días, que es la unidad operativa útil. */
    function TargetDateCell({
      targetDate,
      featureState,
      formatDate
    }) {
      const status = getTargetDateStatus(
        targetDate,
        featureState
      );

      return (
        <div
          className={`target-cell target-cell--${status.tone}`}
          title={
            status.days === null

          <span className="target-cell__date">

          </span>

          {status.days !== null && (
            <span className="target-cell__delta">

            </span>
          )}
        </div>
      );
    }

    /* Versión compacta de Target Date para cards móviles. Reutiliza exactamente getTargetDateStatus(), por lo que desktop y
      móvil no pueden calcular distinto el estado de una misma fecha. */
    /* Target Date compacto para cards móviles. La fecha absoluta y el estado relativo comparten la misma línea:
      10/03/2026 · 3 days overdue

    function MobileTargetDateValue({

    function createDashboardDate(year, month, day = 1) {
      const date = DateTime.fromObject(
        { year, month: month + 1, day },
        { zone: dashboardTimeZone }
      );

      return date.isValid
        ? date.toJSDate()
        : null;
    }

    function addDashboardDays(date, days) {
      return DateTime
        .fromJSDate(date)
        .setZone(dashboardTimeZone)
        .plus({ days })
        .toJSDate();
    }

    function formatDashboardMonth(date, options = {}) {
      return DateTime
        .fromJSDate(date)
        .setZone(dashboardTimeZone)
        .setLocale('en-US')
        .toLocaleString({
          month: 'short',
          ...options
        });
    }

    /* El backend entrega el calendario validado en: /api/features -> dashboard.releaseCalendar.
    Se inicializa vacío para evitar errores durante el primer render, antes de que termine la carga. */
    let releaseCalendar = {};

    function getReleaseDate(releaseFixVersion) {
      return releaseCalendar?.[releaseFixVersion]?.date || null;
    }
    
    function getReleaseSequence(releaseFixVersion) {
      const sequence = releaseCalendar?.[releaseFixVersion]?.sequence;
    
      return Number.isInteger(sequence)

    }

    const storyStateColors = {

      return (

    function FeatureStatusDetails({ feature }) {

   /* Delivery Health:
      La fuente de verdad preferida es feature.deliveryHealth, calculada por el backend. El frontend solamente asigna color, icono y clases
      CSS para renderizarla.
      La lógica antigua basada en deliverySummary se conserva por ahora como fallback temporal para respuestas cacheadas antiguas. */

  /* Delivery Health visual meta.
    El backend define el grupo operativo real de cada regla:
    - requires-action
    - requires-attention
    - healthy
    - not-started
    key conserva estilos especiales cuando corresponde, pero group evita que una regla nueva o no mapeada se muestre con severidad incorrecta. */
  function getDeliveryVisualMeta(key, group = '') {
    switch (key) {
      /* Estas reglas representan compromisos ya vencidos, incumplidos o situaciones que requieren intervención inmediata. */
      case 'overdue':
      case 'target-date-near-unscheduled-discovery':
      case 'target-next-month-without-release':
      case 'release-commitment-missed':
      case 'release-date-passed-with-open-work':
        return {
          className: 'delivery--overdue',
          alertClassName: 'delivery-alert--overdue',
          icon: '!'
        };

      /* Needs estimate conserva un color diferenciado porque indica falta de información de sizing, no necesariamente un retraso operativo. */
      case 'needs-estimate':
        return {
          className: 'delivery--needs-info',
          alertClassName: 'delivery-alert--needs-info',
          icon: '!'
        };

      case 'healthy':
        return {
          className: 'delivery--healthy',
          alertClassName: 'delivery-alert--healthy',
          icon: '✓'
        };

      case 'not-started':
        return {
          className: 'delivery--not-started',
          alertClassName: 'delivery-alert--not-started',
          icon: '○'
        };

      case 'unable-to-evaluate':
        return {
          className: 'delivery--unknown',
          alertClassName: 'delivery-alert--unknown',
          icon: '?'
        };

      default:
        /* Fallback gobernado por el group del backend. Esto cubre reglas válidas como no-stories, no-active-work, unestimated-work,
          closed-with-open-work y futuras reglas configurables. */
        if (group === 'requires-action') {
          return {
            className: 'delivery--overdue',
            alertClassName: 'delivery-alert--overdue',
            icon: '!'
          };
        }

        if (group === 'healthy') {
          return {
            className: 'delivery--healthy',
            alertClassName: 'delivery-alert--healthy',
            icon: '✓'
          };
        }

        if (group === 'not-started') {
          return {
            className: 'delivery--not-started',
            alertClassName: 'delivery-alert--not-started',
            icon: '○'
          };
        }

        if (group === 'requires-attention') {
          return {
            className: 'delivery--attention',
            alertClassName: 'delivery-alert--attention',
            icon: '!'
          };
        }

        /* Protección visual para payloads incompletos o grupos no reconocidos. No afirma Healthy ni Not started sin confirmación. */
        return {
          className: 'delivery--unknown',
          alertClassName: 'delivery-alert--unknown',
          icon: '?'
        };
    }
  }

    function getDeliveryHealthDisplayLabels(key, fallbackLabel) {
      if (key === 'needs-estimate') {
        return {
          label: 'Needs High Level Estimation',
          shortLabel: 'Needs HLE'
        };
      }
    
      return {
        label: fallbackLabel,
        shortLabel: fallbackLabel
      };
    }

    /* parseDashboardDate() se declara una sola vez al inicio del script. Usa Luxon y dashboardTimeZone para interpretar fechas operativas
      bajo America/Chicago.*/
    /* Delivery Health es calculado exclusivamente por el backend.
      El frontend solo:
      - asigna estilos, iconos y clases CSS;
      - renderiza primary y alerts;
      - usa group para KPI y filtros. */

    function getDeliveryHealth(feature) {
      const primary = feature.deliveryHealth?.primary;

      /* Este caso no es un fallback de negocio: es una protección visual para una respuesta incompleta o inválida. */
      if (!primary || typeof primary !== 'object') {
        const visual = getDeliveryVisualMeta(
          'unable-to-evaluate',
          'requires-attention'
        );

        return {
          key: 'unable-to-evaluate',
          label: 'Unable to evaluate',
          shortLabel: 'Unavailable',
          group: 'requires-attention',
          className: visual.className,
          icon: visual.icon,
          reason:
            'Delivery Health information was not returned by the server.',
          recommendedAction:
            'Refresh the dashboard and verify Azure DevOps availability.'
        };
      }

      const visual = getDeliveryVisualMeta(
        primary.key,
        primary.group
      );

      const labels = getDeliveryHealthDisplayLabels(
        primary.key,
        primary.label
      );
      
      return {
        key: primary.key,
        label: labels.label,
        shortLabel:
          primary.key === 'needs-estimate'
            ? labels.shortLabel
            : (primary.shortLabel || labels.shortLabel),
        group: primary.group,
        className: visual.className,
        icon: visual.icon,
        reason: primary.reason,
        recommendedAction: primary.recommendedAction
      };
    }
    function getDeliveryHealthAlerts(feature) {
      const backendAlerts = feature.deliveryHealth?.alerts;

      /* El backend envía [] cuando no existen alertas aplicables, por ejemplo para un Feature Healthy o Not started. */
      if (!Array.isArray(backendAlerts)) {
        const visual = getDeliveryVisualMeta(
          'unable-to-evaluate',
          'requires-attention'
        );

        return [{
          key: 'unable-to-evaluate',
          label: 'Unable to evaluate',
          group: 'requires-attention',
          className: visual.alertClassName,
          reason:
            'Delivery Health alert information was not returned by the server.',
          recommendedAction:
            'Refresh the dashboard and verify Azure DevOps availability.'
        }];
      }

      return backendAlerts.map(alert => {
        const visual = getDeliveryVisualMeta(
          alert.key,
          alert.group
        );
      
        const labels = getDeliveryHealthDisplayLabels(
          alert.key,
          alert.label
        );
      
        return {
          key: alert.key,
          label: labels.label,
          group: alert.group,
          className: visual.alertClassName,
          reason: alert.reason,
          recommendedAction: alert.recommendedAction
        };
      });
    }

    function getReleaseAlignmentMeta(status) {
      switch (status) {
        case 'aligned':
          return {
            label: 'Aligned',
            icon: '✓',
            className: 'release-alignment-badge--aligned'
          };
    
        case 'at-risk':
          return {
            label: 'At risk',
            icon: '!',
            className: 'release-alignment-badge--at-risk'
          };
    
        case 'missed':
          return {
            label: 'Commitment missed',
            icon: '!',
            className: 'release-alignment-badge--missed'
          };
    
        case 'release-passed':
          return {
            label: 'Release date passed',
            icon: '!',
            className: 'release-alignment-badge--release-passed'
          };
    
        case 'unavailable':
          return {
            label: 'Unavailable',
            icon: '?',
            className: 'release-alignment-badge--unavailable'
          };
    
        case 'not-applicable':
          return {
            label: 'Not applicable',
            icon: '○',
            className: 'release-alignment-badge--not-applicable'
          };
    
        default:
          return {
            label: 'Unavailable',
            icon: '?',
            className: 'release-alignment-badge--unavailable'
          };
      }
    }

  function formatReleaseAlignmentDate(value) {
    const parsedDate = parseDashboardDate(value);
  
    if (!parsedDate) {
      return '—';
    }
  
    return parsedDate.toLocaleDateString(
      'es-CO',
      {
        timeZone: dashboardTimeZone
      }
    );
  }

  function ReleaseAlignmentDetails({ feature }) {
    const alignment =
      feature?.deliverySummary?.releaseAlignment;
  
    /*
      El backend normalmente siempre entrega esta estructura.
      Este fallback evita que una entrada histórica anterior rompa
      el detalle expandido.
    */
    const normalizedAlignment = alignment || {
      status: 'unavailable',
      featureRfv: feature?.releaseFixVersion || '',
      featureReleaseDate: null,
      commitmentCutoffDate: null,
      affectedWorkItems: 0,
      pendingWorkItems: 0,
      reasons: {},
      nextViableRfv: null
    };
  
    const meta = getReleaseAlignmentMeta(
      normalizedAlignment.status
    );
  
    const reasons = normalizedAlignment.reasons || {};
  
    const reasonMetrics = [
      {
        key: 'noSprint',
        label: 'without Sprint',
        count: Number(reasons.noSprint || 0)
      },
      {
        key: 'unmappedSprint',
        label: 'unmapped Sprint',
        count: Number(reasons.unmappedSprint || 0)
      },
      {
        key: 'sprintRfvMismatch',
        label: 'Sprint RFV mismatch',
        count: Number(reasons.sprintRfvMismatch || 0)
      },
      {
        key: 'workItemRfvMismatch',
        label: 'Work item RFV mismatch',
        count: Number(reasons.workItemRfvMismatch || 0)
      }
    ].filter(item => item.count > 0);
  
    const isRisk =
      normalizedAlignment.status === 'at-risk';
  
    const isError =
      normalizedAlignment.status === 'missed' ||
      normalizedAlignment.status === 'release-passed';
  
    const isNotApplicable =
      normalizedAlignment.status === 'not-applicable';
  
    const summaryText = (() => {
      if (isNotApplicable) {
        return normalizedAlignment.featureRfv
          ? 'This Feature is closed, so release alignment is no longer evaluated.'
          : 'This Feature does not have a Release Fix Version assigned.';
      }
  
      if (normalizedAlignment.status === 'unavailable') {
        return 'The Feature has pending delivery work, but release or Sprint planning information is unavailable.';
      }
  
      if (normalizedAlignment.status === 'aligned') {
        return normalizedAlignment.pendingWorkItems > 0
          ? `${normalizedAlignment.pendingWorkItems} pending work item(s) are aligned with the Feature RFV and planned Sprint.`
          : 'No pending Stories or Bugs require release alignment evaluation.';
      }
  
      return (
        `${normalizedAlignment.affectedWorkItems} affected of ` +
        `${normalizedAlignment.pendingWorkItems} pending work item(s).`

    return (

        <p className="release-alignment-details__summary">

        {!isNotApplicable && (
          <div className="release-alignment-details__metrics">
            <span className="release-alignment-details__metric">
              RFV: {normalizedAlignment.featureRfv || '—'}

            <span className="release-alignment-details__metric">

            </span>
  
            <span className="release-alignment-details__metric">
              Cutoff: {formatReleaseAlignmentDate(
                normalizedAlignment.commitmentCutoffDate

            </span>
  
            {normalizedAlignment.pendingWorkItems > 0 && (
              <span className="release-alignment-details__metric">
                Pending: {normalizedAlignment.pendingWorkItems}
              </span>

            {normalizedAlignment.affectedWorkItems > 0 && (
              <span
                className={[

                  isError

            {reasonMetrics.map(reason => (

                key={reason.key}

        {normalizedAlignment.nextViableRfv && (
          <span className="release-alignment-details__next-release">

          </span>
        )}
      </section>
    );
  }
    
    function ReadinessOverview({

    // ── Tooltip global ──────────────────────────────────────────────
    function useTooltip() {
      const [tooltip, setTooltip] = React.useState({ visible: false, x: 0, y: 0, content: null });
      const showTooltip = React.useCallback((e, content) => {
        setTooltip({ visible: true, x: e.clientX, y: e.clientY, content });
      }, []);
      const moveTooltip = React.useCallback((e) => {
        setTooltip(prev => ({ ...prev, x: e.clientX, y: e.clientY }));
      }, []);
      const hideTooltip = React.useCallback(() => {
        setTooltip(prev => ({ ...prev, visible: false }));
      }, []);
      return { tooltip, showTooltip, moveTooltip, hideTooltip };
    }

    function Tooltip({ tooltip }) {
      if (!tooltip.visible || !tooltip.content) return null;
      const style = {
        position: 'fixed',
        left: tooltip.x + 14,
        top: tooltip.y - 10,
        background: 'rgba(15, 23, 42, 0.93)',
        color: 'white',
        padding: '8px 12px',
        borderRadius: '6px',
        fontSize: '11px',
        lineHeight: '1.6',
        pointerEvents: 'none',
        zIndex: 9999,
        maxWidth: '260px',
        boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
        whiteSpace: 'pre-wrap'
      };
      const adjustedLeft = tooltip.x + 14 + 260 > window.innerWidth
        ? tooltip.x - 274
        : tooltip.x + 14;
      return (
        <div style={{ ...style, left: adjustedLeft }}>
          {tooltip.content}
        </div>
      );
    }

    /* Un encabezado reutilizable para cualquier columna ordenable.
      - El <th> conserva scope="col".
      - aria-sort comunica el orden real al lector de pantalla.
      - El botón concentra la interacción de mouse, teclado y foco. */
    function SortableHeader({
      column,
      label,
      hint,
      align = 'left',
      sortColumn,
      sortOrder,
      onSort
    }) {
      const isActive = sortColumn === column;

      const alignmentClassName =
        align === 'center'
          ? 'sortable-header--center'
          : align === 'right'
            ? 'sortable-header--right'
            : '';

      return (
        <th
          scope="col"
          className={[
            'sortable-header',
            alignmentClassName,
            isActive ? 'sortable-header--active' : ''
          ]
            .filter(Boolean)
            .join(' ')}
          style={{
            textAlign: align
          }}
          aria-sort={
            isActive
              ? (
                  sortOrder === 'asc'
                    ? 'ascending'
                    : 'descending'
                )
              : 'none'
          }
        >
          <button
            type="button"
            className="sortable-header__button"
            onClick={() => onSort(column)}
            title={hint || `Sort by ${label}`}
          >
            <span className="sortable-header__label">
              {label}
            </span>

            <span
              className="sortable-header__arrow"
              aria-hidden="true"
            >
              {isActive
                ? (
                    sortOrder === 'asc'
                      ? '▲'
                      : '▼'
                  )
                : '↕'}
            </span>
          </button>
        </th>
      );
    }

    /* Estado reutilizable para el panel principal de resultados.
