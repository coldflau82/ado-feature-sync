    function getStorySprintInfo(iterationPath) {
      const rawIterationPath = String(iterationPath || '').trim();
    
      if (!rawIterationPath) {
        return {
          label: 'No Sprint assigned',
          hasAssignedSprint: false,
          start: null,
          end: null
        };
      }
    
      const sprintNumberMatch = rawIterationPath.match(
        /(?:^|_)(S\d+)(?:_|$)/i
      );
    
      const label = sprintNumberMatch
        ? sprintNumberMatch[1].toUpperCase()
        : 'No Sprint assigned';
    
      const sprintRangeMatch = rawIterationPath.match(
        /(\d{4})_(S\d+)_([A-Za-z]+)(\d{1,2})-([A-Za-z]+)(\d{1,2})/
      );
    
      if (!sprintRangeMatch) {
        return {
          label,
          hasAssignedSprint: true,
          start: null,
          end: null
        };
      }
    
      const year = Number(sprintRangeMatch[1]);
    
      const monthMap = {
        jan: 0,
        feb: 1,
        mar: 2,
        apr: 3,
        may: 4,
        jun: 5,
        jul: 6,
        aug: 7,
        sep: 8,
        oct: 9,
        nov: 10,
        dec: 11
      };
    
      const startMonth = monthMap[
        sprintRangeMatch[3].slice(0, 3).toLowerCase()
      ];
    
      const endMonth = monthMap[
        sprintRangeMatch[5].slice(0, 3).toLowerCase()
      ];
    
      const startDay = Number(sprintRangeMatch[4]);
      const endDay = Number(sprintRangeMatch[6]);
    
      if (
        !Number.isInteger(year) ||
        startMonth === undefined ||
        endMonth === undefined ||
        !Number.isInteger(startDay) ||
        !Number.isInteger(endDay)
      ) {
        return {
          label,
          hasAssignedSprint: true,
          start: null,
          end: null
        };
      }
    
      const endYear = endMonth < startMonth
        ? year + 1
        : year;
    
      return {
        label,
        hasAssignedSprint: true,
        start: createDashboardDate(year, startMonth, startDay),
        end: createDashboardDate(endYear, endMonth, endDay)
      };
    }
    
    function StoryRow({ storyId, title, storyPoints, state, iterationPath, formatDate, timelineStart, timelineEnd, adoLink, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const today = getDashboardToday();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);
      
      const segments = [];
      if (states.length > 0) {
        states.forEach((st, idx) => {
          const stateStart = parseDashboardDate(st.changedDate);
          const stateEnd = idx === states.length - 1
            ? today
            : parseDashboardDate(states[idx + 1].changedDate);

          if (!stateStart || !stateEnd) {
            return;
          }

          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            segments.push({
              color: storyStateColors[st.state] || '#cccccc',
              state: st.state,
              startPercent: clampedStart,
              widthPercent: Math.max(1, clampedEnd - clampedStart)
            });
          }
        });
      }

      const sprintInfo = getStorySprintInfo(iterationPath);
      const sprintStart = sprintInfo.start;
      const sprintEnd = sprintInfo.end;
      const sprintLabel = sprintInfo.label;
      const getSprintPercent = (date) => {
        const days = (date - timelineStart) / (1000 * 60 * 60 * 24);
        return (days / timelineTotalDays) * 100;
      };

      let sprintStartPercent = null;
      let sprintEndPercent = null;
      let sprintMidPercent = null;
      let isSprintFullyVisible = false;
      
      if (sprintStart && sprintEnd) {
        const rawStart = getSprintPercent(sprintStart);
        const rawEnd = getSprintPercent(sprintEnd);
      
        /*
          Sólo se dibujan las dos líneas cuando el Sprint completo
          cabe dentro de la ventana de 12 semanas.
        */
        if (rawStart >= 0 && rawEnd <= 100) {
          sprintStartPercent = rawStart;
          sprintEndPercent = rawEnd;
          sprintMidPercent =
            (sprintStartPercent + sprintEndPercent) / 2;
      
          isSprintFullyVisible = true;
        }
      }

      return (
        <tr className="roadmap-detail-row" style={{ borderBottom: '1px solid #eee', background: '#f2f2f2' }}>
          {/* Columna de disclosure: los Stories/Bugs no son expandibles aquí. */}
          <td className="roadmap-disclosure-cell" />

          {/* Columna Priority: los Stories/Bugs no tienen Priority propia en esta vista. */}
          <td />

          <td>
            <a
              href={adoLink(storyId)}
              target="_blank"
              rel="noopener noreferrer"
              aria-label={`Open work item ${storyId} in Azure DevOps`}
            >
              {storyId}
            </a>
          </td>

          <td style={{ maxWidth: '420px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span title={title} style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', flex: '0 1 auto', minWidth: '0' }}>{title}</span>
              <span
                style={{
                  color: storyPoints === null || storyPoints === undefined ? 'var(--risk)' : '#696969',
                  flexShrink: 0,
                  fontSize: '11px',
                  fontWeight: storyPoints === null || storyPoints === undefined ? 'bold' : 'normal'
                }}
              >
                ({storyPoints ?? 'No data'}{storyPoints !== null && storyPoints !== undefined ? ' pts' : ''})
              </span>
            </div>
          </td>
          <td className="gantt-timeline-cell" style={{ padding: '6px 8px' }}>
            <div className="gantt-timeline-canvas" style={{ height: '36px', background: '#e0e0e0', borderRadius: '4px', overflow: 'hidden', 
              position: 'relative' }}>
              {!loading && segments.map((seg, idx) => {
                const segStartDate = new Date(timelineStart.getTime() + (seg.startPercent / 100) * (timelineEnd - timelineStart));
                const segEndDate = new Date(timelineStart.getTime() + ((seg.startPercent + seg.widthPercent) / 100) * (timelineEnd - timelineStart));
                const diffDays = Math.round((segEndDate - segStartDate) / (1000 * 60 * 60 * 24));
                const tooltipContent = (
                <div>
                  <div style={{ fontWeight: 'bold', marginBottom: '4px', color: seg.color, fontSize: '12px' }}>
                    ● {seg.state}
                  </div>

                  <div>
                    From: {segStartDate.toLocaleDateString(
                      'es-CO',
                      { timeZone: dashboardTimeZone }
                    )}
                  </div>

                  <div>
                    To:&nbsp;&nbsp; {segEndDate.toLocaleDateString(
                      'es-CO',
                      { timeZone: dashboardTimeZone }
                    )}
                  </div>

                  <div style={{ marginTop: '4px', color: '#94a3b8' }}>
                    {diffDays} day{diffDays !== 1 ? 's' : ''} in this state
                  </div>
                </div>
                );
                return (
                  <div
                    key={idx}
                    className="gantt-bar gantt-bar--story"
                    style={{
                      left: `${seg.startPercent}%`,
                      width: `${seg.widthPercent}%`,
                      background: seg.color,
                      zIndex: 2
                    }}
                    onMouseEnter={(event) => showTooltip && showTooltip(event, tooltipContent)}
                    onMouseMove={(event) => moveTooltip && moveTooltip(event) }
                    onMouseLeave={() => hideTooltip && hideTooltip()}
                  />
                );
              })}
              {loading && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>Loading...</div>
              )}
              {!loading && segments.length === 0 && (
                <div style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', fontSize: '11px', color: '#999', zIndex: 2 }}>No data</div>
              )}
              {!loading && isSprintFullyVisible && (
                <>
                  <div
                    style={{ position: 'absolute', top: 0, bottom: 0, left: `${sprintStartPercent}%`, width: '1px', borderLeft: '1px dashed #123770', 
                      zIndex: 5, pointerEvents: 'none' }}
                  />
              
                  <div
                    style={{ position: 'absolute', top: 0, bottom: 0, left: `${sprintEndPercent}%`, width: '1px', borderLeft: '1px dashed #123770', 
                      zIndex: 5, pointerEvents: 'none' }}
                  />
              
                  <div
                    style={{ position: 'absolute', top: '2px', left: `${sprintMidPercent}%`, transform: 'translateX(-50%)', padding: '1px 5px', 
                      borderRadius: '2px', background: '#123770', color: 'var(--surface-raised)', fontSize: '9px', fontWeight: '700', lineHeight: '1.2', 
                      whiteSpace: 'nowrap', zIndex: 8, pointerEvents: 'none' }}
                  >
                    {sprintLabel}
                  </div>
                </>
              )}
              
              {!loading &&
              sprintInfo.hasAssignedSprint &&
              !isSprintFullyVisible && (
                <div
                  style={{ position: 'absolute', top: '2px', left: '6px', padding: '1px 5px', borderRadius: '2px', background: '#123770', color: 'var(--surface-raised)',
                    fontSize: '9px', fontWeight: '700', lineHeight: '1.2', zIndex: 8, pointerEvents: 'none' }}
                  title={`Assigned Sprint: ${sprintLabel}`}
                >
                  {sprintLabel}
                </div>
              )}
            </div>
          </td>
        </tr>
      );
    }
    
    function RoadmapFeatureSnapshot({
      feature,
      summary,
      formatDate,
      showTooltip,
      moveTooltip,
      hideTooltip
    }) {
      const targetStatus = getTargetDateStatus(
        feature.targetDate,
        feature.state
      );
    
      const includedWorkItems =
        Number(summary?.includedWorkItems) || 0;
    
      const completedForProgress =
        Number(summary?.completedForProgressWorkItems) || 0;
    
      const progressPercent = Math.max(
        0,
        Math.min(
          100,
          Number(summary?.progressPercent) || 0
        )
      );
    
      const progressText = !summary
        ? 'Progress unavailable'
        : includedWorkItems === 0
          ? 'No work items'
          : `${completedForProgress}/${includedWorkItems} · ${progressPercent}%`;
    
      const targetText =
        targetStatus.days === null
          ? 'No target date'
          : `${formatDate(feature.targetDate)} · ${targetStatus.text}`;
    
      return (
        <div
          className="roadmap-feature-snapshot"
          aria-label={`Delivery snapshot for Feature ${feature.id}`}
        >
          <div className="roadmap-feature-snapshot__health">
            <DeliveryHealthBadge
              feature={feature}
              compact
              showTooltip={showTooltip}
              moveTooltip={moveTooltip}
              hideTooltip={hideTooltip}
            />
          </div>
    
          <span
            className={[
              'roadmap-feature-snapshot__target',
              `roadmap-feature-snapshot__target--${targetStatus.tone}`
            ].join(' ')}
            title={
              targetStatus.days === null
                ? 'No Target Date assigned'
                : `Target Date: ${targetText}`
            }
          >
            <strong>Target:</strong> {targetText}
          </span>
    
          <span
            className="roadmap-feature-snapshot__progress"
            title={
              summary
                ? `Delivery progress: ${progressText}`
                : 'Delivery progress is unavailable'
            }
          >
            {progressText}
          </span>
        </div>
      );
    }
    
    function FeatureRow({ featureId, feature, deliverySummary, title, assignedTo, targetDate, releaseFixVersion, techGoLiveRFV, estimation,
      priority, formatDate, timelineStart, timelineEnd, adoLink, isExpanded, onToggleExpand, states, loading, showTooltip, moveTooltip, hideTooltip }) {
      const stateColors = {
        'New': '#94a3b8',
        'In Shaping': '#fbbf24',
        'In Planning': '#fb923c',
        'Planned': '#34d399',
        'In Process': '#60a5fa',
        'Closed': '#a78bfa'
      };

      const today = getDashboardToday();
      const timelineTotalDays = (timelineEnd - timelineStart) / (1000 * 60 * 60 * 24);

      const segments = [];
      if (states.length > 0) {
        states.forEach((state, idx) => {
          const stateStart = parseDashboardDate(state.changedDate);
          const stateEnd = idx === states.length - 1
            ? today
            : parseDashboardDate(states[idx + 1].changedDate);

          if (!stateStart || !stateEnd) {
            return;
          }
          const daysFromStart = (stateStart - timelineStart) / (1000 * 60 * 60 * 24);
          const daysToEnd = (stateEnd - timelineStart) / (1000 * 60 * 60 * 24);
          const rawStartPercent = (daysFromStart / timelineTotalDays) * 100;
          const rawEndPercent = (daysToEnd / timelineTotalDays) * 100;
          if (rawStartPercent < 100 && rawEndPercent > 0) {
            const clampedStart = Math.max(0, rawStartPercent);
            const clampedEnd = Math.min(100, rawEndPercent);
            const widthPercent = Math.max(1, clampedEnd - clampedStart);
            segments.push({
              color: stateColors[state.state] || '#cccccc',
              state: state.state,
              startPercent: clampedStart,
              widthPercent: widthPercent
            });
          }
        });
      }

      return (
        <tr
          className={[
            'roadmap-feature-row--expandable',
            isExpanded
              ? 'roadmap-feature-row--expanded'
              : ''
          ].filter(Boolean).join(' ')}
          style={{
            borderBottom: '1px solid #eee',
            background: isExpanded ? '#f2f7ff' : 'transparent'
          }}
          /* La fila mantiene el clic como atajo para mouse, pero ya no finge ser un botón ni recibe foco con Tab.
            El botón de la primera columna es el control accesible para expandir o contraer el timeline de Stories y Bugs.  */
          onClick={(event) => {
            if (event.target.closest('a, button')) {
              return;
            }

            if (window.getSelection()?.toString()) {
              return;
            }

            onToggleExpand();
          }}
        >
          <td className="roadmap-disclosure-cell">
            <button
              type="button"
              className={[
                'disclosure-button',
                isExpanded
                  ? 'disclosure-button--expanded'
                  : ''
              ].filter(Boolean).join(' ')}
              onClick={onToggleExpand}
              aria-expanded={isExpanded}
              aria-controls={`roadmap-feature-details-${featureId}`}
              aria-label={
                isExpanded
                  ? `Collapse Story and Bug timelines for Feature ${featureId}`
                  : `Expand Story and Bug timelines for Feature ${featureId}`
              }
              title={
                isExpanded
                  ? 'Collapse Story and Bug timelines'
                  : 'Expand Story and Bug timelines'
              }
            >
              <svg
                viewBox="0 0 16 16"
                width="14"
                height="14"
                aria-hidden="true"
              >
                <path
                  d="M4 6.5l4 4 4-4"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              </svg>
            </button>
          </td>

          <td
            style={{
              width: '36px',
              textAlign: 'center',
              fontSize: '12px',
              fontWeight: 'bold',
              color: priority ? '#1e3a8a' : '#ccc'
            }}
          >
            {priority || '—'}
          </td>

          <td>
            <a
              href={adoLink(featureId)}
              target="_blank"
              rel="noopener noreferrer"
              aria-label={`Open Feature ${featureId} in Azure DevOps`}
            >
              {featureId}
            </a>
          </td>

          <td className="roadmap-feature-title-cell">
            <div className="roadmap-feature-title" title={title}
              onMouseEnter={(event) =>
                showTooltip &&
                showTooltip(
                  event,
                  <div>
                    <div style={{ marginBottom: '6px', maxWidth: '240px', whiteSpace: 'normal', lineHeight: '1.4' }}>
                      {title}
                    </div>
                    <div style={{ color: '#94a3b8', fontSize: '10px' }}>
                      👤 Assigned to: {getShortAssignedToName(assignedTo)}
                    </div>
                    {targetDate && (
                      <div style={{ color: '#94a3b8', fontSize: '10px', marginTop: '2px'}}>
                        🎯 Target: {formatDate(targetDate)}
                      </div>
                    )}
                    {releaseFixVersion && (
                      <div style={{ color: '#94a3b8', fontSize: '10px', marginTop: '2px' }}>
                        🚀 RFV: {releaseFixVersion}
                      </div>
                    )}
          
                    {techGoLiveRFV && (
                      <div style={{ color: '#94a3b8', fontSize: '10px', marginTop: '2px' }}>
                        📣 Tech Go Live: {techGoLiveRFV}
                      </div>
                    )}
                  </div>
                )
              }
              onMouseMove={(event) => moveTooltip && moveTooltip(event)}
              onMouseLeave={() => hideTooltip && hideTooltip()}
            >
              {title}
            </div>

            <RoadmapFeatureSnapshot
              feature={feature}
              summary={deliverySummary}
              formatDate={formatDate}
              showTooltip={showTooltip}
              moveTooltip={moveTooltip}
              hideTooltip={hideTooltip}
            />
          </td>
          <td className="gantt-timeline-cell" style={{ padding: '4px 6px', overflow: 'hidden' }}>
            <div className="gantt-timeline-canvas gantt-feature-timeline-canvas"
              style={{ minHeight: '46px', background: isExpanded ? '#e0e0e0' : '#f9f9f9', borderRadius: '4px', 
              padding: '0', overflow: 'hidden', position: 'relative' }}>
              {!loading && targetDate && (() => {
                const target = parseDashboardDate(targetDate);
                  if (!target) { return null;}
          
                const targetPercent = ((target - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
                if (targetPercent < 0 || targetPercent > 100) return null;
                return (
                  <div style={{ position: 'absolute', top: '-4px', left: targetPercent + '%', transform: 'translateX(-50%)', zIndex: 11, 
                    width: '0', height: '0', borderLeft: '8px solid transparent', borderRight: '8px solid transparent', borderTop: '12px solid #f43f5e' }} 
                    title={'Target: ' + formatDate(targetDate)} />
                );
              })()}
              {/* Release Fix Version: diamante azul */}
              {!loading &&
                releaseFixVersion &&
                getReleaseDate(releaseFixVersion) &&
                (() => {
                  const releaseDate = parseDashboardDate(
                    getReleaseDate(releaseFixVersion)
                  );
              
                  if (!releaseDate) {
                    return null;
                  }
              
                  const releasePercent =
                    ((releaseDate - timelineStart) / (1000 * 60 * 60 * 24) / timelineTotalDays) * 100;
              
                  if (releasePercent < 0 || releasePercent > 100) {
                    return null;
                  }
              
                  return (
                    <div
                      style={{
                        position: 'absolute',
                        top: '55%',
                        left: `${releasePercent}%`,
                        transform: 'translate(-50%, -50%) rotate(45deg)',
                        zIndex: 12,
                        width: '10px',
                        height: '10px',
                        background: '#1e3a8a',
                      }}
                      title={
                        `Release Fix Version: ${releaseFixVersion} · ` +
                        formatDate(getReleaseDate(releaseFixVersion))
                      }
                    />
                  );
                })()}
              
              {/* Tech Go Live RFV: estrella amarilla */}
              {!loading &&
                techGoLiveRFV &&
                getReleaseDate(techGoLiveRFV) &&
                (() => {
                  const techGoLiveDate = parseDashboardDate(
                    getReleaseDate(techGoLiveRFV)
                  );
              
                  if (!techGoLiveDate) {
                    return null;
                  }
              
                  const techGoLivePercent =
                    ((techGoLiveDate - timelineStart) /
                      (1000 * 60 * 60 * 24) /
                      timelineTotalDays) *
                    100;
              
                  if (
                    techGoLivePercent < 0 ||
                    techGoLivePercent > 100
                  ) {
                    return null;
                  }
              
                  const isSameDateAsRelease =
                    releaseFixVersion &&
                    getReleaseDate(releaseFixVersion) ===
                      getReleaseDate(techGoLiveRFV);
              
                  return (
                    <span
                      style={{
                        position: 'absolute',
                        top: '55%',
                        left: `${techGoLivePercent}%`,
                        transform: isSameDateAsRelease
                          ? 'translate(calc(-50% + 11px), calc(-50% - 7px))'
                          : 'translate(-50%, -50%)',
                        zIndex: 13,
                        color: '#f59e0b',
                        fontSize: '17px',
                        fontWeight: '700',
                        lineHeight: '1',
                        textShadow:
                          '0 0 1px #78350f, 0 1px 2px rgba(15, 23, 42, 0.45)',
                      }}
                      title={
                        `Tech Go Live RFV: ${techGoLiveRFV} · ` +
                        formatDate(getReleaseDate(techGoLiveRFV))
                      }
                    >
                      ★
                    </span>
                  );
                })()}
              {loading ? (
                <span style={{ fontSize: '11px', color: '#999' }}>Loading...</span>
              ) : segments.length === 0 ? (
                <span style={{ fontSize: '11px', color: '#999' }}>No data</span>
              ) : (
                <div style={{ width: '100%', position: 'relative', height: '46px' }}>
                  {segments.map((seg, idx) => {
                    const est = estimation || {};
                    const tooltipContent = (
                      <div>
                        <div style={{ fontWeight: 'bold', color: seg.color, marginBottom: '6px', fontSize: '12px' }}>● {seg.state}</div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '6px', textAlign: 'center' }}>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>BE</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.be || '—'}</div></div>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>FE</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.fe || '—'}</div></div>
                          <div><div style={{ color: '#94a3b8', fontSize: '9px', marginBottom: '2px' }}>QA</div><div style={{ fontWeight: 'bold', fontSize: '13px' }}>{est.qa || '—'}</div></div>
                        </div>
                      </div>
                    );
                    return (
                      <div key={idx} className="gantt-bar gantt-bar--feature" style={{
                          left: `${seg.startPercent}%`,
                          width: `${seg.widthPercent}%`,
                          background: seg.color,
                          zIndex: 2
                        }}
                        onMouseEnter={(e) => showTooltip && showTooltip(e, tooltipContent)}
                        onMouseMove={(e) => moveTooltip && moveTooltip(e)}
                        onMouseLeave={() => hideTooltip && hideTooltip()}
                      />
                    );
                  })}
                </div>
              )}
            </div>
          </td>
        </tr>
      );
    }

    /*
      ───────────────────────────────────────────────────────────────
      COMPONENTES MÓVILES
      ───────────────────────────────────────────────────────────────

      Desktop/tablet conserva las tablas actuales.

      En móvil se renderizan cards independientes para no depender de:
      - tablas de 12 columnas;
      - min-width de 1180px;
      - scroll horizontal general;
      - alturas internas que bloquean el scroll vertical.
    */

    function MobileDeliveryBadge({ feature }) {
      /* En móvil no se depende de hover. El detalle expandido presenta Delivery Health, alertas y acciones recomendadas. */
      return (
        <DeliveryHealthBadge
          feature={feature}
          compact
        />
      );
    }

    /* Badge reutilizable de Delivery Health.    
      Reemplaza el title nativo por el tooltip global del dashboard en contextos desktop/tablet. En móvil conserva el aria-label, pero no
      depende de hover para comunicar la información: el detalle expandido ya muestra las alertas, la causa y la acción recomendada. */
    function DeliveryHealthBadge({
      feature,
      compact = false,
      showTooltip,
      moveTooltip,
      hideTooltip
    }) {
      const delivery = getDeliveryHealth(feature);
    
      const tooltipContent = (
        <div className="feature-list-tooltip">
          <div
            style={{
              display: 'flex',
              alignItems: 'center',
              gap: '6px',
              marginBottom: '6px'
            }}
          >
            <span
              style={{
                display: 'inline-flex',
                alignItems: 'center',
                justifyContent: 'center',
                width: '16px',
                height: '16px',
                borderRadius: '50%',
                background:
                  delivery.className === 'delivery--overdue'
                    ? 'var(--risk)'
                    : delivery.className === 'delivery--needs-info'
                      ? '#ea580c'
                      : delivery.className === 'delivery--attention'
                        ? 'var(--warn)'
                        : delivery.className === 'delivery--healthy'
                          ? 'var(--ok)'
                          : delivery.className === 'delivery--not-started'
                            ? 'var(--accent)'
                            : 'var(--text-tertiary)',
                color: '#ffffff',
                fontSize: '10px',
                fontWeight: '800',
                lineHeight: '1'
              }}
              aria-hidden="true"
            >
              {delivery.icon}
            </span>
    
            <strong
              style={{
                margin: 0,
                color: '#ffffff',
                fontSize: '12px',
                lineHeight: '1.35'
              }}
            >
              {delivery.label}
            </strong>
          </div>
    
          <div
            style={{
              color: '#cbd5e1',
              fontSize: '10px',
              lineHeight: '1.5'
            }}
          >
            {delivery.reason && (
              <div>
                <span style={{ color: '#94a3b8' }}>
                  Reason:
                </span>{' '}
                {delivery.reason}
              </div>
            )}
    
            {delivery.recommendedAction && (
              <div style={{ marginTop: '4px' }}>
                <span style={{ color: '#94a3b8' }}>
                  Action:
                </span>{' '}
                {delivery.recommendedAction}
              </div>
            )}
          </div>
        </div>
      );
    
      return (
        <span
          className={`delivery-badge ${delivery.className}`}
          aria-label={
            delivery.reason
              ? `Delivery health: ${delivery.label}. ${delivery.reason}`
              : `Delivery health: ${delivery.label}`
          }
          onMouseEnter={(event) => {
            if (showTooltip) {
              showTooltip(event, tooltipContent);
            }
          }}
          onMouseMove={(event) => {
            if (moveTooltip) {
              moveTooltip(event);
            }
          }}
          onMouseLeave={() => {
            if (hideTooltip) {
              hideTooltip();
            }
          }}
        >
          <span
            className="delivery-badge__icon"
            aria-hidden="true"
          >
            {delivery.icon}
          </span>
    
          <span className="delivery-badge__label">
            {compact
              ? delivery.shortLabel
              : delivery.label}
          </span>
        </span>
      );
    }
    
    function getFeatureStateColor(state) {
      return {
        New: '#94a3b8',
        'In Shaping': '#fbbf24',
        'In Planning': '#fb923c',
        Planned: '#34d399',
        'In Process': '#60a5fa',
        Closed: '#a78bfa'
      }[state] || '#94a3b8';
    }

    }) {

              className="mobile-feature-card__state-dot"

          <div className="mobile-feature-card__info-grid">

              <span

                  'mobile-feature-card__info-value',
                  'mobile-feature-card__info-value--wrap'

    function MobileFeatureProgress({
      feature,
      storiesCache,
      loadingStoriesIds,
      unavailableStoriesIds
    }) {
      const featureId = feature.id;

      /* El resumen del servidor permite pintar Progress desde el primer render. Si después llega storiesCache, getFeatureDeliverySummary()
        prioriza ese detalle local y refina el valor sin parpadeos. */
      const summary = getFeatureDeliverySummary(
        feature,
        storiesCache,
        unavailableStoriesIds
      );

      /* Si no existe ni detalle local ni deliverySummary del backend, sí conservamos los estados anteriores como fallback visual. */
      if (!summary) {
        if (loadingStoriesIds[featureId]) {
          return (
            <div className="mobile-feature-card__progress">
              <div className="mobile-feature-card__progress-heading">
                <span>Progress</span>
                <span>Loading Stories and Bugs...</span>
              </div>
            </div>
          );
        }

        if (unavailableStoriesIds[featureId]) {
          return (
            <div className="mobile-feature-card__progress">
              <div className="mobile-feature-card__progress-heading">
                <span>Progress</span>
                <span>Unavailable</span>
              </div>
            </div>
          );
        }

        return (
          <div className="mobile-feature-card__progress">
            <div className="mobile-feature-card__progress-heading">
              <span>Progress</span>
              <span>—</span>
            </div>
          </div>
        );
      }

      const completedForProgress =
        Number(summary.completedForProgressWorkItems) || 0;

      const total =
        Number(summary.includedWorkItems) || 0;

      const percent = Math.max(
        0,
        Math.min(
          100,
          Number(summary.progressPercent) || 0
        )
      );

      const barColor = percent === 100
        ? '#34d399'
        : percent >= 50
          ? '#60a5fa'
          : '#fbbf24';

      return (
        <div className="mobile-feature-card__progress">
          <div className="mobile-feature-card__progress-heading">
            <span>Progress</span>

            <span>
              {completedForProgress}/{total} ({percent}%)
            </span>
          </div>

          <div className="mobile-feature-card__progress-track">
            <div
              className="mobile-feature-card__progress-fill"
              style={{
                width: `${percent}%`,
                background: barColor
              }}
            />
          </div>
        </div>
      );
    }

    function MobileFeatureActivityTimeline({
      feature,
      states,
      loading,
      timelineStart,
      timelineEnd
    }) {
      const stateColors = {
        New: '#94a3b8',
        'In Shaping': '#fbbf24',
        'In Planning': '#fb923c',
        Planned: '#34d399',
        'In Process': '#60a5fa',
        Closed: '#a78bfa'
      };
    
      const today = getDashboardToday();
    
      const totalTimelineDays =
        (timelineEnd - timelineStart) /
        (1000 * 60 * 60 * 24);
    
      const getPercent = (date) => {
        const daysFromStart =
          (date - timelineStart) /
          (1000 * 60 * 60 * 24);
    
        return (daysFromStart / totalTimelineDays) * 100;
      };
    
      const formatTimelineDate = (date) =>
        DateTime
          .fromJSDate(date)
          .setZone(dashboardTimeZone)
          .setLocale('en-US')
          .toLocaleString({
            month: 'short',
            day: 'numeric'
          });
    
      const segments = [];
    
      if (!loading && Array.isArray(states) && states.length > 0) {
        states.forEach((stateChange, index) => {
          const stateStart = parseDashboardDate(
            stateChange.changedDate

                states[index + 1].changedDate
              );

          }
    
          const rawStart = getPercent(stateStart);
          const rawEnd = getPercent(stateEnd);
    
          if (rawStart < 100 && rawEnd > 0) {
            const startPercent = Math.max(0, rawStart);
            const endPercent = Math.min(100, rawEnd);
    
            segments.push({
              state: stateChange.state,
              color:

              startPercent,
              widthPercent: Math.max(

                endPercent - startPercent
              )
            });

      const rawTodayPercent = getPercent(today);
    
      const todayPercent = Math.max(
        0,
        Math.min(100, rawTodayPercent)
      );
    
      const todayLabelPercent = Math.max(
        8,
        Math.min(92, todayPercent)
      );

                Today

          {loading ? (

    function MobileFeatureTimelineAlerts({ feature }) {
      const readiness = getFeatureReadiness(feature);
    
      const missingChecks =
        getFeatureReadinessMissingChecks(feature);
    
      const unknownChecks =
        getFeatureReadinessUnknownChecks(feature);
    
      const readinessDetails =
        readiness === 'Incomplete'
          ? missingChecks
              .map(check => readinessCheckLabels[check] || check)
              .join(', ')
          : readiness === 'Unknown'
            ? unknownChecks
                .map(check => readinessCheckLabels[check] || check)
                .join(', ')
            : '';
    
      const deliveryAlerts = getDeliveryHealthAlerts(feature)
        .filter(alert => {
          /*
            Healthy y Not started son estados informativos:
            no agregan ruido debajo del timeline.
          */
          return (
            alert.key !== 'healthy' &&
            alert.key !== 'not-started'
          );
        });
    
      const hasReadinessAlert =
        readiness === 'Incomplete' ||
        readiness === 'Unknown';
    
      if (!hasReadinessAlert && deliveryAlerts.length === 0) {
        return null;
      }
    
      return (
        <div
          className="mobile-feature-timeline-alerts"
          aria-label="Feature alerts"

          {hasReadinessAlert && (
            <div className="mobile-feature-timeline-alert mobile-feature-timeline-alert--readiness">
              <strong>
                {readiness === 'Incomplete'
                  ? 'Not Ready'
                  : 'Unable to validate'}
              </strong>
    
              {readinessDetails && (
                <>
                  {' — '}
                  {readiness === 'Incomplete'
                    ? 'Data missing: '
                    : 'Unable to validate: '}
                  {readinessDetails}
                </>
              )}
            </div>
          )}
    
          {deliveryAlerts.map(alert => {
            /* Needs estimate conserva su estilo de falta de información. Para cualquier otra regla, el grupo del backend define la
              severidad visual, incluso para reglas nuevas. */
            const className =
              alert.key === 'needs-estimate'

    function getMobileTimelinePercentage(
      date,
      timelineStart,
      timelineEnd
    ) {
      if (!date) {
        return null;
      }

      const startMs = timelineStart.toMillis();
      const endMs = timelineEnd.toMillis();
      const dateMs = date.toMillis();

      if (dateMs < startMs || dateMs > endMs) {
        return null;
      }

      const total = endMs - startMs;

      if (total <= 0) {
        return null;
      }

      return Math.max(
        0,
        Math.min(
          100,
          ((dateMs - startMs) / total) * 100
        )
      );
    }

    function MobileStoryTimelineCard({

      timelineEnd
    }) {
      const stateColor =
        storyStateColors[story.state] || '#94a3b8';
    
      const today = getDashboardToday();
    
      const totalTimelineDays =
        (timelineEnd - timelineStart) /
        (1000 * 60 * 60 * 24);
    
      const getPercent = (date) => {
        const daysFromStart =
          (date - timelineStart) /
          (1000 * 60 * 60 * 24);
    
        return (daysFromStart / totalTimelineDays) * 100;
      };
    
      const formatTimelineDate = (date) =>
        DateTime
          .fromJSDate(date)
          .setZone(dashboardTimeZone)
          .setLocale('en-US')
          .toLocaleString({
            month: 'short',
            day: 'numeric'
          });
    
      const segments = [];
    
      if (!loading && Array.isArray(states) && states.length > 0) {
        states.forEach((stateChange, index) => {
          const stateStart = parseDashboardDate(
            stateChange.changedDate
          );
    
          const stateEnd = index === states.length - 1
            ? today
            : parseDashboardDate(
                states[index + 1].changedDate
              );
    
          if (!stateStart || !stateEnd) {
            return;
          }
    
          const startPercent = getPercent(stateStart);
          const endPercent = getPercent(stateEnd);
    
          if (startPercent < 100 && endPercent > 0) {
            const clampedStart = Math.max(0, startPercent);
            const clampedEnd = Math.min(100, endPercent);
    
            segments.push({
              state: stateChange.state,
              color:
                storyStateColors[stateChange.state] ||
                '#94a3b8',
              startPercent: clampedStart,
              widthPercent: Math.max(
                1,
                clampedEnd - clampedStart
              )
            });
          }
        });
      }
    
      const todayPercent = getPercent(today);
    
      const clampedTodayPercent = Math.max(
        0,
        Math.min(100, todayPercent)
      );
    
      /*
        Evita que la palabra Today sea cortada si su línea queda
        muy cerca de cualquiera de los extremos.
      */
      const todayLabelPercent = Math.max(
        8,
        Math.min(92, clampedTodayPercent)

      const sprintInfo = getStorySprintInfo(

      let sprintStartPercent = null;
      let sprintEndPercent = null;
      let sprintMidPercent = null;

        const rawSprintStart = getPercent(sprintInfo.start);
        const rawSprintEnd = getPercent(sprintInfo.end);
    
        /*
          Las líneas del Sprint aparecen únicamente si las dos fechas
          están dentro de la escala actual.
        */
        if (
          rawSprintStart >= 0 &&
          rawSprintEnd <= 100
        ) {
          sprintStartPercent = rawSprintStart;
          sprintEndPercent = rawSprintEnd;
          sprintMidPercent =
            (sprintStartPercent + sprintEndPercent) / 2;

      /*
        timelineEnd es exclusivo: mostramos el día anterior para que
        la fecha final indicada sea la última fecha realmente visible.

      const visibleTimelineEnd = DateTime

        .setZone(dashboardTimeZone)
        .minus({ days: 1 })

            {isSprintFullyVisible && (
