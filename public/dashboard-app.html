        - Las alertas siguen siendo acumulables en el detalle.
        - La cabecera solo asigna una categoría por Feature.
        - unable-to-evaluate se identifica por key, no solo por group, Porque versiones anteriores del backend pueden asociarlo a requires-attention como fallback técnico.*/
      function getExclusiveDeliveryHealthGroup(feature) {
        const primary = feature?.deliveryHealth?.primary || {};

        const alerts = getDeliveryHealthAlerts(feature);

        const hasOperationalGroup = group => alerts.some(alert => alert.key !== 'unable-to-evaluate' && alert.group === group );

        if (hasOperationalGroup('requires-action')) { return 'requires-action'; }

        if (hasOperationalGroup('requires-attention')) { return 'requires-attention'; }

        const hasUnableToEvaluate = primary.key === 'unable-to-evaluate' || alerts.some( alert => alert.key === 'unable-to-evaluate' );

        if (hasUnableToEvaluate) { return 'unable-to-evaluate'; }

        if (primary.group === 'not-started') { return 'not-started'; }

        if (primary.group === 'healthy') { return 'healthy'; }

        /* Protección defensiva: si el payload está incompleto o llega una regla no reconocida, no se debe clasificar falsamente como Healthy. */
        return 'unable-to-evaluate';
      }

      /* Cada Feature se cuenta una sola vez. Por diseño, la suma de los cinco valores debe coincidir exactamente con readinessCounts.total, que representa el mismo
        universo: Features después de filtros estructurales y antes de aplicar Readiness o Delivery Health como filtro KPI. */
      const deliveryHealthCounts =
        filteredBeforeReadiness.reduce(
          (counts, feature) => {
            const group = getExclusiveDeliveryHealthGroup(feature);

            if (group === 'requires-action') {
              counts.requiresAction += 1;
            } else if (group === 'requires-attention') {
              counts.requiresAttention += 1;
            } else if (group === 'unable-to-evaluate') {
              counts.unableToEvaluate += 1;
            } else if (group === 'not-started') {
              counts.notStarted += 1;
            } else {
              counts.healthy += 1;
            }

            return counts;
          },
          {
            requiresAction: 0,
            requiresAttention: 0,
            unableToEvaluate: 0,
            notStarted: 0,
            healthy: 0
          }
        );
      
      /* Aplica el filtro de Readiness después de calcular los contadores. Readiness puede originarse desde uno de dos controles independientes:
        1. Una tarjeta KPI.
        2. El dropdown superior.
      Normalmente sólo uno estará activo porque las acciones KPI limpian los dropdowns. Sin embargo, esta lógica es segura incluso si ambos recibieran valores por cualquier motivo. */
      const filteredByReadiness = filteredBeforeReadiness.filter(feature => {
        const readiness = getFeatureReadiness(feature);
        const matchesReadinessKpi = readinessKpiFilter === 'All' || readiness === readinessKpiFilter;
        const matchesReadinessDropdown = readinessDropdownFilter === 'All' || readiness === readinessDropdownFilter;
        return matchesReadinessKpi && matchesReadinessDropdown;
      });

      /* Las tarjetas de Health usan las alertas individuales, no solamente la alerta principal mostrada por el badge.
         Esto permite que, si un Feature tiene más de una alarma, aparezca dentro de cada grupo que le corresponda. */
      const filtered = filteredByReadiness.filter(f => {
        const delivery = getDeliveryHealth(f);

        const healthRuleKeys = new Set([
          delivery.key,
          ...getDeliveryHealthAlerts(f).map(alert => alert.key)
        ]);

        const healthGroups = getDeliveryHealthGroups(f);
      
        /* Las tarjetas KPI aplican la misma clasificación exclusiva usada en los conteos de cabecera. Por ejemplo: una Feature con Requires Action y Requires
          Attention aparecerá solamente en Requires Action cuando el usuario pulse una tarjeta KPI. */
        const matchesHealthGroupKpi = (() => {
          if (healthGroupKpiFilter === 'All') {
            return true;
          }

          return (
            getExclusiveDeliveryHealthGroup(f) === healthGroupKpiFilter
          );
        })();
      
        const matchesHealthRule =
          healthRuleFilter === 'All' ||
          healthRuleKeys.has(healthRuleFilter);
      
        return matchesHealthGroupKpi && matchesHealthRule;
      });

      let sortedFiltered = [...filtered];

      if (sortColumn) { sortedFiltered.sort((a, b) => {
          let valA = '';
          let valB = '';

          if (sortColumn === 'id') {
            valA = a.id;
            valB = b.id;
          } else if (sortColumn === 'title') {
            valA = (a.title || '').toLowerCase();
            valB = (b.title || '').toLowerCase();
          } else if (sortColumn === 'areaPath') {
            valA = (a.areaPath || '').toLowerCase();
            valB = (b.areaPath || '').toLowerCase();
          } else if (sortColumn === 'iteration') {
            const extractYearQuarter = (path) => {
              const yearMatch = (path || '').match(/(\d{4})/);
              const quarterMatch = (path || '').match(/Q(\d)/);

              const year = yearMatch
                ? parseInt(yearMatch[1], 10)
                : 9999;

              const quarter = quarterMatch
                ? parseInt(quarterMatch[1], 10)
                : 9;

              return year * 10 + quarter;
            };

            valA = extractYearQuarter(a.iterationPath);
            valB = extractYearQuarter(b.iterationPath);
          } else if (sortColumn === 'priority') {
            /* Features sin Priority se muestran después de cualquier Priority numérica cuando el orden es ascendente. */
            valA =
              a.priority === null ||
              a.priority === undefined ||
              a.priority === ''
                ? Number.MAX_SAFE_INTEGER
                : parseInt(a.priority, 10);

            valB =
              b.priority === null ||
              b.priority === undefined ||
              b.priority === ''
                ? Number.MAX_SAFE_INTEGER
                : parseInt(b.priority, 10);
          } else if (sortColumn === 'state') {
            valA = (a.state || '').toLowerCase();
            valB = (b.state || '').toLowerCase();
          } else if (sortColumn === 'targetDate') {
            valA = a.targetDate || '';
            valB = b.targetDate || '';
          } else if (sortColumn === 'daysToTarget') {
            /* La lectura ascendente es operacional: overdue primero, luego fechas cercanas y luego las lejanas.
              Sin Target Date siempre va al final, tanto en ascendente como descendente, porque no representa una fecha comparable. */
            const daysA = getTargetDateStatus(
              a.targetDate,
              a.state
            ).days;

            const daysB = getTargetDateStatus(
              b.targetDate,
              b.state
            ).days;

            if (daysA === null && daysB !== null) {
              return 1;
            }

            if (daysA !== null && daysB === null) {
              return -1;
            }

            if (daysA === null && daysB === null) {
              return 0;
            }

            valA = daysA;
            valB = daysB;
          } else if (sortColumn === 'assignedTo') {
            valA = (a.assignedTo || '').toLowerCase();
            valB = (b.assignedTo || '').toLowerCase();
          } else if (sortColumn === 'readiness') {
            const readinessOrder = {
              Incomplete: 1,
              Unknown: 2,
              Healthy: 3
            };

            valA = readinessOrder[getFeatureReadiness(a)] || 4;
            valB = readinessOrder[getFeatureReadiness(b)] || 4;
          } else if (sortColumn === 'deliveryHealth') {
            /*  Orden operativo, de mayor a menor urgencia:
              1. Requires Action
              2. Requires Attention
              3. Unable to evaluate
              4. Not started
              5. Healthy
              Una Feature puede tener múltiples alertas, pero el orden usa la misma categoría exclusiva de las tarjetas KPI. */
            const getDeliveryHealthSortRank = feature => {
              const exclusiveGroup =
                getExclusiveDeliveryHealthGroup(feature);

              const sortOrderByGroup = {
                'requires-action': 1,
                'requires-attention': 2,
                'unable-to-evaluate': 3,
                'not-started': 4,
                healthy: 5
              };

              return (
                sortOrderByGroup[exclusiveGroup] ||
                6
              );
            };

            valA = getDeliveryHealthSortRank(a);
            valB = getDeliveryHealthSortRank(b);
          } else if (sortColumn === 'progress') {
            /* Progress menor primero al ordenar ascendente. Si no existe summary disponible, la Feature siempre queda al
              final porque "sin datos" no debe aparentar ser 0% de progreso. */
            const progressA = getFeatureDeliverySummary(
              a,
              storiesCache,
              unavailableStoriesIds
            )?.progressPercent;

            const progressB = getFeatureDeliverySummary(
              b,
              storiesCache,
              unavailableStoriesIds
            )?.progressPercent;

            const hasProgressA = Number.isFinite(progressA);
            const hasProgressB = Number.isFinite(progressB);

            if (!hasProgressA && hasProgressB) {
              return 1;
            }

            if (hasProgressA && !hasProgressB) {
              return -1;
            }

            if (!hasProgressA && !hasProgressB) {
              return 0;
            }

            valA = progressA;
            valB = progressB;
          } else if (sortColumn === 'risk') {
            /* El score mayor representa más riesgo. Se invierte para que la opción ascendente, que es la primera
              al pulsar una columna nueva, tenga la lectura natural: "riesgo más alto primero". */
            valA = -getFeatureRiskScore(
              a,
              storiesCache,
              unavailableStoriesIds
            );

            valB = -getFeatureRiskScore(
              b,
              storiesCache,
              unavailableStoriesIds
            );
          }

          if (sortOrder === 'asc') {
            return valA < valB
              ? -1
              : valA > valB
                ? 1
                : 0;
          }

          return valA > valB
            ? -1
            : valA < valB
              ? 1
              : 0;
        });
      }

      /* Se usa para diferenciar:

        - sí hay Features cargadas, pero ninguna coincide con los filtros. */
      const hasActiveDashboardFilters =
        filterAreaPath.length > 0 ||
        filterIteration.length > 0 ||
        filterAssignedTo.length > 0 ||
        filterDeliveryTeam.length > 0 ||
        filterState.length > 0 ||
        filterTargetDate.length > 0 ||

        readinessKpiFilter !== 'All' ||
        healthGroupKpiFilter !== 'All' ||
        readinessDropdownFilter !== 'All' ||

      /* Genera el mismo estado visual en Feature List y Roadmap. No se muestran tablas vacías sin explicación. */
      const renderDashboardResultsState = () => {

      /* Carga Stories/Bugs de múltiples Features con UNA llamada HTTP.
        Esta función centraliza los cuatro escenarios que antes usaban fetch('/api/feature-stories/:id') individualmente:
        1. Precarga de los Features visibles en Feature List.
        2. Apertura de History.

        4. Expansión de una fila del Roadmap. */
      const loadStoriesForFeatures = (featureIds) => {

        }
        
        ids.forEach(featureId => {
          storiesRequestInFlightRef.current.add(featureId);
        });
        
        /* Marcamos todos los IDs antes de realizar fetch para evitar peticiones repetidas mientras React procesa el siguiente render. */
        setLoadingStoriesIds(previous => {
          const next = { ...previous };

          ids.forEach(featureId => {
            next[featureId] = true;
          });

          return next;
        });

        fetch('/api/features-stories-batch', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ids })
        })
        .then(response =>
          parseApiJsonResponse(
            response,

          )
        )
          .then(data => {
            const results = data.results || {};
            const unavailableIds = new Set(
              (data.unavailableFeatureIds || [])
                .map(Number)
                .filter(Number.isInteger)
            );

            /* Guardamos un arreglo por cada ID solicitado, incluso cuando esté unavailable. Esto evita una precarga infinita. La UI usa unavailableStoriesIds para mostrar el error correcto. */
            setStoriesCache(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = Array.isArray(results[featureId])
                  ? results[featureId]
                  : [];
              });

              return next;
            });

            setUnavailableStoriesIds(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                if (unavailableIds.has(featureId)) {
                  next[featureId] = true;
                } else {
                  delete next[featureId];
                }
              });

              return next;
            });
          })
          .catch(error => {
            console.error(
              'Error loading Stories/Bugs batch:',
              error
            );

            /*  Un error HTTP general no permite saber qué Feature falló. Marcamos todos los IDs de esta solicitud como unavailable, evitando reintentos automáticos repetidos cada vez que la página vuelva a renderizarse. */
            setStoriesCache(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = [];
              });

              return next;
            });

            setUnavailableStoriesIds(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = true;
              });

              return next;
            });
          })
          .finally(() => {
            ids.forEach(featureId => {
              storiesRequestInFlightRef.current.delete(featureId);
            });
            
            setLoadingStoriesIds(previous => {
              const next = { ...previous };

              ids.forEach(featureId => {
                next[featureId] = false;
              });

              return next;
            });
          });
      };

      const toggleFeatureDetails = (featureId) => {
        const isAlreadyOpen = expandedFeatureId === featureId;

        if (isAlreadyOpen) {
          setExpandedFeatureId(null);
          return;
        }

        setExpandedFeatureId(featureId);

        /* Ambas solicitudes son independientes y pueden ejecutarse en paralelo. Cada función ya tiene protección contra:
          - datos existentes en caché;
          - solicitudes en progreso;
          - duplicados generados por renders consecutivos. */
        loadStoriesForFeatures([featureId]);

        loadRelationshipGraphForFeatures([featureId]);
      };

    const deliveryHealthRuleOptions = [
      { key: 'healthy', label: 'Healthy' },
      { key: 'overdue', label: 'Overdue' },
      { key: 'target-date-near-unscheduled-discovery', label: 'Target date near' },
      { key: 'target-next-month-without-release', label: 'Target date near w/o RFV'},
      { key: 'release-alignment-at-risk', label: 'Release alignment at risk'},
      { key: 'release-commitment-missed', label: 'Release commitment missed' },
      { key: 'release-date-passed-with-open-work', label: 'Release date passed' },
      { key: 'release-alignment-unavailable', label: 'Release alignment unavailable' },
      { key: 'closed-with-open-work', label: 'Closed w/open work' },
      { key: 'unable-to-evaluate', label: 'Unable to evaluate' },
      { key: 'needs-estimate', label: 'Needs High Level Estimation' },
      { key: 'no-stories', label: 'No Stories' },
      { key: 'no-active-work', label: 'No active work' },
      { key: 'unestimated-work', label: 'No estimated work' },
      { key: 'not-started', label: 'Not started' }
    ];

      const featuresItemsPerPage = 15;
      const featuresTotalPages =  Math.max( 1, Math.ceil(sortedFiltered.length / featuresItemsPerPage));
      const featuresStartIdx = (featuresPage - 1) * featuresItemsPerPage;
      const featuresPageItems = sortedFiltered.slice(featuresStartIdx, featuresStartIdx + featuresItemsPerPage);

       /* Los dos handlers centralizan:
        - límites mínimos y máximos;

        - retorno al inicio del panel de resultados. */
      const changeFeaturesPage = (nextPage) => {
        const targetPage = Math.max( 1, Math.min(featuresTotalPages, Number(nextPage) || 1));
        if (targetPage === featuresPage) { return; }
        setFeaturesPage(targetPage);
        setExpandedFeatureId(null);

        requestAnimationFrame(() => { scrollResultsToTop('smooth'); });
      };

        Esto evita competir con las solicitudes de historial del Roadmap. */
      useEffect(() => { if (currentPage !== 'features') {
          return;
        }
        const featuresToLoad = featuresPageItems
          .map(feature => feature.id)
          .filter(featureId =>
            !Object.prototype.hasOwnProperty.call(
              storiesCache,

            ) &&
            !loadingStoriesIds[featureId] &&
            !unavailableStoriesIds[featureId]
          );

        if (featuresToLoad.length === 0) {
          return;
        }

      }, [currentPage,
          featuresPage,
          sortedFiltered.length,
          filterAreaPath.join(','),
          filterIteration.join(','),
          filterState.join(','),
          filterTargetDate.join(','),
          filterReleaseVersion.join(','),
          filterAssignedTo.join(','),
          filterDeliveryTeam.join(','),
          readinessKpiFilter,
          healthGroupKpiFilter,
          readinessDropdownFilter,
          healthRuleFilter,
          searchTitle]);

      const toggleRoadmapFeature = (featureId) => {
        if (expandedRoadmapFeatureId === featureId) {
          setExpandedRoadmapFeatureId(null);

        setExpandedRoadmapFeatureId(featureId);

        /*

        loadStoriesForFeatures([featureId]);

      const adoLink = (id) =>

      /* La última revisión Live pertenece a esta sesión del navegador.

        Ejemplos: 10:42:18 AM (CDT, UTC-5), 8:42:18 AM (PDT, UTC-7), 11:42:18 AM (EDT, UTC-4) */
      const formatLiveCheckTime = (value) => {
        if (!value) {
          return 'Not checked yet in this session.';
        }
      
        const localTime = DateTime
          .fromJSDate(value)
          .toLocal()
          .setLocale('en-US');
      
        return `${localTime.toLocaleString({
          hour: 'numeric',
          minute: '2-digit',
          second: '2-digit'
        })} (${localTime.offsetNameShort}, UTC${localTime.toFormat('ZZ')})`;

      const formatDate = (date) => {
        const parsedDate = parseDashboardDate(date);

          return '-';
        }

        return parsedDate.toLocaleDateString(
          'es-CO',
          {
            timeZone: dashboardTimeZone
          }
        );
      };

      const itemsPerPage = 15;
      const totalPages = Math.max( 1, Math.ceil(sortedFiltered.length / itemsPerPage));
      const startIdx = (roadmapPage - 1) * itemsPerPage;
      const pageItems = sortedFiltered.slice(startIdx, startIdx + itemsPerPage);
      const pageItemIds = pageItems.map(item => item.id).join(',');
      const roadmapDashboardToday = getDashboardNow().startOf('day');
      const monthTimelineStart = roadmapDashboardToday
        .startOf('month')
        .plus({ months: timelineOffset })
        .toJSDate();
      const monthTimelineEnd = roadmapDashboardToday
        .startOf('month')
        .plus({ months: timelineOffset + 12 })
        .minus({ days: 1 })
        .endOf('day')
        .toJSDate();
      const weekTimelineStart = roadmapDashboardToday
        .startOf('week')
        .plus({ weeks: weekOffset })
        .toJSDate();
      const weekTimelineEnd = roadmapDashboardToday
        .startOf('week')
        .plus({ weeks: weekOffset + 12 })
        .toJSDate();
      
      /*
        Fuente única de verdad de la ventana temporal activa:
        header, Features, Stories y regla global.
      */
      const timelineStart = isWeekScale
        ? weekTimelineStart
        : monthTimelineStart;
      
      const timelineEnd = isWeekScale
        ? weekTimelineEnd
        : monthTimelineEnd;
      
      const timelineColumnBox = useTimelineColumnBox(
        roadmapGanttRef,
        [

        ]
      );
      const changeRoadmapPage = (nextPage) => {
        const targetPage = Math.max( 1, Math.min(totalPages, Number(nextPage) || 1) );
        if (targetPage === roadmapPage) { return; }

        setRoadmapPage(targetPage);
        setExpandedRoadmapFeatureId(null);

        requestAnimationFrame(() => {

        });
      };
    
      const expandedRoadmapStories = expandedRoadmapFeatureId ? (storiesCache[expandedRoadmapFeatureId] || []) : [];
      const expandedStoryIds = expandedRoadmapStories.map(s => s.id).join(',');
    
      useEffect(() => {
        if (currentPage !== 'roadmap' || pageItems.length === 0) return;
        const ids = pageItems.map(item => item.id).filter(id => !historyCache[id]);
        if (ids.length === 0) return;
        setLoadingHistory(true);
        fetch('/api/features-history-batch', {

        })

          .then(data => {

       }, [pageItemIds, currentPage]);

   /*   useEffect(() => {
        if (currentPage !== 'roadmap') return;
        const nextStart = roadmapPage * itemsPerPage;
        const nextPageItems = sortedFiltered.slice(nextStart, nextStart + itemsPerPage);
        if (nextPageItems.length === 0) return;
        const ids = nextPageItems.map(item => item.id).filter(id => !historyCache[id]);
        if (ids.length === 0) return;
        fetch('/api/features-history-batch', {

          .then(r => r.json())

      }, [roadmapPage, currentPage, sortedFiltered.length, filterAreaPath.join(','), filterIteration.join(','), filterState.join(','), filterTargetDate.join(','), filterReleaseVersion.join(','), filterAssignedTo.join(','), readinessDropdownFilter, searchTitle]);
    */
    useEffect(() => {

            'Error loading Story timeline history:',
            error
          );
    
          /*
            Evita solicitudes automáticas infinitas si falla el endpoint.
            La UI mostrará "No timeline history available."
          */
          setStoryHistoryCache(previous => {
            const next = { ...previous };
    
            ids.forEach(id => {
              next[id] = [];
            });
    
            return next;
          });
        })
        .finally(() => {
          ids.forEach(id => {
            storyHistoryRequestInFlightRef.current.delete(id);
          });
    
          setLoadingStoryHistoryIds(previous => {
            const next = { ...previous };
    
            ids.forEach(id => {
              next[id] = false;
            });
    
            return next;
          });
        });

      /*─ Renderiza el header de la línea de tiempo (meses o semanas). Vive dentro de la tabla para que use exactamente el mismo ancho que las barras, marcadores y líneas del Timeline.*/
      function TimelineSubHeader({ isWeekMode, timelineOffset, weekOffset }) {
        const dashboardToday = getDashboardNow().startOf('day');

        if (isWeekMode) {
          /*
            Luxon usa lunes como inicio de semana para startOf('week').
            Esto elimina la lógica manual anterior basada en getDay().
          */
          const thisMonday = dashboardToday.startOf('week');

          const groups = [];
          let currentGroup = null;
          for (let i = 0; i < 12; i++) {
            const weekStart = thisMonday.plus({
              weeks: weekOffset + i
            });

            const year = weekStart.year;
            const quarter = Math.floor((weekStart.month - 1) / 3) + 1;
            const quarterKey = year + '-Q' + quarter;

            const label = weekStart
              .setLocale('en-US')
              .toLocaleString({
                month: 'short',
                day: 'numeric'
              });

            if (!currentGroup || currentGroup.key !== quarterKey) {
              currentGroup = { key: quarterKey, label: year + ' · Q' + quarter, weeks: [] };
              groups.push(currentGroup);
            }
            currentGroup.weeks.push(label);
          }

          return (
            <div className="gantt-timeline-canvas" style={{ width: '100%', minWidth: 0 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
                {groups.map((g, gi) => (
                  <div
                    key={gi}
                    style={{
                      gridColumn: 'span ' + g.weeks.length,
                      background: (() => {
                        const parts = g.key.split('-Q');
                        return (parseInt(parts[0]) * 4 + parseInt(parts[1])) % 2 === 0 ? '#1e3a8a' : 'var(--accent)';
                      })(),
                      color: 'white',
                      textAlign: 'center',
                      fontSize: '10px',
                      fontWeight: 'bold',
                      padding: '3px 0',
                      borderRadius: '3px'
                    }}
                  >
                    {g.label}
                  </div>
                ))}
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
                {groups.map((g, gi) =>
                  g.weeks.map((week, wi) => (
                    <div key={gi + '-' + wi} style={{ background: 'var(--neutral-soft)', textAlign: 'center', fontSize: '9px', fontWeight: 'bold', padding: '3px 0', borderRadius: '3px', color: '#334155' }}>
                      {week}
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        }

        // Modo meses
        const timelineStart = dashboardToday
          .startOf('month')
          .plus({ months: timelineOffset });

        const groups = [];
        let currentGroup = null;

        for (let i = 0; i < 12; i++) {
          const month = timelineStart.plus({ months: i });
          const year = month.year;

          const monthName = month
            .setLocale('en-US')
            .toLocaleString({ month: 'short' });

          if (!currentGroup || currentGroup.year !== year) {
            currentGroup = { year, months: [] };
            groups.push(currentGroup);
          }
          currentGroup.months.push(monthName);
        }

        return (
          <div style={{ width: '100%', minWidth: 0 }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px', marginBottom: '2px' }}>
              {groups.map((g, gi) => (
                <div key={gi} style={{
                    gridColumn: 'span ' + g.months.length,
                    background: gi % 2 === 0 ? '#1e3a8a' : 'var(--accent)',
                    color: 'white',
                    textAlign: 'center',
                    fontSize: '10px',
                    fontWeight: 'bold',
                    padding: '3px 0',
                    borderRadius: '3px'
                  }}
                >
                  {g.year}
                </div>
              ))}
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gap: '2px' }}>
              {groups.map((g, gi) =>
                g.months.map((month, mi) => (
                  <div

                    style={{ background: 'var(--neutral-soft)', textAlign: 'center', fontSize: '10px', fontWeight: 'bold', padding: '3px 0', borderRadius: '3px', color: '#334155' }}
                  >
                    {month}
                  </div>
                ))
              )}
            </div>
          </div>
        );
      }

                                  colSpan="5"
                                  style={{
                                    padding: '20px',
                                    textAlign: 'center',
                                    color: 'var(--warn)',
                                    fontSize: '12px'
                                  }}
                                >
                                  Stories and Bugs could not be fully retrieved from Azure DevOps.
                                  Refresh the dashboard and try again.
                                </td>
                              </tr>
                            ) : (storiesCache[f.id] || []).length === 0 ? (
                              /*  Resultado válido: ADO respondió correctamente, pero este Feature no tiene Stories/Bugs hijos directos.
                                La fila conserva ahora cinco columnas:
                                - Disclosure vacío;
                                - Priority vacía;
                                - identificador informativo;
                                - mensaje dentro del espacio de título;
                                - timeline gris, sin barras de estado. */
                              <tr
                                id={`roadmap-feature-details-${f.id}`}
                                className="roadmap-detail-row"
                                style={{
                                  borderBottom: '1px solid #eee',
                                  background: '#f2f2f2'
                                }}
                              >
                                <td className="roadmap-disclosure-cell" />

                                <td />

                                <td
                                  style={{
                                    color: 'var(--text-tertiary)',
                                    fontSize: '10px',
                                    fontWeight: '700',
                                    textAlign: 'center'
                                  }}
                                  aria-label="No child work items"
                                  title="No Stories or Bugs"
                                >
                                  —
                                </td>

                                <td style={{ maxWidth: '420px', padding: '10px 12px' }}>
                                  <strong
                                    style={{
                                      display: 'block',
                                      color: '#334155',
                                      fontSize: '10px',
                                      lineHeight: '1.15'
                                    }}
                                  >
                                    No Stories or Bugs are associated with this Feature.
                                  </strong>

                                  <span
                                    style={{
                                      display: 'block',
                                      marginTop: '3px',
                                      color: 'var(--text-tertiary)',
                                      fontSize: '10px',
                                      lineHeight: '1.15'
                                    }}
                                  >
                                    Click the Feature row again to collapse it.
                                  </span>
                                </td>

                                <td className="gantt-timeline-cell" style={{ padding: '6px 8px' }}>
                                  <div className="gantt-timeline-canvas" 
                                    style={{  height: '36px', borderRadius: '4px', background: '#e0e0e0', position: 'relative', overflow: 'hidden' }}
                                    aria-label="No Story or Bug timeline is available for this Feature">
                                    <span style={{ position: 'absolute', top: '50%', left: '8px', transform: 'translateY(-50%)', color: '#94a3b8',
                                      fontSize: '11px'}}>
                                      No child work items
                                    </span>
                                  </div>
                                </td>
                              </tr>
                            ) : (
                              (storiesCache[f.id] || []).map(s => (
                                <StoryRow
                                  key={s.id}
                                  storyId={s.id}
                                  title={s.title}
                                  storyPoints={s.storyPoints}
                                  state={s.state}
                                  iterationPath={s.iterationPath}
                                  formatDate={formatDate}
                                  timelineStart={timelineStart}
                                  timelineEnd={timelineEnd}
                                  adoLink={adoLink}
                                  states={storyHistoryCache[s.id] || []}
                                  loading={!!loadingStoryHistoryIds[s.id]}
                                  showTooltip={showTooltip}
                                  moveTooltip={moveTooltip}
                                  hideTooltip={hideTooltip}
                                />
                              ))
                            )
                          )}
                          </React.Fragment>
                        );
                      })}
                  </tbody>
                </table>
                <GanttRuler
                  box={timelineColumnBox}
                  timelineStart={timelineStart}
                  timelineEnd={timelineEnd}
                  unitCount={12}
                />
              </div>
            </div>
           </>
            )}
          </>
          )}

          
          </main>

          {!loading && !loadError && sortedFiltered.length > 0 && (
            <div className="dashboard-pagination-footer">
              {currentPage === 'features' ? (
                <DashboardPagination
                  currentPage={featuresPage}
                  totalPages={featuresTotalPages}
                  onPageChange={changeFeaturesPage}
                  ariaLabel="Feature List pagination"
                />
              ) : (
                <DashboardPagination
                  currentPage={roadmapPage}
                  totalPages={totalPages}
                  onPageChange={changeRoadmapPage}
                  ariaLabel="Roadmap pagination"
                />
              )}
            </div>
          )}
          <Tooltip tooltip={tooltip} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>
